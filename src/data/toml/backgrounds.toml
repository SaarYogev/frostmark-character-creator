[[backgrounds]]
name = "Warden"
category = "Kingdom"
kingdom = "Applegate"
origin = "Applegate"
desc = "You belong to the ancient order of the Wardens - a group of forest defenders whose origins are said to have come from Geanor's swift and brutal archer units. The Wardens were the original elite bodyguards of the Duke of Applegate, assigned when the Empire was formed. Applegate was originally an administrational area covered in leaf forest, but it has been transformed gradually to be dominated by agricultural fields.\n\nWhen the Empire fell, the Wardens swore to protect the royal family of Applegate instead. Nowadays, only a few natural forest patches remain, and there is no Duke or royal family to guard anymore for the order. Thus, only a few members still practice the ancient ways, mostly for tradition than anything else. The Wardens were excellent shock and guerilla units, who hid in forested areas and surprised their enemy with traps, bows, and axes. Today's Wardens have to pick up additional work to make ends meet as they are not funded by any government or community anymore."
gold = 10
equipment = "An insignia of the Wardens, a random trinket from the Random Trinket table. A tool, a kit, or a musical instrument of your choice, a set of traveler's clothes, and a pouch containing 10 gp."
trait = "Death From Above"
traitDesc = "You gain the Skulker feature."
bond = "Ancient Oath: As a Warden, you have sworn an oath to protect the sovereignty of Applegate."
freeSkillPoints = 6
skills = ["Animal Handling", "Arts & Craft", "Athletics", "Empathy", "Perception", "Stealth", "Subterfuge", "Survival"]
restrictSkills = ["Animal Handling", "Arts & Craft", "Athletics", "Empathy", "Perception", "Stealth", "Subterfuge", "Survival"]

[[backgrounds]]
name = "Arbalist"
category = "Kingdom"
kingdom = "Armathain"
origin = "Armathain"
desc = "As an Arbalist of Armathain, you have been placed in a peculiar position. You are an absolute necessity to protect your lord against the Knights, but at the same time, you are viciously despised, not only by your enemy but also by your lord. You are plucked from the Diligent Mark's ranks by the grace of your loyalty and trained to use the heavy crossbow. In a skirmish between the nobles, you and your fellow Arbalists might be the only ones who can stop the enemy's Knight. Since you have this purpose on the battlefield, you are often accused of dishonor, and many soldiers, regardless of rank, want little to do with you. Even if your effectiveness is vital in Armathain, your numbers are limited to only a handful per influential noble to limit your power."
gold = 20
equipment = "A gaming set of your choice, a random trinket from the Random Trinket table, a set of common clothes, and a pouch containing 20 gp."
trait = "A Double-Sided Sword"
traitDesc = "* Income: As long as you are assigned as an Arbalist you may earn a comfortable lifestyle.\n* Reputation: Even if you are socially mistrusted, you are a commodity amongst nobles. They fear disloyalty and assassination attempts more than the social backlash of hiring you, so you enjoy a better lifestyle than most people in the Diligent Mark. You are not given more influence or improved rights than others in your status, but you are treated better by your lord and given more coin than your brothers and sisters in arms."
bond = "Forced Subterfuge: At the threat of termination of your employment or other punishments, a lord can attempt to persuade you to accept more shady assignments, like spying or even assassination."
freeSkillPoints = 5
skills = ["Athletics", "Deception", "Perception", "Stealth", "Subterfuge"]
restrictSkills = ["Athletics", "Deception", "Perception", "Stealth", "Subterfuge"]

[[backgrounds]]
name = "Knight of Valiant"
category = "Kingdom"
kingdom = "Armathain"
origin = "Armathain"
desc = "You weren't your noble parents' first child, and thus, you weren't tasked with the administrational duty of one day ruling over the family name. Instead, as a younger sibling, your talents were explored to discover how you could best serve your house. You showed an aptitude for combat. Thus, you were initiated to become a Knight, an elite warrior of Armathain.\n\nThe Knights are the last defenders of the crown and the noble houses of Armathain. You are given the best Armathainian steel to make you equally protected as you are intimidating, as well as a well-armored warhorse to carry you into battle. They teach you how to ride, how to conduct yourself with authority, and how to swing a weapon. You are seldom deployed on the battlefield, but if you are, you wade through the enemy lines to break their spirits and their formation. To protect your back and to serve you, you are assigned two squires of the Integrity mark, sworn to your side. Out of battle, you serve as a bodyguard for noble scions and diplomatic envoys, keeping the ruling tier of Armathain safe. To keep your edge, there are often tournaments and other knightly games for the Knights."
gold = 20
equipment = "A set of fine clothes, an insignia of your rank, a scroll of pedigree, and a purse containing 20 gp."
trait = "Squires"
traitDesc = "* Followers: You are served by two squires who have sworn to protect you. The squires are capable in their own right and can both perform mundane tasks as well as handle conflict. The squires’ CR rating equals your level divided by 5 (minimum ½, rounded down) and they possess [Tactics] as their AO. You and your GM create the character sheets together, but you control them in battle. The squires can leave your service if you frequently abuse them or if you break your bond.\n* Income: As long as you serve as a Knight of Armathain you may earn a comfortable lifestyle."
bond = "Oath Of The Knight: You have sworn an oath to protect your charge, be chivalrous and defend Armathain and its crown."
freeSkillPoints = 4
skills = ["Animal Handling", "Athletics", "Leadership"]
restrictSkills = ["Animal Handling", "Athletics", "Leadership"]
[backgrounds.builtInRanks]
"Animal Handling" = 1
"Athletics" = 1
"Leadership" = 1

[[backgrounds]]
name = "Unmarked Insurgent"
category = "Kingdom"
kingdom = "Armathain"
origin = "Armathain"
desc = "You are Unmarked and unsatisfied with your lot in life. You live outside society in squalor, and there are no prospects to rise beyond your living conditions. There is no hope for you and thousands of others like you. You find the Mark system to be both unfair and horrid. Whilst the highest of nobles live in decadent palaces, you have to fight for scraps of food, and you are often exploited to do the dirty work of the higher marks. You have decided to take action and do whatever you can to fight back. You may be a part of a bigger network of people with similar thoughts, or you may be alone. But you are determined to do something."
gold = 5
equipment = "A small knife, a gaming set of your choice, Thieves' Tools, a random trinket from the Random Trinket table, a set of common clothes, and a pouch containing 5 gp."
trait = "The Downtrodden's Embrace"
traitDesc = "* Familiarity: You have lived your life amongst the poor and wretched and you know your way around this world. Even in other kingdoms, you know how to act in similar environments of criminals and the wretched, even aptly befriending them. You know where to find shelter, protection from the authorities, and special equipment.\n* Residence: You are known by the Unmarked to fight for their cause and thus you can always find a secluded place to sleep, some food, and tightly closed lips amongst your kindred."
bond = "The Rise Of The Unmarked: For two additional skill points to assign between the selection of skills provided above, you have sworn a personal oath to fight for and protect your fellow Unmarked. You wish to see another world where they are treated fairly."
freeSkillPoints = 4
skills = ["Athletics", "Deception", "Perception", "Stealth", "Subterfuge", "Survival"]
restrictSkills = ["Athletics", "Deception", "Perception", "Stealth", "Subterfuge", "Survival"]

[[backgrounds]]
name = "Chieftain"
category = "Kingdom"
kingdom = "Beornhelm"
origin = "Beornhelm"
desc = "You may have risen in ranks as a talented warrior and leader or taken the title by force. Either way, you were a Chieftain over a small community in Beornhelm. You commanded respect from your subjects and your warriors, and you may have been more or less loyal towards the Warchieftain. Work with your GM to establish whether you suddenly left your position as Chieftain and why. Or maybe you lost the position to another, and you somehow survived? Or maybe your tribe was wiped out? Nevertheless, you aren't a Chieftain anymore."
gold = 20
equipment = "A trophy taken from a fallen enemy, a random trinket from the Random Trinket table, a set of traveler's clothes, and 20 gp."
trait = "Chieftain's Presence"
traitDesc = "Gain the Menacing feature."
bond = "Holding on to Power: Disregard the questions of how you lost your chieftain status in the overview because you are still a chieftain. Instead, work with your GM to flesh out your chiefdom. ❖ Competition: Any competitors you might have will constantly search for any sign of weakness to strike and take what you have. Be warned. ❖ Duty: You are responsible for executing the law, planning the economy, and overseeing the wellbeing of those who live in your chiefdom. The Warchieftain may issue orders to you, and if you do not follow them your territory will be conquered by the Warchieftain. ❖ Income: If you choose to take this bond, you gain a wealthy lifestyle, and a village of people (thralls, peasants of different kinds, crafters, some warriors, and maybe a shaman) that follows your orders."
freeSkillPoints = 4
skills = ["Animal Handling", "Athletics", "Leadership", "Perception", "Persuasion", "Survival"]
restrictSkills = ["Animal Handling", "Athletics", "Leadership", "Perception", "Persuasion", "Survival"]

[[backgrounds]]
name = "Raider"
category = "Kingdom"
kingdom = "Beornhelm"
origin = "Beornhelm"
desc = "You are a raider and warrior of Beornhelm who has joined in on campaigns to bring wealth and thralls home to your community. You could have raided Greenfield, Sirendale, Oldwood, or even joined one of Warchieftain Kynemund's ambitious raids to Karthmere and Armathain. You might have a second profession on the side during the winters, like a farm and a homestead to come back to. Or you might have been a full- time warrior, acting as a bodyguard for your Chieftain or even the Warchieftain."
gold = 15
equipment = "A trophy taken from a fallen enemy, a random trinket from the Random Trinket table, a set of traveler's clothes, and 15 gp."
trait = "Savage Onslaught"
traitDesc = "* Familiarity: You are familiar with the terrain of the regions you have raided in the past.\n* Feature: You gain the Savage Attack feature.\n* Income: If you would find work as a bodyguard you earn a modest lifestyle."
freeSkillPoints = 4
skills = ["Animal Handling", "Arts & Craft", "Athletics", "Perception", "Survival"]

[[backgrounds]]
name = "Shaman"
category = "Kingdom"
kingdom = "Beornhelm"
origin = "Beornhelm"
desc = "Originally, the shamans were a part of the Wayfarers, the caretakers and guides of the Oldberry Woods, the pine forest that stretches from the peaks of Beornhelm down to northern Eastcreek. The Wayfarers have sworn to not engage in political agendas, but many of them broke their oaths to fight the war against Geanor in Beornhelm. These oath breakers became the shamans, a new organization that was more active in their respective communities.\n\nSome mysteries of the Wayfarers became lost to the shamans, but they created plenty of their own too. They also picked up several utility functions, acting as advisors and doctors. After the purge of magic in Frostmark, most of the shamans today are naturalists of different kinds. Serving as tutors, healers, and advisors to their communities and their Chieftains. They stand both in high regard and stand outside the general law of Beornhelm. Only another shaman can accuse and judge another shaman. Though, in the far-reaching tundra, high mountains, and deep forests of Beornhelm, there might be a few shamans who are still able to practice the ancient ways."
gold = 15
equipment = "A staff, a Herbalism Kit, a Tattoo Kit, a set of bone dice, a set of traveler's clothes, and a pouch containing 15 gp."
trait = "A Shaman's Role"
traitDesc = "* Income: The shamans have evolved to not have a common goal anymore, some simply worship the land and make right by it, others aiding the freedom of Beornhelm and its people, and some devoting themselves to a lost god. As long as you serve your community you may earn a modest lifestyle.\n* Jurisdiction: You can't be judged by the law of man in Beornhelm, thus you have almost free reign to roam and to practice your craft. It is only when you directly oppose a chieftain or is judged by another shaman that you must answer for your actions."
bond = "Servant of the Community: The shamans enjoy a lot of freedom and respect because of their invaluable service to the community they serve. They act as spiritual guides, advisors, and doctors. If the community of a shaman believes that they have broken this contract, the community can appeal to neighboring shamans. If those shamans believe those concerns to be true, they will first issue a warning. If that is not heeded the shaman in question will either be exiled or executed for their crimes. An exiled shaman finds no home in any Beornish community and loses all benefits of the background trait above."
freeSkillPoints = 7
skills = ["Academics", "Animal Handling", "Arts & Craft", "Empathy", "Medicine", "Occult", "Persuasion", "Survival"]
restrictSkills = ["Academics", "Animal Handling", "Arts & Craft", "Empathy", "Medicine", "Occult", "Persuasion", "Survival"]

[[backgrounds]]
name = "Crow Priest"
category = "Kingdom"
kingdom = "Crowhill"
origin = "Crowhill"
desc = "As a priest from Crowhill, you have a unique perspective and relationship to the Church. In addition to their spiritual duties, most of the priesthood in Crowhill also manage the administrational work of the Church. These duties include overseeing the food imports from Applegate, the pressure on the House of Representatives in Karthmere, the salvation of Eastcreek, the initiatives to regain popularity in Oldwood and Malgrave, the strong diplomatic ties with Armathain, etc. Besides working as a priest in Crowhill, you can be a missionary in another kingdom, a priest independently conducting their investigations about troubling news, a priest sent out on a mission, a priest who experienced a call from Riahn, or even a priest who has defected the Church for his or her reasons."
gold = 15
equipment = "The holy symbol of Riahn (a gift to you when you entered the priesthood), a prayer book, a copy of the Radiance of Geanor, vestments, a Tattoo Kit, a set of common clothes, and a belt pouch containing 15 gp."
trait = "Partial Soul Drain Ritual"
traitDesc = "You have been taught how to perform the Partial Soul Drain ritual, but chances are that you don’t know the true nature of it. You may combine Soul fragments and Soul power beyond Soul power of level 1.\n\nBackground Trait: Priest Of The Sun God\n* Aid: If you ask your fellow priests for aid they would offer it, provided the assistance is not hazardous and you remain in good standing with your church.\n* Familiarity: The Crow Priest has unique insight into the Church's administrational system and operations.\n* Income: You command respect among those who share your faith. As long as you work as a priest you gain a comfortable lifestyle.\n* Residence: You can expect free healing and care at any establishment of the Riahn faith. In the church or abbey you are serving in, you gain a permanent residence. You may also be borrowed a residence in an establishment of Riahn in your travels."
bond = "Devotion To The Sun: You have devoted your Soul and work to Riahn and his Church. You are sanctified to perform religious ceremonies of Riahn."

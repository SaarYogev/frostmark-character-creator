[[backgrounds]]
name = "Questing Knight"
category = "Kingdom"
kingdom = "Karthmere"
origin = "Karthmere"
desc = "You are the romantic questing knight, traveling around Karthmere trying to solve problems, earn coin and fame. You might be a child of a minor noble, or a sibling of a higher one, or even just a hero of the people given the title of knight. What all of these paths have in common, though, is that you do not possess any land to use your noble title to collect taxes and solidify your influence. Land is also hard to come by in the greatly populated Karthmere. Questing knights, therefore, take the road, trying to gather resources and glory to buy or be gifted land to settle down."
gold = 10
equipment = "A riding horse with a bit and bridle, a riding saddle, and saddlebag. A set of traveler's clothes, a scroll of pedigree, and a purse containing 10 gp"
trait = "Fame and Fortune"
traitDesc = "* Followers: You are followed by one retainer who has sworn to serve you. The retainer will perform mundane tasks for you, but will not fight for you. They will not follow you into obviously dangerous areas and will leave if they are frequently endangered or abused.\n* Income: As long as you serve as a Knight of Karthmere you may earn a comfortable lifestyle.\n* Reputation: You have gathered a bit of a reputation around and in your hometown and as you play you may attempt to increase this fame. If you are located in an area you are famous in, people will recognize, respect you and try to not displease you. You gain access to important local figures, may be offered lower prices and you can seek aid if it is non-hazardous."
bond = "Chivalric Code: You have sworn the Sacred Code to king and kingdom."
freeSkillPoints = 5
skills = ["Animal Handling", "Athletics", "Perception", "Persuasion"]
restrictSkills = ["Animal Handling", "Athletics", "Perception", "Persuasion"]

[[backgrounds]]
name = "Development Diplomat"
category = "Kingdom"
kingdom = "Malgrave"
origin = "Malgrave"
desc = "You belong to the Department of Development, the Department that handles foreign relations, science, and projects. Your particular Vocation is or was that of Mediator, a diplomat, serving Malgrave's interest in other kingdoms. Establish what kind of work you have done so far and where."

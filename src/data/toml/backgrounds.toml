restrictSkills = ["Academics", "Deception", "Empathy", "Investigation", "Persuasion"]

[[backgrounds]]
name = "Military Engineer"
category = "Kingdom"
kingdom = "Malgrave"
origin = "Malgrave"
desc = "As a born and bred military engineer of Malgrave, you are among the sharpest militaristic minds in Frostmark. As a child, you showed an aptitude for both body and mind and were moved into the Protection Vocation. You were first trained for a short time as a soldier to ensure you could handle yourself on the battlefield and give you insight into the military's baseline operations. But your greatest weapon was your mind, and thus you advanced to the status of a military engineer. Your character's specialty can be defensive architecture, arms and armor smithing, siege equipment, etc."
gold = 15
equipment = "Memorabilia from the field, two sets of tools, a set of common clothes, and a pouch containing 10 gp"
trait = "Siege Craft"
wikiTrait = "My Religion is Efficiency"
traitDesc = "As an engineer, you care greatly for efficiency. From your Malgravian background, you are simply better than most other engineers in Frostmark. Whenever you build something or oversee something being built, you can either decrease the material weight by 25%, time by 25%, or coin by 25%, your choice."
legacyTrait = "Siege Craft"
freeSkillPoints = 1
skills = ["Academics", "Arts & Craft", "Athletics", "Perception"]
restrictSkills = ["Academics", "Arts & Craft", "Athletics", "Perception"]

[[backgrounds]]
name = "Unhindered Explorer"
category = "Kingdom"
kingdom = "Malgrave"
origin = "Malgrave"
desc = "The Malgravian school system early discovered your intelligence. Hence you advanced quickly and easily to a position in the Explorer Vocation. As an Explorer of Malgrave, you are given a certain amount of freedom and leverage to practice your skill. The Development Department funds you, and you are free to explore whatever topic you please, as long as you can argue to the Development Department its value for the Malgravian society. Still, the Explorers’ freedom is restrained by ethical limitations and a level of oversight. Some scientists find them irritating enough that they migrate to Greenfield to conduct their experiments in peace. Due to the vast political pressure, Malgrave is exerting on Greenfield, Greenfield cannot complain fully about the Explorers’ practices. You can be an Explorer in the sense of the word, exploring other kingdoms or people for some kind of social studies. Work with your GM to determine your area of expertise, some of your accomplishments, and your place in the narrative."
gold = 10
equipment = "A tool of your choice, a bottle of black ink, a quill, an almost empty book you are using for notes, a set of common clothes, and a belt pouch containing 10 gp."
trait = "Quick Study"
traitDesc = "* Fast Mind: Others may mock your obsession, but your dedication has paid off. It takes you half the time it normally would identify, repair, or glean information from an object, a specimen, or writings related to your field of study.\n* Income: As long as you serve the Development Department in Malgrave you earn a comfortable lifestyle. However, if you have moved to Greenfield, considering the Department’s extra costs purchasing property for you there, as well as ensuring your safety, the Department lowers your salary to Modest."
freeSkillPoints = 5
skills = ["Academics", "Arts & Craft", "Investigation", "Medicine", "Occult", "Perception", "Persuasion"]
restrictSkills = ["Academics", "Arts & Craft", "Investigation", "Medicine", "Occult", "Perception", "Persuasion"]

[[backgrounds]]
name = "Iron Barricade Defender"
category = "Kingdom"
kingdom = "Oldwood"
origin = "Oldwood"
desc = "You have had enough with how Beornhelm has been allowed to torment northern Oldwood for so long. You are determined to fight back and properly defend northern Oldwood against Beornhelm. You follow Duke Grimcolt, the leader of this initiative, and you support his methods. You are not, however, one of the mere civilians building the new defenses, you are a competent warrior. Maybe you joined Grimcolt's army after he announced his goals, or you were one of his soldiers even before his brother died."
gold = 10
equipment = "A gaming set of your choice, a random trinket from the Random Trinket table or a battle trophy, a set of traveler's clothes, and a belt pouch containing 10 gp."
trait = "Northerner's Gratitude"
traitDesc = "Oldwood has historically been chilly and somewhat uncooperative with outsiders, but with Duke Grimcolt they are banding together like never before.\n* Familiarity: You have also studied the way of the Beornish and sharing your knowledge with your brothers and sisters in arms. You have gained a unique insight into Beornish tactics and society.\n* Income: As long as you remain in service to Duke Grimcolt, you earn a poor lifestyle.\n* Reputation: As an Iron Defender you are highly respected amongst the people of the north, and even some folk in the south feel the same about you.\n* Residence: You can find bedding, protection, and aid, provided it is non-hazardous for them, in northern Oldwood. Furthermore, you are welcome in any military establishment controlled by the Duke."
bond = "Almost a Deserter: You are not in open rebellion against the crown of Oldwood, but under Duke Grimcolt, you have certainly ignored its commands. If you were recognized by the southern authorities loyal to the crown, you would be apprehended and imprisoned. The crown does not execute northern soldiers as of yet, instead, they are quite confused about what to do with them."
freeSkillPoints = 6
skills = ["Animal Handling", "Athletics", "Deception", "Medicine", "Perception"]
restrictSkills = ["Animal Handling", "Athletics", "Deception", "Medicine", "Perception"]

[[backgrounds]]
name = "Ravenmoor Operative"
category = "Kingdom"
kingdom = "Oldwood"
origin = "Oldwood"
desc = "How you find yourself in west Oldwood, nor your past, matters not to the Ravenmoors, now only what you can do for them is of importance. You possess talents that interest them, and thus you were one day picked up by their soldiers, trained and instructed, and sent on your way to perform whatever task they had you do. Work with your GM to establish some details about your past and your work for the Ravenmoors, and what you could be up to now."
gold = 20
equipment = "One tool or kit of your choice, two sets of clothes of your choice, a trinket from the Random Trinket table or memorabilia that reminds you of your past, and a belt pouch containing 20 gp."
trait = "Unnatural Luck"
traitDesc = "* Feat: Ever since your contract with Ravenmoor you have experienced unnatural luck. You gain the Luck feature.\n* Income: So long as you stay in their good graces you are paid a modest lifestyle for your service."
bond = "Risky Business: The missions you are sent to perform can be completely harmless and legal, but it doesn't have to be. If caught, they will deny any connection with you and won't help you escape your fate. Similarly, if you become a liability for them or even escape the contract without their consent, they will send others like you after you."
freeSkillPoints = 6

[[backgrounds]]
name = "Wayfarer"
category = "Kingdom"
kingdom = "Oldwood"
origin = "Oldwood"
desc = "You are one of the last Wayfarers of the Oldberry. As a child, a Wayfarer came into your town or village and picked you out of a group of many. It was quite the event for you, as you most likely didn't understand why you had to leave your home for barely a hut in the woods and never visit your family again. But you resigned yourself to your fate, and the Wayfarer became like a parent for you instead. They taught you how to survive out in the wilds, and most importantly, the mysteries of the Wayfarers.\n\nA lot of knowledge of the Wayfarers has been lost, however, and most of the few that exist still today do not dabble in magic or do not even know how to. Most likely, you were taught herbalism, how to rudimentary defend yourself, and various secrets of the land. Your Wayfarer patron would also instill reluctant respect in you for the Sacred Arms and teach you to avoid them, and if you can't, how to appease them. Work with your GM to establish how your apprenticeship went, what kind of Wayfarer became your patron, and how you came to divert from them. Were you given a higher calling? Did they die before you could complete your training, and you felt lost or revengeful? Or did you simply think that the things they have taught you can be better used in another way?"
gold = 10
equipment = "A staff, a set of bone dice, an Herbalism Kit, a Tattoo Kit, a set of traveler's clothes, and a belt pouch containing 10 gp."
trait = "My Home is Nature"
traitDesc = "You gain the Naturalist feature."
bond = "Under Scrutiny: If you ever come across an agent of the Church, you must act like a simple tribal shaman and not reveal the true breadth of your knowledge, or else Sacred Arms will come after you. As a \"paltry deceiver\" you are probably not welcome in any establishment owned by the Church."
freeSkillPoints = 6
skills = ["Academics", "Animal Handling", "Athletics", "Deception", "Investigation", "Medicine", "Occult", "Survival"]
restrictSkills = ["Academics", "Animal Handling", "Athletics", "Deception", "Investigation", "Medicine", "Occult", "Survival"]

[[backgrounds]]
name = "Journeyman"
category = "Kingdom"
kingdom = "Sirendale"
origin = "Sirendale"
desc = "You have learned a great deal from your Master, or the school of art or craft that you attended, and you have practiced your craft as a Practitioner for some time, but you feel like you want to take the next step in your career and become a master. Or maybe you were more motivated by the idea of traveling around Frostmark, and maybe becoming a Journeyman was your goal all along.\n\nA Journeyman takes their craft or art to the road, searching for inspiration, serving in other kingdoms' courts, or learning from other master crafters or artists. Once you feel properly enriched, you can return to Sirendale and take your Master's test in front of a council of other Masters. If you would somehow pass this legendary test, you would be granted the title of Master, given the same status as a low noble, and be counted as the very pinnacle of your art and craft in Frostmark in your time.\n\nMost Journeymen fail to impress the judges and return to their travels. Some accept it and return to the position of Practitioner in Sirendale. Some Journeymen do not want to return home, even if their craft or art rivals that of the Masters in Sirendale. Some want to continue traveling, or maybe they have found their new home in another kingdom. Perhaps working for a wealthy noble and earning a comfortable and fulfilling life is enough for you."
gold = 15
equipment = "A traveling document detailing your profession to enter markets, guilds, and cross borders, a tool or kit of your choice, traveler's clothes, and a belt pouch containing 15 gp."
trait = "Been There"
traitDesc = "* Familiarity: You have been a little bit over all of Frostmark in your journey for the title of Master and thus you can roughly navigate your way in most kingdoms. You may know the basic information about the kingdoms and their rulers you have visited and the GM may supply you with random tidbits of information when it pleases them. Work with your GM to establish which kingdoms you have predominantly visited.\n* Income: When you find an opportunity to work your craft or art you earn a comfortable lifestyle."
freeSkillPoints = 4
[backgrounds.builtInRanks]
"Arts & Craft" = 2

[[backgrounds]]
name = "Light of Lysander Rebel"
category = "Kingdom"
kingdom = "Sirendale"
origin = "Sirendale"
desc = "Whatever profession or background you may have, you are politically interested in the fate of Sirendale. You find the kingdom to be vulnerable to other kingdom's influences, as shown by both Beornhelm and Armathain, and you want these foreign powers to not exploit Sirendale. Thus, it was natural for you to join an organization that felt the same, Light of Lysander.\n\nThe Light of Lysander is a political activist group that is not afraid to get dirty by committing criminal acts. They believe that if Sirendale could rally behind a true ruler, instead of being divided between the three unofficial regional nobles, they could cast out both Armathain and Beornhelm from their country. Lysander was the family name of the royal household of Sirendale that perished during the great ransack of Beornhelm, but a branch of it still exists in Oldwood today. The Light of Lysander is not just opposing Armathain where they can in the south, protecting the north from Beornish raids. Still, they are also negotiating with Greenfield and Oldwood to initiate their pact of the Northern Front again and help each other once more."
gold = 10
equipment = "A tool of your choice, a small knife, a gaming set of your choice, common clothes, and a belt pouch containing 10 gp."
trait = "Like the Back of My Hand"
traitDesc = "* Familiarity: You know your way around the cities of Sirendale, indeed, like the back of your hand. You know how to avoid prying eyes, where to run to if you were chased, where to set up headquarters, move materials, and how to move quickly from one side of the city to the other.\n* Residence: Your brothers and sisters in arms and those who are loyal to your cause will offer a place to stay, tightly closed lips, support, and aid, as long as it is not hazardous for the civilian or overly hazardous for your colleagues."
bond = "No Loose Ends: The Light of Lysander group tries to protect their members, but if you would become a threat to them if you deserted or would become apprehended and interrogated by Armathain."
freeSkillPoints = 5
skills = ["Arts & Craft", "Athletics", "Deception", "Perception", "Stealth", "Subterfuge"]
restrictSkills = ["Arts & Craft", "Athletics", "Deception", "Perception", "Stealth", "Subterfuge"]

[[backgrounds]]
name = "Master Noble"
category = "Kingdom"
kingdom = "Sirendale"
origin = "Sirendale"
desc = "As a Master of Sirendale, you have advanced from Apprentice to Practitioner, to Journeyman to finally Master in your specific art or craft. In most other kingdoms on Frostmark, this would simply earn you reputation and coin, but in Sirendale, it also grants you a noble title. You do not have to fulfill any administrational duties yourself, you can hire people for that, but you are burdened with at least some partial responsibility for your home region. The people refer to your's and your fellow artisan's wisdom to protect and steer the kingdom towards prosperity."
gold = 25
equipment = "A tool or kit of your choice, a grant of your title as both Master and Noble, a trinket from the Random Trinket table, a set of fine clothes, and a pouch containing 25 gp."
trait = "Noble by Effort"
traitDesc = "* Income: As long as you can work your craft or art you earn a comfortable lifestyle.\n* Jurisdiction: Thanks to your noble and Master title, people are inclined to think the best of you. You are welcome in high society, and people assume you have the right to be wherever you are. The common folk and merchants make every effort to accommodate you and avoid your displeasure, and other people of high status treat you as a member of the same social sphere. You can secure an audience with local powerful people if you need to."
bond = "Position of Responsibility: As a Master Artist or Crafter of Sirendale, people's hope falls on you. You are given the responsibility to help protect the kingdom and enrichen it, even if you do not want it. In addition, as a Master, you are also expected to start your own school to share your knowledge with the next generation. If you abandoned the very minimum of these requirements, you would be shunned by Siren society. No one would trade with you, buy your creations, or even make conversation with you."
freeSkillPoints = 4
[backgrounds.builtInRanks]
"Arts & Craft" = 3

[[backgrounds]]
name = "Lowcloaks' Investigator"
category = "Kingdom"
kingdom = "Stormholme"
origin = "Stormholme"
desc = "You are a member of the Lowcloaks guild as some kind of investigator. You may have been picked up through one of their charity schooling projects as a talented subject, you may have been a promising scion of a respected family who has been a part of the Lowcloaks Guild as long as anyone can remember, or you simply just agreed with the guild's philosophy and joined on your own volition and merit. You rose in the ranks from the lowest of apprentice and assistant to hold some independence in your current position. An investigator of the Lowcloaks can be a tutor, a researcher, an explorer, a spy, an infiltrator, an archivist, etc."
gold = 15
equipment = "An insignia of your guild and rank, a random trinket from the Random Trinket table, a bottle of black ink, a quill, an almost empty book you are using for notes, a set of common clothes, and a belt pouch containing 15 gp."
trait = "Guild Membership"
traitDesc = "As an established and respected member of your guild, you gain certain benefits that your membership provides.\n* Income: As long as you practice your craft or trade, you earn a modest lifestyle.\n* Jurisdiction: The Lowcloaks guild wields tremendous political power. They may offer you aid if it is worth their time. You might be able to gain access to powerful figures through the guild if you are a member in good standing. Such connections might require payment from the guild, in the form of donations of coins or valuable items to the guild's coffers.\n* Residence: Your fellow guild members will provide you with lodging and food if necessary. In some cities and towns, a guildhall offers a central place to meet other members of your profession, which can be a good place to meet potential patrons, allies, or hirelings. In the cities that the Lowcloaks own there are several guild establishments that you gain full access to."
bond = "In The Guild Books: Your name is written in your guild's manifest, along with your hometown, your characteristics, loved ones, exploits, and talents. The guilds of Stormholme’s most crucial demand of you is your loyalty. If they consider this loyalty to be broken, they will punish you. Worst case scenario, you pissed them off somehow and now they are coming for you to silence you."
freeSkillPoints = 5

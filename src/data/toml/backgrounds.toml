[[backgrounds]]
name = "Flowing River Duelist"
category = "Kingdom"
kingdom = "Eastcreek"
origin = "Eastcreek"
desc = "The Flowing River is more than just a fighting style that disciplines you to awaken your Soul Mastery. It is also a way of living and thinking, heavily tied into the traditions of Eastcreek. Respect for nature and its animals, humility, wisdom, and mental strength are some valued traits of the Flowing River. Most practitioners of the Flowing River live as clansmen, traveling with the seasons, making do with what the earth gives them, taking care of their clan, and honing their body and mind in the way of the Flowing River. The Flowing River is only supposed to be used in ceremonial duels and self-defense, but some practitioners use it for selfless means, or so the masters in Flowing River would claim. You are one of these rash children who have decided to set out and use what you have learned."
gold = 5
equipment = "A staff, a random trinket from the Random Trinket table, a set of traveler's clothes, and a pouch containing 5 gp."
trait = "Disciplined Body"
traitDesc = "You gain the Acrobat feature."

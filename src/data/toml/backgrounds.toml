name = "Bloodhound"
category = "Kingdom"
kingdom = "Applegate"
origin = "Applegate"
desc = "You belong to a special archetype of the watch of Applegate, called the Bloodhounds. The Bloodhounds are considered an authority in Applegate, tasked by their communities to root out any kind of corruption in Peeler society. They are highly respected and unofficially possess the same rank as a captain of the guard. Part of a Bloodhound's job is to stalk suspicious foreigners, guard diplomats, and follow caravans, both those that Applegate sends out and those who visit Applegate. If they point someone out as a troublemaker, they are quickly disposed of or exiled.\n\nThe Bloodhound is a watchful defender, paired with a loyal and intelligent dog. The Bloodhounds, and their families, are breeders and dog trainers who create stalwart and imposing hounds with remarkable tracking capabilities. The hound and the human fight together if the situation calls for it. The hound finds and pushes the target out in the open, and the human uses either a spear or bow to force them to surrender or simply end them on the spot."
gold = 15
equipment = "A set of manacles, the insignia of the Bloodhounds, five dog treats, a dog toy, a uniform, and a pouch containing 15 gp."
trait = "Root Out Threats"
traitDesc = "* Aid: You can ask for aid from any other Bloodhound operative as long as the task is not too dangerous and you remain in good standing in Applegate.\n* Income: The people of Applegate supply you with a modest lifestyle as long as you work for their interests.\n* Jurisdiction: As a Bloodhound, you possess jurisdiction in almost all of Applegate. You have the right to enter private houses, go through any gate without paying the tithe, and have the right to inspect any shipment or storage on Peeler land. Sometimes this applies in other kingdoms as well, but only under the flag of official Peeler business.\n* Residence: There is always a comfortable bed waiting for you as you travel within Applegate."
bond = "For The New Applegate: You believe in the new Applegate and its community. You see it as your responsibility to protect this growing new kingdom."
freeSkillPoints = 5
skills = ["Animal Handling", "Athletics", "Empathy", "Investigation", "Perception", "Persuasion"]
restrictSkills = ["Animal Handling", "Athletics", "Empathy", "Investigation", "Perception", "Persuasion"]

[[backgrounds]]
name = "Peeler Priest"
category = "Kingdom"
kingdom = "Applegate"
origin = "Applegate"
desc = "As a priest of Applegate, you fulfill a lot of different functions in society. As this war-torn kingdom's infrastructure is still suffering, there is a general lack of educators and doctors in Applegate. The priesthood, either sent here from Crowhill to live and work or native Peelers trained by the Church of Riahn, is the Applegate's religious authority. Though the Church's agents, most often than not, serve as the village doctor, educator, and advisor.\n\nApplegate supplies the Church with food and labor, and in return is repaid with aid in rebuilding but also supplying and paying these priests. Most priests serve alone in their respective communities, some fortunate enough to harbor an assistant or an apprentice to lessen their responsibilities. Due to these priests' varied workload, religious sermons and duties are generally conducted only when it is a necessity."
gold = 15
equipment = "The holy symbol of Riahn (a gift to you when you entered the priesthood), a prayer book, a tool of your choice, a Tattoo Kit, a set of common clothes, and a belt pouch containing 15 gp."
trait = "Partial Soul Drain Ritual"
traitDesc = "You have been taught how to perform the Partial Soul Drain ritual, but chances are that you don’t know the true nature of it. You may combine Soul fragments and Soul power beyond the Soul power of level 1.\n\nBackground Trait: Priest Of All Trades\n* Aid: In the area, you are serving as a priest, or have served, the population treats you with respect and will offer aid if the task is not hazardous and you remain in good standing with them.\n* Dynamic Mind: You gain half your Cunning modifier (minimum 1) to any skills you do not possess points in.\n* Income: As long as you serve your community and the Church or Riahn you may earn a modest lifestyle."
bond = "Devotion To The Sun: You have devoted your Soul and work to Riahn and his Church. You are sanctified to perform religious ceremonies of Riahn."
freeSkillPoints = 3
skills = ["Academics", "Animal Handling", "Arts & Craft", "Empathy", "Leadership", "Medicine", "Persuasion"]
restrictSkills = ["Academics", "Animal Handling", "Arts & Craft", "Empathy", "Leadership", "Medicine", "Persuasion"]

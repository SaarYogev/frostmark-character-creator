traitDesc = "As long as you can prove, either to Malgrave or the kingdom you are visiting, that you are still serving as a diplomat you gain certain benefits.\n* Income: You earn a comfortable lifestyle whilst working as a diplomat for Malgrave.\n* Jurisdiction: You can gain access to most areas and people in other kingdoms, you are excused for most crimes due to your immunity and those who know of your position will attempt to accommodate you and not displease you."
freeSkillPoints = 5

[[backgrounds]]
name = "Sacred Arms Agent"
category = "Kingdom"
kingdom = "Crowhill"
origin = "Crowhill"
desc = "As an agent of the Sacred Arms' civilian branch, your origins do not matter because they don't exist anymore. Your past has been erased, both on paper and in your mind. Now only the cause remains. There are several paths within Sacred Arms, but yours were selected for you after determining your usefulness and talents.\n\nIf you had a head for numbers, you might have become an administrative assistant in a secret headquarters. If you had an aptitude for going unnoticed, they trained you to become a spy. If you had a knack for people, they would turn you into an inquisitor. If you had the stomach for blood, you were turned into a mindless instrument of violence. Depending upon your skills, you might have become more or less independent in your work, only needing to report back here and there. You might have been sent on a specific or deep infiltration mission. Or you could have tried to escape, attempting to evade your former colleagues."
gold = 10
equipment = "Two tools or kits of your choice, a set of common clothes, a set of traveler's clothes and a set of fine clothes, and a pouch containing 10 gp."
trait = "Plucked from all Paths of Life"
traitDesc = "* Feature: Choose a feature that you are eligible for.\n* Income: As long as you continue your service you earn a comfortable lifestyle.\n* Jurisdiction: If you are still a member of the organization or can accurately fake it, you have special jurisdiction in some kingdoms. In Applegate, Crowhill, Eastcreek, Greenfield, and Karthmere, you do not answer to local authorities and can not be punished for executing your mission. In Armathain, Malgrave, and Sirendale, the agent must first ask for permission to enact their task or be treated as a criminal. In Beornhelm and Oldwood any Sacred Arms presence is considered unwelcomed and local authorities will be openly hostile if you reveal your identity."
bond = "If not, then Death: As an agent of the Inquisition, you enjoy a lot of freedom, except the Inquisition itself. A mission failed, or a string of mistakes might lead to the Sacred Arms terminating you as a liability. If you disobey and refuse orders, they have no time for dissenters and will, once again, attempt to terminate you. If you try to escape their clutches, they will try to hunt you down and destroy you as the threat you are and everyone you might have revealed your identity to, or worse."
freeSkillPoints = 4

[[backgrounds]]
name = "Sacred Arms Soldier"
category = "Kingdom"
kingdom = "Crowhill"
origin = "Crowhill"
desc = "You are a soldier in the Sacred Arms, the personal army of the Church of Riahn. Sacred Arms is notorious for its rigid training and its extensive traditions and rituals. A soldier of the Sacred Arms is foremost tasked with protecting the Church in Crowhill and all their diplomatic envoys, serving as bodyguards. They are also the main peacekeeping force in Eastcreek today after the successful occupation. You may be a personal bodyguard of a church official in their travels, an active soldier in Eastcreek, a captain stationed in Crowhill who experiences a call from Riahn, or you could have even deserted for your reasons."
gold = 20
equipment = "An insignia of rank, a trinket from the Random Trinket table, a set of traveler’s clothes, and a belt pouch containing 20 gp."
trait = "Army Hierarchy"
traitDesc = "* Familiarity: You possess inside knowledge of Sacred Arms’ operations, as well its strengths and weaknesses.\n* Income: As long as you serve the Sacred Arms you earn a modest lifestyle.\n* Jurisdiction: You possess a military rank in Sacred Arms, and soldiers of lower rank recognize your authority.\n* Residence: You are welcome in any establishment of the Sacred Arms and you might be able to acquire simple equipment from the organization."
bond = "In the Service Of The Sacred Arms: ❖ No Resignations: You have sworn an oath to Riahn and his church. If you have defected from Sacred Arms you will be met with hostility if you ever come across them again, you will be barred from any Church of Riahn, and if you're not careful with what you do and say, the Inquisition may come knocking on your door. ❖ Service: No matter your rank and your circumstances, your oath to Sacred Arms might demand active service from you. At any point in the campaign, Sacred Arms will ask for loyalty and work from you."
freeSkillPoints = 5
skills = ["Animal Handling", "Athletics", "Investigation", "Leadership", "Medicine", "Perception", "Persuasion"]
restrictSkills = ["Animal Handling", "Athletics", "Investigation", "Leadership", "Medicine", "Perception", "Persuasion"]

[[backgrounds]]
name = "Naturalist"
category = "Kingdom"
kingdom = "Eastcreek"
origin = "Eastcreek"
desc = "Naturalists can have many different names, and many paths can lead you to become a naturalist in Eastcreek. Essentially, a naturalist is someone who has devoted their life to the land. You can be a religious figure of Gera, a technically outlawed profession but a tradition that is barely surviving through the use of deception. Or you can be someone who worships the World itself. You can be a healer, someone who studies the earth and its plants and animals, or a wise advisor to a Vision."
gold = 10
equipment = "A quarterstaff, a Herbalism Kit, a Tattoo Kit, a set of traveler's clothes, a holy symbol, or a random trinket from the Random Trinket table, and a pouch containing 10 gp."
trait = "Let Nature Guide You"
traitDesc = "You have a special kind of relationship with nature that allows you to gain simple premonitions or questions answered by searching in the right place. Once per seven days and if you spend an hour, observing how the river fish jump, the clouds play on a windy sky or how a fowl is born, you can glean some insight into the natural realm. This works as a very basic form of divination, where the GM is free to reveal as much as they like to and in what manner."
freeSkillPoints = 4

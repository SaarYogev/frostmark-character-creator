[[backgrounds]]
name = "Defector Warrior"
category = "Kingdom"
kingdom = "Greenfield"
origin = "Greenfield"
desc = "You were one of the unfortunate souls whose life was forever changed when the Beornish chieftain Idris decided to do more in Greenfield than just raid. The Beornish had some use for you, as you can replenish their ranks. Perhaps you were one of the few survivors of the bastions of civilization and defense in the northern parts of Greenfield, and you were spared the ax by swearing to join Idris instead. Or you left your post before the incoming doom, deserting your fellow soldiers to join the winning side. You might have even lived in the southern parts of Greenfield but journeyed north to take advantage of the lay of the land. Either way, now you belong to neither camp. You are not a full-fledged Beornish raider, even if you have assimilated well with them, and you are certainly not as patriotic and principled as you once were as a fieldish."
gold = 15
equipment = "A trinket to remind you of your past life (an old insignia of your rank, a keepsake from your hometown, something that reminds you of the family you left behind, etc.), a gaming set of your choice, a set of traveler's clothes and a belt pouch containing 15 gp."
trait = "One of You"
traitDesc = "Your experiences, and the fact that you were embraced by the Beornish at all, speaks of your ability to be adaptable. You have learned how to fit amongst the Beornish, absorbing their culture and mannerisms to a degree it might be hard to tell you apart. Now you are certain you can test this in any culture, provided you have the right means. This trait allows you, only after a day or two of observing and preparing your look, to go unnoticed in another culture. Of course, you would potentially have to get your hands on the right papers and craft a believable story, but no one will think twice about seeing you walk down the street or small talking with you."
freeSkillPoints = 4
skills = ["Animal Handling", "Athletics", "Deception", "Perception"]
restrictSkills = ["Animal Handling", "Athletics", "Deception", "Perception"]

[[backgrounds]]
name = "Opportunist"
category = "Kingdom"
kingdom = "Greenfield"
origin = "Greenfield"
desc = "Many view Greenfield's situation to be a tragedy, but you see it as an opportunity to do business. And the shady kind at that. The powers that be in Greenfield and how they are busy eradicating each other has left little time and resources for either to police their lands and the no man's land in between them. There are plenty of people who are desperate enough to swindle, exploit, and manipulate. Many would pay a pretty coin to be smuggled out of the northern area to the south, but somehow they end up on the black market of Stormholme instead of through ports in Oldwood. Funny how that works. There are targets without sufficient protection that can be robbed, and some Beornish raiders can be more than arrogant in their vigilance.\n\nPerhaps you were always an outlaw, just thriving in the current climate. Perhaps you came from another bandit clan from somewhere else and traveled here for the opportunity. Or you were simply a normal citizen who had no other choice than to prey on others to survive."
gold = 10
equipment = "A tool or kit of your choice, a gaming set of your choice, traveler's clothes, and a belt pouch containing 10 gp."
trait = "Slippery"
traitDesc = "You are impressively slippery when avoiding the authorities out in the wild. You know how to scout the scouts, find weak points in guard patrols and how to slip over borders whilst going unnoticed. As long as you travel in a group that is as large or smaller than your proficiency times 3, animals of burden included, you and your group gain an advantage on all checks made to avoid notice whilst you are out in the wild."
freeSkillPoints = 4
skills = ["Animal Handling", "Arts & Craft", "Athletics", "Deception", "Perception", "Stealth", "Subterfuge", "Survival"]
restrictSkills = ["Animal Handling", "Arts & Craft", "Athletics", "Deception", "Perception", "Stealth", "Subterfuge", "Survival"]

[[backgrounds]]
name = "Royal Vanguard"
category = "Kingdom"
kingdom = "Greenfield"
origin = "Greenfield"
desc = "You are one of the last bastions of defense of Greenfield. You belong to the Sacred Arms' green branch, the division that decided to stay here after the Empire fell and not a journey to Crowhill, as many did around Frostmark. The green branch of Sacred Arms is almost the same as the real deal, but it is not as strict for many reasons when it comes to rules and regulations. As the Greenfielders have nicknamed them, many of the Royal Vanguard have fallen in the war against Beornhelm. Only a few hundred remain now, and most of them have fallen back to protect bigger cities or the King himself, the symbol of Greenfield. The Royal Vanguard is known for their stubborn loyalty, and they are a reason why this kingdom is still holding together."
gold = 15
equipment = "An insignia of rank, a trinket from the Random Trinket table, a set of fine clothes, and a belt pouch containing 15 gp."
trait = "Loyalty Goes a Long Way"
traitDesc = "* Familiarity: You possess inside knowledge of the military of Greenfield’s operations, as well as its strengths and weaknesses.\n* Income: As long as you remain in service to the Green Arms, you earn a comfortable lifestyle.\n* Jurisdiction:  You possess a military rank in Greenfield, and soldiers of lower rank recognize your authority. You can acquire simple equipment from the organization. You can move almost unhindered in the southern parts of Greenfield, the people always believing the best about you.\n* Residence: As Royal Vanguard of Greenfield, people view you with the utmost respect. You can find a bed, support, and aid, as long as it is not hazardous, amongst Greenfielders who are still allied with the King. Furthermore, you are welcome in any military establishment controlled by Greenfield."
bond = "In the Service of the Green Arms: ❖ No Resignations: If you have defected from the Green Arms you will be met with hostility if you ever come across them again, you will be barred from any Church of Riahn, and if you're not careful with what you do and say, the Inquisition may come knocking on your door. ❖ Service: No matter your rank and your circumstances, your oath to Greenfield's Sacred Arms might demand active service from you. At any point in the campaign, the Royal Vanguard will ask for loyalty and work from you. In addition, you have sworn an oath to Riahn and his Church."
freeSkillPoints = 4
skills = ["Academics", "Animal Handling", "Athletics", "Investigation", "Leadership", "Medicine", "Perception", "Persuasion"]
restrictSkills = ["Academics", "Animal Handling", "Athletics", "Investigation", "Leadership", "Medicine", "Perception", "Persuasion"]

[[backgrounds]]
name = "Guild Artisan"
category = "Kingdom"
kingdom = "Karthmere"
origin = "Karthmere"
desc = "You are a member of an artisan's guild in Karthmere, skilled in a particular field of arts and crafts. You are a well-established part of the mercantile world in Karthmere, freed by talent and wealth from the constraints of a feudal social order. You learned your skills as an apprentice under a master through your guild's sponsorship until you became a master in your own right. As a member of your guild, you know the skills needed to create finished items from raw materials (provided that you have access to the right kind of Artisan's Tools), as well as the principles of trade and good business practices. The question now is whether you abandon your trade for the story's narrative or take on the extra effort to weave adventure and trade together."
gold = 15
equipment = "A set of Artisan's Tools (one of your choice), a letter of introduction from your guild, a set of traveler's clothes, and a belt pouch containing 15 gp."
trait = "Guild Membership"
traitDesc = "As an established and respected member of your guild, you gain certain benefits that your membership provides.\n* Income: As long as you practice your craft or trade, you earn a comfortable lifestyle.\n* Jurisdiction: Guilds in Karthmere wields a modicum of political power. If you are accused of a crime, your guild might support you if it is worth their time and/or your innocence is easily proven. You might be able to gain access to powerful figures through the guild if you are a member in good standing. Such connections might require payment from the guild, in the form of donations of coins or valuable items to the guild's coffers.\n* Residence: Your fellow guild members will provide you with lodging and food if necessary. In some cities and towns, a guildhall offers a central place to meet other members of your profession, which can be a good place to meet potential patrons, allies, or hirelings."
bond = "Monthly Fee: You must pay dues of 5 gp per month to the guild. If you miss payments, you must make up back dues to remain in the guild's good graces."
freeSkillPoints = 4
skills = ["Academics", "Arts & Craft", "Empathy", "Persuasion"]
restrictSkills = ["Academics", "Arts & Craft", "Empathy", "Persuasion"]


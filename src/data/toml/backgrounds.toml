kingdom = "Eastcreek"
origin = "Eastcreek"
desc = "You are a mounted warrior from one of the clans of Eastcreek, or you defected your crumbling clan to one of the surviving ones. Choose one of the remaining clans, Red Stag, Iron Crow, or Swift Fox. As a clan member, you have ridden horses all your life and know them like the back of your hand. And as a warrior, you have trained to turn your horsemanship into a deadly weapon. Maybe you are still fighting for the clans' survival in your way, or maybe you have left Eastcreek for your reasons."
gold = 5

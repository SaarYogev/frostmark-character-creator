[[backgrounds]]
name = "Nightstriders' Dropper"
category = "Kingdom"
kingdom = "Stormholme"
origin = "Stormholme"
desc = "You are among the many thugs and enforcers the Guild owns. You may have been picked up as a sturdy urchin from a gutter somewhere, you might have been indebted or in trouble with the Guild, and this is your only salvation, or you simply liked the thought of being strong enough to be the bully, not the bullied. You can be a bodyguard to the guild merchants, and businessmen, an operative performing shady tasks in the shadows, or even an assassin hired for someone else in some corner of Frostmark. You know how to take care of yourself, and as long as other people wind up dead rather than you, you can continue to earn your pretty coins."
gold = 15

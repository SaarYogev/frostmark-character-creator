[[backgrounds]]
name = "Sea's Embrace Herald"
category = "Kingdom"
kingdom = "Stormholme"
origin = "Stormholme (most often from the island of Nodensia)"
desc = "You are one of the few souls on Frostmark that has been unblinded by the Church of Riahn and its lies. You know that the other Enneade are not devils or any less good or evil than Riahn is himself. You might have been a child growing up in the fishing community in Nodensia, hearing about the old legends of worship on the island, and decided to join the growing and secretive guild of the Sea's Embrace of your own volition. Or perhaps you miraculously came across this secret and became so enamored with it that you left your old life to join the guild.\n\nSea's Embrace has been allowed to thrive by the grace of its ally, Stormgarde, where Tecla herself seems to show a certain degree of curiosity for their teachings. Primarily, Sea's Embrace finds it unfair that the other guilds have all but abandoned religion. They think it should be anyone's right in Stormholme to practice any kind of worship, just as the Stormers are free in most other regards. Religion is not outlawed per se by the four guilds, but they usually see no use in them and only sometimes as a threat.\n\nAs a Sea's Embrace member, you must take on a false persona to hide your true intentions. The other guilds are not ready yet for your revelation, and Sacred Arms would brand you as a heretic would they ever discover you. Therefore, you must make your moves in the shadows, slowly changing the playing field to a point where you can openly practice what you preach. Sea's Embrace guild members can have different specialties, but they are often some kind of hybrid priest with dashes of a diplomat, politician, or agent."
gold = 10
equipment = "Two tools, kits, or musical instruments of your choice, a hidden insignia of Lapuana, a set of clothing of your choice, and a belt pouch containing 10 gp."
trait = "Guild Membership"
traitDesc = "As an established and respected member of your guild, you gain certain benefits that your membership provides.\n* Income: As long as you practice your craft or trade, you earn a modest lifestyle.\n* Jurisdiction: The Sea’s Embrace guild wields some political power. If you need it they will offer you aid to the best of their ability. You might be able to gain access to powerful figures through the guild if you are a member in good standing.\n* Residence: Your fellow guild members will provide you with lodging and food if necessary. In some cities and towns, a guildhall offers a central place to meet other members of your profession, which can be a good place to meet potential patrons, allies, or hirelings. In Nodensia there are several guild establishments that you gain full access to. Background Trait: Second Life You have created a second identity for yourself, including all the backstory, disguise, and paperwork you need to make it near immaculate. In addition, you gain a certain knack for falsifying documentation."
bond = "Devotion To The Sea: You have devoted your soul and work to Lapuana and her journey. Bond: Heretic If your participation with the occult would come to light, the Sacred Arms inquisitorial agents will attempt to hunt you down and silence you."

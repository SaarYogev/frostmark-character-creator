desc = "After you throw a weapon that has been enchanted by this Soul Gift, it returns automatically to the same square the attack was launched from on the battlefield at the end of your turn. You can catch it if you end your turn in that space as a free action if you have a hand free.\nArcane Fire"

[[abilities]]

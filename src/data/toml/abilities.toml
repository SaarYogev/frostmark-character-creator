name = "Relentless Rage"
desc = "If you drop to 0 hit points while you're raging and don't die outright, you can make a DC 10 Vitality saving throw. If you succeed, you drop to 1 hit point instead. Each time you use this ability after the first, the DC increases by 5. When you finish a short or long rest, the DC resets to 10."

[[abilities]]

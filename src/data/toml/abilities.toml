selection = "Primary"
name = "Channel Divinity (Storm)"
desc = "For a short moment, you can channel the divine essence of your God through yourself. Channel Divinity abilities, shortened as “CD”, share these rules;\nCD High Voltage: Instead of rolling damage dice, you may use your Channel Divinity to deal maximum damage with a spell or ability that deals thunder or lightning damage."


name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Occult Student"
level = 20
selection = "Primary"
name = "Superior Spell Mastery"
desc = "You gain mastery over two powerful spells and can cast them with little effort. Choose two 3rd-level spells that you know. Once per short or long rest, you can cast them as Soul Mastery."

[[abilities]]
origin = "Pact"
level = 1
selection = "Primary"
name = "Patron (Angelic)"
desc = "Mending Warmth: Your Soul oozes a warmth that reinvigorates your allies. You gain a number of d6s equal to 1 + your level picks of [Pact]. You can heal other creatures by spending a bonus action and dice from your pool. You roll the dice, add it together, and restore that many hit points. You can only spend a number of dice equal to your Presence modifier (minimum of 1) on your turn. You regain all your spent dice when you complete a long rest."

[[abilities]]
origin = "Pact"
level = 1
selection = "Primary"
name = "Patron (Explorer)"
desc = "Energy Field: Once per short or long rest, a swirling field of energy surrounds you. As a bonus action, you gain resistance against all damage and you deal radiant damage equal to your [Pact] + your Intelligence modifier to all hostile creatures who end their turn within 2 m of you until the end of your next turn."

[[abilities]]
origin = "Pact"
level = 1
selection = "Primary"
name = "Patron (Fey)"
desc = "Beguiling Aura: Once per short or long rest you may frighten or charm (your choice) all creatures in a 2 m cube originating from you as an action. The creatures in the area make an Int/Cun saving throw against your spell save DC. On a failed save, the creature suffers the condition until the end of your next turn."

[[abilities]]
origin = "Pact"
level = 1
selection = "Primary"
name = "Patron (Fiend)"
desc = "Violent Nourishment: When you reduce a hostile creature to 0 hit points, you gain temporary hit points equal to your Presence modifier + your level picks in [Pact] (minimum of 1)."

[[abilities]]
origin = "Pact"
level = 1
selection = "Primary"
name = "Patron (Lurker)"
desc = "Jinx: Once per short or long rest, you can curse one creature that you can see within 6 m of you as a bonus action. The curse lasts for 10 rounds or until you or the creature becomes incapacitated. As long as the curse is in effect you gain these benefits:\nA bonus to your damage from both spell attacks and weapon attacks equal to your proficiency bonus.\nYour critical range increases to 19 against the cursed target.\nIf the target dies whilst it is cursed, you recover hit points equal to your level picks in [Pact] plus your Manipulation modifier."

[[abilities]]
origin = "Pact"
level = 1
selection = "Primary"
name = "Patron (Psychic)"
desc = "Ascension: As long as a creature knows one language and is within 6 m of you, you can telepathically communicate with it and the creature will understand you. The creature cannot reply."

[[abilities]]
origin = "Pact"
level = 1
selection = "Primary"
name = "Patron (Undead)"
desc = "Deceased Familiarity: Any undead must first succeed a resolve saving throw against your spell DC before targeting you directly with an attack or spell that deals damage, or be forced to target somebody else, potentially forfeiting the attack or spell. The undead creature becomes immune to this ability for 24 hours if it succeeds the saving throw and if you target the undead with an attack or a spell that deals damage. In addition, you learn the Spare the Dying cantrip as Soul Mastery and you receive advantage to all saving throws against disease."

[[abilities]]
origin = "Pact"
level = 1
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\nOne point to use in the Accomplishment section or to store for later purchase in the same section\n10 Potential"

[[abilities]]
origin = "Pact"
level = 2
selection = "Primary"
name = "Absorbed Soul Aspect"
desc = "When you pick this ability you gain two Absorbed Soul Aspects. For every third level of [Pact] you possess you may learn another Absorbed Soul Aspect. If you picked this ability at level 2 you receive another Absorbed Soul Aspect at 4th, 7th, 10th, 13th, 16th, and 19th pick of [Pact] to a maximum of 8 Aspects. Additionally, when you pick a level of [Pact], you can choose one of the Aspects you know and replace it with another Aspect that you could learn at that level."

[[abilities]]
origin = "Pact"
level = 2
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\nOne point to use in the Accomplishment section or to store for later purchase in the same section\n10 Potential"

[[abilities]]
origin = "Pact"
level = 3
selection = "Primary"
name = "Pact Boon (Blade)"
desc = "As an action, you can create a melee [Pact] weapon of your choice in your hand. These rules apply to your [Pact] weapon:"

[[abilities]]
origin = "Pact"
level = 3
selection = "Primary"
name = "Pact Boon (Proficient)"
desc = "You are proficient with it while you wield it."

[[abilities]]
origin = "Pact"
level = 3
selection = "Primary"
name = "Pact Boon (Magical)"
desc = "This weapon counts as magical for the purpose of overcoming resistance and immunity to nonmagical attacks and damage."

[[abilities]]
origin = "Pact"
level = 3
selection = "Primary"
name = "Pact Boon (Duration)"
desc = "Your [Pact] weapon disappears if it is more than 1 m away from you for 10 rounds or more. It also disappears if you use this ability again, if you dismiss the weapon (no action required), or if you die. You can dismiss the weapon, shunting it into an extradimensional space, and it appears whenever you create your [Pact] weapon thereafter."

[[abilities]]
origin = "Pact"
level = 3
selection = "Primary"
name = "Pact Boon (Transform)"
desc = "You can transform one magic weapon into your [Pact] weapon by performing a special ritual while you hold the weapon. You perform the ritual for over 1 hour, which can be done during a short rest. You can't affect an artifact or a sentient weapon in this way. The weapon ceases being your [Pact] weapon if you die, if you perform the 1-hour ritual on a different weapon, or if you use a 1-hour ritual to break your bond to it. The weapon appears at your feet if it is in the extradimensional space when the bond breaks."

[[abilities]]
origin = "Pact"
level = 3
selection = "Primary"
name = "Pact Boon (Bond)"
desc = "You learn the Find Familiar spell and can cast it as a ritual and Soul Mastery.\nWhen you cast the spell, you can choose one of the normal forms for your familiar or one of the following special forms: Imp, Pseudodragon, Quasit, or Sprite.\nAdditionally, when you take the attack action, you can forgo one of your own attacks to allow your familiar to use its reaction to make one attack of its own."

[[abilities]]
origin = "Pact"
level = 3
selection = "Primary"
name = "Pact Boon (Tome)"
desc = "Your patron gives you a spellbook. When you gain this ability, choose three cantrips from the spell list. While the book is on your person, you can cast those cantrips at will. They don't count against your number of cantrips known.\nIf you lose your spellbook, you can perform a 1-hour ceremony to receive a replacement from your patron. This ceremony can be performed during a short or long rest, and it destroys the previous book. The book turns to ash when you die."

[[abilities]]
origin = "Pact"
level = 3
selection = "Primary"
name = "Pact Boon (Stellar Bond)"
desc = "If you have chosen Explorer as your patron you can select this Pact Boon. This Pact Boon grants your character a chain forged in starlight and whilst this chain is on your person you gain two benefits:\nOnce per short or long rest, you gain advantage to one Intelligence check or a skill check including Intelligence.\nYou can cast the Augury spell as Soul Mastery but only as a ritual.\nThe chain disappears if you would die. Once per short or long rest, you can perform"

[[abilities]]
origin = "Pact"
level = 3
selection = "Primary"
name = "Pact Boon (a 1)"
desc = "hour ritual to replace your star chain if it is lost."

[[abilities]]
origin = "Pact"
level = 3
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\nOne point to use in the Accomplishment section or to store for later purchase in the same section\n10 Potential"

[[abilities]]
origin = "Pact"
level = 4
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Pact"
level = 5
selection = "Primary"
name = "Improved Magical Upgrade"
desc = "Gain one of your choices:\nTwo points to use in the Accomplishment section or to store for later purchase in the same section\n20 Potential\n+1 to an ability score of your choice\nPick an additional feat from the feat list"

[[abilities]]
origin = "Pact"
level = 6
selection = "Primary"
name = "Patron (Angelic)"
desc = "Heart of Gold: Whenever you cast a spell that deals fire or radiant damage to one target, you add your Presence modifier to the damage. In addition, you gain resistance to radiant damage."

[[abilities]]
origin = "Pact"
level = 6
selection = "Primary"
name = "Patron (Explorer)"
desc = "Star Step: Once per long rest, you can temporarily teleport into the Stellar Expanse as an action. You return at the end of your turn and then your turn ends, but before then you can cast two spells that target yourself. This movement does not trigger an attack of opportunity."

[[abilities]]
origin = "Pact"
level = 6
selection = "Primary"
name = "Patron (Fey)"
desc = "Fade Out: Once per short or long rest, you become invisible and teleport up to 12 m to an unoccupied space you can see if you take combat damage. You remain invisible until the end of your next turn or until you take a hostile action."

[[abilities]]
origin = "Pact"
level = 6
selection = "Primary"
name = "Patron (Fiend)"
desc = "Fiendish Luck: When you make an ability check or a saving throw, you can use this ability to add 1d10 to your roll. You can do so after seeing the initial roll but before any of the roll's effects occur. Once you use this ability, you can't use it again until you finish a short or long rest."

[[abilities]]
origin = "Pact"
level = 6
selection = "Primary"
name = "Patron (Lurker)"
desc = "Ghost Caller: Once per long rest, you can cause a Soul to rise as a ghost from a humanoid creature you killed this turn. The Soul that rises has the statistics of a specter but with a few differences:\nIt gains a bonus to its attack roll equal to your Manipulation modifier.\nIt gains temporary hit points equal to half your total level.\nThe specter obeys your commands and rolls its own initiative. The Soul returns to the world after you finish a long rest."

[[abilities]]
origin = "Pact"
level = 6
selection = "Primary"
name = "Patron (Psychic)"
desc = "Mind Over Matter: Once per short or long rest, you can spend a reaction to give an enemy attacking you disadvantage to the attack roll. Before the end of your next turn, you may make your next attack roll with advantage if you caused the attack to miss this way."

[[abilities]]
origin = "Pact"
level = 6
selection = "Primary"
name = "Patron (Undead)"
desc = "Escape Fate: Once per long rest, when you stabilize a creature with the Spare the Dying cantrip, you can heal them for 1d8 + your Vitality modifier. Alternatively, when you succeed on a death saving throw, you can heal yourself for 1d8+ your Vitality modifier (minimum 1)."

[[abilities]]
origin = "Pact"
level = 7
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\nOne point to use in the Accomplishment section or to store for later purchase in the same section\n10 Potential"

[[abilities]]

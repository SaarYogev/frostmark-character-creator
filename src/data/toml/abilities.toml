selection = "Primary"
name = "Spellbow: Arcane Projectile"
desc = "Arcane Projectile is a magical effect that represents each school of Soul Magic. The assortment of Arcane Projectile options is presented here in alphabetical order. If you have not chosen an ability score for your spellcasting, choose one when you decide on your Arcane Projectile options.\nProjectile of Charm\nYou infuse your projectile with Enchantment magic. Choose an ally within 6 m of the target hit by your projectile. The target must succeed on a Composure saving throw or be charmed by your chosen ally. The condition lasts for 5 rounds. The target may roll the saving throw again at the end of their turns to end the effect early. In addition to the normal damage the Projectile of Charm deals, the target suffers an extra 2d6 psychic damage.\nAfter you have picked 18 levels of [Tactics], the target suffers 4d6 psychic damage instead, in addition to Projectile of Charm’s effects.\nProjectile of Debilitation\nYou infuse your projectile in Necromantic magic. You force a creature hit by the projectile to roll a Vitality saving throw. On a failure, the target’s weapon attacks deal half damage. The condition lasts for 5 rounds. The target may roll the saving throw again at the end of their turns to end the effect early. In addition to the normal damage the Projectile of Debilitation deals, the target suffers an extra 2d6 necrotic damage.\nAfter you have picked 18 levels of [Tactics], the target suffers 4d6 necrotic damage instead, in addition to Projectile of Debilitation’s effects.\nProjectile of Exile\nYou infuse your projectile with Abjuration magic. You force a creature hit by the projectile to roll a Presence saving throw. On a failure, you temporarily banish the creature until the end of its next turn to their home Realm. They appear in a safe location where they are considered incapacitated and their speed is zero. The creature reappears again in its original spot if it is unoccupied. If not, the creature reappears in the closest vacant spot.\nAfter you have picked 18 levels of [Tactics], the creature also suffers 2d6 force damage in addition to Projectile of Exilement’s effects.\nProjectile of Explosion\nYou infuse your projectile with Evocation magic. After your projectile successfully hits its target, the target and all other creatures in a 2 m radius take 2d6 force damage each.\nAfter you have picked 18 levels of [Tactics], creatures suffer 4d6 force damage instead.\nProjectile of Hunting\nYou infuse your projectile with Divination magic. When you use this Arcane Projectile option you do not roll an attack roll. The projectile is flung towards a target that you saw less than a minute ago and is within your ranged weapon’s range. It weaves and turns around corners if it has to, and ignores half and three-quarters cover. If the projectile reaches its target, the target makes a Dexterity saving throw. If the saving throw is a success, you learn their current location and the target takes your normal ranged weapon attack damage plus an additional 1d6 force damage. If the saving throw is a success you do not learn their location and they only suffer half damage.\nAfter you have picked 18 levels of [Tactics], the target suffers 2d6 force damage instead, in addition to Projectile of Hunting’s effects.\nProjectile of the Phantasm\nYou infuse your projectile with Transmutation magic. When this projectile is fired it can move through objects and cover, and it flies like a 1 m wide and 6 m long line. When you use this Magical Discharge option you don’t roll an attack roll for your attack action. Any creature within the trajectory of the projectile must succeed on a Dexterity saving throw or take the damage of the projectile plus additional 1d6 piercing damage. On a success, the creatures in the trajectory take half damage.\nAfter you have picked 18 levels of [Tactics], the target suffers 2d6 piercing damage instead, in addition to the Projectile of the Phantasm’s effects.\nProjectile of Shade\nYou infuse your projectile with Illusion magic. If your projectile hits its target, the projectile obscures their vision until the start of your next turn. Your target must make a successful Resolve saving throw or take 2d6 psychic damage and not be able to see anything farther than 1 m away.\nAfter you have picked 18 levels of [Tactics], the target suffers 4d6 psychic damage instead, in addition to Projectile of Hunting’s effects.\nProjectile of Thorns\nYou infuse your projectiles with Conjuration magic. The creature hit with your projectile is wrapped in thorny and poisonous vines. This effect lasts for 10 rounds or until the target or any other creature within 1 m of your target attempts to remove them. A successful Brawn: Athletics check against your spell DC ends the effect early.\nOn a hit, the target takes an extra 2d6 poison damage. As long as the vines are wrapped around the target its speed is reduced by 2 m and the first time on each of the target’s turns when the target moves more than 1 m without teleporting, it takes an additional 2d6 slashing damage.\nAfter you have picked 18 levels of [Tactics], the target suffers 4d6 poison and slashing damage instead, in addition to Projectile of Thorns’ effects."

[[abilities]]
origin = "Tactics"
level = 20
selection = "Primary"
name = "Grandmaster: Weapon Techniques"
desc = "Some of the Weapon Techniques require a saving throw. It equals 8 + proficiency bonus + Brawn or Dexterity modifier (your choice).\nAccurate Strike\nYou can increase the accuracy of a weapon attack roll you make by spending a Technique Die before or after you make an attack roll, but before the GM declares the attack to be a hit or a miss. Roll your Technique Die and add it to your attack roll.\nAssail of the Captain\nDuring your attack action on your turn, you may spend a Technique Die and a bonus action to let an ally that you can see and hear immediately make a weapon attack action as a reaction. The ally receives the result of your Technique Die to their attack’s damage die.\nBlock\nYou can reduce the damage of a melee attack that damages you by spending a Technique Die and a reaction. The damage is reduced by your Dexterity modifier in addition to the result of your Technique Die.\nDizzying Bash\nYou can attempt to disarm your target by spending a Technique Die when you successfully hit a creature with a weapon attack. The creature rolls a Brawn saving throw and on a fail drops an object to its feet of your choice. You add your Technique Die to the damage you deal with your weapon attack.\nDrive Back\nYou can push a target back by spending a Technique Die when you successfully hit a creature with a weapon attack. The creature rolls a Brawn saving throw and on a fail gets pushed back 3 m away from you. You add your Technique Die to the damage you deal with your weapon attack.\nEluding Movement\nYou can add the result of one Technique Die to your AC when you spend movement this turn. When you stop moving you lose this benefit.\nEncourage\nYou can encourage an ally of your choice by spending a Technique Die and a bonus action. A creature of your choice that can see gains temporary hit points equal to your Presence modifier in addition to the result of your Technique Die.\nExtended Strike\nYou can increase the reach of one melee weapon attack you make on your turn by spending one Technique Die. You add your Technique Die to the damage you deal if you hit with your melee weapon attack.\nFalling Strike\nYou can knock a target prone by spending a Technique Die when you successfully hit a creature with a weapon attack. If the creature is large or smaller, it rolls a Brawn saving throw and on a fail the target is knocked prone. You add your Technique Die to the damage you deal with your weapon attack.\nIntimidating Strike\nYou can frighten a creature by spending a Technique Die when you successfully hit a creature with a weapon attack. The creature rolls a Resolve saving throw and on a fail becomes frightened of you until the end of your next turn. You add your Technique Die to the damage you deal with your weapon attack.\nMisleading Attack\nYou can give an ally an opening for an attack by spending a Technique Die when you successfully hit a creature with a weapon attack. Until the start of your next turn, the next attack roll an ally makes has advantage. You add your Technique Die to the damage you deal with your weapon attack.\nPlotting Strike\nYou can move one ally into a new position by spending a Technique Die when you successfully hit a creature with a weapon attack. An ally of your choice that can see and hear you can use its reaction to immediately move up to half its speed without provoking opportunity attacks from the target you hit with Plotting Strike. You add your Technique Die to the damage you deal with your weapon attack.\nProvoking Strike\nYou can attempt to provoke a creature to attack you by spending a Technique Die when you successfully hit a creature with a weapon attack. The creature rolls a Composure saving throw and on a fail, until the end of your next turn, receives disadvantage on all of its attack rolls against targets other than you. You add your Technique Die to the damage you deal with your weapon attack.\nRetort\nYou can immediately make a melee weapon attack against a creature that misses you with a melee attack by spending a Technique Die and a reaction. You add your Technique Die to the damage you deal if you hit with your melee weapon attack.\nRuse Strike\nYou may expend a Technique Die and a bonus action to receive advantage on the next weapon attack roll you make before the end of your turn. You add your Technique Die to the damage you deal if you hit with your weapon attack."

[[abilities]]
origin = "Unique Ancestry"

name = "Absorb Soul Aspect (Prerequisite)"
desc = "Your connection to your patron allows you to glimpse aspects of power from your patron’s Soul, and then, with time, embody them yourself. When you gain a level in [Pact], you can choose one of the Soul aspects you know and replace it with another Soul aspect that you could learn at that level. If an aspect has prerequisites, you must meet them to learn it. You can learn the Soul aspect at the same time that you meet its prerequisites.\nNo Level RequirementAgonizing Blast\nPact of the Tome\nYou cannot fall asleep anymore, not even by magical means. You can still gain the benefits of a long rest but you must spend it only doing light activity.\nMask of Many FacesYou can cast Disguise Self as Soul Mastery.\nMisty VisionsYou can cast Silent Image as Soul Mastery.\nRepelling Blast"


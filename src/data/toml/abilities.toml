[[abilities]]
origin = "Artistry"
level = 2
selection = "Secondary"
name = "College (Charmer)"
desc = "**Hypnotic Work**\n\nIf you perform for at least 1 minute, you can attempt\n\nto hypnotize an audience by singing, reciting a poem, dancing, etc. At the end of\n\nthe performance, choose a number of humanoids within 12 m of you who\n\nwatched and listened to all of it, up to a number equal to your Presence or\n\nManipulation modifier (minimum of one). Each target must succeed on a\n\nComposure saving throw against your spell save DV or be charmed by you. While\n\ncharmed in this way, the target idolizes you, it speaks glowingly of you to anyone\n\nwho talks to it, and it hinders anyone who opposes you, although it avoids\n\nviolence unless it was already inclined to fight on your behalf. This effect ends on\n\na target after 1 hour, if it takes any damage, if you attack it, or if it witnesses you\n\nattacking or damaging any of its allies.\n\nIf a target succeeds on its saving throw, the target has no hint that you tried to\n\ncharm it.\n\nOnce you use this ability, you can't use it again until you finish a short or long\n\nrest."


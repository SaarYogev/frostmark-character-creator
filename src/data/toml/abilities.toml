name = "Metamagic"
desc = "Gain another Metamagic option."

[[abilities]]
origin = "Unique Ancestry"
level = 11
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\nTwo points to use in the Accomplishment section or to store for later purchase in the same section\n20 Potential"

[[abilities]]

[[abilities]]
origin = "Divine Oath"
level = 3
selection = "Primary"
name = "Sacred Oath (Act of Aggression)"
desc = "Your oath allows you to channel divine energy to fuel magical effects. Each Channel Divinity option provided by your oath explains how to use it.\nWhen you use your Channel Divinity, you choose which option to use. You must then finish a short or long rest to use your Channel Divinity again. After 6 level picks of [Divine Oath] you can use it twice per day, and after 18 level picks of [Divine Oath] thrice.\nSome Channel Divinity effects require saving throws. When you use such an effect from this class, the DC equals your spell save DC.\nIn addition, you may expend a use of Channel Divinity as a bonus action to regain one expended spell slot of the first level.\n- Riahn: You gain the following two Channel Divinity options.\nYou can target one creature of your choice within 2 m of you with your Aggression as a bonus action. You gain advantage on attack rolls for 10 rounds against a creature targeted this way, or until the creature is defeated.\n- Vegomo: You gain the following two Channel Divinity options."

[[abilities]]
origin = "Divine Oath"
level = 3
selection = "Primary"
name = "Sacred Oath (Peaceful Solution)"
desc = "Your oath allows you to channel divine energy to fuel magical effects. Each Channel Divinity option provided by your oath explains how to use it.\nWhen you use your Channel Divinity, you choose which option to use. You must then finish a short or long rest to use your Channel Divinity again. After 6 level picks of [Divine Oath] you can use it twice per day, and after 18 level picks of [Divine Oath] thrice.\nSome Channel Divinity effects require saving throws. When you use such an effect from this class, the DC equals your spell save DC.\nIn addition, you may expend a use of Channel Divinity as a bonus action to regain one expended spell slot of the first level.\n- Riahn: You gain the following two Channel Divinity options.\nYou can grant yourself a +5 bonus to Persuasion (Pre) checks for 10 minutes as a bonus action."

[[abilities]]
origin = "Divine Oath"
level = 3
selection = "Primary"
name = "Sacred Oath (Pacify)"
desc = "Your oath allows you to channel divine energy to fuel magical effects. Each Channel Divinity option provided by your oath explains how to use it.\nWhen you use your Channel Divinity, you choose which option to use. You must then finish a short or long rest to use your Channel Divinity again. After 6 level picks of [Divine Oath] you can use it twice per day, and after 18 level picks of [Divine Oath] thrice.\nSome Channel Divinity effects require saving throws. When you use such an effect from this class, the DC equals your spell save DC.\nIn addition, you may expend a use of Channel Divinity as a bonus action to regain one expended spell slot of the first level.\n- Riahn: You gain the following two Channel Divinity options.\nImmediately after another creature within 6 m of you is dealt damage from an attack that did not originate from you, you can spend your reaction to force the attacker to make a Resolve saving throw. On a failed save, the attacker takes psychic damage equal to the damage it just dealt. On a successful save, it takes half as much damage."

[[abilities]]
origin = "Divine Oath"
level = 3
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\nOne point to use in the Accomplishment section or to store for later purchase in the same section\n10 Potential"

[[abilities]]
origin = "Divine Oath"
level = 4
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Divine Oath"
level = 5
selection = "Primary"
name = "Extra Attack"
desc = "As part of your attack action, you can make two attacks instead of one. You must possess at least 1 level of [Divine Oath] to be eligible for this ability (excluding this level)."

[[abilities]]
origin = "Divine Oath"
level = 6
selection = "Primary"
name = "Aura of Protection"
desc = "Whenever you or a friendly creature within 2 m of you must make a saving throw, the creature gains a bonus to the saving throw equal to your Presence modifier (minimum 1 but maximum +3). You must be conscious to grant this bonus. At 18th total level, the range of this aura increases to 6 m."

[[abilities]]
origin = "Divine Oath"
level = 7
selection = "Primary"
name = "Sacred Oath (Riahn)"
desc = "Aura of Radiant Awe: You and friendly creatures within 2 m of you have advantage on mental and social saving throws while you are conscious. At 18th total level, the range of this aura increases to 6 m."

[[abilities]]
origin = "Divine Oath"
level = 7
selection = "Primary"
name = "Sacred Oath (Gera)"
desc = "Defender of the Pack: When a creature within 2 m of you takes damage, you can use your Reaction to magically take that damage, instead of that creature taking it. This ability doesn't transfer any other effects that might accompany the damage, and this damage can't be reduced in any way. At 18th total level, the range of this aura increases to 6 m."

[[abilities]]
origin = "Divine Oath"
level = 7
selection = "Primary"
name = "Sacred Oath (Teranis)"
desc = "Scheming Generosity: You, your allies, any celestial and fiends within 2 m of you, gain a bonus to their weapon damage rolls equal to your Cunning modifier (minimum 1). A creature can benefit from this ability from only one source at a time. At 18th total level, the range of this aura increases to 6 m."

[[abilities]]
origin = "Divine Oath"
level = 7
selection = "Primary"
name = "Sacred Oath (Lapuana)"
desc = "Harmony: When a creature within 2 m of you takes damage, you can use your Reaction to magically take that damage, instead of that creature taking it. This ability doesn't transfer any other effects that might accompany the damage, and this damage can't be reduced in any way. At 18th total level, the range of this aura increases to 6 m."

[[abilities]]
origin = "Divine Oath"
level = 7
selection = "Primary"
name = "Sacred Oath (Borias)"
desc = "Harbinger of Ruin: As long as you are not incapacitated, creatures who are frightened and are within 2 m of you that you can see and hear, suffer a number of penalties:\nTheir speed becomes 0.\nIf the creature starts its turn within your range, it takes cold damage equal to half your [Divine Oath].\nAt 18th total level, the range of this ability increases to 6 m."

[[abilities]]
origin = "Divine Oath"
level = 7
selection = "Primary"
name = "Sacred Oath (Suhlmis)"
desc = "Fervent Persecution: Whenever you successfully hit an opportunity attack, you can immediately move up to half your speed as part of the same reaction. This movement doesn't provoke opportunity attacks."

[[abilities]]
origin = "Divine Oath"
level = 7
selection = "Primary"
name = "Sacred Oath (Vegomo)"
desc = "Queller of Violence: You and friendly creatures within 2 m of you have resistance to damage from spells. At 18th total level, the range of this aura increases to 6 m."

[[abilities]]
origin = "Divine Oath"
level = 8

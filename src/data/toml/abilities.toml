desc = "You can use your Wild Shape an unlimited number of times (except for elementals where you still need to spend Wild Shape uses like normal) but you still suffer the Hit Dice penalty as normal. Additionally, when you are transformed with your Wild Shape ability you ignore the verbal and somatic components of spells."

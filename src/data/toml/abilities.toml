level = 7
selection = "Primary"
name = "Martial Archetype Abilities (Beast Slayer)"
desc = "**Scourge of Giants**\n\nWhenever you roll damage you may add two\n\nSlayer Technique Dice instead of one. If you damage a celestial, fey, fiend,\n\nmonstrosity, or an undead you deal the maximum damage with your Slayer\n\nTechnique Dice."

[[abilities]]
origin = "Tactics"
level = 7
selection = "Primary"
name = "Martial Archetype Abilities (Bruiser)"
desc = "**Fierce Resilience**\n\nYou may add 1d6 and add the result to any saving\n\nthrow you make. This bonus applies to death saving throws as well. If your result\n\nto a death saving throw would be 20 or above this way, treat the result as a\n\nnatural 20."

[[abilities]]
origin = "Tactics"
level = 7
selection = "Primary"
name = "Martial Archetype Abilities (Champion)"
desc = "**Olympic Vigor**\n\nWhen you make a running long jump, the distance\n\nyou can cover increases by a number of meters equal to half your Brawn or\n\nDexterity modifier (your choice, rounded up, minimum 1). In addition, whenever\n\nyou take the dash action you may make one melee or ranged weapon attack as a\n\nbonus action a number of times per long rest equal to your Vitality modifier\n\n(minimum 1)."

[[abilities]]
origin = "Tactics"
level = 7
selection = "Primary"
name = "Martial Archetype Abilities (Grandmaster)"
desc = "**Knowledge is Power**\n\nIf you interact or observe another creature\n\noutside of combat for at least a minute, you learn some of their capabilities.\n\nChoose two characteristics from below, your GM tells you if they are superior,\n\ninferior, or equal compared to you:\n\n  * Brawn score\n\n  * Dexterity score\n\n  * Vitality score\n\n  * Armor Class\n\n  * Current health points\n\n  * Total level/CR\n\n  * [Tactics] class levels, if any"

[[abilities]]

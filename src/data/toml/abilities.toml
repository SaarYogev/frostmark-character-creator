level = 15
selection = "Primary"
name = "Vow (Aegis)"
desc = "Defend Feeble: Once per short rest, you can spend a reaction to move up to your speed (or your mount’s speed if you are mounted) towards an opponent and make one melee weapon attack. This movement must end adjacent to an enemy and it triggers attacks of opportunity as normal."

[[abilities]]
origin = "Soul Oath"
level = 15
selection = "Primary"
name = "Vow (Aspiration)"
desc = "Push the Advantage: Once per long rest, you gain a bonus equal to your proficiency bonus on your AC, ability checks, attack rolls, damage rolls, saving throws, and skill checks for a number of rounds equal to your Cunning modifier (minimum of 1)."

[[abilities]]
origin = "Soul Oath"
level = 15
selection = "Primary"
name = "Vow (Chivalry)"
desc = "Sacred Threat: Once per long rest, you may increase the potency of your normal Threat ability to a Sacred Threat. When you use Sacred Threat you add your Resolve modifier to all attack rolls and damage rolls made against the target of your Threat. In addition, you gain a critical range of 18-20 against the target of your Threat."

[[abilities]]
origin = "Soul Oath"
level = 15
selection = "Primary"
name = "Vow (Loyalty)"
desc = "United: Once per short rest, if you spend an action you can grant all allies within 6 m of you that can hear and see you move up to their speed and make a melee attack as a reaction."

[[abilities]]
origin = "Soul Oath"
level = 15
selection = "Primary"
name = "Vow (Templar)"
desc = "Avenger: When you or an adjacent ally is hit with a melee attack, you may make an attack of opportunity with advantage against that creature. If they hit you or your ally suffered was a critical hit, you gain all benefits from your Threat ability against that creature for the purposes of your attack of opportunity, even if you are currently Threatening another creature. You can use this ability a number of times per long rest equal to your Resolve modifier."

[[abilities]]
origin = "Soul Oath"
level = 15
selection = "Primary"
name = "Vow (Vassalage)"
desc = "Royal Bulwark: As a reaction, you can redirect an attack made against a creature adjacent to you or yourself to another creature adjacent to you within reach or yourself. This ability must be declared before the attack roll is made. The attack is made against the new AC and defenses, even if the creature could not normally reach or attack the new target. You can use this ability a number of times per long rest equal to your Composure modifier (minimum 1). In addition, allies adjacent to you receive a +2 to their AC."


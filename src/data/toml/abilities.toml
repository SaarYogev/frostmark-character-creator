[[abilities]]
origin = "Divine Oath"
level = 3
selection = "Primary"
name = "Sacred Oath (Sacred Weapon)"
desc = "Your oath allows you to channel divine energy to fuel magical effects. Each Channel Divinity option provided by your oath explains how to use it.\nWhen you use your Channel Divinity, you choose which option to use. You must then finish a short or long rest to use your Channel Divinity again. After 6 level picks of [Divine Oath] you can use it twice per day, and after 18 level picks of [Divine Oath] thrice.\nSome Channel Divinity effects require saving throws. When you use such an effect from this class, the DC equals your spell save DC.\nIn addition, you may expend a use of Channel Divinity as a bonus action to regain one expended spell slot of the first level.\n- Riahn: You gain the following two Channel Divinity options.\nAs an action, for 10 rounds you add your Resolve modifier to attack rolls made with a weapon of your choice (with a minimum bonus of +1). The weapon also emits bright light in a 4 m radius and dim light 4 m beyond that. If the weapon is not already magical, it becomes magical for the duration. You can end this effect on your turn as a bonus action. If you are no longer holding or carrying this weapon, or if you fall unconscious, this effect ends."

[[abilities]]
origin = "Divine Oath"
level = 3
selection = "Primary"
name = "Sacred Oath (Turn the Unholy)"
desc = "Your oath allows you to channel divine energy to fuel magical effects. Each Channel Divinity option provided by your oath explains how to use it.\nWhen you use your Channel Divinity, you choose which option to use. You must then finish a short or long rest to use your Channel Divinity again. After 6 level picks of [Divine Oath] you can use it twice per day, and after 18 level picks of [Divine Oath] thrice.\nSome Channel Divinity effects require saving throws. When you use such an effect from this class, the DC equals your spell save DC.\nIn addition, you may expend a use of Channel Divinity as a bonus action to regain one expended spell slot of the first level.\n- Riahn: You gain the following two Channel Divinity options.\nYou can force any undead or fiends within 6 m of you to make a Resolve saving throw or become turned as an action. On a failed save, the creature is turned for 10 rounds or until it takes damage. A turned creature suffer a number of penalties:\nIt cannot take reactions.\nEvery turn the creature is turned it must move as far as possible away from you.\nIt cannot willingly move within 6 m of you.\nAny actions it takes must be dash actions to try and escape from you and the effect\nIf it cannot move further away from you, it can only use the dodge action.\nIf the creature is using an illusion or a shapeshifting effect to conceal its true form, its true form is revealed as long as it is turned.\n- Gera: You gain the following two Channel Divinity options."

[[abilities]]
origin = "Divine Oath"
level = 3
selection = "Primary"
name = "Sacred Oath (Burgeoning Tangle)"
desc = "Your oath allows you to channel divine energy to fuel magical effects. Each Channel Divinity option provided by your oath explains how to use it.\nWhen you use your Channel Divinity, you choose which option to use. You must then finish a short or long rest to use your Channel Divinity again. After 6 level picks of [Divine Oath] you can use it twice per day, and after 18 level picks of [Divine Oath] thrice.\nSome Channel Divinity effects require saving throws. When you use such an effect from this class, the DC equals your spell save DC.\nIn addition, you may expend a use of Channel Divinity as a bonus action to regain one expended spell slot of the first level.\n- Riahn: You gain the following two Channel Divinity options.\nYou can attempt to restrain a creature within 2 m of you by causing magical vines to spring forth as an action. The target breaks free from the vines, which vanishes) if it succeeds on a Brawn or Dexterity saving throw (it’s choice). While restrained by the vines, the creature repeats the saving throw at the end of each of its turns."

[[abilities]]

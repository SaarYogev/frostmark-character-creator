level = 3
selection = "Primary"
name = "Primal Path (Pack)"
desc = "As long as you are using your Rage ability, all your companions receive advantage when they target a creature within 1 m of you with a melee attack."

[[abilities]]
origin = "Power"
level = 3
selection = "Primary"
name = "Primal Path (Berserker)"
desc = "Frenzy: You can go into a Frenzy when you Rage. If you do so, for the duration of your Rage you can make a single melee weapon attack as a bonus action on each of your turns after this one. When the Rage ends you gain one level of exhaustion."

[[abilities]]
origin = "Power"
level = 3
selection = "Primary"
name = "Primal Path (Fanatic)"
desc = "Blessed: As long as you are using your Rage ability, your first successful weapon attack on each of your turns receives a bonus to its damage. The damage equals 1d6 plus half your [Power] level, rounded up. You choose the damage type and it will remain that damage type for the rest of your campaign."

[[abilities]]
origin = "Power"
level = 3
selection = "Primary"
name = "Primal Path (Natural Harbinger)"
desc = "Child of the Natural World: Whilst raging, you can activate an aura with a 2 m radius. On subsequent turns whilst you are raging, as long as you spend a bonus action, the aura is activated until the start of your next turn. This aura cannot pierce through total cover. If any effects within Natural Harbinger would require a saving throw, your DC would equal your Vitality modifier plus your proficiency modifier. Choose one:"

[[abilities]]
origin = "Power"
level = 3
selection = "Primary"
name = "Primal Path (Arid)"
desc = "All creatures but you take 2 fire damage when you activate your aura with a bonus action. The damage increases with +1 at every 5 level picks of [Power]."

[[abilities]]
origin = "Power"
level = 3
selection = "Primary"
name = "Primal Path (Ocean)"
desc = "When you spend a bonus action to reactivate your aura, choose a creature within your aura’s range. That creature makes a dexterity saving throw. On a fail, the creature suffers 1d6 lightning damage and on a success, they suffer half that damage. The damage increases with +1d6 at every 5 level picks of [Power]."

[[abilities]]
origin = "Power"
level = 3
selection = "Primary"
name = "Primal Path (Arctic)"
desc = "All allies within range become strengthened by your icy aura and gain 5 temporary hit points. The temporary hit points increase with +5 at every 5 level picks of [Power]."

[[abilities]]
origin = "Power"
level = 3
selection = "Primary"
name = "Primal Path (Shaman)"
desc = "Defenders: On your turn, the first creature you hit with a weapon attack whilst you are raging becomes distracted by spirits. That creature has disadvantage to any attack it makes when targeting one of your allies instead of you. If it would successfully hit one of your allies anyway, your ally receives resistance to the damage it receives. This effect lasts until the start of your next turn or until you stop raging."

[[abilities]]

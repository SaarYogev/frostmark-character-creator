desc = "For a short moment, you can channel the divine essence of your God through yourself. Channel Divinity abilities, shortened as “CD”, share these rules;\nWhen you use your Channel Divinity ability, you choose which option to use if you have several."

[[abilities]]
origin = "Devotion"

[[abilities]]
origin = "Artistry"
level = 20
selection = "Primary"
name = "Superior Inspiration"
desc = "When you roll Initiative or cast a spell of 5th level or higher, and have no uses of Inspiration left, you regain one use.1. Story of the Clever: For the next 10 minutes, whenever the target makes a mental or social ability check, the target can roll an extra die immediately after rolling the d20 and add the extra die's number to the check. The extra die is the same type as your Inspiration die.2. Story of the Warrior: You make a melee spell attack against the target. On a hit, the target takes force damage equal to two rolls of your Inspiration die + your Presence or Manipulation modifier.3. Story of the Lover: The target and another creature of its choice it can see within 1 m of it gains temporary health points equal to a roll of your Inspiration die + your Presence or Manipulation modifier.4. Story of the Nimble: The target can immediately use its reaction to teleport up to 6 m to an unoccupied space it can see. When the target teleports, it can choose a number of creatures it can see within 6 m of it up to your Presence or Manipulation modifier (minimum of 0) to immediately use the same reaction.5. Story of the Vengeful: For 1 minute, any creature that hits the target with a melee attack takes force damage equal to a roll of your Inspiration die.6. Story of the Ranger: The target gains temporary health points equal to a roll of your Inspiration die + your total level. While it has these temporary health points, the target's walking speed increases by 2 m and it gains a +1 bonus to its AV.7. Story of the Occultist: The target must succeed on a Int/Cun saving throw or take psychic damage equal to two rolls of your Inspiration die, and the target is incapacitated until the end of its next turn.8. Story of the Specter: The target becomes invisible until the end of its next turn or until it hits a creature with an attack. If the target hits a creature with an attack during this invisibility, the creature it hits takes necrotic damage equal to a roll of your Inspiration die and is frightened of the target until the end of the frightened creature's next turn.9. Story of the Gladiator: Each creature of the target's choice it can see within 6 m of it must make a Brawn saving throw. On a failed save, a creature takes thunder damage equal to three rolls of your Inspiration die and is knocked prone. A creature that succeeds on its saving throw takes half as much damage and isn't knocked prone.10. Story of the Wyrm: The target spews fire from the mouth in a 6 m cone. Each creature in that area must make a Dexterity saving throw, taking fire damage equal to four rolls of your Inspiration die on a failed save, or half as much damage on a successful one.11. Story of the Celestial: The target regains health points equal to two rolls of your Inspiration die + your Presence/Manipulation modifier, and you end one condition from the following list affecting the target: blinded, deafened, paralyzed, petrified, or poisoned.12. Story of the Abberation: The target must succeed on an Resolve saving throw or take psychic damage equal to three rolls of your Inspiration die and be stunned until the end of its next turn."


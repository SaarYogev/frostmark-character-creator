name = "Soul Weapon Archetype (Sage)"
desc = "Enlightenment: Whenever you use the Martial Arcanist ability to cast a melee or ranged attack spell that is of 1st level or higher as a bonus action, you may immediately cast a cantrip that requires a melee spell attack as part of the same bonus action. The cantrip suffers the same penalties to hit as your normal spell attack when using the Martial Arcanist ability."

[[abilities]]

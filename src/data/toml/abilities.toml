[[abilities]]
origin = "Divine Oath"
level = 14
selection = "Primary"
name = "Cleansing Touch"
desc = "You can use your action to end one spell on yourself or on one willing creature that you touch. You can use this ability a number of times equal to your Cunning modifier (a minimum of once). You regain expended uses when you finish a long rest."

[[abilities]]
origin = "Divine Oath"
level = 15
selection = "Primary"
name = "Sacred Oath (Riahn)"
desc = "Purity of Spirit: You gain resistance against necrotic and radiant damage."

[[abilities]]
origin = "Divine Oath"
level = 15
selection = "Primary"
name = "Sacred Oath (Gera)"
desc = "Survival of the Fittest: If you end your turn in combat with fewer than half of your hit points and you are not incapacitated, you regain a number of hit points equal to 1d6 + half your [Divine Oath]."

[[abilities]]
origin = "Divine Oath"
level = 15
selection = "Primary"
name = "Sacred Oath (Teranis)"
desc = "Resilient Duality: You gain resistance to bludgeoning, piercing, and slashing damage from nonmagical weapons."

[[abilities]]
origin = "Divine Oath"
level = 15
selection = "Primary"
name = "Sacred Oath (Lapuana)"
desc = "Unperturbed Wanderer: You have advantage on saving throws to avoid becoming paralyzed or stunned."

[[abilities]]
origin = "Divine Oath"
level = 15
selection = "Primary"
name = "Sacred Oath (Borias)"
desc = "Immortal Will: Once per long rest, when you drop to 0 hit points but not killed outright you can choose to drop to 1 hit point instead. Additionally, you suffer none of the drawbacks of old age, and you can't be aged magically."

[[abilities]]
origin = "Divine Oath"
level = 15
selection = "Primary"
name = "Sacred Oath (Suhlmis)"
desc = "Nemesis: When a creature under the effect of your Act of Aggression makes an attack, you can use your reaction to make a melee weapon attack against that creature if it is within range."

[[abilities]]

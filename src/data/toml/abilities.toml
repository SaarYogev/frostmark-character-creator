name = "Fighting Style (Protection)"
desc = "When a creature you can see attacks a target other than you that is\n\nwithin 1 m of you, you can use your reaction to impose disadvantage on the\n\nattack roll. You must be wielding a shield."

[[abilities]]
origin = "Soul Oath"
level = 2
selection = "Secondary"
name = "Fighting Style (Two)"
desc = "**Weapon Fighting**\n\nWhen you engage in two-weapon fighting, you can add\n\nyour ability score modifier to the damage of the second attack."

[[abilities]]
origin = "Soul Oath"
level = 3
selection = "Primary"
name = "Cavalry Charge"
desc = "If you are mounted, you gain advantage on a weapon attack you make immediately after\n\nyou move at least 2 m in a straight line."

[[abilities]]
origin = "Soul Oath"
level = 3
selection = "Secondary"
name = "Mighty Steed"
desc = "You gain the Partner of the Wild ability from [Predator] but it can only take the form of a\n\nbeast or animal you can ride into battle with."

[[abilities]]
origin = "Soul Oath"
level = 4
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice."

[[abilities]]
origin = "Soul Oath"
level = 5
selection = "Primary"
name = "Extra Attack"
desc = "As part of your attack action, you can make two attacks instead of one. You must\n\npossess at least 1 level of [Soul Oath] to be eligible for this ability (excluding this level)."

[[abilities]]
origin = "Soul Oath"
level = 6
selection = "Primary"
name = "Master Handler"
desc = "You receive a skill point with Animal Handling and you can gain rank 5 with it. In\n\naddition, mounts you are currently riding receive advantage to any mental or social\n\nsaving throw."

[[abilities]]
origin = "Soul Oath"
level = 7
selection = "Primary"
name = "Vow (Aegis)"
desc = "**Curb the Onslaught**\n\nYou gain the Sentinel feat."

[[abilities]]
origin = "Soul Oath"
level = 7
selection = "Primary"
name = "Vow (Aspiration)"
desc = "**Kill Steal**\n\nYou can make a free attack of opportunity against a target\n\nyou are currently engaged in melee with immediately afterward another creature\n\nscores a critical hit against it."

[[abilities]]
origin = "Soul Oath"
level = 7
selection = "Primary"
name = "Vow (Chivalry)"
desc = "**Mounted Mastery**\n\nWhenever you are mounted and an opponent\n\nmakes a weapon attack roll against your mount, you may divert the attack by\n\nspending a reaction and making an attack roll of your own. If your attack roll is\n\nhigher, you parry the attack and your mount takes no damage. You can use this\n\nability a number of times per long rest equal to your Cunning modifier and you\n\ncan only redirect a strike from a creature no more than one size larger than you."

[[abilities]]
origin = "Soul Oath"
level = 7
selection = "Primary"
name = "Vow (Loyalty)"
desc = "**Together**\n\nOnce per short rest, as an action you can give all allies within\n\n6 m (including yourself) who can see and hear you a benefit for one round that\n\nyou choose. Choose one benefit which ally receives (and choose one for yourself):\n\n  * +2 to AC.\n\n  * +2 to all attack rolls.\n\n  * Move up to their speed without spending a movement action."

[[abilities]]
origin = "Soul Oath"
level = 7
selection = "Primary"
name = "Vow (Templar)"
desc = "**In the Service of the Divine**\n\nFor three rounds, you and all allies within\n\n6 m of you that share your faith gain a bonus to your attack rolls and damage\n\nrolls equal to your Resolve modifier (minimum 1) by calling out the name of your\n\nEnneade as a bonus action. You can use this ability once per short rest, plus one\n\nadditional time per short rest at 12 level picks of [Soul Oath] and every four level\n\npicks thereafter of [Soul Oath]."

[[abilities]]
origin = "Soul Oath"
level = 7
selection = "Primary"
name = "Vow (Vassalage)"
desc = "**For the Crown**\n\nFor three rounds, you and all allies within 6 m of you\n\nthat share your loyalties gain a bonus to your attack rolls and damage rolls equal\n\nto your Presence modifier (minimum 1) by calling out the name of your sovereign\n\nas a bonus action. You can use this ability once per short rest, plus one additional\n\ntime per short rest at 12 level picks of [Soul Oath] and every four level picks\n\nthereafter of [Soul Oath]."

[[abilities]]
origin = "Soul Oath"
level = 8
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Soul Oath"
level = 9
selection = "Primary"
name = "Bonus Feat"
desc = "Gain a bonus feat."

[[abilities]]
origin = "Soul Oath"
level = 10
selection = "Primary"
name = "Relentless Assault"
desc = "If you hit a creature with a melee attack after you moved at least 2 m in a straight line\n\nwhilst mounted, that target must succeed on a Brawn saving throw (DV 8 + your\n\nproficiency bonus + your Brawn modifier) or be knocked prone. You can use this ability\n\nonly once on each of your turns."

[[abilities]]
origin = "Soul Oath"
level = 11
selection = "Primary"
name = "Great Charge"
desc = "Gain the Charger feat. You may exchange one feat you possess for another."

[[abilities]]
origin = "Soul Oath"
level = 12
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Soul Oath"
level = 13
selection = "Primary"
name = "Oppressive Threat"
desc = "Targets that you have Threatened and are within your melee reach take -2 penalty to\n\ntheir AV from attacks made by anyone other than you."

[[abilities]]
origin = "Soul Oath"
level = 14
selection = "Primary"
name = "Unshakeable Focus"
desc = "While the creature you have Threatened is within 1 m of you, it has disadvantage on any\n\nattack roll that doesn't target you."

[[abilities]]
origin = "Soul Oath"
level = 15
selection = "Primary"
name = "Vow (Aegis)"
desc = "**Defend Feeble**\n\nOnce per short rest, you can spend a reaction to move up\n\nto your speed (or your mount\u2019s speed if you are mounted) towards an opponent\n\nand make one melee weapon attack. This movement must end adjacent to an\n\nenemy and it triggers attacks of opportunity as normal."

[[abilities]]
origin = "Soul Oath"
level = 15
selection = "Primary"
name = "Vow (Aspiration)"
desc = "**Push the Advantage**\n\nOnce per long rest, you gain a bonus equal to\n\nyour proficiency bonus on your AV, ability checks, attack rolls, damage rolls,\n\nsaving throws, and skill checks for a number of rounds equal to your Cunning\n\nmodifier (minimum of 1)."

[[abilities]]
origin = "Soul Oath"
level = 15
selection = "Primary"
name = "Vow (Chivalry)"
desc = "**Sacred Threat**\n\nOnce per long rest, you may increase the potency of\n\nyour normal Threat ability to a Sacred Threat. When you use Sacred Threat you\n\nadd your Resolve modifier to all attack rolls and damage rolls made against the\n\ntarget of your Threat. In addition, you gain a critical range of 18-20 against the\n\ntarget of your Threat."

[[abilities]]
origin = "Soul Oath"
level = 15
selection = "Primary"
name = "Vow (Loyalty)"
desc = "**United**\n\nOnce per short rest, if you spend an action you can grant all\n\nallies within 6 m of you that can hear and see you move up to their speed and\n\nmake a melee attack as a reaction."

[[abilities]]
origin = "Soul Oath"
level = 15
selection = "Primary"
name = "Vow (Templar)"
desc = "**Avenger**\n\nWhen you or an adjacent ally is hit with a melee attack, you\n\nmay make an attack of opportunity with advantage against that creature. If they\n\nhit you or your ally suffered was a critical hit, you gain all benefits from your\n\nThreat ability against that creature for the purposes of your attack of\n\nopportunity, even if you are currently Threatening another creature. You can use\n\nthis ability a number of times per long rest equal to your Resolve modifier."

[[abilities]]
origin = "Soul Oath"
level = 15
selection = "Primary"
name = "Vow (Vassalage)"
desc = "**Royal Bulwark**\n\nAs a reaction, you can redirect an attack made\n\nagainst a creature adjacent to you or yourself to another creature adjacent to you\n\nwithin reach or yourself. This ability must be declared before the attack roll is\n\nmade. The attack is made against the new AV and defenses, even if the creature\n\ncould not normally reach or attack the new target. You can use this ability a\n\nnumber of times per long rest equal to your Composure modifier (minimum 1). In\n\naddition, allies adjacent to you receive a +2 to their AC."

[[abilities]]
origin = "Soul Oath"
level = 16
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Soul Oath"
level = 17
selection = "Primary"
name = "Bonus Feat"
desc = "Gain a bonus feat."

[[abilities]]
origin = "Soul Oath"
level = 18
selection = "Primary"
name = "Acute Guardian"
desc = "You gain another reaction per round in combat. This second reaction can only be used\n\nto make attacks of opportunity. You cannot use both of your reactions on the same\n\nturn."

[[abilities]]
origin = "Soul Oath"
level = 19
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Soul Oath"
level = 20
selection = "Primary"
name = "Peerless Charge"
desc = "Whenever you use the Charger feat you gain advantage on the attack and an improved\n\ncritical range of 18-20. In addition, if you roll a critical hit on a charge attack while\n\nmounted, the target is stunned for 1d4 rounds.\n\nExtra Ability Origin Content"

[[abilities]]
origin = "Soul Oath"
level = 20
selection = "Primary"
name = "Oaths"
desc = "When you pick the Threaten ability or a Vow ability, you must choose an Oath and\n\nfollow its decrees. If your GM considers you have broken your Oath, you lose the ability\n\nto Threaten. You can reclaim the ability to do so if you repent in a way your GM finds\n\nacceptable.\n\nAegis\n\nYou devote yourself to protect those who cannot protect themselves. Defending the\n\ncommon folk from danger and exploitation. You must offer your help when the meek\n\ncalls for you, and give alms when needed. You cannot endanger or hurt the defenseless.\n\nThreat: When you Threaten a creature you receive a +2 bonus to attack rolls against the\n\ncreature you have Threatened. The bonus to attack rolls increases with +1 for every 6\n\nlevel picks of [Soul Oath].\n\nAspiration\n\nYou swear an oath to yourself only and you care foremost about your own needs and\n\ngoals. If the opportunity presents itself, you cannot refuse the chance to elevate\n\nyourself, be it wealth, status, or power. You cannot decline a reward or sacrifice your\n\nobjectives for another cause.\n\nThreat: If an ally would successfully hit the creature you have Threatened with a\n\nweapon attack, you may immediately spend a reaction and make a weapon attack of\n\nyour own against that Threatened creature. You do not add your ability score modifier\n\nto the damage roll for the purposes of this weapon attack.\n\nChivalry\n\nYou devote your life to the Sacred Code, upholding its tenets to the best of your\n\nabilities.\n\n\"I will keep faith in the face of hopelessness\n\nBe honest against my own benefit\n\nValorous despite my fear\n\nRemain loyal to my oaths\n\nBe honorable until my soul leaves me\n\nAnswer any challenge that stands before me\n\nAnd protect the weak and the deserving\"\n\nThreat: Against creatures that have a higher CR rating than you do or are one size larger\n\nthan you, you receive +2 to your attack rolls and +2 bonus to your weapon attack\n\ndamage against the creature if you have Threatened it. Every 6 level picks of [Soul Oath]\n\nboth bonuses increase with +1.\n\nLoyalty\n\nYou devote yourself to the virtue of loyalty, you commit yourself to a cause or a small\n\nnumber of allies, always having their back. All for one, and one for all. You must always\n\noffer aid to those you are loyal to, in or out of combat, even sacrificing yourself if\n\nnecessary.\n\nThreat: Your allies receive a +1 to their weapon attack rolls to hit the creature you have\n\nThreatened. Once per short rest, you can use the help action as a free action. You\n\nreceive an additional free usage of the help action after 11 level picks of [Soul Oath] and\n\nthe bonus your allies receive to hit increases to +2.\n\nTemplar\n\nYou devote yourself to an Enneade, its church, and its members. You must uphold the\n\ntenets of your Enneade, aid your church, and protect its members.\n\nThreat: When you Threaten a creature you receive a +2 bonus to all saving throws as\n\nlong as you are engaged in combat. The bonus to your saving throws increases with +1\n\nfor every 6 level picks of [Soul Oath].\n\nVassalage\n\nYou have sworn yourself to authority and devoted yourself to their cause. You must\n\nfight for your authority\u2019s interests, defend their territory, and protect their life.\n\nThreat: When you Threaten a creature you receive a +1 bonus to your AV against attacks\n\nmade by the creature you have Threatened. The bonus to your AV increases with +1 for\n\nevery 6 level picks of [Soul Oath]."

[[abilities]]
origin = "Soul Weapon"
level = 1
selection = "Primary"
name = "Martial Arcanist"
desc = "You learn how to intertwine flinging spells and wielding weapons in combat. If you use\n\nyour action to make one or several unarmed, melee weapons or ranged weapon attacks,\n\nyou may cast a spell with a ranged or melee attack and a casting time of one action as a\n\nbonus action as long as you have a hand free for your casting. The highest level spell you\n\ncan cast this way equals [Soul Weapon] level divided by 5 (rounded up and minimum\n\nlevel 1).\n\nBoth the unarmed or weapon attacks and the spell attack receive a -2 penalty to hit. If\n\nyou use any Extra Attack, all the Extra Attacks and the spell attack receive an extra -1\n\npenalty for each Extra Attack used in a turn."

[[abilities]]
origin = "Soul Weapon"
level = 1
selection = "Secondary"
name = "Infuse Soul"
desc = "Once per long rest, you gain the ability to infuse your weapon with the power of your\n\nown Soul. As a bonus action, you may give your weapon a first level enhancement, +1 to\n\nhit and +1 to damage, for 10 rounds plus your Intelligence modifier (minimum of +1)."

[[abilities]]
origin = "Soul Weapon"
level = 2
selection = "Primary"
name = "Soul Weapon Archetype (Cabalist)"
desc = "**Undermine**\n\nInstead of making a spell attack as part of the Martial\n\nArcanist ability, you can choose to cast an enchantment or illusion spell that\n\nrequires a saving throw, targets only one creature, and normally has a casting\n\ntime of an action, as a bonus action. If you choose to cast an enchantment or\n\nillusion spell this way, your spell save DV is lowered by -2. If you use the Extra\n\nAttack ability, the penalty increases to -3."

[[abilities]]
origin = "Soul Weapon"
level = 2
selection = "Primary"
name = "Soul Weapon Archetype (Rival)"
desc = "**Parry**\n\nAs a reaction, you may attempt to parry a melee attack targeting\n\nyou if you are wielding a melee weapon of your own. Roll an opposed melee\n\nweapon attack with a +2 bonus to hit. If you roll higher than the incoming attack\n\nroll, you parry the attack and it does not deal damage to you. You can use this\n\nability a number of times equal to your proficiency modifier per long rest and you\n\ncan only parry Small or Medium-sized creatures this way."

[[abilities]]
origin = "Soul Weapon"
level = 2
selection = "Primary"
name = "Soul Weapon Archetype (Sage)"
desc = "**Body, and Mind**\n\nYou gain the Martial Arts ability from the [Discipline] AO\n\nwith some modifications and you replace all instances of [Discipline] with [Soul\n\nWeapon] for the purposes of the Martial Arts ability. The modifications are:\n\n  * The armor you wear can now be up to medium armor.\n\n  * This ability only applies to unarmed attacks, not attacks with the\n\nquarterstaff.\n\n  * You do not gain the ability to make an unarmed attack as a bonus action if\n\nyou use your action to make an unarmored attack.\n\n  * You may apply your Infuse Soul ability on your unarmored attacks."

[[abilities]]
origin = "Soul Weapon"
level = 2
selection = "Primary"
name = "Soul Weapon Archetype (Soul Blade)"
desc = "**Animated Weapon**\n\nYou learn to cast the spell Find Familiar as Soul\n\nMastery once per long rest. You must still abide by the Soul Consumption\n\nrequirement. When you cast Find Familiar this way, you add the flying sword to\n\nthe list of creatures you can summon with the spell. If you summon a flying\n\nsword with this ability it gains a few changes:\n\n  * The flying sword keeps its construct creature type.\n\n  * The flying sword only has 4d6 HD.\n\n  * The flying sword cannot speak and has no emotions, but it understands\n\nyour commands and you can still communicate commands telepathically\n\nto it.\n\n  * By spending your attack action you can command the flying sword to\n\nmake a melee weapon or spell attack if it is within 20 m of you. This attack\n\nspends the flying sword\u2019s reaction."

[[abilities]]
origin = "Soul Weapon"
level = 2
selection = "Primary"
name = "Soul Weapon Archetype (Vanguard)"
desc = "**Absorb**\n\nYou may add the AV bonus of a shield you are using to any\n\nsaving throw you make against a spell or spell effect. In addition, you gain the\n\nWar Caster feat."

[[abilities]]
origin = "Soul Weapon"
level = 2
selection = "Secondary"
name = "Fighting Style (Archery)"
desc = "+2 attack rolls made with ranged weapons."

[[abilities]]
origin = "Soul Weapon"
level = 2
selection = "Secondary"
name = "Fighting Style (Defense)"
desc = "While you\u2019re wearing armor, you gain a +1 bonus to AC."

[[abilities]]
origin = "Soul Weapon"
level = 2
selection = "Secondary"
name = "Fighting Style (Dueling)"
desc = "When you\u2019re wielding a melee weapon in one hand and no other\n\nweapon, you gain a +2 bonus to damage rolls with that weapon."

[[abilities]]
origin = "Soul Weapon"
level = 2
selection = "Secondary"
name = "Fighting Style (Great Weapon Fighting)"
desc = "When you roll a 1 or 2 on a damage die for an attack you\n\nmake with a melee weapon that you\u2019re wielding with two hands, you can reroll\n\nthe dice and must use the new results."

[[abilities]]
origin = "Soul Weapon"
level = 2
selection = "Secondary"
name = "Fighting Style (Protection)"
desc = "When a creature you can see attacks a target other than you that is\n\nwithin 1 m of you, you can use your reaction to impose disadvantage on the\n\nattack roll. You must be wielding a shield."

[[abilities]]
origin = "Soul Weapon"
level = 2
selection = "Secondary"
name = "Fighting Style (Two)"
desc = "**Weapon Fighting**\n\nWhen you engage in two-weapon fighting, you can add\n\nyour ability modifier to the damage of the second attack."

[[abilities]]
origin = "Soul Weapon"
level = 2
selection = "Secondary"
name = "Soul Weapon Archetype (Soul Blade)"
desc = "**Health Infusion**\n\nYour flying sword familiar gains a number of extra\n\nhealth points equal to your level in [Soul Weapon]."

[[abilities]]
origin = "Soul Weapon"
level = 3
selection = "Primary"
name = "Greater Soul Gift"
desc = "You unlock two minor magical powers in your Soul. Choose two Soul Gifts from the Soul\n\nGift list. See below."

[[abilities]]
origin = "Soul Weapon"
level = 3
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 10 Potential"

[[abilities]]
origin = "Soul Weapon"
level = 4
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice."

[[abilities]]
origin = "Soul Weapon"
level = 5
selection = "Primary"
name = "Extra Attack"
desc = "As part of your attack action, you can make two attacks instead of one. You must\n\npossess at least 1 level of [Soul Weapon] to be eligible for this ability (excluding this\n\nlevel)."

[[abilities]]
origin = "Soul Weapon"
level = 6
selection = "Primary"
name = "Soul Weapon Archetype (Cabalist)"
desc = "**Subtle Charmer**\n\nWhenever you cast Charm Person you do not require\n\na Verbal component. In addition, if you successfully afflict another creature with\n\nthe effects of Charm Person, they do not know they were charmed by you after\n\nthe spell ends."

[[abilities]]
origin = "Soul Weapon"
level = 6
selection = "Primary"
name = "Soul Weapon Archetype (Rival)"
desc = "**Riposte**\n\nIf you successfully parry an attack using your Parry ability, you\n\nmay immediately make an attack of opportunity with a +2 bonus to hit if the\n\nattacker is within your range as part of the same reaction."

[[abilities]]
origin = "Soul Weapon"
level = 6
selection = "Primary"
name = "Soul Weapon Archetype (Sage)"
desc = "**Spellfist**\n\nYour unarmed strikes count as magical. If you cast a spell as a\n\nbonus action first and use your attack action to make unarmed attacks as part of\n\nthe Martial Arcanist ability, the unarmored damage you deal is converted into the\n\nspell\u2019s damage type."

[[abilities]]
origin = "Soul Weapon"
level = 6
selection = "Primary"
name = "Soul Weapon Archetype (Soul Blade)"
desc = "**Power Infusion**\n\nThe damage your flying sword familiar makes is\n\nconsidered magical. In addition, your flying familiar gains first level weapon\n\nenhancement, +1 to hit, and damage. After 11 level picks of [Soul Weapon] this\n\nbonus increases to +2, and after 16 level picks it increases to +3."

[[abilities]]
origin = "Soul Weapon"
level = 6
selection = "Primary"
name = "Soul Weapon Archetype (Vanguard)"
desc = "**Elemental Resilience**\n\nIf you possess a shield you may add an\n\nelemental resistance to that shield after you have rested. When you finish a long\n\nrest, as an action, choose between cold, fire, or lightning. As long as you are\n\nwielding the shield, you gain resistance against the chosen damage type until you\n\nfinish a long rest."

[[abilities]]
origin = "Soul Weapon"
level = 7
selection = "Primary"
name = "Soul Gift"
desc = "You unlock one minor magical power in your Soul. Choose one Soul Gifts from the Soul\n\nGift list. See below."

[[abilities]]

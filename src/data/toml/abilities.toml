desc = "Once per long rest, you can cast Freedom of Movement as Soul Mastery.\nAscendant Step"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Prerequisite: 9 level picks in (Prerequisite)"
desc = "You can cast Levitate on yourself as Soul Mastery.\nExceptional Pact Weapon\n9 level picks in [Pact], Pact of the Blade ability\nAs long as your [Pact] weapon does not have a +2 bonus to attack rolls and damage rolls already, it receives a +2 bonus to attack and damage rolls. Additionally, the [Pact] weapon you conjure can be a short bow, longbow, light crossbow, or heavy crossbow.\nMinions of the Primordials"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Prerequisite: 9 level picks in"
desc = "Once per long rest, you can cast Conjure Elemental as Soul Mastery.\nOtherworldly Leap"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Prerequisite: 9 level picks in"
desc = "You can cast Jump as Soul Mastery.\nWhispers of the Grave"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Prerequisite: 9 level picks in (Prerequisite)"
desc = "You can cast Speak With Dead as Soul Mastery.\nWrath of the Taskmaster\n9 level picks in [Pact], Pact of the Bond ability\nSpend your bonus action and you can command your familiar to make an attack.\nAffliction of Galene"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Prerequisite: 9 level picks in (Prerequisite)"
desc = "You can cast Speak With Dead as Soul Mastery.\nWrath of the Taskmaster\n12 level picks in [Pact], Pact of the Blade ability\nWhen you hit a creature with your [Pact] weapon, the creature takes extra lightning damage equal to your Cunning or Manipulation modifier (your choice, choose once, minimum 1).\nChains of Amaknuphis"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Prerequisite: 9 level picks in (Prerequisite)"
desc = "You can cast Speak With Dead as Soul Mastery.\nWrath of the Taskmaster\n15th [Pact] level, Pact of the Bond ability\nYou can cast Hold Monster as Soul Mastery but you can only target a celestial, fiend, or elemental. You must finish a long rest before you can cast Hold Monster like this against the same creature again.\nCloak of Darkness"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Prerequisite: 15 level picks in"
desc = "Once per long rest, you can cast Invisibility as Soul Mastery.\nMaster of Myriad Forms"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Prerequisite: 15 level picks in (Prerequisite)"
desc = "You can cast Alter Self as Soul Mastery.\nTranscendent Pact Weapon\n15 level picks in [Pact], Pact of the Blade ability\nAs long as your [Pact] weapon does not have a +3 bonus to attack rolls and damage rolls already, it receives a +3 bonus to attack and damage rolls. Additionally, the [Pact] weapon you conjure can be a short bow, longbow, light crossbow, or heavy crossbow.\nVisions of Distant Realms"

[[abilities]]

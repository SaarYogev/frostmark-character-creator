selection = "Primary"
name = "Prerequisite: 9 level picks in (Enchant)"
desc = "As a bonus action, you can teleport a weapon enchanted by this Soul Gift to you, if you can see your weapon and have a free hand.\nChilling/Corrosive/Flaming/Sparkling"

[[abilities]]
origin = "Soul Weapon"
level = 20
selection = "Primary"
name = "Prerequisite: 9 level picks in"
desc = "Once per long rest, as a bonus action you can activate 1d4 acid, cold, fire or lightning damage to each of your weapon damage rolls for a number or rounds equal to your proficiency bonus with the weapon enchanted by this Soul Gift. Once you have chosen the damage type from the selection above, you cannot change it to another type next time.\nFrightening Skill"

[[abilities]]
origin = "Soul Weapon"
level = 20
selection = "Primary"
name = "Prerequisite: 9 level picks in"
desc = "Once per long rest, after you make a successful attack with a weapon enchanted by this Soul Gift, you may attempt to frighten a creature that can see you with a bonus action. You make an attack roll that doesn’t deal any damage versus the opponent's Resolve saving throw, on a failure the creature is frightened of your display of mastery until the end of your next turn. You may attempt to continue this effect on each of your turns by spending bonus actions and making opposed rolls. On a success, the creature is not frightened anymore.\nMartial Sprint"

[[abilities]]
origin = "Soul Weapon"
level = 20
selection = "Primary"
name = "Prerequisite: 9 level picks in"
desc = "Once per long rest, you may cast Haste on yourself as a bonus action. If you do not already possess Haste as a spell known, you may add it to your spells known.\nOccult Absorption"

[[abilities]]

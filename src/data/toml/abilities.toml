name = "Divine Domain (Animation)"
desc = "Great Animator: When you cast a spell of 1st level or higher that restores health points to a creature other than you, you regain health points equal to 2+ the spell's level. In addition, when you cast a spell of 1st level or higher that buffs a creature other than you and requires concentration to maintain, you gain 1+ the spell’s level in temporary health points at the end of each of your turns as long as you maintain concentration on it."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Athanasia)"
desc = "Halt Oblivion: You may turn a critical hit into a normal hit targeting you or an ally within 6m of you as a reaction. Any effects triggered by the critical hit are canceled. You can use this ability a number of times equal to your Resolve or Composure modifier (minimum 1). You regain all expended uses when you finish a long rest."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Battle)"
desc = "CD Benediction of Conflict: Using your Channel Divinity, you may grant a creature within 6m of you a +10 bonus to their failed attack roll, ability check, or saving throw as a reaction."

[[abilities]]
origin = "Devotion"

name = "Martial Archetype (Champion)"
desc = "**Survivor**\n\nAt the start of each of your turns, you regain health points\n\nequal to 5+ your Vitality modifier if you have no more than half of your health\n\npoints left. You do not gain this benefit if you have 0 health points."


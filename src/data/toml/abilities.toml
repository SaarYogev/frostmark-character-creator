[[abilities]]
origin = "Artistry"
level = 1
selection = "Primary"
name = "Inspiration"
desc = "You can use a bonus action on your turn to choose one creature other than yourself\n\nwithin 12 m of you who can hear you. That creature gains one Inspiration die, a d6.\n\nOnce within the next 10 minutes, the creature can roll the die and add the number\n\nrolled to one ability check, attack roll, or saving throw it makes. In addition, the\n\nInspiration die can be added to a damage or a healing roll from casting a spell. The\n\ncreature can wait until after it rolls the d20 before deciding to use the Inspiration die\n\nbut must decide before the GM says whether the roll succeeds or fails. Once the\n\nInspiration die is rolled, it is lost. A creature can have only one Inspiration die at a time.\n\nYou can use this ability a number of times equal to your 1 + Presence modifier or\n\nManipulation modifier (a minimum of once). You regain any expended uses when you\n\nfinish a long rest. Your Inspiration die changes when you reach certain levels in\n\n[Artistry]. The die becomes a d8 after 5 level picks, a d10 after 10 level picks, and a d12\n\nafter 15 level picks."

[[abilities]]
origin = "Artistry"
level = 1
selection = "Secondary"
name = "Master of Some"
desc = "You gain 5 skill points in at least 4 different skills. With this ability, you cannot increase\n\nany skill rank beyond rank 2. One skill point you must spend in Academics and one in\n\nArts & Craft. In addition, you also add half your proficiency bonus (rounded up) to your\n\ninitiative checks. If you pick Master of Some, you cannot pick Jack of all Trades."

[[abilities]]
origin = "Artistry"
level = 1
selection = "Secondary"
name = "Jack Of All Trades"
desc = "In skills you do not already have any skill points invested in, except for Academics and\n\nArts & Craft skills, you can add half your proficiency bonus (rounded up) to your skill\n\nchecks. In addition, you also add half your proficiency bonus (rounded up) to your\n\ninitiative checks. If you pick Jack of all Trades, you cannot pick Master of Some."

[[abilities]]
origin = "Artistry"
level = 1
selection = "Secondary"
name = "Unarmored Defense"
desc = "While you are not wearing any armor or wielding a shield, your armor value equals 10 +\n\nyour Dexterity modifier + your Presence or Manipulation modifier. The Dexterity and\n\nthe Presence/Manipulation modifier cannot exceed your proficiency bonus\n\nindividually."

[[abilities]]
origin = "Artistry"
level = 2
selection = "Primary"
name = "College (Charmer)"
desc = "**Protective Pomp**\n\nYou inspire resilience in your allies, making them\n\nmore determined to stand firm. When you pick this ability, choose either\n\nPresence or Manipulation. As a bonus action, you can spend two uses of\n\nInspiration and choose a number of creatures (minimum 1) that can either see\n\nyou (Presence) or hear you (Manipulation). The designated creatures receive 5\n\ntemporary health points and they can immediately use their reactions to move up\n\nto half their speed. This movement does not provoke attacks of opportunity. The\n\nnumber of temporary health points increases when you reach certain total levels,\n\nincreasing to 10 at 5th total level, 15 at 10th total level, and 20 at 15th total level."

[[abilities]]
origin = "Artistry"
level = 2
selection = "Primary"
name = "College (Connoisseur)"
desc = "**Cutting Words**\n\nWhen a creature that you can see within 12 m of\n\nyou makes an attack roll, an ability check, or a damage roll, you can use your\n\nreaction to expend one of your uses of Inspiration, rolling an Inspiration die and\n\nsubtracting the number rolled from the creature's roll. You can choose to use\n\nthis ability after the creature makes its roll, but before the GM determines\n\nwhether the attack roll or ability check succeeds or fails, or before the creature\n\ndeals its damage. The creature is immune if it can't hear you or if it's immune to\n\nbeing charmed."

[[abilities]]
origin = "Artistry"
level = 2
selection = "Primary"
name = "College (Dancer)"
desc = "**Ballet of Blades**\n\nWhenever you make an attack action on your turn,\n\nyour walking speed increases by 2 m until the end of your turn. Additionally, once\n\nper turn, you may apply a Ballet of Blades option to a successful melee weapon\n\nattack:\n\n  * Waltz: You can expend one use of your Inspiration dice to cause the\n\nmelee weapon attack to deal more damage equal to the number rolled on\n\nthe Inspiration die. In addition, you may add the result of your Inspiration\n\ndie to your AV, or to an ally of your choice within 6 m of you that can see\n\nor hear you, until the start of your next turn.\n\n  * Conga: You can expend one use of your Inspiration dice to cause the\n\nmelee weapon attack to deal more damage equal to the number rolled on\n\nthe Inspiration die. In addition, you deal damage to any other creatures\n\nwithin 1 m of you that you can see equal to the number rolled on the\n\nInspiration die.\n\n  * Tango: You can expend one use of your Inspiration dice to cause the\n\nmelee weapon attack to deal more damage equal to the number rolled on\n\nthe Inspiration die. In addition, you can push the target up to 1 m + half\n\nthe number rolled on the Inspiration die (minimum 1) away from you.\n\nImmediately after, you can spend your reaction to move up to half your\n\nspeed to an unoccupied space within 1 m of the target, or as close as\n\npossible. Alternatively, instead, you can allow an ally within 6 m of you\n\nthat hears or sees you to spend their reaction and to move up to half their\n\nspeed to an unoccupied space within 1 m of the target."

[[abilities]]
origin = "Artistry"
level = 2
selection = "Primary"
name = "College (Duelist)"
desc = "**Inspiring Bravado**\n\nA creature that has been given an Inspiration die\n\nfrom you can add the Inspiration die to weapon damage rolls. Additionally, you\n\nmay spend a bonus action and an Inspiration die to heal yourself or an ally within\n\n6 m of you that can see or hear you, equal to the number rolled on the Inspiration\n\ndie plus half your proficiency bonus (rounded up)."

[[abilities]]
origin = "Artistry"
level = 2
selection = "Primary"
name = "College (History)"
desc = "**A Ghost Story**\n\nYou can use a bonus action to expend one use of your\n\nInspiration and roll on the Ghost Story table below using your Inspiration die to\n\ndetermine the story history directs you to tell. You retain the story in mind until\n\nyou bestow the story's effect or you finish a short or long rest.\n\nYou can use an action to choose one creature you can see within 6 m of you (this\n\ncan be you) to be the target of the story's effect. Once you do so, you can't\n\nbestow the story's effect again until you roll it again.\n\nYou can retain only one of these stories in mind at a time, and rolling on the\n\nGhost Story table immediately ends the effect of the previous story.\n\nIf the story requires a saving throw, the DV equals your spell save DV.\n\n1. Story of the Clever: For the next 10 minutes, whenever the target makes a\n\nmental or social ability check, the target can roll an extra die immediately\n\nafter rolling the d20 and add the extra die's number to the check. The\n\nextra die is the same type as your Inspiration die.\n\n2. Story of the Warrior: You make a melee spell attack against the target. On\n\na hit, the target takes force damage equal to two rolls of your Inspiration\n\ndie + your Presence or Manipulation modifier.\n\n3. Story of the Lover: The target and another creature of its choice it can see\n\nwithin 1 m of it gains temporary health points equal to a roll of your\n\nInspiration die + your Presence or Manipulation modifier.\n\n4. Story of the Nimble: The target can immediately use its reaction to\n\nteleport up to 6 m to an unoccupied space it can see. When the target\n\nteleports, it can choose a number of creatures it can see within 6 m of it\n\nup to your Presence or Manipulation modifier (minimum of 0) to\n\nimmediately use the same reaction.\n\n5. Story of the Vengeful: For 1 minute, any creature that hits the target with a\n\nmelee attack takes force damage equal to a roll of your Inspiration die.\n\n6. Story of the Ranger: The target gains temporary health points equal to a\n\nroll of your Inspiration die + your total level. While it has these temporary\n\nhealth points, the target's walking speed increases by 2 m and it gains a +1\n\nbonus to its AV.\n\n7. Story of the Occultist: The target must succeed on a Int/Cun saving\n\nthrow or take psychic damage equal to two rolls of your Inspiration die,\n\nand the target is incapacitated until the end of its next turn.\n\n8. Story of the Specter: The target becomes invisible until the end of its next\n\nturn or until it hits a creature with an attack. If the target hits a creature\n\nwith an attack during this invisibility, the creature it hits takes necrotic\n\ndamage equal to a roll of your Inspiration die and is frightened of the\n\ntarget until the end of the frightened creature's next turn.\n\n9. Story of the Gladiator: Each creature of the target's choice it can see\n\nwithin 6 m of it must make a Brawn saving throw. On a failed save, a\n\ncreature takes thunder damage equal to three rolls of your Inspiration die\n\nand is knocked prone. A creature that succeeds on its saving throw takes\n\nhalf as much damage and isn't knocked prone.\n\n10. Story of the Wyrm: The target spews fire from the mouth in a 6 m cone.\n\nEach creature in that area must make a Dexterity saving throw, taking fire\n\ndamage equal to four rolls of your Inspiration die on a failed save, or half\n\nas much damage on a successful one.\n\n11. Story of the Celestial: The target regains health points equal to two rolls of\n\nyour Inspiration die + your Presence/Manipulation modifier, and you end\n\none condition from the following list affecting the target: blinded,\n\ndeafened, paralyzed, petrified, or poisoned.\n\n12. Story of the Abberation: The target must succeed on an Resolve saving\n\nthrow or take psychic damage equal to three rolls of your Inspiration die\n\nand be stunned until the end of its next turn."


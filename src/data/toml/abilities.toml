[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Sibling Soul"
desc = "You can spend 10 rounds entreating your patron for aid to regain either all your spell slots that recover after a long rest, or all your spell slots that recover after a short rest. Once you regain spell slots with this ability, you must finish a long rest before you can do so again."

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Absorb Soul Aspect (Prerequisite)"
desc = "Your connection to your patron allows you to glimpse aspects of power from your patron’s Soul, and then, with time, embody them yourself. When you gain a level in [Pact], you can choose one of the Soul aspects you know and replace it with another Soul aspect that you could learn at that level. If an aspect has prerequisites, you must meet them to learn it. You can learn the Soul aspect at the same time that you meet its prerequisites.\nNo Level RequirementAgonizing Blast\nRanged spell attack cantrip\nWhen you cast a ranged spell attack cantrip of your choice, add your Cunning or Manipulation modifier of your choice (choose once) to the damage it deals on a hit.\nArcane SightYou can cast Detect Magic as Soul Mastery.\nArmor of ShadowsYou can cast Mage Armor as Soul Mastery.\nBeast SpeechYou can cast Speak With Animals as Soul Mastery.\nBeguiling InfluenceYou gain 2 skill points in the Deception and Persuasion skills and you may gain rank 5 with those skills.\nBook of Ancient Rituals"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Absorb Soul Aspect (Prerequisite)"
desc = "Your connection to your patron allows you to glimpse aspects of power from your patron’s Soul, and then, with time, embody them yourself. When you gain a level in [Pact], you can choose one of the Soul aspects you know and replace it with another Soul aspect that you could learn at that level. If an aspect has prerequisites, you must meet them to learn it. You can learn the Soul aspect at the same time that you meet its prerequisites.\nNo Level RequirementAgonizing Blast\nPact of the Tome ability\nYou can now inscribe magical rituals in your spellbook. Choose two 1st-level spells that have the ritual tag. The spells appear in the book and don't count against the number of spells you know. With your spellbook in hand, you can cast the chosen spells as rituals. You can't cast the spells except as rituals unless you've learned them by some other means. You can also cast your normal spells you know as a ritual if it has the ritual tag.\nOn your adventures, you can add other ritual spells to your spellbook. When you find such a spell, you can add it to the book if the spell's level is equal to or less than half your [Pact] level (rounded up) and if you can spare the time to transcribe the spell. For each level of the spell, the transcription process takes 2 hours and costs Soul points equal to the level of the spell inscribed, those Soul points are consumed.\nBountiful Recovery"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Absorb Soul Aspect (Prerequisite)"
desc = "Your connection to your patron allows you to glimpse aspects of power from your patron’s Soul, and then, with time, embody them yourself. When you gain a level in [Pact], you can choose one of the Soul aspects you know and replace it with another Soul aspect that you could learn at that level. If an aspect has prerequisites, you must meet them to learn it. You can learn the Soul aspect at the same time that you meet its prerequisites.\nNo Level RequirementAgonizing Blast\nPact of the Bond ability\nWhilst your familiar is within 30 m of you, whenever you are targeted with a spell or ability that rolls dice to regain hit points, you regain hit points equal to the maximum value of those dice instead of rolling.\nEmbrace of Dithore"

[[abilities]]
origin = "Pact"

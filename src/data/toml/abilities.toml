desc = "Summer’s Ward: You can't be charmed or frightened by elementals or fey, and you are immune to poison and disease."

[[abilities]]
origin = "World Magic"
level = 10
selection = "Primary"
name = "Circle (Pateph)"
desc = "Infest: Instead of using your Toxic Response ability you can hurl all your projectiles into a 2m cube to a point you can see up to 6 m away as a reaction. The cube persists for 10 rounds or until you use this ability again, and whilst it is active you cannot use your Toxic Response ability. Any creature that starts its turn inside of the cube takes damage from your Toxic Response."

[[abilities]]
origin = "World Magic"
level = 10
selection = "Primary"
name = "Circle (Verhet)"
desc = "Spring's Embrace: If a fey, animal, or beast that you have conjured ends their turn inside of your Spirit Companion’s aura, that summoned creature may recover a number of hit points equal to half your total level."

[[abilities]]
origin = "World Magic"
level = 10
selection = "Primary"
name = "Circle (Vettias)"
desc = "Primordial Kinship: You gain the ability to transform into an air, earth, fire, and water elemental, by expending two uses of your Wild Shape ability at once."

[[abilities]]
origin = "World Magic"
level = 10
selection = "Primary"
name = "Circle (Zestos)"
desc = "Moment of Salvation: You can teleport up to 12 m to an unoccupied space you can see as a bonus action. You may bring a willing creature with you as you teleport but then you must spend an action instead of a bonus action. You can use this ability a number of times equal to your Cunning modifier (minimum 1), and you recover all your expended uses of it when you finish a long rest."


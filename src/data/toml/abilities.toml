[[abilities]]
origin = "Soul Weapon"
level = 1
selection = "Primary"
name = "Martial Arcanist"
desc = "You learn how to intertwine flinging spells and wielding weapons in combat. If you use your action to make one or several unarmed, melee weapons or ranged weapon attacks, you may cast a spell with a ranged or melee attack and a casting time of one action as a bonus action as long as you have a hand free for your casting. The highest level spell you can cast this way equals [Soul Weapon] level divided by 5 (rounded up and minimum level 1).\nBoth the unarmed or weapon attacks and the spell attack receive a -2 penalty to hit. If you use any Extra Attack, all the Extra Attacks and the spell attack receive an extra -1 penalty for each Extra Attack used in a turn."

[[abilities]]
origin = "Soul Weapon"
level = 1
selection = "Secondary"
name = "Infuse Soul"
desc = "Once per long rest, you gain the ability to infuse your weapon with the power of your own Soul. As a bonus action, you may give your weapon a first level enhancement, +1 to hit and +1 to damage, for 10 rounds plus your Intelligence modifier (minimum of +1)."

[[abilities]]
origin = "Soul Weapon"
level = 2
selection = "Primary"
name = "Soul Weapon Archetype (Cabalist)"
desc = "Undermine: Instead of making a spell attack as part of the Martial Arcanist ability, you can choose to cast an enchantment or illusion spell that requires a saving throw, targets only one creature, and normally has a casting time of an action, as a bonus action. If you choose to cast an enchantment or illusion spell this way, your spell save DC is lowered by -2. If you use the Extra Attack ability, the penalty increases to -3."

[[abilities]]
origin = "Soul Weapon"
level = 2
selection = "Primary"
name = "Soul Weapon Archetype (Rival)"
desc = "Parry: As a reaction, you may attempt to parry a melee attack targeting you if you are wielding a melee weapon of your own. Roll an opposed melee weapon attack with a +2 bonus to hit. If you roll higher than the incoming attack roll, you parry the attack and it does not deal damage to you. You can use this ability a number of times equal to your proficiency modifier per long rest and you can only parry Small or Medium-sized creatures this way."

[[abilities]]
origin = "Soul Weapon"
level = 2
selection = "Primary"
name = "Soul Weapon Archetype (Sage)"
desc = "Body, and Mind: You gain the Martial Arts ability from the [Discipline] AO with some modifications and you replace all instances of [Discipline] with [Soul Weapon] for the purposes of the Martial Arts ability. The modifications are:\nThe armor you wear can now be up to medium armor.\nThis ability only applies to unarmed attacks, not attacks with the quarterstaff.\nYou do not gain the ability to make an unarmed attack as a bonus action if you use your action to make an unarmored attack.\nYou may apply your Infuse Soul ability on your unarmored attacks."

[[abilities]]
origin = "Soul Weapon"
level = 2
selection = "Primary"
name = "Soul Weapon Archetype (Soul Blade)"
desc = "Animated Weapon: You learn to cast the spell Find Familiar as Soul Mastery once per long rest. You must still abide by the Soul Consumption requirement. When you cast Find Familiar this way, you add the flying sword to the list of creatures you can summon with the spell. If you summon a flying sword with this ability it gains a few changes:\nThe flying sword keeps its construct creature type.\nThe flying sword only has 4d6 HD.\nThe flying sword cannot speak and has no emotions, but it understands your commands and you can still communicate commands telepathically to it.\nBy spending your attack action you can command the flying sword to make a melee weapon or spell attack if it is within 20 m of you. This attack spends the flying sword’s reaction."

[[abilities]]
origin = "Soul Weapon"
level = 2
selection = "Primary"
name = "Soul Weapon Archetype (Vanguard)"
desc = "Absorb: You may add the AV bonus of a shield you are using to any saving throw you make against a spell or spell effect. In addition, you gain the War Caster feat."

[[abilities]]

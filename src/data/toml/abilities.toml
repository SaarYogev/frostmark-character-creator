[[abilities]]
origin = "World Magic"
level = 14
selection = "Primary"
name = "Circle (Athronna)"
desc = "Summer’s Sanctuary: When a beast, animal, or plant creature attacks you, that creature must make a Composure saving throw against your spell save DC. On a failed save, the creature must choose a different target, or the attack automatically misses. On a successful save, the creature is immune to this effect for 24 hours. The creature is aware of this effect before it makes its attack against you."

[[abilities]]
origin = "World Magic"
level = 14
selection = "Primary"
name = "Circle (Pateph)"
desc = "Master of Disease: If you are dealt damage from a critical hit you do not suffer the extra damage of the critical hit. In addition, you are immune to the conditions of blinded, deafened, frightened, and poisoned."

[[abilities]]
origin = "World Magic"
level = 14
selection = "Primary"
name = "Circle (Verhet)"
desc = "Loyal Companions: Once per long rest, whenever you are incapacitated against your will you may cast conjure animals as a 9th level spell for free. In this case, the spell requires no concentration or components. The spell conjures four beasts or animals of challenge rating 2 or lower. They protect you and attack any enemies until they can receive other orders from you. This ability lasts until you dismiss it, no action required, or for an hour."

[[abilities]]
origin = "World Magic"
level = 14
selection = "Primary"
name = "Circle (Vettias)"
desc = "Endless Expression: You can cast the spell Alter Self as Soul Mastery and at will."

[[abilities]]
origin = "World Magic"
level = 14
selection = "Primary"
name = "Circle (Zestos)"
desc = "Path to Salvation: Once per long rest, you can cast either Scrying or Teleportation Circle as Soul Mastery when you have finished a short rest. The cast of Teleportation Circle is different. Instead of teleporting to another Teleportation Circle, it opens a gateway to the last location where you completed a long rest if you remain within the same Realm. If you have not finished a long rest in the Realm, the cast of the spell fails but this ability is not wasted."


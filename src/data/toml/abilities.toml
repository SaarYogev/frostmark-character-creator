[[abilities]]
origin = "Predator"
level = 3
selection = "Primary"
name = "Conclave (Butcher of Behemoths)"
desc = "Butcher’s Intuition: Choose one creature that you can see within 12 m of you and spend an action. As long as the creature is not protected from Divination magic you learn the creature’s vulnerabilities, resistances, and immunities. If it is protected, you sense the creature has no vulnerabilities, resistances, and immunities. You may perform this ability a number of times equal to your Cunning modifier (minimum of 1) before you complete a long rest."

[[abilities]]
origin = "Predator"
level = 3
selection = "Primary"
name = "Conclave (Exterminator of Woe)"
desc = "Ghastly Executioner: On your first turn each combat you gain a number of benefits.\nAs part of your attack action that turns you can make an additional attack.\nYou can dash as a bonus action."

[[abilities]]
origin = "Predator"

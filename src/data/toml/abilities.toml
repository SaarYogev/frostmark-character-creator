selection = "Primary"
name = "Prerequisite: 5 level picks in (Enchant)"
desc = "When you attack a creature that is incorporeal/exist in the Ethereal dimension with a weapon enchanted by this Soul Gift, your weapon is treated like magical for the purposes of damage, you are able to target and roll damage them, and you deal 1d6 extra damage against creatures affected by those abilities.\nGlamour"

[[abilities]]

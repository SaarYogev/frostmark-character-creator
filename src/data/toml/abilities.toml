[[abilities]]
origin = "World Magic"
level = 6
selection = "Primary"
name = "Circle (Athronna)"
desc = "Summer's Stride’s: Moving through nonmagical difficult terrain costs you no extra movement. You can also pass through nonmagical or magical plants without being slowed by them and without taking damage from them if they have thorns, spines, or a similar hazard.\nIn addition, you have advantage on saving throws against plants that are magically created or manipulated to impede movement, such as those created by the Entangle spell."

[[abilities]]
origin = "World Magic"
level = 6
selection = "Primary"
name = "Circle (Pateph)"
desc = "Spread the Disease: If your Toxic Response ability would kill a humanoid it is transformed into a zombie. The zombie animates at the end of your turn and its turn in the initiative order is immediately after yours. You can command the zombie telepathically but the only action the zombie can take is one melee attack action per turn. The zombie collapses when it is either defeated in combat or after an hour."

[[abilities]]
origin = "World Magic"
level = 6
selection = "Primary"
name = "Circle (Verhet)"
desc = "Potent Conjurer: Beasts, animals, and fey conjured by you are more potent. Creatures conjured by you gain a bonus to their hit points equal to +2 for each hit dice they possess. In addition, their natural weapon attacks are now considered magical for the purpose of overcoming immunities and resistance to nonmagical attacks and damage."

[[abilities]]
origin = "World Magic"
level = 6
selection = "Primary"
name = "Circle (Vettias)"
desc = "Magical Excellence: When you use your Wild Shape ability, your natural weapon attacks are considered magical for the purpose of overcoming resistances and immunities to nonmagical attacks and damage."

[[abilities]]
origin = "World Magic"
level = 6
selection = "Primary"
name = "Circle (Zestos)"
desc = "Dome of Recuperation: Whenever you start a rest, you may touch a location and a 6 m radius sphere of obscuring magic appears on that point. The sphere is invisible and is blocked by total cover. Sources of light from within the sphere are not visible outside of it. In addition, any number of creatures of your choice inside the sphere gain a +5 bonus to Perception and Stealth checks. This effect disappears whenever you leave the sphere or your rest is over."

[[abilities]]

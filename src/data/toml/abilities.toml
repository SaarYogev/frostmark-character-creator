desc = "Arcane Reflection: As a reaction, you may attempt to reflect a spell that would hit you back at its caster. To reflect a spell this way, the spell must require a melee or ranged spell attack roll, it must target only you and you must wield a shield. Roll an opposed melee spell attack. If you roll higher than the incoming spell attack roll, you reflect the spell back at the caster and the spell deals damage to the caster instead of you. You can use this ability a number of times equal to half your proficiency modifier (rounded up) per long rest and you can only reflect spells that are less than, or equal to ¼ of your total level (rounded up) this way."


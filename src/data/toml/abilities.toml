name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Animation)"
desc = "**Supreme Healing**\n\nWhen you restore health points with a spell, you\n\nheal the maximum value of the dice instead of rolling them."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Ardor)"
desc = "**Improved Severance**\n\nYou can create up to four illusions of yourself,\n\ninstead of one, when you use your Sever Shadow ability. On your turn, you may\n\nmove any number of them up to 6 m as a bonus action, to a maximum range of 24\n\nm."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Athanasia)"
desc = "**Reap Rewards**\n\nWhen an enemy you can see dies within 12 m of you,\n\nyou or one creature of your choice that is within 12 m of you regains health\n\npoints equal to the enemy's number of health dice. You can use this ability only if\n\nyou aren't incapacitated. Once you use it, you can't do so again until the start of\n\nyour next turn."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Battle)"
desc = "**Avatar of Strife**\n\nYou gain resistance to bludgeoning, piercing, and\n\nslashing damage from nonmagical attacks."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Community)"
desc = "**Public Transport**\n\nYou can teleport from one specialized building, a\n\ntavern, marketplace, barracks, shop, bathhouse, etc., within a city, as if you had\n\ncast a Teleport spell whose destination is a permanent Teleportation Circle you\n\nknow. Once you use this ability, you must finish a short or long rest before using\n\nit again."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Craft)"
desc = "**Soul of the Forge**\n\nYou gain the following benefits:\n\n  * You gain immunity to fire damage.\n\n  * While you're wearing heavy armor, you have resistance to bludgeoning,\n\npiercing, and slashing damage from nonmagical attacks."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Deceit)"
desc = "**Improved Severance**\n\nYou can create up to four illusions of yourself,\n\ninstead of one, when you use your Sever Shadow ability. On your turn, you may\n\nmove any number of them up to 6 m as a bonus action, to a maximum range of 24\n\nm."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Harmony)"
desc = "**Supreme Healing**\n\nWhen you restore health points with a spell, you\n\nheal the maximum value of the dice instead of rolling them."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Law)"
desc = "**Judge, and Jury**\n\nWhen you deal damage to a creature with your Deistic\n\nPunishment ability, you can additionally curse that creature until the start of\n\nyour next turn. Whilst the creature is cursed, the next time one of your allies hits\n\nthe creature with an attack, the ally deals an additional 2d8 psychic damage. The\n\ncurse \u00b4then ends. You can also curse a creature with this ability once per turn."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Lore)"
desc = "**The Knowledge of Stars**\n\nOnce per short or long rest, if you spend 10\n\nuninterrupted rounds in meditation, you receive visions of recent events. You\n\ncan meditate in this way for a number of minutes equal to your Intelligence score\n\n(minimum 1) and must maintain concentration during that time as if you were\n\ncasting a spell. Choose one option below when you use this ability:\n\n  * Object Reading: Holding an object as you meditate, you can see visions of\n\nthe object's previous owner. After meditating for 10 rounds, you learn how\n\nthe owner acquired and lost the object, as well as the most recent\n\nsignificant event involving the object and the owner. If the object was\n\nowned by another creature in the recent past (within a number of days\n\nequal to your Intelligence score, minimum 1), you can spend 1 additional\n\nminute for each owner to learn the same information about that creature.\n\n  * Area Reading: As you meditate, you see visions of recent events in your\n\nimmediate vicinity (a room, street, tunnel, clearing, or the like, up to a 10\n\nm cube), going back a number of days equal to your Intelligence score\n\n(minimum 1). For each minute you meditate, you learn about one\n\nsignificant event, beginning with the most recent. Significant events\n\ntypically involve powerful emotions, such as battles and betrayals,\n\nmarriages and murders, births, and funerals. However, they might also\n\ninclude more mundane events that are nevertheless important in your\n\ncurrent situation."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Might)"
desc = "**Avatar of Strife**\n\nYou gain resistance to bludgeoning, piercing, and\n\nslashing damage from nonmagical attacks."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Nature)"
desc = "**In Harmony with Nature**\n\nYou can verbally command what actions each\n\ncreature charmed with your Invoke your Mother ability will do on their turns as a\n\nbonus action."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Passion)"
desc = "**Blaze of Zeal**\n\nOnce per long rest, when you are reduced to 0 health\n\npoints (even if you would die) \u00b4\u00b4\u00b4\u00b4by an attacker you can see, you can use your\n\nreaction to move up to your speed toward the attacker and make one melee\n\nweapon attack against it, as long as the movement brings it within your reach.\n\nYou make this attack with advantage. If the attack hits, the creature takes an\n\nextra 5d10 fire damage and an extra 5d10 damage of the weapon's type. Then you\n\nfall unconscious and begin making death saving throws as normal (or die if the\n\ndamage was sufficient)."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Preservation)"
desc = "**Indomitable Defense**\n\nYou gain resistance to two damage types of\n\nyour choice, choosing from bludgeoning, necrotic, piercing, radiant, and slashing.\n\nWhenever you finish a short or long rest, you can change the damage types you\n\nchose. Additionally, you can transfer one resistance to an ally you touch as an\n\naction. The creature keeps the resistance until the end of your next long rest or\n\nuntil you transfer it back to yourself as a bonus action."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Radiance)"
desc = "**Aura of Resplendence**\n\nAs an action, you can shine like a small sun for\n\n10 rounds or until you dismiss it as an action. Your aura emits bright light in a 12\n\nm radius and dim light 6 m beyond that. Enemies inside of the bright light aura\n\nsuffer disadvantage on saving throws against any spell that deals fire or radiant\n\ndamage."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Ruin)"
desc = "**Improved Bringer of Death**\n\nWhenever you cast a spell of the vismancy\n\nschool of at least 1st level but not higher than 5th level, the spell can instead\n\ntarget two creatures within range and within 1 m of each other. If the spell\n\nconsumes Souls, you must provide them for each target."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Storm)"
desc = "**Stormborn**\n\nAs long as you are not underground or indoors, you gain a\n\nflying speed equal to your walking speed."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Thaumaturgy)"
desc = "**Arcane Mastery**\n\nYou choose four spells, one from each of the\n\nfollowing levels: 6th, 7th, 8th, and 9th. You add them to your list of spells."

[[abilities]]
origin = "Devotion"
level = 18
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- Two points to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 20 Potential"

[[abilities]]
origin = "Devotion"
level = 19
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Devotion"
level = 20
selection = "Primary"
name = "Greater Aid of the Gods"
desc = "Your Aid of the Gods ability succeeds automatically, no roll required."

[[abilities]]
origin = "Discipline"
level = 1
selection = "Primary"
name = "Martial Arts"
desc = "You gain the following benefits while you are unarmed or wielding a quarterstaff, and\n\nyou aren't wearing armor or wielding a shield:\n\n- When you make a melee weapon attack or an unarmed attack, you may use your\n\nDexterity modifier instead of your Brawn modifier to hit and deal damage.\n\n- You may change the damage die of your unarmed strike or quarterstaff weapon\n\nto a 1d4. This die increases as you pick levels in [Discipline], to a 1d6 after 5 level\n\npicks, 1d8 after 11 level picks, and a 1d10 after 17 level picks.\n\n- When you attack unarmed or with a quarterstaff, you can make one unarmed\n\nstrike as a bonus action."

[[abilities]]
origin = "Discipline"
level = 1
selection = "Secondary"
name = "Unarmored Defense"
desc = "While you are not wearing any armor or wielding a shield, your armor value equals 10 +\n\nyour Dexterity modifier + your Composure modifier. The Dexterity and the Composure\n\nmodifier cannot exceed your proficiency bonus individually."

[[abilities]]
origin = "Discipline"
level = 2
selection = "Primary"
name = "Mastery"
desc = "You have gained a singularly pure connection to your Soul which allows you to draw\n\nupon Soul power within to strengthen and empower your body. You gain a number of\n\nMastery points. Your [Discipline] level determines the number of points you have. When\n\nyou pick this ability you gain 2 Mastery points and for every level pick of [Discipline]\n\nafter this one, this increases by 1. Mastery points possess these features:\n\n- Abilities: You can spend Mastery point to fuel certain abilities. When you take\n\nthis ability you gain five such abilities. You can learn more Mastery abilities as\n\nyou pick levels in [Discipline].\n\n- Recover: You regain all expended Mastery points when you finish a short or long\n\nrest. During these rests, you must spend at least 30 minutes meditating to allow\n\nyour Soul to recover, and in extension regenerate your Mastery points.\n\n- Saving Throws: Some of your Mastery abilities requires your target to make a\n\nsaving throw to resist the ability's effects. Your Mastery DV equals 8 + your\n\nproficiency modifier + your Composure modifier.\n\nYou gain these Mastery abilities:\n\n- Farseeing: Until the end of your next turn, by spending 1 Mastery point you\n\nmay ignore disadvantage imposed when attacking with a ranged weapon at\n\nlong range.\n\n- Greater Aggression: Immediately after you take the attack action on your\n\nturn, you can spend 1 Mastery point to make two unarmed strikes as a bonus\n\naction.\n\n- Greater Agility: If you spend 1 Mastery point, your jump distance is doubled\n\nfor the turn and as a bonus action you can take the disengage or dash action\n\nas a bonus action on your turn.\n\n- Greater Reflexes: You can use the dodge action as a bonus action on your\n\nturn if you spend 1 Mastery point.\n\n- Self-Healing: As a bonus action, you may spend 2 Mastery points to regain\n\nhealth points equal to 1d6 + your proficiency modifier."

[[abilities]]
origin = "Discipline"
level = 2
selection = "Secondary"
name = "Unburdened Celerity"
desc = "Your walking speed increases by 2 m if you are not wearing armor or wielding a shield.\n\nThis bonus increases after a certain amount of [Discipline] level picks, to 3 m after 6\n\nlevel picks, 4 m after 10 level picks, 5 m after 14 level picks, and 6 m after 18 levels.\n\nAfter 9 level picks of [Discipline], you gain the ability to move along vertical surfaces and\n\nacross liquids on your turn without falling during the move."

[[abilities]]
origin = "Discipline"
level = 3
selection = "Primary"
name = "Mold Soul (Embodiment of Enlightenment)"
desc = "**Radiant Bolt**\n\nAs a ranged spell attack, you can\n\nhurl a ball of Soul energy at an enemy. The spell attack has a range of 6 m, you\n\nare proficient with it, and you add your Dexterity modifier to its attack and\n\ndamage rolls. Radiant Bolt deals 1d4 radiant damage (plus your Dexterity\n\nmodifier). The damage of Radiant Bolt increases as you pick levels in [Discipline]\n\nequal to how your unarmed strikes and quarterstaff gains damage from the\n\nMartial Arts ability.\n\nIn addition, when you take the attack action on your turn and use this ranged\n\nspell attack as part of it, you can spend 1 Mastery point to make the spell attack\n\ntwice as a bonus action. If you pick the Extra Attack ability, this spell attack can\n\nbe used for any of the attacks you make as part of the attack action."

[[abilities]]
origin = "Discipline"
level = 3
selection = "Primary"
name = "Mold Soul (Embodiment of Inevitability)"
desc = "**Silver Lining**\n\nWhen you reduce a creature within\n\n1 m of you to 0 health points, you gain temporary health points equal to your\n\nComposure modifier + your [Discipline] level (minimum 1)."

[[abilities]]
origin = "Discipline"
level = 3
selection = "Primary"
name = "Mold Soul (Embodiment of Serenity)"
desc = "**Channel Soul**\n\nWhenever you health a creature with\n\none of the attacks granted by your Greater Aggression, you can impose one of\n\nthe following effects on that target:\n\n  * It must succeed on a Dexterity saving throw or be knocked prone.\n\n  * It must make a Brawn saving throw or be pushed 3 m away from you.\n\n  * It cannot take reactions until the end of your next turn."

[[abilities]]
origin = "Discipline"
level = 3
selection = "Primary"
name = "Mold Soul (Embodiment of Solemnity)"
desc = "**Spell Mastery**\n\nYou can cast Minor Illusion as Soul\n\nMastery. In addition, you can cast Darkness, Darkvision, Pass Without Trace, and\n\nSilence as Soul Mastery by spending 2 Mastery points."

[[abilities]]
origin = "Discipline"
level = 3
selection = "Primary"
name = "Mold Soul (Embodiment of Triumph)"
desc = "**Extension of the Soul**\n\nOn the path of finding\n\ncomplete harmony with your Soul, you practice your discipline in the heat of\n\nbattle. You gain the following benefits:\n\n  * Mastery Weapons: Choose one ranged weapon and one melee weapon to\n\nbe your Mastery Weapons. Your Mastery Weapons can be any weapon\n\nthat lacks the heavy and special properties (the longbow is an exception to\n\nthis rule). You gain proficiency with these weapons if you do not already\n\npossess them. Many abilities in the Embodiment of Triumph requires the\n\nuse of your Mastery Weapons. After you have picked 6 levels, 11 levels, and\n\n17 levels of [Discipline], you can choose another ranged or melee weapon\n\nto be counted as a Mastery Weapon for you, following the limitations\n\nabove.\n\n  * Defensive Arms: If you make an unarmed strike as part of the attack\n\naction on your turn and you are wielding a melee Mastery Weapon, you\n\ngain a +2 bonus to your AV until the start of your next turn. During this\n\ntime the weapon must be in your hand and you cannot be incapacitated.\n\n  * Deadly Shot: As a bonus action, you may increase the damage of your\n\nranged weapon attacks with an extra 1d4 of the weapon\u2019s damage type.\n\nYou keep this benefit until the end of your current turn."

[[abilities]]
origin = "Discipline"
level = 3
selection = "Secondary"
name = "Deflect Missiles"
desc = "As a reaction, you can reduce the damage of a ranged weapon attack targeting you by\n\n1d10 + Dexterity modifier + your [Discipline] level. If you reduce the damage to 0, you\n\ncan catch the missile if it is small enough for you to hold in one hand and you have at\n\nleast one hand free.\n\nIf you reduce the damage to 0, you can catch the missile if it is small enough for you to\n\nhold in one hand and you have at least one hand free. If you catch a missile in this way,\n\nyou can spend 1 Mastery point to make a ranged attack (4/6 m) with the weapon or\n\npiece of ammunition you just caught, as part of the same reaction. You make this attack\n\nwith proficiency, and the missile counts as unarmed for the attack."

[[abilities]]
origin = "Discipline"
level = 4
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Discipline"
level = 5
selection = "Primary"
name = "Extra Attack"
desc = "As part of your attack action, you can make two attacks instead of one. You must\n\npossess at least 1 level of [Discipline] to be eligible for this ability (excluding this level)."

[[abilities]]
origin = "Discipline"
level = 5
selection = "Primary"
name = "Stunning Strike"
desc = "When you hit another creature with a melee weapon attack, you can spend 1 Mastery\n\npoint to attempt a Stunning Strike. The target must succeed on a Vitality saving throw\n\nor be stunned until the end of your next turn."

[[abilities]]
origin = "Discipline"
level = 6
selection = "Primary"
name = "Soul-Infused Strikes"
desc = "Your unarmed strikes count as magical for the purpose of overcoming resistance and\n\nimmunity to non-magical attacks and damage."

[[abilities]]
origin = "Discipline"
level = 6
selection = "Primary"
name = "Mold Soul (Embodiment of Enlightenment)"
desc = "**Fiery Outburst**\n\nImmediately after you take the\n\nattack action on your turn, you can spend 2 Mastery points to cast the Burning\n\nHands spell as a bonus action and Soul Mastery.\n\nYou can spend additional Mastery points to cast Burning Hands as a higher-level\n\nspell. Each additional Mastery point you spend increases the spell's level by 1. The\n\nmaximum number of Mastery points (2 plus any additional points) that you can\n\nspend on the spell equals half your [Discipline] level."

[[abilities]]
origin = "Discipline"
level = 6
selection = "Primary"
name = "Mold Soul (Embodiment of Inevitability)"
desc = "**Face Fate**\n\nAs an action, each creature within 6 m\n\nof you that can see you must succeed on a Resolve saving throw or be frightened\n\nof you until the end of your next turn."

[[abilities]]
origin = "Discipline"
level = 6
selection = "Primary"
name = "Mold Soul (Embodiment of Serenity)"
desc = "**Wholeness of Body**\n\nAs an action, you can regain\n\nhealth points equal to three times your [Discipline] level. You must finish a long\n\nrest before you can use this ability again."

[[abilities]]
origin = "Discipline"
level = 6
selection = "Primary"
name = "Mold Soul (Embodiment of Solemnity)"
desc = "**Shadow Step**\n\nYou gain the ability to step from one\n\nshadow into another. When you are in dim light or darkness, as a bonus action\n\nyou can teleport up to 12 m to an unoccupied space you can see that is also in\n\ndim light or darkness. You then have advantage on the first melee attack you\n\nmake before the end of the turn. You can use this ability a number of times equal\n\nto your Composure saving throw (minimum 1) per long rest."

[[abilities]]
origin = "Discipline"
level = 6
selection = "Primary"
name = "Mold Soul (Embodiment of Triumph)"
desc = "**Master of Arms**\n\nYour mastery of your Soul and arms\n\ndeepens, granting you the following benefits.\n\n  * Magic Mastery Weapons: Your attacks with your Mastery Weapons count\n\nas magical for the purpose of overcoming resistance and immunity to\n\nnonmagical attacks and damage.\n\n  * Soul Enchanted: When you hit a target with a Mastery Weapon, you can\n\nspend 1 Mastery point to cause the weapon to deal extra damage to the\n\ntarget equal to the damage die of unarmed strikes and the quarterstaff of\n\nyour Martial Arts ability. You can use this ability only once on each of your\n\nturns."

[[abilities]]
origin = "Discipline"
level = 7
selection = "Primary"
name = "Evasion"
desc = "When you are subjected to an effect that allows you to make a Dexterity saving throw to\n\ntake only half damage, you instead take no damage if you succeed on the saving throw,\n\nand only half damage if you fail."

[[abilities]]
origin = "Discipline"
level = 7
selection = "Primary"
name = "Stillness of Mind"
desc = "As an action, you can end one effect on yourself that causes you to be charmed or\n\nfrightened."

[[abilities]]
origin = "Discipline"
level = 8
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Discipline"
level = 9
selection = "Primary"
name = "Slow-Fall"
desc = "As a reaction, you can reduce the damage you take from falling by an amount equal to\n\nfive times your [Discipline] level."

[[abilities]]
origin = "Discipline"
level = 10
selection = "Primary"
name = "Purity of Body"
desc = "You become immune to disease and poison."

[[abilities]]
origin = "Discipline"
level = 11
selection = "Primary"
name = "Tradition (Embodiment of Enlightenment)"
desc = "**Soul Bomb**\n\nAs an action, you can create an orb\n\nand hurl it at a point you choose within 30 m, where it erupts into a sphere of\n\nradiant light. Each creature in a 4 m radius sphere must succeed on a Vitality\n\nsaving throw or take 2d6 radiant damage. A creature doesn't need to make the\n\nsave if the creature is behind total cover that is opaque.\n\nYou can increase the sphere's damage by spending Mastery points. Each point\n\nyou spend, up to a maximum of 3, increases the damage by 2d6."

[[abilities]]
origin = "Discipline"
level = 11
selection = "Primary"
name = "Tradition (Embodiment of Inevitability)"
desc = "**Vigor of the Soul**\n\nWhen you are reduced to 0\n\nhealth points, you can expend 1 Mastery point to have 1 health point instead. You\n\ncan use this ability a number of times equal to your Resolve modifier (minimum 1)\n\nper long rest."

[[abilities]]
origin = "Discipline"
level = 11
selection = "Primary"
name = "Tradition (Embodiment of Serenity)"
desc = "**Tranquility**\n\nAt the end of a long rest, you gain the\n\neffect of a Sanctuary spell that lasts until the start of your next Long Rest (the\n\nspell can end early as normal)."

[[abilities]]
origin = "Discipline"
level = 11
selection = "Primary"
name = "Tradition (Embodiment of Solemnity)"
desc = "**Soul Obscurity**\n\nWhen you are in an area of dim light\n\nor darkness, you can use your action to become invisible. You remain invisible\n\nuntil you make an attack, cast a spell, or are in an area of bright light."

[[abilities]]
origin = "Discipline"
level = 11
selection = "Primary"
name = "Tradition (Embodiment of Triumph)"
desc = "**Greater Mastery Weapon**\n\nAs a bonus action, you can\n\nexpend up to 3 Mastery points to grant one Mastery Weapon you touch a bonus\n\nto attack and damage rolls equal to the number of Mastery points you spent. This\n\nbonus lasts for 10 rounds or until you use this ability again. This ability has no\n\neffect on a magic weapon that already has a bonus to attack and damage rolls."

[[abilities]]
origin = "Discipline"
level = 12
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Discipline"
level = 13
selection = "Primary"
name = "True Understanding"
desc = "You understand all spoken languages. Moreover, any creature that can understand a\n\nlanguage can understand what you say."

[[abilities]]
origin = "Discipline"
level = 14
selection = "Primary"
name = "Incorruptible Purity"
desc = "You are proficient in all saving throws. Additionally, whenever you make a saving throw\n\nand fail, you can spend 1 Mastery point to reroll it, but you must use the new result."

[[abilities]]
origin = "Discipline"
level = 15
selection = "Primary"
name = "Supreme Spirit"
desc = "You suffer no penalties of old age and you cannot be aged magically, but you can still die\n\nof old age. In addition, you no longer need food or water."

[[abilities]]
origin = "Discipline"
level = 16
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Discipline"
level = 17
selection = "Primary"
name = "Tradition (Embodiment of Enlightenment)"
desc = "**Shield of Brilliance**\n\nYou shed bright light in a 6\n\nm radius and dim light for an additional 6 m. You can extinguish or restore the\n\nlight as a bonus action. If a creature hits you with a melee attack while this light\n\nshines, you can use your reaction to deal radiant damage to the creature. The\n\nradiant damage equals 5 + your Composure modifier."

[[abilities]]
origin = "Discipline"
level = 17
selection = "Primary"
name = "Tradition (Embodiment of Inevitability)"
desc = "**Touch of Atrophy**\n\nAs an action, you can touch a\n\ncreature within 1 m of you and attempt to wither their body and soul with\n\nnecrotic damage by spending Mastery points. The creature must make a Vitality\n\nsaving throw. On a failed save, it takes necrotic damage equal to 2d10 per\n\nMastery point spent. You can spend 1 to 10 Mastery points. On a successful save,\n\nthe creature suffers half of the damage."

[[abilities]]
origin = "Discipline"
level = 17
selection = "Primary"
name = "Tradition (Embodiment of Serenity)"
desc = "**Soul Infection**\n\nWhen you hit a creature with an\n\nunarmed strike, you can spend 3 Mastery points to leave this Soul power hidden\n\nin the creature\u2019s body. The Soul power persists in the creature for a number of\n\ndays equal to your [Discipline] level. As an action, you may explode the Soul\n\npower within the creature's body. When you use this action, the creature must\n\nmake a Vitality saving throw. If it fails, it takes 10d10 necrotic damage. If it\n\nsucceeds, it takes half damage.\n\nYou can have only one creature under the effect of this ability at a time. You can\n\nchoose to release the Soul power harmlessly without using an action. To use this\n\nability, you and the creature must be within the same Realm."

[[abilities]]
origin = "Discipline"
level = 17
selection = "Primary"
name = "Tradition (Embodiment of Solemnity)"
desc = "**Patient Opportunist**\n\nWhenever a creature within 1\n\nm of you is hit by an attack made by a creature other than you, you can use your\n\nreaction to make a melee attack against that creature."

[[abilities]]
origin = "Discipline"
level = 17
selection = "Primary"
name = "Tradition (Embodiment of Triumph)"
desc = "**Superb Accuracy**\n\nOnce per turn, you may reroll one\n\nmissed attack made with a Mastery Weapon."

[[abilities]]
origin = "Discipline"
level = 18
selection = "Primary"
name = "Formless Spirit"
desc = "You can use your action to spend 4 Mastery points to become invisible for 10 rounds.\n\nDuring that time, you also have resistance to all damage but force damage."

[[abilities]]
origin = "Discipline"
level = 19
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Discipline"
level = 20
selection = "Primary"
name = "Nirvana"
desc = "When you roll for initiative and have no Mastery points remaining, you regain 4 Mastery\n\npoints."

[[abilities]]
origin = "Divine Oath"
level = 1
selection = "Primary"
name = "Divine Sense"
desc = "As an action, for 10 rounds, you know the location of three creature types of your\n\nchoice within 12 m of you that is not behind total cover. You know the type of\n\nany being whose presence you sense, but not its identity. Within the same\n\nradius, you also detect the presence of any place or object that has been\n\nconsecrated or desecrated (been sanctified by either celestial forces or fiendish\n\nforces). You can use this ability a number of times equal to 1 + your Resolve\n\nmodifier (minimum 1). When you finish a long rest, you regain all expended uses."

[[abilities]]
origin = "Divine Oath"
level = 1
selection = "Primary"
name = "Proclaim Judgement"
desc = "Once per long rest, you may Proclaim Judgement as a bonus action. This ability is\n\nactivated as long as you are in combat or until combat ends. You can only have\n\none Judgement active at one time. When you Proclaim Judgement, choose one\n\neffect:\n\n- Ire: You will not let this slight against your Enneade go unpunished. You\n\ngain a +1 bonus on all damage rolls you make. Once per combat, when you\n\nscore a critical hit, you may choose to double your static damage bonuses\n\nas well as your damage dice.\n\n- Conviction: Your divine conviction nourishes your Soul. You heal 2 points\n\nof damage at the start of your turn as long as you have not fallen\n\nunconscious.\n\n- Righteousness: Your blade is as sharp as your righteousness. You gain a +1\n\nbonus on all attack rolls you make. In addition, you gain a critical hit range\n\nincrease of 19-20.\n\n- Serenity: You remain serene and confident in your dedication. Your spell\n\nsaves DV increases with +1.\n\n- Indignation: You will suffer no indignation. Your AV gains a +1 bonus.\n\n- Contempt: Heretics fill you with nothing but contempt. You gain a +1\n\nbonus on all saving throws you make. This bonus is doubled for any vitality\n\nsaving throws you make.\n\n- Defiance: Losing is not an option. You gain resistance against one\n\nelemental damage type (acid, cold, fire, lightning, or thunder). When you\n\nProclaim this Judgement, choose one. You must possess at least 10 level\n\npicks of [Divine Oath] to choose this judgment.\n\n- At 4th level and every three level picks thereafter of [Divine Oath] you can\n\nuse this ability one additional time per long rest."

[[abilities]]
origin = "Divine Oath"
level = 1
selection = "Secondary"
name = "Lay on Hands"
desc = "You have a pool of healing power that replenishes when you take a long rest.\n\nWith that pool, you can restore a total number of health points equal to your\n\n[Divine Oath] level x 5. As an action, you can touch a creature and draw power\n\nfrom the pool to restore a number of health points to that creature, up to the\n\nmaximum amount remaining in your pool.\n\nAlternatively, you can expend 5 health points from your pool of healing to cure\n\nthe target of one disease or neutralize one poison affecting it. You can cure\n\nmultiple diseases and neutralize multiple poisons with a single use of Lay on\n\nHands, expending health points separately for each one. This ability does not\n\naffect constructs."

[[abilities]]
origin = "Divine Oath"
level = 2
selection = "Primary"
name = "Divine Smite"
desc = "You gain the ability to purchase special spell slots with your Potential, Smite\n\nspell slots. You purchase them just like your normal spell slots with Potential, but\n\nyou must use Potential you gain from Divine Oath to buy them. Smite spell slots\n\nmust abide by the normal number of spell slot limitations but do so exclusively\n\nfrom normal spell slots. For example, you may have seven normal spell slots of\n\nlevel 1 and seven Smite spell slots of level 1 with Moderate Spellcasting at the\n\nsame time. Smite spell slots do not require a Soul Mark, Soul Power nor a Soul\n\nCheck when used. You regain all your spent Smite spell slots on a long rest.\n\nAfter you attack a creature with a melee weapon attack, you may expend a Smite\n\nspell slot to deal extra damage to that target, in addition to the weapon\u2019s damage.\n\nThe type of the damage equals one of your Enneade\u2019s favorite damage types.\n\nWhen you gain this ability you choose which damage type your Smites will deal\n\nwith for the rest of the game. The extra damage is 10 for a first level spell slot,\n\nplus 5 for each spell level higher than 1st, to a maximum of 25 extra damage. The\n\ndamage increases by 5 if the target is a favored enemy of your Enneade, to a\n\nmaximum of 30 damage. You cannot use Smite more than once per round.\n\nEnneade Favorite Damage Type (Choose\n\none)\n\nFavored Enemy\n\nRiahn Fire or radiant Fiends and undead\n\nGera Acid or poison Constructs and undead\n\nTeranis Lightning or necrotic Celestials and fiends\n\nLapuana Force or thunder One creature type of your\n\nchoice\n\nBorias Bludgeoning or cold Celestials and fey\n\nSuhlmis Fire or slashing Monstrosities and oozes\n\nVegomo Piercing or psychic Animals and beasts"


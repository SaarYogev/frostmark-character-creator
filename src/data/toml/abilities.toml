desc = "Once per short rest, after you make a successful attack with a melee weapon enchanted by this Soul Gift, you may give an ally a help action for their melee attack until the end of their next turn as a free action. Alternatively, once per short rest, after you make a successful attack with a ranged weapon enchanted by this Soul Gift, you may give an ally a help action for their ranged attack until the end of their next turn as a free action.\nDelivery System"

[[abilities]]

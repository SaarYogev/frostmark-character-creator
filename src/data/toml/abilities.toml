selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Divine Oath"
level = 20
selection = "Primary"
name = "Sacred Oath (Riahn)"
desc = "Holy Nimbus: As an action, you can emanate light. For 10 rounds, a bright light shines from you in a 6 m aura radius, and dim light shines 6 m beyond that. Whenever an enemy creature starts its turn in your 6 m bright light aura, the creature takes 10 radiant damage. In addition, for the duration, you have advantage on saving throws against spells with cold damage. Once you use this ability, you can't use it again until you finish a long rest."

[[abilities]]
origin = "Divine Oath"
level = 20
selection = "Primary"
name = "Sacred Oath (Gera)"
desc = "Verdant Warden: Once per long rest, as an action, you can transform into a powerful champion of the wilds. For 10 rounds you gain the following benefits:\nAt the start of each of your turns, you regain 10 hit points.\nWhenever you cast a spell that has a casting time of 1 action, you can cast it using a bonus action instead.\nEnemy creatures within 2 m of you have disadvantage on saving throws against your spells and Channel Divinity options."

[[abilities]]
origin = "Divine Oath"
level = 20
selection = "Primary"
name = "Sacred Oath (Teranis)"
desc = "Beacon of Death: Once per long rest, you can cloak yourself in mighty shadows as an action. For 10 rounds you gain a number of benefits:\nYou reduce bright light in a 6 m radius around you to dim light.\nWhenever an enemy that is frightened by you starts its turn within 6 m of you, it takes 4d10 necrotic damage.\nCreatures other than you, that rely on sight have disadvantage on attack rolls against creatures within 6 m of you.\nYou can use a bonus action on your turn to cause your shadows to attack one creature within 6 m of you. Make a melee spell attack against the target. If the attack hits, the target takes necrotic damage equal to 3d10 + your Cunning modifier (minimum 1)."

[[abilities]]
origin = "Divine Oath"
level = 20
selection = "Primary"
name = "Sacred Oath (Lapuana)"
desc = "Lunar Paragon: Once per long rest, you can give yourself a number of benefits that last for an hour by spending an action.\nYou have Resistance to bludgeoning, piercing, and slashing damage from nonmagical weapons.\nYour allies have advantage on death saving throws while within 6 m of you.\nYou have advantage on Resolve saving throws, as do your allies within 6 m of you. This effect ends early if you are incapacitated or die."

[[abilities]]
origin = "Divine Oath"
level = 20
selection = "Primary"
name = "Sacred Oath (Borias)"
desc = "Embodiment of Winter’s Cruelty: Once per long rest, you become the embodiment of winter as an action. For 10 rounds you gain a number of benefits:\nYou have resistance to all damage.\nWhen you take the attack action on your turn, you can make one additional attack as part of that action.\nYour melee weapon attacks gain an increased critical hit range of 19 to 20.\n- Suhlmis - Merciless Avenger: Once per long rest, as an action, you can transform into an avatar of vengeance. For 10 rounds you gain the following benefits:\nYou gain a flying speed of 12 m as wings of fire appears on your back.\nThe first time any enemy creature moves within 6 m of you or starts its turn within 6 m, the creature must succeed on a Resolve saving throw or become frightened of you for 10 rounds or until it takes any damage. Attack rolls against the frightened creature have advantage."

[[abilities]]
origin = "Divine Oath"
level = 20
selection = "Primary"
name = "Sacred Oath (Vegomo)"
desc = "Arbiter of Peace: As an action, you can awaken your mind’s eye. For 10 rounds you gain a number of benefits:\nYou have resistance to all damage dealt by other creatures (their attacks, spells, and other effects).\nWhenever a creature hits you with an attack, it takes psychic damage equal to half the damage you take from the attack.\nIf you attack a creature, cast a spell on it, or deal damage to it by any means but this ability or Guilty Conscience ability, neither benefit works against that creature until you finish a long rest."

[[abilities]]
origin = "Finesse"
level = 1
selection = "Primary"
name = "Sneak Attack"
desc = "When you attack a creature with a weapon attack you can deal an extra 1d6 damage to it if you attack with a finesse or ranged weapon and if you had advantage on the attack. You don't need advantage on the attack roll if another enemy of the target is within 1 m of it, that enemy isn't incapacitated, and you don't have disadvantage on the attack roll. The amount of the extra damage increases with 1d6 as you pick levels in [Finesse], at every uneven level pick of [Finesse] (counting only [Finesse] levels). You can only Sneak Attack once per turn."

[[abilities]]
origin = "Finesse"
level = 1
selection = "Secondary"
name = "Unarmored Defense"
desc = "While you are not wearing any armor or wielding a shield, your armor class equals 10 + your Dexterity modifier + your Cunning modifier. The Dexterity and the Cunning modifier cannot exceed your proficiency bonus individually."

[[abilities]]
origin = "Finesse"
level = 1
selection = "Secondary"
name = "Expertise"
desc = "You gain two skill points in two skills of your choice, and you may gain rank 5 for both of the chosen skills."

[[abilities]]
origin = "Finesse"
level = 2
selection = "Primary"
name = "Cunning Action"
desc = "You can use your bonus action to take the dash, disengage, or hide action."

[[abilities]]
origin = "Finesse"
level = 2
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\nOne point to use in the Accomplishment section or to store for later purchase in the same section\n10 Potential"

[[abilities]]
origin = "Finesse"
level = 3
selection = "Primary"
name = "Roguish Archetype (Cutthroat)"
desc = "Slay: You gain two skill points with Academics: Poison and two skill points with Subterfuge. Any successful attack you make against a surprised creature is an automatic critical hit. In addition, you have advantage on attack rolls against creatures who have not taken a turn in combat yet."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Primary"
name = "Roguish Archetype (Divining Rogue)"
desc = "Wise Engagement: You may gain Sneak Attack against a target even if you don’t have advantage on the attack roll, as long as you do not have disadvantage. Spend a bonus action and target a creature that is not incapacitated. You gain this benefit for 10 rounds if the target fails a Persuasion (Man) versus your Empathy (Int) check. You can only target one creature with this ability at the same time. If a creature succeeds on the check they are immune until you finish a long rest."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Primary"
name = "Roguish Archetype (Fencer)"
desc = "Slippery Maneuvers: An opponent cannot make opportunity attacks against you for the rest of your turn if you make a successful attack against that opponent during your turn."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Primary"
name = "Roguish Archetype (Occult Prowler)"
desc = "Spectral Sleight of Hand: You learn to cast Mage Hand as Soul Mastery. When you cast Mage Hand this way it earns a number of additional benefits. Your Mage Hand is invisible and it can perform tasks unnoticed if you succeed on a Subterfuge (Dex/Cun) versus your target’s Perception (Com). In addition, you can use the bonus action granted by Cunning Action to control the hand.\nYou can perform the following additional tasks with it:\nYou can stow one object the hand is holding in a container worn or carried by another creature.\nYou can retrieve an object in a container worn or carried by another creature.\nYou can use Thieves' Tools to pick locks and disarm traps at range."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Primary"
name = "Roguish Archetype (Operator)"
desc = "Master of Strategy: You can use the help action as a bonus action and with a 6 m range as long as your target can see or hear you."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Primary"
name = "Roguish Archetype (Spy)"
desc = "Agile Mobility: As a reaction, you can move up to half your speed whenever an enemy ends their turn within 1 m of you. This movement doesn't provoke opportunity attacks."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Primary"
name = "Roguish Archetype (Thief)"
desc = "Fast Hands: You can use the bonus action given by your Cunning Action ability to make a Subterfuge (Dex/Cun) check, use your Thieves' Tools, or take the use an object action."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Secondary"
name = "Roguish Archetype (Divining Rogue)"
desc = "Discerning Eye: You can use a bonus action to make a Perception (Int) check to spot a hidden creature or object or to make an Investigation (Cun) check to uncover or decipher clues. In addition, whenever you make an Empathy (Com) check to determine whether a creature is lying, treat a roll of 7 or lower on the d20 as an 8."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Secondary"
name = "Roguish Archetype (Fencer)"
desc = "Dashing Courage: You learn another way to perform sneak attack. As long as you do not have disadvantage on the attack, you are within 1 m of the opponent and no other creature is within 1 m of you. All the other rules for Sneak Attack still apply to you. In addition, you gain a bonus to your initiative rolls equal to your Manipulation modifier."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Secondary"
name = "Roguish Archetype (Occult Prowler)"
desc = "Cantrips: You learn two cantrips of your choice as Soul Mastery. After ten level picks of [Finesse] you learn a level 1 spell of your choice as Soul Mastery."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Secondary"
name = "Roguish Archetype (Operator)"
desc = "Web Spinner: As long as you know the language, you can pass yourself off as a native speaker of a culture if you hear it spoken for at least 10 rounds. In addition, you gain two skill points in Subterfuge and one skill point in Academics (strategy)."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Secondary"
name = "Roguish Archetype (Spy)"
desc = "Crafty: You gain two skill points in the Academics (nature) and Survival skills. You may reach rank 5 in these skills."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Secondary"
name = "Roguish Archetype (Thief)"
desc = "Second-Story Work: You are immune to the first 2d6 damage you take by falling. Climbing no longer costs you extra movement. In addition, when you make a running jump, the distance you cover increases by a number of meters equal to half your Dexterity modifier (rounded up and minimum 1 m)."

[[abilities]]
origin = "Finesse"
level = 4
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Finesse"
level = 5
selection = "Primary"
name = "Expertise"
desc = "You gain two skill points in two skills of your choice, and you may gain rank 5 for both of the chosen skills."

[[abilities]]
origin = "Finesse"
level = 6
selection = "Primary"
name = "Uncanny Dodge"
desc = "When an attacker that you can see hits you with an attack, you can use your reaction to halve the attack's damage against you."

[[abilities]]
origin = "Finesse"
level = 7
selection = "Primary"
name = "Evasion"
desc = "When you are subjected to an effect that allows you to make a Dexterity saving throw to take only half damage, you instead take no damage if you succeed on the saving throw, and only half damage if you fail."

[[abilities]]
origin = "Finesse"
level = 8
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Finesse"
level = 9
selection = "Primary"
name = "Archetype (Cutthroat)"
desc = "Blend In: By spending seven days and 25 gp you can give yourself a new identity by establishing history, profession, and affiliations. You can't establish an identity that belongs to someone else. Other creatures believe you to be this identity until they are given an obvious reason not to."

[[abilities]]
origin = "Finesse"
level = 9
selection = "Primary"
name = "Archetype (Divining Rogue)"
desc = "Accurate Perception: As long as you do not move no more than half your speed on your turn, you gain advantage on any perception or investigation check you make."

[[abilities]]
origin = "Finesse"
level = 9
selection = "Primary"
name = "Archetype (Fencer)"
desc = "Swagger: Against a creature that can hear you and shares a language with you, you can spend an action to make a Persuasion (Man) contested by your target’s Empathy (Com). The effect of this ability lasts for 10 rounds if your check is successful and depends upon if the creature you targeted is hostile or not. s\nAgainst a hostile target, this ability causes that creature to have disadvantage on attack rolls against targets other than you and can't make opportunity attacks against targets other than you. This effect ends immediately if you or your companions attack the target or affects it with a spell, or until you and the target are more than 12 m apart.\nAgainst a target that is not hostile to you, the creature becomes charmed by you. While charmed, it regards you as a friendly acquaintance. This effect ends immediately if you or your companions do anything harmful to it."

[[abilities]]
origin = "Finesse"
level = 9
selection = "Primary"
name = "Archetype (Occult Prowler)"
desc = "Arcane Conniving: Until the end of your turn, creatures gain disadvantage against any saving throws from spells you cast if you are hidden from the creature."

[[abilities]]
origin = "Finesse"
level = 9
selection = "Primary"
name = "Archetype (Operator)"
desc = "Informed Schemer: If you interact or observe another creature outside of combat for at least a minute, you learn some of their capabilities. Choose two characteristics from below, your GM tells you if they are superior, inferior, or equal compared to you:\nIntelligence score\nComposure score\nPresence score\nAO levels (if any)\nAt the GM's option, you might also realize you know a piece of the creature's history or one of its personality traits, if it has any."

[[abilities]]
origin = "Finesse"
level = 9
selection = "Primary"
name = "Archetype (Spy)"
desc = "Greater Maneuverability: Your walking speed increases by 2 m. If you have a climbing or swimming speed, this increase applies to those speeds as well."

[[abilities]]
origin = "Finesse"
level = 9
selection = "Primary"
name = "Archetype (Thief)"
desc = "Supreme Sneak: You gain advantage on Stealth (Dex/Cun) checks if you move no more than half your speed on the same turn."

[[abilities]]
origin = "Finesse"
level = 10
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Finesse"
level = 11
selection = "Primary"
name = "Reliable Talent"
desc = "Whenever you make an ability check that lets you add your proficiency bonus, you can treat a d20 roll of 9 or lower as a 10."

[[abilities]]
origin = "Finesse"
level = 12
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Finesse"
level = 13
selection = "Primary"
name = "Roguish Archetype (Cutthroat)"
desc = "Changeling: If you spend three hours studying another creature's speech, writing, and behavior you can mimic these traits with impeccable accuracy. If a creature would become suspicious of you, you gain advantage on Deception (Man) checks you roll to avoid detection."

[[abilities]]
origin = "Finesse"
level = 13
selection = "Primary"
name = "Roguish Archetype (Divining Rogue)"
desc = "Faultless Attention: As long as you are not deafened or blinded, you know when an illusion effect is trying to deceive you. Within 6 m of you, spend an action and you can sense the presence of illusions, shapechangers not in their original form, or magical effects designed to fool the senses. You do not learn who, where or what is the cause of the effect, but you learn that something is amiss in your radius of awareness. You can use this ability a number of times equal to your Cunning modifier (minimum of 1), and you regain all expended uses of it when you finish a long rest."

[[abilities]]
origin = "Finesse"
level = 13
selection = "Primary"
name = "Roguish Archetype (Fencer)"
desc = "Fancy Stunt: As a bonus action, you grant yourself advantage on the next Athletics check you make this turn. Alternatively, you can grant yourself advantage on the first dexterity saving throw you make until the start of your next turn."

[[abilities]]
origin = "Finesse"
level = 13
selection = "Primary"
name = "Roguish Archetype (Occult Prowler)"
desc = "Gifted Prowler: You can choose one creature within 1 m of your Mage Hand cantrip as a bonus action. Against the chosen creature you gain advantage on attack rolls until the end of your turn."

[[abilities]]
origin = "Finesse"
level = 13
selection = "Primary"
name = "Roguish Archetype (Operator)"
desc = "Feint: If another creature is within 1 m of you and provides cover for you against an attack targeting you, you can use your reaction to have that attack target the creature covering you instead of hitting you."

[[abilities]]
origin = "Finesse"
level = 13
selection = "Primary"
name = "Roguish Archetype (Spy)"
desc = "Waylay Virtuoso: You gain advantage on initiative rolls. Until the end of your next turn, your allies receive advantage on their attack rolls against the first creature you hit on the first round of combat."

[[abilities]]
origin = "Finesse"
level = 13
selection = "Primary"
name = "Roguish Archetype (Thief)"
desc = "Use Magic Device: You ignore all ability origin, race, and level requirements on the use of magic items. In addition, you can cast Identify as Soul Mastery."

[[abilities]]
origin = "Finesse"
level = 14
selection = "Primary"
name = "Blindsense"
desc = "If you can hear, you are aware of the location of any hidden or invisible creatures within 2 m of you."

[[abilities]]
origin = "Finesse"
level = 15
selection = "Primary"
name = "Slippery mind"
desc = "You gain proficiency in one mental or social saving throw of your choice."

[[abilities]]
origin = "Finesse"
level = 16
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Finesse"
level = 17
selection = "Primary"
name = "Roguish Archetype (Cutthroat)"
desc = "Murderous Intent: Whenever you deal damage against a creature that is surprised, that creature must make a Vitality saving throw against 8+ your dexterity modifier + your proficiency bonus, or take double the damage from your attack."

[[abilities]]
origin = "Finesse"
level = 17
selection = "Primary"
name = "Roguish Archetype (Divining Rogue)"
desc = "Discover Flaw: Your Sneak Attack damage increases by 3d6 against a creature you have targeted with your Wise Engagement ability."

[[abilities]]
origin = "Finesse"
level = 17
selection = "Primary"
name = "Roguish Archetype (Fencer)"
desc = "Charming Mercenary: Once per short or long rest, you can reroll a missed attack with advantage."

[[abilities]]
origin = "Finesse"
level = 17
selection = "Primary"
name = "Roguish Archetype (Operator)"
desc = "Spirit of Manipulation: Your mind becomes as slippery as your soul. You gain a number of benefits:\nWhenever your mind is being read, you can present false thoughts if you succeed on a Deception (Man) contested by the mind readers Empathy (Com).\nYou can not be compelled to tell the truth by magic.\nYou become immune to charm effects."

[[abilities]]
origin = "Finesse"
level = 17
selection = "Primary"
name = "Roguish Archetype (Occult Prowler)"
desc = "Spell Thief: Once per long rest, you attempt to steal a spell. When a creature casts a spell that targets you or includes you in its area of effect you can spend your reaction and force that creature to make a saving throw using its spellcasting ability modifier against your spell save DC. On a failed save, you negate the spell’s effect against you. In addition, if the spell is of a level you can cast and is at least 1st level, you can cast that spell using your spell slots for the next 8 hours. During this duration, the creature you stole the spell from cannot cast it. You can use this ability once per long rest."

[[abilities]]
origin = "Finesse"
level = 17
selection = "Primary"
name = "Roguish Archetype (Spy)"
desc = "Out of Nowhere: If you take the attack action on your turn, you can make one additional attack as a bonus action. This attack can benefit from your Sneak Attack even if you have already used it this turn, but you can't use Sneak Attack against the same target more than once in a turn."

[[abilities]]
origin = "Finesse"
level = 17
selection = "Primary"
name = "Roguish Archetype (Thief)"
desc = "Thief's Reflexes: You can take two turns during the first round of any combat. You take your first turn at your normal initiative and your second turn at your initiative minus 10. You can't use this ability when you are surprised."

[[abilities]]
origin = "Finesse"
level = 18
selection = "Primary"
name = "Elusive"
desc = "No attack roll has advantage against you while you aren't incapacitated."

[[abilities]]
origin = "Finesse"
level = 19
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Finesse"
level = 20
selection = "Primary"
name = "Stroke of Luck"
desc = "If your attack misses a target within range, you can turn the miss into a hit. Alternatively, if you fail an ability check, you can treat the d20 roll as a 20. Once you use this ability, you can't use it again until you finish a short or long rest."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Primary"
name = "Arcane Tradition (Abjuration)"
desc = "Protective Ward: Once per long rest, you can tease out more power from the Souls you use when you cast abjuration spells. Whenever you cast an abjuration spell of 1st or higher you also create a protective Ward that soaks up damage for you. The Ward functions like this:\nIt has hit points equal to your Intelligence modifier plus the number of level picks you possess in [Occult Student].\nWhenever you take damage, your Ward takes the damage instead.\nIf the damage you take succeeds the hit points your Ward possesses, you take the remaining damage.\nWhen your Ward is reduced to 0 hit points it persists until you finish a long rest.\nThe ward regains hit points whenever you cast an abjuration spell of 1st level or higher equal to twice the level of the spell."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Primary"
name = "Arcane Tradition (Conjuration)"
desc = "Conjure Minor Item: As an action, you can conjure an inanimate object into your hand or unto the ground in an unoccupied space that you can see within 2 m of you. The object cannot be larger than 0.5 m or weigh more than 5 kg. You must have seen the object before to be able to conjure a copy. It is visibly magical and sheds dim light in a 1 m radius. The object immediately disappears if you attempt to deal damage with it, or it takes damage. The object persists for an hour or until you use this ability again."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Primary"
name = "Arcane Tradition (Divination)"
desc = "Premonition: Whenever you finish a long rest, you roll two d20 and save the numbers you rolled. At any point, until you finish a long rest, you can swap one of the numbers you rolled with any attack roll, saving throw, or ability check you make. You must swap out a number this way before the GM declares the check to be a success or a fail. You can only swap out a result this way once per turn and a saved number can only be used once."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Primary"
name = "Arcane Tradition (Enchantment)"
desc = "Mesmerize: You can hypnotize a creature within 1 m of you that you can see by spending an action. If the target can see you too, they must succeed on a Composure saving throw against your spell save DC or becomes incapacitated and have their speed be reduced to 0 until the end of your next turn. You can choose to maintain this effect by spending another action on your subsequent turn and continue hypnotizing your target until the end of your next turn. The target can make another saving throw every time you choose to maintain this effect. The hypnotized condition ends if you move more than 1 m away from the target, the target is forced to make another saving throw or it is dealt damage. The target becomes immune to this ability until you finish a long rest if they succeed on their saving throw against this effect."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Primary"
name = "Arcane Tradition (Evocation)"
desc = "Sculpt Spells: When you cast an evocation spell that affects other creatures that you can see, you can choose a number of them equal to 1 + the spell's level. The chosen creatures automatically succeed on their saving throws against the spell, and they take no damage if they would normally take half damage on a successful save."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Primary"
name = "Arcane Tradition (Illusion)"
desc = "Illusionist’s Stratagem: You learn the Minor Illusion cantrip as Soul Mastery. In addition, whenever you cast Minor Illusion you can both create a sound and an image with a single cast of the cantrip."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Primary"
name = "Arcane Tradition (Necromancy)"
desc = "Siphon Vitality: Once per turn, when you kill one or more creatures with a spell of 1st level or higher, you regain hit points equal to twice the spell's level, or three times its level if the spell belongs to the school of viscmancy. You don't gain this benefit when killing constructs or undead."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Primary"
name = "Arcane Tradition (Transmutation)"
desc = "Alchemical Secrets: You can cast a version of Fabricate once per short rest as Soul Mastery. This version of Fabricate can only create an object that is no larger than 0.5 m or weigh more than 5 kg. This use of Fabricate only lasts for 1 hour before it reverts to its original form."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Primary"
name = "Arcane Tradition (War Magic)"
desc = "Minor Shield: You can use your reaction to gain a +2 bonus to your AC against an attack that hits you, or alternatively gain a +4 bonus to a failed saving throw. If you decide to use either benefit from this ability, you cannot cast any spells other than cantrips until the end of your next turn."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Secondary"
name = "Arcane Tradition (War Magic)"
desc = "Quick Mind: You can give yourself a bonus to your initiative rolls equal to your Intelligence modifier."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Secondary"
name = "Spellbook"
desc = "A spellbook helps you to both learn spells and to concentrate on keeping your Souls when you cast them. You gain a +2 bonus to your Soul Checks when you cast a spell that is transcribed into a Spellbook that you hold in one or both of your hands.\nYou can copy spells transcribed, such as in a Spellbook or on a Spell Scroll, unto other Spell Scrolls or into other Spellbooks. The process takes 2 hours per level of the spell and consumes Soul Potency equal to the Soul Consumption cost of the level of the spell. You cannot copy a spell of a level higher than your own total level.\nWhenever you level up you can purchase spells known that you possess transcribed into Spellbooks and Spell Scrolls at a Potential discount. For level 1 spells the discount equals -5 Potential, whilst for level 2 and higher the discount is -10 Potential.\nIf you would pick this ability in character creation, you can begin your adventure with a Spellbook in your possession with spells transcribed in your Spellbook already. You may choose three level 1 spells, one level 1 and one level 2, or one spell at level 3. The discount in Potential to purchase these spells is in effect whenever you level up to level 2 and beyond for you. If you would take this ability during play, it's the GM’’s discretion to give you spellbook and what spells lie within."

[[abilities]]
origin = "Occult Student"
level = 2
selection = "Primary"
name = "Arcane Recovery"
desc = "Once per long rest, as an action, you can recover one spell slot. The spell must have a level that is equal to or less than half your [Occult Student] level (rounded up), the slot can’t be 8th level or higher."

[[abilities]]
origin = "Occult Student"
level = 2
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\nOne point to use in the Accomplishment section or to store for later purchase in the same section\n10 Potential"

[[abilities]]
origin = "Occult Student"
level = 3
selection = "Primary"
name = "General Upgrades"
desc = "Gain one of your choices:\nOne point to use in the Accomplishment section or to store for later purchase in the same section\n10 Potential"

[[abilities]]
origin = "Occult Student"
level = 3
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\nOne point to use in the Accomplishment section or to store for later purchase in the same section\n10 Potential"

[[abilities]]
origin = "Occult Student"
level = 4
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Occult Student"
level = 5
selection = "Primary"
name = "Improved Magical Upgrade"
desc = "Gain one of your choices:\nTwo points to use in the Accomplishment section or to store for later purchase in the same section\n20 Potential\n+1 to an ability score of your choice\nPick an additional feat from the feat list"

[[abilities]]
origin = "Occult Student"
level = 6
selection = "Primary"
name = "Arcane Tradition (Abjuration)"
desc = "Generous Ward: Whenever a creature within 6 m of you that you can see takes damage, you can use your reaction to cause your Protective Ward to absorb the damage dealt with to the creature. If your Ward would be reduced to 0 hit point this way, the creature you warded takes any remaining damage."

[[abilities]]
origin = "Occult Student"
level = 6
selection = "Primary"
name = "Arcane Tradition (Conjuration)"
desc = "Juxtapose: As an action, you can teleport up to 6 m to an unoccupied space that you can see. Alternatively, you can choose a space within range that is occupied by a Small or Medium creature that is willing. You both teleport by swapping places with each other. You can use this ability once per long rest, but if you cast a conjuration spell of 1st level or higher you regain one usage of it."

[[abilities]]
origin = "Occult Student"
level = 6
selection = "Primary"
name = "Arcane Tradition (Divination)"
desc = "Effortless Visions: When you cast a divination spell of 2nd level or higher using a spell slot, you regain one expended spell slot. The slot you regain must be of a level lower than the spell you cast and can't be higher than 5th level."

[[abilities]]
origin = "Occult Student"
level = 6
selection = "Primary"
name = "Arcane Tradition (Enchantment)"
desc = "Reverence: If you spend a reaction you can cause an attack that was targeting you to target another creature instead. The attacker must succeed on a Composure saving throw against your spell save DC, or it must attack another viable target. The attacker targets a creature that is closest to it but cannot attack itself or you. If several creatures are closest to the attacker, the attacker chooses which one to target. If there are no viable targets for the attack, the attack is wasted. You must choose to use this ability before knowing whether the attack hits or misses. On a successful save, the attacker becomes immune against this ability until you finish a long rest. Creatures that are immune to the charmed condition can not be affected but this ability."

[[abilities]]
origin = "Occult Student"
level = 6
selection = "Primary"
name = "Arcane Tradition (Evocation)"
desc = "Potent Cantrips: When a creature succeeds on saving throws against a cantrip you cast, the creature takes half the cantrip's damage (if any) but suffers no additional effect from the cantrip. In addition, damage you deal with cantrips with a spell attack gains a bonus equal to your proficiency bonus."

[[abilities]]
origin = "Occult Student"
level = 6
selection = "Primary"
name = "Arcane Tradition (Illusion)"
desc = "Dreamscape: When you cast an illusion spell that has a duration of 10 rounds or longer, you can use your action to change the nature of the form of that illusion (using the spell's normal parameters for the illusion), provided that you can see the illusion."

[[abilities]]
origin = "Occult Student"
level = 6
selection = "Primary"
name = "Arcane Tradition (Necromancy)"
desc = "Infuse Vessel: You learn to cast Animate Dead. In addition, you can cast Animate Dead once per short rest as Soul Mastery but you must still pay the Soul consumption. When you cast Animate Dead, you can target one additional corpse or a pile of bones, creating another zombie or skeleton, as appropriate. Whenever you create an undead using a necromancy spell, it has additional benefits:\nThe undead's hit point maximum is increased by an amount equal to your total level.\nThe undead adds your proficiency bonus to its weapon damage rolls."

[[abilities]]
origin = "Occult Student"
level = 6
selection = "Primary"
name = "Arcane Tradition (Transmutation)"
desc = "Alchemist’s Stone: You gain two skill points in Academics (alchemy). If you spend 8 hours practicing alchemy you can create an Alchemist's Stone. When you create the Stone, choose the benefit from the following options:\nDarkvision out to a range of 12 m."

[[abilities]]
origin = "Occult Student"
level = 6
selection = "Primary"
name = "Arcane Tradition (As long as the creature is not over)"
desc = "encumbered, their speed increases by 2 m.\nAdvantage with Vitality saving throws.\nResistance to acid, cold, fire, lightning, or thunder damage (your choice whenever you choose this benefit).\nYou can benefit from the Stone yourself or give it to another creature. Each time you cast a transmutation spell of 1st level or higher, you can change the effect of your Stone if the Stone is on your person. If you create a new Alchemist's Stone, the previous one ceases to function."

[[abilities]]
origin = "Occult Student"
level = 6
selection = "Primary"
name = "Arcane Tradition (War Magic)"
desc = "Overcharge: Whenever you successfully end a magical effect by casting Dispel Magic or prevent a spell from being cast with Counterspell, you absorb some fleeting Soul energy from the magical effects you terminate by gaining one use of Overcharge. In addition, whenever you complete a short rest, you gain one use of Overcharge. Once per turn, whenever you deal damage with a spell you cast you may spend one use of Overcharge to deal more damage. The bonus damage equals half your total level and is of one of the damage types the spell you cast deals (your choice). You can store a number of Overcharge uses equal to your Intelligence modifier (minimum of 1). When you complete a long rest, you lose all uses of Overcharge you have stored except for one."

[[abilities]]
origin = "Occult Student"
level = 7
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\nOne point to use in the Accomplishment section or to store for later purchase in the same section\n10 Potential"

[[abilities]]
origin = "Occult Student"

desc = "Power Infusion: The damage your flying sword familiar makes is considered magical. In addition, your flying familiar gains first level weapon enhancement, +1 to hit, and damage. After 11 level picks of [Soul Weapon] this bonus increases to +2, and after 16 level picks it increases to +3."

[[abilities]]

name = "College (Mummer)"
desc = "**Psychic Blades**\n\nWhen you hit a creature with a weapon attack, you\n\ncan expend one use of your Inspiration to deal an extra 2d6 psychic damage to\n\nthat target. You can do so only once per round on your turn.\n\n**Words of Dominance**\n\nOnce per short or long rest, you can attempt\n\nto enforce your will upon a humanoid by talking uninterrupted with the target\n\nfor 1 minute. When the conversation ends, the humanoid must succeed on a\n\nResolve saving throw (frighten) or a Composure saving throw (charm) against\n\nyour spell save DV or be frightened or charmed by you or another creature of\n\nyour choice. The target remains frightened or charmed until it is attacked or\n\ndamaged until it witnesses its allies being attacked or damaged or until an hour\n\npasses. The target has no hint that you tried to frighten or charm it if the target\n\nsucceeds the saving throw.\n\nIn addition, if you possess the Psychic Blades ability, the extra damage you deal\n\nincreases with 1d6 when you\u2019re total level 5."


level = 10
selection = "Primary"
name = "Purity of Body"
desc = "You become immune to disease and poison."

[[abilities]]
origin = "Discipline"
level = 11
selection = "Primary"
name = "Tradition (Embodiment of Enlightenment)"
desc = "Soul Bomb: As an action, you can create an orb and hurl it at a point you choose within 30 m, where it erupts into a sphere of radiant light. Each creature in a 4 m radius sphere must succeed on a Vitality saving throw or take 2d6 radiant damage. A creature doesn't need to make the save if the creature is behind total cover that is opaque.\nYou can increase the sphere's damage by spending Mastery points. Each point you spend, up to a maximum of 3, increases the damage by 2d6."

[[abilities]]
origin = "Discipline"
level = 11
selection = "Primary"
name = "Tradition (Embodiment of Inevitability)"
desc = "Vigor of the Soul: When you are reduced to 0 hit points, you can expend 1 Mastery point to have 1 hit point instead."

[[abilities]]
origin = "Discipline"
level = 11
selection = "Primary"
name = "Tradition (Embodiment of Serenity)"
desc = "Tranquility: At the end of a long rest, you gain the effect of a Sanctuary spell that lasts until the start of your next Long Rest (the spell can end early as normal)."

[[abilities]]
origin = "Discipline"
level = 11
selection = "Primary"
name = "Tradition (Embodiment of Solemnity)"
desc = "Soul Obscurity: When you are in an area of dim light or darkness, you can use your action to become invisible. You remain invisible until you make an attack, cast a spell, or are in an area of bright light."

[[abilities]]
origin = "Discipline"
level = 11
selection = "Primary"
name = "Tradition (Embodiment of Triumph)"
desc = "Greater Mastery Weapon: As a bonus action, you can expend up to 3 Mastery points to grant one Mastery Weapon you touch a bonus to attack and damage rolls equal to the number of Mastery points you spent. This bonus lasts for 10 rounds or until you use this ability again. This ability has no effect on a magic weapon that already has a bonus to attack and damage rolls."

[[abilities]]
origin = "Discipline"
level = 12
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Discipline"
level = 13
selection = "Primary"
name = "True Understanding"
desc = "You understand all spoken languages. Moreover, any creature that can understand a language can understand what you say."

[[abilities]]
origin = "Discipline"
level = 14
selection = "Primary"
name = "Incorruptible Purity"
desc = "You are proficient in all saving throws. Additionally, whenever you make a saving throw and fail, you can spend 1 Mastery point to reroll it, but you must use the new result."

[[abilities]]
origin = "Discipline"
level = 15
selection = "Primary"
name = "Supreme Spirit"
desc = "You suffer no penalties of old age and you cannot be aged magically, but you can still die of old age. In addition, you no longer need food or water."

[[abilities]]
origin = "Discipline"
level = 16
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Discipline"
level = 17
selection = "Primary"
name = "Tradition (Embodiment of Enlightenment)"
desc = "Shield of Brilliance: You shed bright light in a 6 m radius and dim light for an additional 6 m. You can extinguish or restore the light as a bonus action. If a creature hits you with a melee attack while this light shines, you can use your reaction to deal radiant damage to the creature. The radiant damage equals 5 + your Composure modifier."

[[abilities]]
origin = "Discipline"
level = 17
selection = "Primary"
name = "Tradition (Embodiment of Inevitability)"
desc = "Touch of Atrophy: As an action, you can touch a creature within 1 m of you and attempt to wither their body and soul with necrotic damage by spending Mastery points. The creature must make a Vitality saving throw. On a failed save, it takes necrotic damage equal to 2d10 per Mastery point spent. You can spend 1 to 10 Mastery points. On a successful save, the creature suffers half of the damage."

[[abilities]]
origin = "Discipline"
level = 17
selection = "Primary"
name = "Tradition (Embodiment of Serenity)"
desc = "Soul Infection: When you hit a creature with an unarmed strike, you can spend 3 Mastery points to leave this Soul power hidden in the creature’s body. The Soul power persists in the creature for a number of days equal to your [Discipline] level. As an action, you may explode the Soul power within the creature's body. When you use this action, the creature must make a Vitality saving throw. If it fails, it takes 10d10 necrotic damage. If it succeeds, it takes half damage.\nYou can have only one creature under the effect of this ability at a time. You can choose to release the Soul power harmlessly without using an action. To use this ability, you and the creature must be within the same Realm."

[[abilities]]
origin = "Discipline"
level = 17
selection = "Primary"
name = "Tradition (Embodiment of Solemnity)"
desc = "Patient Opportunist: Whenever a creature within 1 m of you is hit by an attack made by a creature other than you, you can use your reaction to make a melee attack against that creature."

[[abilities]]
origin = "Discipline"
level = 17
selection = "Primary"
name = "Tradition (Embodiment of Triumph)"
desc = "Superb Accuracy: Once per turn, you may reroll one missed attack made with a Mastery Weapon."

[[abilities]]
origin = "Discipline"
level = 18
selection = "Primary"
name = "Formless Spirit"
desc = "You can use your action to spend 4 Mastery points to become invisible for 10 rounds. During that time, you also have resistance to all damage but force damage."

[[abilities]]
origin = "Discipline"
level = 19
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Discipline"
level = 20
selection = "Primary"
name = "Nirvana"
desc = "When you roll for initiative and have no Mastery points remaining, you regain 4 Mastery points."

[[abilities]]
origin = "Divine Oath"
level = 1
selection = "Primary"
name = "Divine Sense"
desc = "As an action, for 10 rounds, you know the location of three creature types of your choice within 12 m of you that are not behind total cover. You know the type of any being whose presence you sense, but not its identity. Within the same radius, you also detect the presence of any place or object that has been consecrated or desecrated (been sanctified by either celestial forces or fiendish forces). You can use this ability a number of times equal to 1 + your Resolve modifier (minimum 1). When you finish a long rest, you regain all expended uses."

[[abilities]]
origin = "Divine Oath"
level = 1
selection = "Primary"
name = "Proclaim Judgement (Ire)"
desc = "Once per long rest, you may Proclaim Judgement as a bonus action. This ability is activated as long as you are in combat or until combat ends. You can only have one Judgement active at one time. When you Proclaim Judgement, choose one effect:\nYou will not let this slight against your Enneade go unpunished. You gain a +1 bonus on all damage rolls you make. Once per combat, when you score a critical hit, you may choose to double your static damage bonuses as well as your damage dice."

[[abilities]]
origin = "Divine Oath"
level = 1
selection = "Primary"
name = "Proclaim Judgement (Conviction)"
desc = "Once per long rest, you may Proclaim Judgement as a bonus action. This ability is activated as long as you are in combat or until combat ends. You can only have one Judgement active at one time. When you Proclaim Judgement, choose one effect:\nYour divine conviction nourishes your Soul. You heal 2 points of damage at the start of your turn as long as you have not fallen unconscious."

[[abilities]]
origin = "Divine Oath"
level = 1
selection = "Primary"
name = "Proclaim Judgement (Righteousness)"
desc = "Once per long rest, you may Proclaim Judgement as a bonus action. This ability is activated as long as you are in combat or until combat ends. You can only have one Judgement active at one time. When you Proclaim Judgement, choose one effect:\nYour blade is as sharp as your righteousness. You gain a +1 bonus on all attack rolls you make. In addition, you gain a critical hit range increase of 19-20."

[[abilities]]
origin = "Divine Oath"
level = 1
selection = "Primary"
name = "Proclaim Judgement (Serenity)"
desc = "Once per long rest, you may Proclaim Judgement as a bonus action. This ability is activated as long as you are in combat or until combat ends. You can only have one Judgement active at one time. When you Proclaim Judgement, choose one effect:\nYou remain serene and confident in your dedication. Your spell saves DC increases with +1."

[[abilities]]
origin = "Divine Oath"
level = 1
selection = "Primary"
name = "Proclaim Judgement (Indignation)"
desc = "Once per long rest, you may Proclaim Judgement as a bonus action. This ability is activated as long as you are in combat or until combat ends. You can only have one Judgement active at one time. When you Proclaim Judgement, choose one effect:\nYou will suffer no indignation. Your AC gains a +1 bonus."

[[abilities]]
origin = "Divine Oath"
level = 1
selection = "Primary"
name = "Proclaim Judgement (Contempt)"
desc = "Once per long rest, you may Proclaim Judgement as a bonus action. This ability is activated as long as you are in combat or until combat ends. You can only have one Judgement active at one time. When you Proclaim Judgement, choose one effect:\nHeretics fill you with nothing but contempt. You gain a +1 bonus on all saving throws you make. This bonus is doubled for any vitality saving throws you make."

[[abilities]]
origin = "Divine Oath"
level = 1
selection = "Primary"
name = "Proclaim Judgement (Defiance)"
desc = "Once per long rest, you may Proclaim Judgement as a bonus action. This ability is activated as long as you are in combat or until combat ends. You can only have one Judgement active at one time. When you Proclaim Judgement, choose one effect:\nLosing is not an option. You gain resistance against one elemental damage type (acid, cold, fire, lightning, or thunder). When you Proclaim this Judgement, choose one. You must possess at least 10 level picks of [Divine Oath] to choose this judgment.\nAt 4th level and every three level picks thereafter of [Divine Oath] you can use this ability one additional time per long rest."

[[abilities]]
origin = "Divine Oath"
level = 1
selection = "Secondary"
name = "Lay on Hands"
desc = "You have a pool of healing power that replenishes when you take a long rest. With that pool, you can restore a total number of hit points equal to your [Divine Oath] level x 5. As an action, you can touch a creature and draw power from the pool to restore a number of hit points to that creature, up to the maximum amount remaining in your pool.\nAlternatively, you can expend 5 hit points from your pool of healing to cure the target of one disease or neutralize one poison affecting it. You can cure multiple diseases and neutralize multiple poisons with a single use of Lay on Hands, expending hit points separately for each one.\nThis ability does not affect constructs."

[[abilities]]
origin = "Divine Oath"
level = 2
selection = "Primary"
name = "Divine Smite"
desc = "You gain the ability to purchase special spell slots with your Potential, Smite spell slots. You purchase them just like your normal spell slots with Potential, but you must use Potential you gain from Divine Oath to buy them. Smite spell slots must abide by the normal number of spell slot limitations but do so exclusively from normal spell slots. For example, you may have seven normal spell slots of level 1 and seven Smite spell slots of level 1 with Moderate Spellcasting at the same time. Smite spell slots do not require a Soul Mark, Soul Power nor a Soul Check when used. You regain all your spent Smite spell slots on a long rest.\nAfter you attack a creature with a melee weapon attack, you may expend a Smite spell slot to deal extra damage to that target, in addition to the weapon’s damage. The type of the damage equals one of your Enneade’s favorite damage types. When you gain this ability you choose which damage type your Smites will deal with for the rest of the game. The extra damage is 10 for a first level spell slot, plus 5 for each spell level higher than 1st, to a maximum of 25 extra damage. The damage increases by 5 if the target is a favored enemy of your Enneade, to a maximum of 30 damage. You cannot use Smite more than once per round.\n\nEnneade | Favorite Damage Type (Choose one) | Favored Enemy\n--- | --- | ---\nRiahn | Fire or radiant | Fiends and undead\nGera | Acid or poison | Constructs and undead\nTeranis | Lightning or necrotic | Celestials and fiends\nLapuana | Force or thunder | One creature type of your choice\nBorias | Bludgeoning or cold | Celestials and fey\nSuhlmis | Fire or slashing | Monstrosities and oozes\nVegomo | Piercing or psychic | Animals and beasts"


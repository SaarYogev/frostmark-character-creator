desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase\n\nin the same section\n\n- 10 Potential"

[[abilities]]
origin = "Devotion"
level = 4
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Devotion"
level = 5
selection = "Primary"
name = "Improved Magical Upgrade"
desc = "Gain one of your choices:\n\n- Two points to use in the Accomplishment section or to store for later\n\npurchase in the same section\n\n- 20 Potential\n\n- +1 to an ability score of your choice\n\n- Pick an additional feat from the feat list"

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Animation)"
desc = "**Great Animator**\n\nWhen you cast a spell of 1st level or higher that\n\nrestores health points to a creature other than you, you regain health points\n\nequal to 2 + the spell's level."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Ardor)"
desc = "**CD Escape Route**\n\nAs an action, you may become invisible until the end of\n\nyour next turn or until you attack or cast a spell."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Athanasia)"
desc = "**Negate Aggression**\n\nYou may turn a critical hit into a normal hit\n\ntargeting you or an ally within 6 m of you as a reaction. Any effects triggered by\n\nthe critical hit are canceled. You can use this ability a number of times equal to\n\nyour Resolve modifier (minimum 1). You regain all expended uses when you finish\n\na long rest."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Battle)"
desc = "**CD Benediction of Conflict**\n\nUsing your Channel Divinity, you may grant\n\na creature within 6 m of you a +10 bonus to their attack roll as a reaction. You\n\nmake this choice after you see the roll, but before the GM says whether the\n\nattack hits or misses."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Community)"
desc = "**Street Smart**\n\nWhile in an urban environment, you are considered\n\nto have two skill points in the Empathy and Perception skills (in addition to your\n\nexisting points). You cannot go beyond rank 5. With this ability, you may ignore\n\nthe level requirements for skill ranks. You may gain rank 5 in those skills."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Craft)"
desc = "**Devoted to the Forge**\n\nYou gain resistance to fire and you gain +1 AV when\n\nyou are wearing heavy armor."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Deceit)"
desc = "**Cloak of Shadows**\n\nAs an action, you may become invisible until the end\n\nof your next turn or until you attack or cast a spell."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Harmony)"
desc = "**Benediction of Conflict**\n\nUsing your Channel Divinity, you may grant\n\na creature within 6 m of you a +10 bonus to their attack roll as a reaction. You\n\nmake this choice after you see the roll, but before the GM says whether the\n\nattack hits or misses."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Law)"
desc = "**Epitome of Order**\n\nFor a number of times per long rest equal to your\n\nResolve modifier (minimum 1), you can change the casting time of one\n\nenchantment spell of at least 1st level or higher from an action to a bonus action."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Lore)"
desc = "**CD Pervade Mind**\n\nAs an action, you can attempt to read the surface\n\nthoughts of a creature within 12 m of you that you can see. The creature must roll\n\na Composure saving throw, on a failed save, you can read thoughts that are\n\nforemost in its mind for 10 rounds as long as the creature is within 12 m of you. As\n\nlong as you are reading its mind and within 12 m of the creature, you can spend\n\nan action to cast Suggestion on the creature as Soul Mastery. The target\n\nautomatically fails its saving throw against the spell. If the creature succeeds on\n\nthe saving throw, you cannot use this ability on the creature again until you finish\n\na long rest."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Might)"
desc = "**CD Benediction of Conflict**\n\nUsing your Channel Divinity, you may grant\n\na creature within 6 m of you a +10 bonus to their attack roll as a reaction. You\n\nmake this choice after you see the roll, but before the GM says whether the\n\nattack hits or misses."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Nature)"
desc = "**Align to Element**\n\nYou can give resistance to yourself or a creature\n\nwithin 12 m of you against one instance of acid, cold, fire, lightning, or thunder\n\ndamage you or the creature takes as a reaction."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Passion)"
desc = "**Fiery Burst**\n\nYou can push a Large or smaller creature 2 m away from\n\nyou when you deal lightning or fire damage to that creature."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Preservation)"
desc = "**Reciprocated Gift**\n\nWhen you cast a spell of 1st level or higher that\n\nrestores health points to a creature other than you, you regain health points\n\nequal to 2 + the spell's level."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Radiance)"
desc = "**Improved Flash**\n\nWhen a creature other than you within 6 m of you is\n\ntargeted with an attack, you may use your Distracting Flash ability to impose\n\ndisadvantage on the attack."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Ruin)"
desc = "**Ineludible Carnage**\n\nYou ignore resistance against necrotic with damage\n\ndealt by your spells and any Channel Divinity ability you possess."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Storm)"
desc = "**Electric Burst**\n\nYou can push a Large or smaller creature 2 m away from\n\nyou when you deal lightning damage to that creature."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Thaumaturgy)"
desc = "**Restoring Dismissal**\n\nYou may end the effects of a spell on an ally\n\nof your choice by casting a spell of 1st level or higher that restores health points\n\nto that ally. The level of the spell you end must be equal to or lower than the level\n\nof the spell slot you use to cast the healing spell."

[[abilities]]
origin = "Devotion"
level = 7
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase\n\nin the same section\n\n- 10 Potential"

[[abilities]]
origin = "Devotion"
level = 8
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Devotion"

selection = "Primary"
name = "Channel Divinity"
desc = "For a short moment, you can channel the divine essence of your God through yourself. Channel Divinity abilities, shortened as “CD”, share these rules;\nFor the duration, you can cast spells through your illusion, as if you were in the illusion’s space, but you must still abide by your own senses."

[[abilities]]
origin = "Devotion"

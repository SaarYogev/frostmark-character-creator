name = "Conclave (Giant Killer)"
desc = "When a Large or larger creature within 1 m of you hits or misses you with an attack, you can use your reaction to attack that creature immediately after its attack, provided that you can see the creature."

[[abilities]]
origin = "Predator"
level = 3
selection = "Primary"
name = "Conclave (Horde Breaker)"
desc = "Once on each of your turns when you make a weapon attack, you can make another attack with the same weapon against a different creature that is within 1 m of the original target and within range of your weapon."

[[abilities]]
origin = "Predator"
level = 3
selection = "Primary"
name = "Conclave (Ranger)"
desc = "Partner of the Wild: You gain a bonus to your initiative equal to your Cunning modifier. In addition, you learn how to bond an animal’s or beast’s Soul to yours, and through your bond strengthen their Soul. To bond with the partner you must perform an 8-hour Soul Consumption ritual with at least one Soul potency. This ritual is Soul Mastery but Soul potency must still be consumed. If you do not have a Soul Mark, the Soul can be consumed from a Soul Gem or directly from a recently dead corpse within 6 m of you during the full length of the ritual. At the end of the ritual, the partner you chose appears and befriends you. You can bond with any animal or beast that possesses a CR rating of ½ or below and is native to the area that you perform the ritual in.\nWhen a Partner of the Wild is bound to your Soul it obeys certain rules:\nYour partner obeys your commands to the best of its ability and shares your goals.\nYou determine your partner’s actions, personality, and behavior.\nIf you would be incapacitated or away from your partner, it acts on its own per the personality and behavior you gave it.\nYou roll initiative separately for your animal partner.\nThe benefits you receive from your Natural Explorer ability also applies to your partner.\nWhen you have bonded with a partner, its character sheet changes:\nIf your animal partner possesses multiattack actions, it loses it.\nIt uses your proficiency bonus rather than its own.\nIt adds your proficiency bonus to its AV, to its attack rolls, and the damage it deals from natural weapon attacks.\nIt gains two skill points in two skills of your choice.\nIt gains proficiency with all saving throws.\nYou calculate your partner’s new HP by rolling health dice equal to your total level. The size of its health dice is equal to the health dice size it already possesses. Whilst rolling for the new HP as you pick this ability up or for a level up, you abide by the same rules as when you roll your health dice.\nWhenever you pick an “Ability Score Improvement or Feat” ability, your partner may increase one of its ability scores with +2, or two ability scores can receive +1. Your partner cannot increase an ability score above 20 unless its description allows it to do so. In addition, it gains one skill point in a skill of your choice.\nDue to the nature of your bound Souls, your partner cannot die as long as you are alive. As long as you are not incapacitated you can call back your partner’s Soul from their Enneade, even if you possess no parts of their body. Through redoing the ritual and consuming a Soul of at least 1 Soul potency, your partner’s Soul gains a body and revives. This way, you can also change which animal or beast body your partner inhabits by abiding by the character sheet rules above."

[[abilities]]
origin = "Predator"
level = 3
selection = "Primary"
name = "Conclave (Realm Marshal)"
desc = "Champion of the Realm: Choose a creature within your weapon’s range or reach and spend a bonus action. The next time you successfully hit that creature with a weapon attack action on this turn, you deal more damage. The damage you make with your weapon attack becomes force damage and you deal an extra 1d8 force damage. When you have picked 11 levels of [Predator] the extra damage increases to 2d8 force damage."

[[abilities]]
origin = "Predator"
level = 3
selection = "Secondary"
name = "Primeval Awareness"
desc = "You gain the ability to sense your Favored Enemy through Soul Mastery. If you spend an uninterrupted minute as if you were concentrating on a spell, you can sense your Favored Enemy within a 10 km radius. You sense how many of your Favored Enemy is within the range, their general direction as well as distance (in km) from you. If you have several Favored Enemies your senses can differentiate between them and you learn about them separately with one use of Primeval Awareness.\nIn addition, you gain a form of primitive communication with animals and beasts. As an action, you may understand, or you may convey to an animal or beast:\nA simple request.\nEmotional state.\nCurrent intent.\nDesires (such as shelter, safety, or food).\nPhysical state (such as being hurt, or affected by magic).\nConversing with an animal or beast you attacked recently may not be receptive to you."

[[abilities]]

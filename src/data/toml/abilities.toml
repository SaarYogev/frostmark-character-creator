[[abilities]]
origin = "Tactics"
level = 20
selection = "Primary"
name = "Greater Extra Attack"
desc = "As part of your attack action, you can make four attacks instead of one. You must at\n\nleast possess 17 levels of [Tactics] to be eligible for this ability.\n\nExtra Ability Origin Content\n\nGrandmaster: Weapon Techniques [Tactics]\n\nSome of the Weapon Techniques require a saving throw. It equals 8 + proficiency bonus\n\n+ Brawn or Dexterity modifier (your choice).\n\nAccurate Strike\n\nYou can increase the accuracy of a weapon attack roll you make by spending a\n\nTechnique Die before or after you make an attack roll, but before the GM declares the\n\nattack to be a hit or a miss. Roll your Technique Die and add it to your attack roll.\n\nAssail of the Captain\n\nDuring your attack action on your turn, you may spend a Technique Die and a bonus\n\naction to let an ally that you can see and hear immediately make a weapon attack action\n\nas a reaction. The ally receives the result of your Technique Die to their attack\u2019s damage\n\ndie.\n\nBlock\n\nYou can reduce the damage of a melee attack that damages you by spending a\n\nTechnique Die and a reaction. The damage is reduced by your Dexterity modifier in\n\naddition to the result of your Technique Die.\n\nDizzying Bash\n\nYou can attempt to disarm your target by spending a Technique Die when you\n\nsuccessfully hit a creature with a weapon attack. The creature rolls a Brawn saving\n\nthrow and on a fail drops an object to its feet of your choice. You add your Technique\n\nDie to the damage you deal with your weapon attack.\n\nDrive Back\n\nYou can push a target back by spending a Technique Die when you successfully hit a\n\ncreature with a weapon attack. The creature rolls a Brawn saving throw and on a fail\n\ngets pushed back 3 m away from you. You add your Technique Die to the damage you\n\ndeal with your weapon attack.\n\nEluding Movement\n\nYou can add the result of one Technique Die to your AV when you spend movement this\n\nturn. When you stop moving you lose this benefit.\n\nEncourage\n\nYou can encourage an ally of your choice by spending a Technique Die and a bonus\n\naction. A creature of your choice that can see gains temporary health points equal to\n\nyour Presence modifier in addition to the result of your Technique Die.\n\nExtended Strike\n\nYou can increase the reach of one melee weapon attack you make on your turn by\n\nspending one Technique Die. You add your Technique Die to the damage you deal if you\n\nhit with your melee weapon attack.\n\nFalling Strike\n\nYou can knock a target prone by spending a Technique Die when you successfully hit a\n\ncreature with a weapon attack. If the creature is large or smaller, it rolls a Brawn saving\n\nthrow and on a fail the target is knocked prone. You add your Technique Die to the\n\ndamage you deal with your weapon attack.\n\nIntimidating Strike\n\nYou can frighten a creature by spending a Technique Die when you successfully hit a\n\ncreature with a weapon attack. The creature rolls a Resolve saving throw and on a fail\n\nbecomes frightened of you until the end of your next turn. You add your Technique Die\n\nto the damage you deal with your weapon attack.\n\nMisleading Attack\n\nYou can give an ally an opening for an attack by spending a Technique Die when you\n\nsuccessfully hit a creature with a weapon attack. Until the start of your next turn, the\n\nnext attack roll an ally makes has advantage. You add your Technique Die to the damage\n\nyou deal with your weapon attack.\n\nPlotting Strike\n\nYou can move one ally into a new position by spending a Technique Die when you\n\nsuccessfully hit a creature with a weapon attack. An ally of your choice that can see and\n\nhear you can use its reaction to immediately move up to half its speed without\n\nprovoking opportunity attacks from the target you hit with Plotting Strike. You add your\n\nTechnique Die to the damage you deal with your weapon attack.\n\nProvoking Strike\n\nYou can attempt to provoke a creature to attack you by spending a Technique Die when\n\nyou successfully hit a creature with a weapon attack. The creature rolls a Composure\n\nsaving throw and on a fail, until the end of your next turn, receives disadvantage on all of\n\nits attack rolls against targets other than you. You add your Technique Die to the\n\ndamage you deal with your weapon attack.\n\nRetort\n\nYou can immediately make a melee weapon attack against a creature that misses you\n\nwith a melee attack by spending a Technique Die and a reaction. You add your\n\nTechnique Die to the damage you deal if you hit with your melee weapon attack.\n\nRuse Strike\n\nYou may expend a Technique Die and a bonus action to receive advantage on the next\n\nweapon attack roll you make before the end of your turn. You add your Technique Die\n\nto the damage you deal if you hit with your weapon attack.\n\nSpellbow: Arcane Projectile [Tactics]\n\nArcane Projectile is a magical effect that represents each school of Soul Magic. The\n\nassortment of Arcane Projectile options is presented here in alphabetical order. If you\n\nhave not chosen an ability score for your spellcasting, choose one when you decide on\n\nyour Arcane Projectile options.\n\nProjectile of Charm\n\nYou infuse your projectile with Enchantment magic. Choose an ally within 6 m of the\n\ntarget hit by your projectile. The target must succeed on a Composure saving throw or\n\nbe charmed by your chosen ally. The condition lasts for 5 rounds. The target may roll\n\nthe saving throw again at the end of their turns to end the effect early. In addition to the\n\nnormal damage the Projectile of Charm deals, the target suffers an extra 2d6 psychic\n\ndamage.\n\nAfter you have picked 18 levels of [Tactics], the target suffers 4d6 psychic damage\n\ninstead, in addition to Projectile of Charm\u2019s effects.\n\nProjectile of Debilitation\n\nYou infuse your projectile in Necromantic magic. You force a creature hit by the\n\nprojectile to roll a Vitality saving throw. On a failure, the target\u2019s weapon attacks deal\n\nhalf damage. The condition lasts for 5 rounds. The target may roll the saving throw again\n\nat the end of their turns to end the effect early. In addition to the normal damage the\n\nProjectile of Debilitation deals, the target suffers an extra 2d6 necrotic damage.\n\nAfter you have picked 18 levels of [Tactics], the target suffers 4d6 necrotic damage\n\ninstead, in addition to Projectile of Debilitation\u2019s effects.\n\nProjectile of Exile\n\nYou infuse your projectile with Abjuration magic. You force a creature hit by the\n\nprojectile to roll a Presence saving throw. On a failure, you temporarily banish the\n\ncreature until the end of its next turn to their home Realm. They appear in a safe\n\nlocation where they are considered incapacitated and their speed is zero. The creature\n\nreappears again in its original spot if it is unoccupied. If not, the creature reappears in\n\nthe closest vacant spot.\n\nAfter you have picked 18 levels of [Tactics], the creature also suffers 2d6 force damage in\n\naddition to Projectile of Exilement\u2019s effects.\n\nProjectile of Explosion\n\nYou infuse your projectile with Evocation magic. After your projectile successfully hits\n\nits target, the target and all other creatures in a 2 m radius take 2d6 force damage each.\n\nAfter you have picked 18 levels of [Tactics], creatures suffer 4d6 force damage instead.\n\nProjectile of Hunting\n\nYou infuse your projectile with Divination magic. When you use this Arcane Projectile\n\noption you do not roll an attack roll. The projectile is flung towards a target that you saw\n\nless than a minute ago and is within your ranged weapon\u2019s range. It weaves and turns\n\naround corners if it has to, and ignores half and three-quarters cover. If the projectile\n\nreaches its target, the target makes a Dexterity saving throw. If the saving throw is a\n\nsuccess, you learn their current location and the target takes your normal ranged\n\nweapon attack damage plus an additional 1d6 force damage. If the saving throw is a\n\nsuccess you do not learn their location and they only suffer half damage.\n\nAfter you have picked 18 levels of [Tactics], the target suffers 2d6 force damage instead,\n\nin addition to Projectile of Hunting\u2019s effects.\n\nProjectile of the Phantasm\n\nYou infuse your projectile with Transmutation magic. When this projectile is fired it can\n\nmove through objects and cover, and it flies like a 1 m wide and 6 m long line. When you\n\nuse this Magical Discharge option you don\u2019t roll an attack roll for your attack action. Any\n\ncreature within the trajectory of the projectile must succeed on a Dexterity saving\n\nthrow or take the damage of the projectile plus additional 1d6 piercing damage. On a\n\nsuccess, the creatures in the trajectory take half damage.\n\nAfter you have picked 18 levels of [Tactics], the target suffers 2d6 piercing damage\n\ninstead, in addition to the Projectile of the Phantasm\u2019s effects.\n\nProjectile of Shade\n\nYou infuse your projectile with Illusion magic. If your projectile hits its target, the\n\nprojectile obscures their vision until the start of your next turn. Your target must make a\n\nsuccessful Resolve saving throw or take 2d6 psychic damage and not be able to see\n\nanything farther than 1 m away.\n\nAfter you have picked 18 levels of [Tactics], the target suffers 4d6 psychic damage\n\ninstead, in addition to Projectile of Hunting\u2019s effects.\n\nProjectile of Thorns\n\nYou infuse your projectiles with Conjuration magic. The creature hit with your projectile\n\nis wrapped in thorny and poisonous vines. This effect lasts for 10 rounds or until the\n\ntarget or any other creature within 1 m of your target attempts to remove them. A\n\nsuccessful Brawn: Athletics check against your spell DV ends the effect early.\n\nOn a hit, the target takes an extra 2d6 poison damage. As long as the vines are wrapped\n\naround the target its speed is reduced by 2 m and the first time on each of the target\u2019s\n\nturns when the target moves more than 1 m without teleporting, it takes an additional\n\n2d6 slashing damage.\n\nAfter you have picked 18 levels of [Tactics], the target suffers 4d6 poison and slashing\n\ndamage instead, in addition to Projectile of Thorns\u2019 effects."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Primary"
name = "Origin (Celestial)"
desc = "**Blessed**\n\nOnce per short or long rest, you can roll a 2d4 and add it to a\n\nfailed attack roll or saving throw, possibly exchanging failure for success."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Primary"
name = "Origin (Draconic)"
desc = "**Natural Armor**\n\nYour skin hardens and becomes more scale-like.\n\nWhen you aren't wearing armor, your AV equals 13 + your Dexterity modifier."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Primary"
name = "Origin (Flames)"
desc = "**Ablazed Soul**\n\nWhen you tap into your magical powers your very Soul\n\nbecomes ablaze. As soon as you cast a spell that is of level one or higher,\n\ncreatures of your choice within a 2 m radius centered on you take fire damage\n\nequal to half your [Unique Ancestry] level."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Primary"
name = "Origin (Penumbra)"
desc = "**Shadow\u2019s Resilience**\n\nIf combat damage would bring you down to 0\n\nhealth points you make an Int/Cun saving throw where the DV equals 5 plus the\n\ndamage taken. If the saving throw is successful you remain at 1 health point\n\ninstead. The saving throw is an automatic fail if the damage dealt was a critical hit\n\nor radiant damage. You may roll this saving throw again after you complete a\n\nlong rest."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Primary"
name = "Origin (Tempest)"
desc = "**Elevated Soul**\n\nWhen you tap into your magical powers your Soul\n\nunleashes the storm within. Before or after you cast a spell that is of level one or\n\nhigher, you gain 2 meters of flight by elemental gusts of wind. This movement\n\ndoes not provoke opportunity attacks."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Primary"
name = "Origin (Titan)"
desc = "**Dictate of Order**\n\nYou gain three spells known at levels 1 and 3 of [Unique\n\nAncestry]. The spells known you gain depends upon which true giant you possess\n\na heritage of. Choose one:\n\n  * Cloud Titan: At level one, you gain Fog Cloud and Minor Illusion, and at\n\nlevel 3 you gain Invisibility.\n\n  * Fire Titan: At level one, you gain Burning Hands and Fire Bolt, and at level\n\n3 you gain Flaming Sphere.\n\n  * Frost Titan: At level one, you gain Armor of Cold and Frostbite, and at\n\nlevel 3 you gain Hold Person.\n\n  * Hill Titan: At level one, you gain Heroism and Shillelagh, and at level 3 you\n\ngain Enlarge/Reduce.\n\n  * Stone Titan: At level one, you gain Entangle and Resistance, and at level 3\n\nyou gain Spike Growth.\n\n  * Storm Titan: At level one, you gain Shocking Grasp and Thunderwave, and\n\nat the third level you gain Gust of Wind."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Secondary"
name = "Origin (Draconic)"
desc = "**Draconic Ancestry**\n\nAny ability check you make involving Presence or\n\nManipulation when interacting with dragons is considered to possess at least\n\nfour skill points in the appropriate skill. You gain 2 skill points in Academics (the\n\ndraconic language). Additionally, you gain +1 to your health points now, and +1\n\nhealth points whenever you level up."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Secondary"
name = "Origin (Penumbra)"
desc = "**Vision of the Deep**\n\nYou learn the Darkness spell as Soul Mastery\n\nwhen you reach level 3 of [Unique Ancestry]. You may cast Darkness by spending\n\n2 sorcery points, if you do, you can see through the magical darkness you created\n\nwith the spell. In addition, you gain a darkvision with a range of 24 m."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Secondary"
name = "Origin (Tempest)"
desc = "**Tongue of the Primordials**\n\nAny ability check you make involving\n\nPresence or Manipulation when interacting with elementals are considered to\n\npossess at least four skill points in the appropriate skill. You gain 2 skill points in\n\nAcademics (the Primordial language). Additionally, you gain +1 to your health\n\npoints now, and +1 health points whenever you level up."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Secondary"
name = "Origin (Titan)"
desc = "**Giants\u2019 Endurance**\n\nAny ability check you make involving Presence or\n\nManipulation when interacting with giants are considered to possess at least four\n\nskill points in the appropriate skill. You gain 2 skill points in Academics (the giant\n\nlanguage). Additionally, you gain +1 to your health points for every level you\n\npossess, and +1 health points whenever you level up."

[[abilities]]
origin = "Unique Ancestry"
level = 2
selection = "Primary"
name = "Font of Magic"
desc = "You have 2 sorcery points, and you gain one additional point every time you pick a level\n\nof [Unique Ancestry], to a maximum of 20 sorcery points at level 20. You can use your\n\nsorcery points in three ways:\n\n- Spend Sorcery Points for Spell Slots: You can transform unexpended sorcery\n\npoints into one spell slot as a bonus action on your turn. The created spell slots\n\nvanish at the end of a long rest. A level 1 spell slot cost 2 sorcery points, and every\n\nlevel thereafter for the spell cost costs an additional 1 sorcery point. You can\n\ncreate spell slots no higher in level than 5th.\n\n- Spend Spell Slots for Sorcery Points: You can transform unused spell slots into\n\nsorcery points as a bonus action on your turn. The created sorcery points vanish\n\nat the end of a short rest. A level 1 spell slot creates 2 sorcery points, and every\n\nlevel thereafter generates an additional 1 sorcery point.\n\n- Metamagic or Abilities: You can spend sorcery points on abilities and metamagic\n\noptions.\n\nYou regain all spent sorcery points when you finish a long rest."

[[abilities]]
origin = "Unique Ancestry"
level = 2
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 10 Potential"

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Primary"
name = "Metamagic (Careful Spell)"
desc = "You gain two of the following Metamagic options of your choice. You can use only one \nMetamagic option on a spell when you cast it unless otherwise noted.\n\nWhen you cast a spell that forces other creatures to make a saving\n\nthrow, you can protect some of those creatures from the spell's full force. To do\n\nso, you spend 1 sorcery point and choose a number of those creatures up to your\n\nPresence modifier (minimum of one creature). A chosen creature automatically\n\nsucceeds on its saving throw against the spell."

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Primary"
name = "Metamagic (Distant Spell)"
desc = "You gain two of the following Metamagic options of your choice. You can use only one \nMetamagic option on a spell when you cast it unless otherwise noted.\n\nWhen you cast a spell that has a range of 1 m or greater, you can\n\nspend 1 sorcery point to double the range of the spell. When you cast a spell that\n\nhas a range of touch, you can spend 1 sorcery point to make the range of the spell\n\n6 m."

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Primary"
name = "Metamagic (Empowered Spell)"
desc = "You gain two of the following Metamagic options of your choice. You can use only one \nMetamagic option on a spell when you cast it unless otherwise noted.\n\nWhen you roll damage for a spell, you can spend 1 sorcery\n\npoint to reroll a number of the damage dice up to your Presence modifier\n\n(minimum of one). You must use the new rolls."

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Primary"
name = "Metamagic (You can use Empowered Spell ev)"
desc = "You gain two of the following Metamagic options of your choice. You can use only one \nMetamagic option on a spell when you cast it unless otherwise noted.\n\nYou can use Empowered Spell even if you have already used a different\nMetamagic option during the casting of the spell."

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Primary"
name = "Metamagic (Extended Spell)"
desc = "You gain two of the following Metamagic options of your choice. You can use only one \nMetamagic option on a spell when you cast it unless otherwise noted.\n\nWhen you cast a spell with a duration of 10 rounds or longer, you\n\ncan spend 1 sorcery point to double its duration, to a maximum duration of 24\n\nhours."

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Primary"
name = "Metamagic (Heightened Spell)"
desc = "You gain two of the following Metamagic options of your choice. You can use only one \nMetamagic option on a spell when you cast it unless otherwise noted.\n\nWhen you cast a spell that forces a creature to make a saving\n\nthrow to resist its effects, you can spend 3 sorcery points to give one target of\n\nthe spell disadvantage on its first saving throw made against the spell."

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Primary"
name = "Metamagic (Hunting Spell)"
desc = "You gain two of the following Metamagic options of your choice. You can use only one \nMetamagic option on a spell when you cast it unless otherwise noted.\n\nA spell you cast that requires a Dexterity saving throw or an\n\nattack roll ignores three-quarters and half cover by spending 1 sorcery point."

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Primary"
name = "Metamagic (Quickened Spell)"
desc = "You gain two of the following Metamagic options of your choice. You can use only one \nMetamagic option on a spell when you cast it unless otherwise noted.\n\nWhen you cast a spell that has a casting time of 1 action, you\n\ncan spend 2 sorcery points to change the casting time to 1 bonus action for this\n\ncasting."

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Primary"
name = "Metamagic (Primordial Spell)"
desc = "You gain two of the following Metamagic options of your choice. You can use only one \nMetamagic option on a spell when you cast it unless otherwise noted.\n\nYou may change the damage type of a spell by spending 1\n\nsorcery point. You may change the damage type of a spell that deals acid, cold,\n\nfire, lightning, or thunder to another damage type mentioned in this list."

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Primary"
name = "Metamagic (Subtle Spell)"
desc = "You gain two of the following Metamagic options of your choice. You can use only one \nMetamagic option on a spell when you cast it unless otherwise noted.\n\nWhen you cast a spell, you can spend 1 sorcery point to cast it\n\nwithout any somatic or verbal components."

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Primary"
name = "Metamagic (Twinned Spell)"
desc = "You gain two of the following Metamagic options of your choice. You can use only one \nMetamagic option on a spell when you cast it unless otherwise noted.\n\nWhen you cast a spell that targets only one creature and doesn't\n\nhave a range of self, you can spend a number of sorcery points equal to the spell's\n\nlevel to target a second creature in range with the same spell (1 sorcery point if\n\nthe spell is a cantrip).\n\nTo be eligible for Twinned Spell, a spell must be incapable of targeting more than\n\none creature at the spell's current level."

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 10 Potential"

[[abilities]]
origin = "Unique Ancestry"
level = 4
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Unique Ancestry"
level = 5
selection = "Primary"
name = "Improved Magical Upgrade"
desc = "Gain one of your choices:\n\n- Two points to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 20 Potential\n\n- +1 to an ability score of your choice\n\n- Pick an additional feat from the feat list"

[[abilities]]
origin = "Unique Ancestry"
level = 6
selection = "Primary"
name = "Origin (Celestial)"
desc = "**Potent Recovery**\n\nOnce per turn you may reroll dice from a spell that\n\nrestores health points that you or an ally cast within 1 m of you. If you aren\u2019t\n\nincapacitated, you may spend 1 sorcery upgrade to reroll any number of dice that\n\nrestore health points and you must keep the new result."

[[abilities]]
origin = "Unique Ancestry"
level = 6
selection = "Primary"
name = "Origin (Draconic)"
desc = "**Elemental Affinity**\n\nIf you have not already done so, choose one\n\nchromatic or metallic dragon as your ancestor. When you cast a spell that deals\n\ndamage of the type associated with your draconic ancestry, add your Presence\n\nmodifier to that damage (minimum 1). The damage bonus applies to one damage\n\nroll of a spell, not multiple rolls. At the same time, you can spend 1 sorcery point\n\nto gain resistance to that damage type for 1 hour."

[[abilities]]
origin = "Unique Ancestry"
level = 6
selection = "Primary"
name = "Origin (Flames)"
desc = "**Blood on Fire**\n\nSpells you cast ignore resistance to fire. Once per long\n\nrest you can dash action as a free action. In addition, once per short rest, you\n\nmay increase your movement speed by 3 m for one turn."

[[abilities]]
origin = "Unique Ancestry"
level = 6
selection = "Primary"
name = "Origin (Penumbra)"
desc = "**Dire Shade**\n\nIf you spend 3 sorcery points you can summon a\n\nspectral hound as a bonus action. The Dire Shade uses the dire wolf\u2019s statistics\n\nwith a few changes:\n\n  * Choose a target for the Dire Shade. The Dire Shade can only move directly\n\ntowards its target, attack, and perform opportunity attacks against its\n\ntarget.\n\n  * You can summon the Dire Shade up to 24 m away from you in an\n\nunoccupied space you can see. However, the Dire Shade cannot be\n\nsummoned within 6 m of the target.\n\n  * When the Dire Shade appears, roll initiative for it.\n\n  * It\u2019s health point total equals half your total level.\n\n  * The Dire Shade can move through objects as they were thick liquid. The\n\nDire Shade treats any square with a creature or an object as difficult\n\nterrain. However, if it would end its turn inside of an object or a creature,\n\nthe Dire Shade takes 5 force damage.\n\n  * The Dire Shade always knows it\u2019s target\u2019s location, regardless of any\n\ninvisibility, hidden conditions, etc.\n\n  * The Dire Shade\u2019s target has disadvantage against any spell you cast as long\n\nas the spectral hound is within 1 m of its target.\n\n  * The Dire Shade is a medium creature and counts as a beast.\n\n  * When the Dire Shade is brought down to 0 health points, its target is\n\nbrought down to 0 health points, or 5 minutes has passed, it disappears."

[[abilities]]
origin = "Unique Ancestry"
level = 6
selection = "Primary"
name = "Origin (Tempest)"
desc = "**Lightning Veins**\n\nWhen you tap into your tempestuous powers your\n\nSoul crackles with lightning. As soon as you cast a spell that deals lightning or\n\nthunder damage and is of level one or higher, creatures of your choice within a 2\n\nm radius centered on you take lightning or thunder damage (you may choose\n\nwhich damage type every time you use this ability) equal to half your [Unique\n\nAncestry] level. In addition, you are resistant to lightning and thunder damage."

[[abilities]]
origin = "Unique Ancestry"
level = 6
selection = "Primary"
name = "Origin (Titan)"
desc = "**Mark of Ouskira**\n\nDepending upon your Dictate of Order ability, you gain\n\na benefit whenever you cast one of the spells given by the ability.\n\n  * Cloud Titan: As a bonus action you can teleport up to 2 + your Vitality\n\nmodifier (minimum +1) m away to an unoccupied space you can see. This\n\nbenefit triggers immediately after you cast any of your Dictate of Order\n\nspells.\n\n  * Fire Titan: Your Dictate of Order spells gain a bonus to their damage\n\nequal to your Vitality modifier (minimum of +1).\n\n  * Frost Titan: You gain temporary health points equal to your Vitality\n\nmodifier (minimum 1). If the spell cast was Armor of Cold, you instead\n\nincrease its temporary health points equal to your Vitality modifier\n\n(minimum of +1). This benefit triggers immediately after you cast any of\n\nyour Dictate of Order spells.\n\n  * Hill Titan: Within 1 m of you, you can target up to two creatures you can\n\nsee and force them to make a Brawn saving throw against your spell save\n\nDV. If a creature fails this saving throw, willingly or not, they are pushed a\n\nnumber of m away from you equal to 1 + your Vitality modifier (minimum\n\n+1). This benefit triggers immediately after you cast any of your Dictate of\n\nOrder spells.\n\n  * Stone Titan: Until the end of your next turn, your AV receives a bonus\n\nequal to your Vitality modifier (minimum +1). This benefit triggers\n\nimmediately after you cast any of your Dictate of Order spells.\n\n  * Storm Titan: Choose up to three creatures you can see within 6 m of you,\n\nthey take lightning damage equal to your Vitality modifier (minimum 1).\n\nThis benefit triggers immediately after you cast any of your Dictate of\n\nOrder spells."

[[abilities]]
origin = "Unique Ancestry"
level = 7
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 10 Potential"


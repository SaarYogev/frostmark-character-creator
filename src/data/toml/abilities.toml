selection = "Primary"
name = "Sacred Oath (Alpha’s Dominance)"
desc = "Your oath allows you to channel divine energy to fuel magical effects. Each Channel Divinity option provided by your oath explains how to use it.\nWhen you use your Channel Divinity, you choose which option to use. You must then finish a short or long rest to use your Channel Divinity again. After 6 level picks of [Divine Oath] you can use it twice per day, and after 18 level picks of [Divine Oath] thrice.\nSome Channel Divinity effects require saving throws. When you use such an effect from this class, the DC equals your spell save DC.\nIn addition, you may expend a use of Channel Divinity as a bonus action to regain one expended spell slot of the first level.\n- Riahn: You gain the following two Channel Divinity options.\nYou can force any undead or constructs within 6 m of you to make a Resolve saving throw or become turned as an action. On a failed save, the creature is turned for 10 rounds or until it takes damage. A turned creature suffer a number of penalties:\nIt cannot take reactions.\nEvery turn the creature is turned it must move as far as possible away from you.\nIt cannot willingly move within 6 m of you.\nAny actions it takes must be dash actions to try and escape from you and the effect.\nIf it cannot move further away from you, it can only use the dodge action.\nIf the creature is using an illusion or a shapeshifting effect to conceal its true form, its true form is revealed as long as it is turned.\n- Teranis: You gain the following two Channel Divinity options."


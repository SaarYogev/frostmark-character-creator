desc = "Spell Parry: You gain the ability to also parry spells that require an attack roll and targets you, with your Parry ability. You oppose the spell attack roll with your melee attack roll. You may still use your Riposte ability in retaliation if the caster is within range."

[[abilities]]
origin = "Soul Weapon"

[[abilities]]
origin = "Artistry"
level = 14
selection = "Primary"
name = "College (Mummer)"
desc = "**Unknowing Blackmail**\n\nIf you possess the Psychic Blades ability, the\n\nextra damage you deal increases with 3d6.\n\nIn addition, once per long rest, you may attempt to unknowingly blackmail\n\nanother creature. Choose a creature within 6 m of you that can hear you and\n\nshare a language with you. As an action, you magically whisper a phrase that only\n\nyour target can hear after which the target must make a Composure saving\n\nthrow against your spell save DV. On a successful saving throw, your whisper\n\nsounds like unintelligible mumbling and has no effect. On a failed saving throw,\n\nthe target suffers a number of effects:\n\n  * The target believes you know a mortifying secret of theirs, and becomes\n\ncharmed by you for the next 8 hours, or until you or your allies attack it,\n\ndamage it, or force it to make a saving throw.\n\n  * You gain no knowledge of this secret, but the target is convinced you\n\nknow it.\n\n  * The charmed creature believes it is blackmailed by you and follows your\n\ncommands in fear that you will reveal their secret. It won\u2019t risk its life for\n\nyou unless it was already inclined to do so, but it treats you like a close\n\nfriend and may offer you favors and gifts.\n\n  * When the effect ends, the creature does not remember why they were\n\nafraid of you, but they remember everything else that happened during\n\nthe duration of this ability."


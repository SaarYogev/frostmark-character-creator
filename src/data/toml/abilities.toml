level = 9
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\nOne point to use in the Accomplishment section or to store for later purchase in the same section\n10 Potential"

[[abilities]]
origin = "Pact"
level = 10
selection = "Primary"
name = "Patron (Angelic)"
desc = "Radiant Fortitude: When you finish a short or long rest, you and up to ten allies are filled with celestial fortitude. You gain temporary hit points equal to your total level plus your Presence modifier. Your allies receive temporary hit points equal to half your level picks in [Pact] plus your Presence modifier."

[[abilities]]
origin = "Pact"
level = 10
selection = "Primary"
name = "Patron (Explorer)"
desc = "Resilient Voyager: You gain resistance to both fire and cold damage, and you no longer need to breathe."

[[abilities]]
origin = "Pact"
level = 10
selection = "Primary"
name = "Patron (Fey)"
desc = "Iron Will: When another creature attempts to charm you they must succeed a Composure saving throw against your spell save DC or be charmed by you instead of for 10 rounds or until the creature takes damage from an hostile action. In addition, you are immune to the charm condition."

[[abilities]]
origin = "Pact"
level = 10
selection = "Primary"
name = "Patron (Fiend)"
desc = "Fiendish Resilience: You can choose one damage type when you finish a short or long rest. You gain resistance to that damage type until you choose a different one with this ability. Damage from magical weapons or silver weapons ignores this resistance."

[[abilities]]
origin = "Pact"
level = 10
selection = "Primary"
name = "Patron (Lurker)"
desc = "Jinx Aegis: You can roll a d6 as a reaction. If the result is 4 or higher the creature afflicted by your Jinx ability that hits you with a successful attack roll misses their attack instead."

[[abilities]]
origin = "Pact"
level = 10
selection = "Primary"
name = "Patron (Psychic)"
desc = "Telepathic Wall: Whenever you are dealt psychic damage from another creature, that creature suffers as much psychic damage you do. Your thoughts cannot be read unless you allow it. In addition, you gain resistance against psychic damage."

[[abilities]]
origin = "Pact"
level = 10
selection = "Primary"
name = "Patron (Undead)"
desc = "Eternal Existence: Every ten years your body only ages 1 year and you are immune against magical age effects. You do not require food, water, or breathing. You still receive the benefits of a short or a long rest and you must rest to remove the exhaustion condition."

[[abilities]]
origin = "Pact"
level = 11
selection = "Primary"
name = "Absorb Innate Spellcasting (Choose one 6th)"
desc = "level spell that is not Soul Consumption. You can cast this spell as Soul Mastery once per long rest."

[[abilities]]
origin = "Pact"
level = 12
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Pact"
level = 13
selection = "Primary"
name = "Absorb Innate Spellcasting (Choose one 7th)"
desc = "level spell that is not Soul Consumption. You can cast this spell as Soul Mastery once per long rest."

[[abilities]]
origin = "Pact"
level = 14
selection = "Primary"
name = "Patron (Angelic)"
desc = "Blazing Dedication: Once per long rest, when you make a death saving throw you may instantly stabilize, gain hit points equal to your half your hit point maximum and stand up. All creatures of your choice within 6 m of you take radiant damage equal to your Presence damage plus 2d8 and are blinded until the end of your next turn."

[[abilities]]
origin = "Pact"
level = 14
selection = "Primary"
name = "Patron (Explorer)"
desc = "Isolated in the Expanse: Once per long rest, you may transport yourself and up to ten willing creatures into the Stellar Expanse by performing a 5-minute ritual. You can stay in the Stellar Expanse for the duration of a short rest. If a creature uses this time to take the rest action, they regain the full value of any spent hit dice and they gain advantage on one skill check, saving throw, or attack roll of their choosing. The advantage must be used within 4 hours after the rest is complete. You can apply the advantage after you have rolled the check but before the GM declares a success or a fail. When the duration is over, all creatures are returned to their original location."

[[abilities]]
origin = "Pact"
level = 14
selection = "Primary"
name = "Patron (Fey)"
desc = "Sinister Hallucinations: Once per short or long rest, you can target one creature within 12 m of you and cause them to hallucinate. The target hallucinates that they are in an empty, misty realm where they can only hear themselves and you, but not see anything else. The target suffers these effects for 10 rounds or until your concentration is broken (as if you were concentrating on a spell) if they fail a Resolve saving throw or a Composure saving throw (your choice) against your spell save DC."

[[abilities]]
origin = "Pact"
level = 14
selection = "Primary"
name = "Patron (Fiend)"
desc = "Hurl Through Hell: Once per short rest, when you hit a creature with an attack, you can use this ability to instantly make the target hallucinate about long gone realms once home to fiends. The creature disappears to the Stellar Expanse and in their mind falls through a nightmare landscape. At the end of your next turn, the target returns to the space it previously occupied or the nearest unoccupied space. If the target is not a fiend, it takes 10d10 psychic damage as it reels from its horrific experience."

[[abilities]]
origin = "Pact"
level = 14
selection = "Primary"
name = "Patron (Lurker)"
desc = "Jinx Savant: As long as you are not incapacitated, you can transfer your Jinx to another target within 6 m of you after your currently Jinxed target dies as a bonus action. You can transfer your Jinx like this three times per short rest."

[[abilities]]
origin = "Pact"
level = 14
selection = "Primary"
name = "Patron (Psychic)"
desc = "Instant Slave: You can charm an incapacitated humanoid by simply touching them and spending an action. You can communicate telepathically with the charmed creatures as long as the both of you are within the same Realm. The charm condition persists until you use this ability again or by a Remove Curse spell."

[[abilities]]
origin = "Pact"
level = 14
selection = "Primary"
name = "Patron (Undead)"
desc = "Everlasting Soul: If you regain hit points from any source you can reattach body parts. Once per short or long rest, you may spend a bonus action and regain hit points equal to 1d8 + your total level."

[[abilities]]

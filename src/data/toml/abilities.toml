desc = "Blessed: Once per short or long rest, you can roll a 2d4 and add it to a failed attack roll or saving throw, possibly exchanging failure for success."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Primary"
name = "Origin (Draconic)"
desc = "Natural Armor: Your skin hardens and becomes more scale-like. When you aren't wearing armor, your AC equals 13 + your Dexterity modifier."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Primary"
name = "Origin (Flames)"
desc = "Ablazed Soul: When you tap into your magical powers your very Soul becomes ablaze. As soon as you cast a spell that is of level one or higher, creatures of your choice within a 2 m radius centered on you take fire damage equal to half your [Unique Ancestry] level."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Primary"
name = "Origin (Penumbra)"
desc = "Shadow’s Resilience: If combat damage would bring you down to 0 hit points you make an Int/Cun saving throw where the DC equals 5 plus the damage taken. If the saving throw is successful you remain at 1 hit point instead. The saving throw is an automatic fail if the damage dealt was a critical hit or radiant damage. You may roll this saving throw again after you complete a long rest."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Primary"
name = "Origin (Tempest)"
desc = "Elevated Soul: When you tap into your magical powers your Soul unleashes the storm within. Before or after you cast a spell that is of level one or higher, you gain 2 meters of flight by elemental gusts of wind. This movement does not provoke opportunity attacks."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Primary"
name = "Origin (Titan)"
desc = "Dictate of Order: You gain three spells known at levels 1 and 3 of [Unique Ancestry]. The spells known you gain depends upon which true giant you possess a heritage of. Choose one:"

[[abilities]]

desc = "You can call out to your Enneade to ask for aid. Describe the assistance you seek, and roll percentile dice. If you roll a number equal to or lower than your level in [Devotion], your Enneade offers aid. The GM chooses the nature of the aid. If your deity offers aid, you can't use this ability again for 7 days. Otherwise, you can use it again after you finish a long rest.If you’ve failed six attempts of Aid of the Gods, you treat your level as double for the seventh attempt. It resets after this attempt if you succeed or fail, after which another six failed attempts the chance increases once more."


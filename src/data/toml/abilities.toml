level = 15
selection = "Primary"
name = "Sacred Oath (Vegomo)"
desc = "Guilty Conscience: As long as you are not incapacitated, whenever a creature hits you with an attack, that creature takes psychic damage equal to your Presence modifier (minimum of 1)."

[[abilities]]

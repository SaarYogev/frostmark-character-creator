desc = "Retaliation: As a reaction, you may make one melee weapon against a creature that is within 1 of you and damages you."

[[abilities]]
origin = "Power"
level = 14
selection = "Primary"
name = "Primal Path (Fanatic)"
desc = "Endless Anger: If you are brought down to 0 hit points or less but not killed outright when you are raging, you do not fall unconscious. You still suffer damage as normal and make death saving throws as normal. If you die from your death saving throws you can still keep on fighting until your rage ends or 10 rounds has passed, whichever is faster."

[[abilities]]

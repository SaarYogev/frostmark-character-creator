[[abilities]]
origin = "Soul Weapon"
level = 20
selection = "Primary"
name = "Prerequisite: 5 level picks in (Enchant)"
desc = "Once per long rest, if you have a weapon in your hand, you may sacrifice 1d4 AV as a reaction to give that AV to an ally when they are targeted by an attack. They receive the AV you lost to protect themselves against the attack, and your AV recovers to normal at the start of your next turn.\nHeartseeker"

[[abilities]]

desc = "Synchronized Strike: As long as your partner can see you, it can use its reaction to make a natural weapon attack against any creature within its range when you use an attack action on your turn. If you decide to spend your partner’s reaction this way, they receive a bonus to hit equal to your Cunning modifier."

[[abilities]]

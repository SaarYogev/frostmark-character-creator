[[abilities]]
origin = "Soul Weapon"
level = 10
selection = "Primary"
name = "Action Surge"
desc = "On your turn, you can take one additional action on top of your regular action and a\n\npossible bonus action. Once you use this ability, you must finish a short or long rest\n\nbefore you can use it again."

[[abilities]]
origin = "Soul Weapon"
level = 11
selection = "Primary"
name = "Soul Weapon Archetype (Cabalist)"
desc = "**Thought Cutter**\n\nAgainst creatures that are either charmed by you or\n\naffected by at least one of your enchantment or illusion spells that targets only\n\none creature and requires a saving throw, you gain a number of benefits:\n\n  * Your critical hit range increases 19-20 against the creature.\n\n  * You gain advantage on your first attack roll against the creature on each\n\nof your turns."

[[abilities]]
origin = "Soul Weapon"
level = 11
selection = "Primary"
name = "Soul Weapon Archetype (Rival)"
desc = "**Spell Parry**\n\nYou gain the ability to also parry spells that require an attack\n\nroll and targets you with your Parry ability. You oppose the spell attack roll with\n\nyour melee attack roll. You may still use your Riposte ability in retaliation if the\n\ncaster is within your range."

[[abilities]]
origin = "Soul Weapon"
level = 11
selection = "Primary"
name = "Soul Weapon Archetype (Sage)"
desc = "**Enlightenment**\n\nWhenever you use the Martial Arcanist ability to cast a\n\nmelee or ranged attack spell that is of 1st level or higher as a bonus action, you\n\nmay immediately cast a cantrip that requires a melee spell attack as part of the\n\nsame bonus action. The cantrip suffers the same penalties to hit as your normal\n\nspell attack when using the Martial Arcanist ability."

[[abilities]]
origin = "Soul Weapon"
level = 11
selection = "Primary"
name = "Soul Weapon Archetype (Soul Blade)"
desc = "**Alacrity Infusion**\n\nWhile your flying weapon familiar is within 2m of\n\nyou, your flying weapon can attack one additional time per turn."

[[abilities]]
origin = "Soul Weapon"
level = 11
selection = "Primary"
name = "Soul Weapon Archetype (Vanguard)"
desc = "**Arcane Reflection**\n\nAs a reaction, you may attempt to reflect a spell\n\nthat would hit you back at its caster. To reflect a spell this way, the spell must\n\nrequire a melee or ranged spell attack roll, it must target only you and you must\n\nwield a shield. Roll an opposed melee spell attack. If you roll higher than the\n\nincoming spell attack roll, you reflect the spell back at the caster and the spell\n\ndeals damage to the caster instead of you. You can use this ability a number of\n\ntimes equal to half your proficiency modifier (rounded up) per long rest and you\n\ncan only reflect spells that are less than, or equal to \u00bc of your total level (rounded\n\nup) this way."

[[abilities]]
origin = "Soul Weapon"
level = 12
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice."


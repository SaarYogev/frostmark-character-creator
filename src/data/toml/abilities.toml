selection = "Primary"
name = "Soul Gift"
desc = "You unlock one minor magical power in your Soul. Choose one Soul Gifts from the Soul\n\nGift list. See below."

[[abilities]]
origin = "Soul Weapon"
level = 14
selection = "Primary"
name = "Greater Martial Arcanist"
desc = "Your insight into the mysteries of the occult and the martial broadens. When you use\n\nyour Martial Arcanist ability your unarmed or weapon attacks and spell attack receive a\n\npenalty to hit equal to -1, instead of -2. The extra penalty from using Extra Attacks is still\n\nin effect."


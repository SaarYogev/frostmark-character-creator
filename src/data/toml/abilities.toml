level = 1
selection = "Primary"
name = "Origin (Cloud Titan)"
desc = "At level one, you gain Fog Cloud and Minor Illusion, and at level 3 you gain Invisibility."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Primary"
name = "Origin (Fire Titan)"
desc = "At level one, you gain Burning Hands and Fire Bolt, and at level 3 you gain Flaming Sphere."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Primary"
name = "Origin (Frost Titan)"
desc = "At level one, you gain Armor of Cold and Frostbite, and at level 3 you gain Hold Person."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Primary"
name = "Origin (Hill Titan)"
desc = "At level one, you gain Heroism and Shillelagh, and at level 3 you gain Enlarge/Reduce."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Primary"
name = "Origin (Stone Titan)"
desc = "At level one, you gain Entangle and Resistance, and at level 3 you gain Spike Growth."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Primary"
name = "Origin (Storm Titan)"
desc = "At level one, you gain Shocking Grasp and Thunderwave, and at the third level you gain Gust of Wind."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Secondary"
name = "Origin (Draconic)"
desc = "Draconic Ancestry: Any ability check you make involving Presence or Manipulation when interacting with dragons is considered to possess at least four skill points in the appropriate skill. You gain 2 skill points in Academics (the draconic language). Additionally, you gain +1 to your hit points now, and +1 hit points whenever you level up."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Secondary"
name = "Origin (Penumbra)"
desc = "Vision of the Deep: You learn the Darkness spell as Soul Mastery when you reach level 3 of [Unique Ancestry]. You may cast Darkness by spending 2 sorcery points, if you do, you can see through the magical darkness you created with the spell. In addition, you gain a darkvision with a range of 24 m."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Secondary"
name = "Origin (Tempest)"
desc = "Tongue of the Primordials: Any ability check you make involving Presence or Manipulation when interacting with elementals are considered to possess at least four skill points in the appropriate skill. You gain 2 skill points in Academics (the Primordial language). Additionally, you gain +1 to your hit points now, and +1 hit points whenever you level up."

[[abilities]]
origin = "Unique Ancestry"
level = 1
selection = "Secondary"
name = "Origin (Titan)"
desc = "Giants’ Endurance: Any ability check you make involving Presence or Manipulation when interacting with giants are considered to possess at least four skill points in the appropriate skill. You gain 2 skill points in Academics (the giant language). Additionally, you gain +1 to your hit points for every level you possess, and +1 hit points whenever you level up."

[[abilities]]
origin = "Unique Ancestry"
level = 2
selection = "Primary"
name = "Font of Magic (Spend Sorcery Points for Spell Slots)"
desc = "You have 2 sorcery points, and you gain one additional point every time you pick a level of [Unique Ancestry], to a maximum of 20 sorcery points at level 20. You can use your sorcery points in three ways:\nYou can transform unexpended sorcery points into one spell slot as a bonus action on your turn. The created spell slots vanish at the end of a long rest. A level 1 spell slot cost 2 sorcery points, and every level thereafter for the spell cost costs an additional 1 sorcery point. You can create spell slots no higher in level than 5th."

[[abilities]]
origin = "Unique Ancestry"
level = 2
selection = "Primary"
name = "Font of Magic (Spend Spell Slots for Sorcery Points)"
desc = "You have 2 sorcery points, and you gain one additional point every time you pick a level of [Unique Ancestry], to a maximum of 20 sorcery points at level 20. You can use your sorcery points in three ways:\nYou can transform unused spell slots into sorcery points as a bonus action on your turn. The created sorcery points vanish at the end of a long rest. A level 1 spell slot creates 2 sorcery points, and every level thereafter generates an additional 1 sorcery point."

[[abilities]]
origin = "Unique Ancestry"
level = 2
selection = "Primary"
name = "Font of Magic (Metamagic or Abilities)"
desc = "You have 2 sorcery points, and you gain one additional point every time you pick a level of [Unique Ancestry], to a maximum of 20 sorcery points at level 20. You can use your sorcery points in three ways:\nYou can spend sorcery points on abilities and metamagic options.\nYou regain all spent sorcery points when you finish a long rest."

[[abilities]]
origin = "Unique Ancestry"
level = 2
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\nOne point to use in the Accomplishment section or to store for later purchase in the same section\n10 Potential"

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Primary"
name = "Metamagic (Careful Spell)"
desc = "You gain two of the following Metamagic options of your choice. You can use only one Metamagic option on a spell when you cast it unless otherwise noted.\nWhen you cast a spell that forces other creatures to make a saving throw, you can protect some of those creatures from the spell's full force. To do so, you spend 1 sorcery point and choose a number of those creatures up to your Presence modifier (minimum of one creature). A chosen creature automatically succeeds on its saving throw against the spell."

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Primary"
name = "Metamagic (Distant Spell)"
desc = "You gain two of the following Metamagic options of your choice. You can use only one Metamagic option on a spell when you cast it unless otherwise noted.\nWhen you cast a spell that has a range of 1 m or greater, you can spend 1 sorcery point to double the range of the spell. When you cast a spell that has a range of touch, you can spend 1 sorcery point to make the range of the spell 6 m."

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Primary"
name = "Metamagic (Empowered Spell)"
desc = "You gain two of the following Metamagic options of your choice. You can use only one Metamagic option on a spell when you cast it unless otherwise noted.\nWhen you roll damage for a spell, you can spend 1 sorcery point to reroll a number of the damage dice up to your Presence modifier (minimum of one). You must use the new rolls.\nYou can use Empowered Spell even if you have already used a different Metamagic option during the casting of the spell."

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Primary"
name = "Metamagic (Extended Spell)"
desc = "You gain two of the following Metamagic options of your choice. You can use only one Metamagic option on a spell when you cast it unless otherwise noted.\nWhen you cast a spell with a duration of 10 rounds or longer, you can spend 1 sorcery point to double its duration, to a maximum duration of 24 hours."

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Primary"
name = "Metamagic (Heightened Spell)"
desc = "You gain two of the following Metamagic options of your choice. You can use only one Metamagic option on a spell when you cast it unless otherwise noted.\nWhen you cast a spell that forces a creature to make a saving throw to resist its effects, you can spend 3 sorcery points to give one target of the spell disadvantage on its first saving throw made against the spell."

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Primary"
name = "Metamagic (Hunting Spell)"
desc = "You gain two of the following Metamagic options of your choice. You can use only one Metamagic option on a spell when you cast it unless otherwise noted.\nA spell you cast that requires a Dexterity saving throw or an attack roll ignores three-quarters and half cover by spending 1 sorcery point."

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Primary"
name = "Metamagic (Quickened Spell)"
desc = "You gain two of the following Metamagic options of your choice. You can use only one Metamagic option on a spell when you cast it unless otherwise noted.\nWhen you cast a spell that has a casting time of 1 action, you can spend 2 sorcery points to change the casting time to 1 bonus action for this casting."

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Primary"
name = "Metamagic (Primordial Spell)"
desc = "You gain two of the following Metamagic options of your choice. You can use only one Metamagic option on a spell when you cast it unless otherwise noted.\nYou may change the damage type of a spell by spending 1 sorcery point. You may change the damage type of a spell that deals acid, cold, fire, lightning, or thunder to another damage type mentioned in this list."

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Primary"
name = "Metamagic (Subtle Spell)"
desc = "You gain two of the following Metamagic options of your choice. You can use only one Metamagic option on a spell when you cast it unless otherwise noted.\nWhen you cast a spell, you can spend 1 sorcery point to cast it without any somatic or verbal components."

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Primary"
name = "Metamagic (Twinned Spell)"
desc = "You gain two of the following Metamagic options of your choice. You can use only one Metamagic option on a spell when you cast it unless otherwise noted.\nWhen you cast a spell that targets only one creature and doesn't have a range of self, you can spend a number of sorcery points equal to the spell's level to target a second creature in range with the same spell (1 sorcery point if the spell is a cantrip).\nTo be eligible for Twinned Spell, a spell must be incapable of targeting more than one creature at the spell's current level."

[[abilities]]
origin = "Unique Ancestry"
level = 3
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\nOne point to use in the Accomplishment section or to store for later purchase in the same section\n10 Potential"

[[abilities]]
origin = "Unique Ancestry"
level = 4
selection = "Primary"
name = "Ability Score improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Unique Ancestry"
level = 5
selection = "Primary"
name = "Improved Magical Upgrade"
desc = "Gain one of your choices:\nTwo points to use in the Accomplishment section or to store for later purchase in the same section\n20 Potential\n+1 to an ability score of your choice\nPick an additional feat from the feat list"

[[abilities]]
origin = "Unique Ancestry"
level = 6
selection = "Primary"
name = "Origin (Celestial)"
desc = "Potent Recovery: Once per turn you may reroll dice from a spell that restores hit points that you or an ally cast within 1 m of you. If you aren’t incapacitated, you may spend 1 sorcery upgrade to reroll any number of dice that restore hit points and you must keep the new result."

[[abilities]]
origin = "Unique Ancestry"
level = 6
selection = "Primary"
name = "Origin (Draconic)"
desc = "Elemental Affinity: If you have not already done so, choose one chromatic or metallic dragon as your ancestor. When you cast a spell that deals damage of the type associated with your draconic ancestry, add your Presence modifier to that damage (minimum 1). The damage bonus applies to one damage roll of a spell, not multiple rolls. At the same time, you can spend 1 sorcery point to gain resistance to that damage type for 1 hour."

[[abilities]]
origin = "Unique Ancestry"
level = 6
selection = "Primary"
name = "Origin (Flames)"
desc = "Blood on Fire: Spells you cast ignore resistance to fire. Once per long rest you can do the dash action as a free action. In addition, once per short rest, you may increase your movement speed by 3 m for one turn."

[[abilities]]
origin = "Unique Ancestry"
level = 6
selection = "Primary"
name = "Origin (Penumbra)"
desc = "Dire Shade: If you spend 3 sorcery points you can summon a spectral hound as a bonus action. The Dire Shade uses the dire wolf’s statistics with a few changes:\nChoose a target for the Dire Shade. The Dire Shade can only move directly towards its target, attack, and perform opportunity attacks against its target.\nYou can summon the Dire Shade up to 24 m away from you in an unoccupied space you can see. However, the Dire Shade cannot be summoned within 6 m of the target.\nWhen the Dire Shade appears, roll initiative for it.\nIt’s hit point total equals half your total level.\nThe Dire Shade can move through objects as they were thick liquid. The Dire Shade treats any square with a creature or an object as difficult terrain. However, if it would end its turn inside of an object or a creature, the Dire Shade takes 5 force damage.\nThe Dire Shade always knows it’s target’s location, regardless of any invisibility, hidden conditions, etc.\nThe Dire Shade’s target has disadvantage against any spell you cast as long as the spectral hound is within 1 m of its target.\nThe Dire Shade is a medium creature and counts as a beast.\nWhen the Dire Shade is brought down to 0 hit points, its target is brought down to 0 hit points, or 5 minutes has passed, it disappears."

[[abilities]]
origin = "Unique Ancestry"
level = 6
selection = "Primary"
name = "Origin (Tempest)"
desc = "Lightning Veins: When you tap into your tempestuous powers your Soul crackles with lightning. As soon as you cast a spell that deals lightning or thunder damage and is of level one or higher, creatures of your choice within a 2 m radius centered on you take lightning or thunder damage (you may choose which damage type every time you use this ability) equal to half your [Unique Ancestry] level. In addition, you are resistant to lightning and thunder damage."

[[abilities]]
origin = "Unique Ancestry"
level = 6
selection = "Primary"
name = "Origin (Titan)"
desc = "Mark of Ouskira: Depending upon your Dictate of Order ability, you gain a benefit whenever you cast one of the spells given by the ability."

[[abilities]]
origin = "Unique Ancestry"
level = 6
selection = "Primary"
name = "Origin (Cloud Titan)"
desc = "As a bonus action you can teleport up to 2 + your Vitality modifier (minimum +1) m away to an unoccupied space you can see. This benefit triggers immediately after you cast any of your Dictate of Order spells."

[[abilities]]
origin = "Unique Ancestry"
level = 6
selection = "Primary"
name = "Origin (Fire Titan)"
desc = "Your Dictate of Order spells gain a bonus to their damage equal to your Vitality modifier (minimum of +1)."

[[abilities]]
origin = "Unique Ancestry"
level = 6
selection = "Primary"
name = "Origin (Frost Titan)"
desc = "You gain temporary hit points equal to your Vitality modifier (minimum 1). If the spell cast was Armor of Cold, you instead increase its temporary hit points equal to your Vitality modifier (minimum of +1). This benefit triggers immediately after you cast any of your Dictate of Order spells."

[[abilities]]
origin = "Unique Ancestry"
level = 6
selection = "Primary"
name = "Origin (Hill Titan)"
desc = "Within 1 m of you, you can target up to two creatures you can see and force them to make a Brawn saving throw against your spell save DC. If a creature fails this saving throw, willingly or not, they are pushed a number of m away from you equal to 1 + your Vitality modifier (minimum +1). This benefit triggers immediately after you cast any of your Dictate of Order spells."

[[abilities]]
origin = "Unique Ancestry"
level = 6
selection = "Primary"
name = "Origin (Stone Titan)"
desc = "Until the end of your next turn, your AC receives a bonus equal to your Vitality modifier (minimum +1). This benefit triggers immediately after you cast any of your Dictate of Order spells."

[[abilities]]
origin = "Unique Ancestry"
level = 6
selection = "Primary"
name = "Origin (Storm Titan)"
desc = "Choose up to three creatures you can see within 6 m of you, they take lightning damage equal to your Vitality modifier (minimum 1). This benefit triggers immediately after you cast any of your Dictate of Order spells."

[[abilities]]
origin = "Unique Ancestry"
level = 7
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\nOne point to use in the Accomplishment section or to store for later purchase in the same section\n10 Potential"

[[abilities]]

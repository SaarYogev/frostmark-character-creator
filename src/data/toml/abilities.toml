name = "Absorb Soul Aspect (Prerequisite)"
desc = "Your connection to your patron allows you to glimpse aspects of power from your patron’s Soul, and then, with time, embody them yourself. When you gain a level in [Pact], you can choose one of the Soul aspects you know and replace it with another Soul aspect that you could learn at that level. If an aspect has prerequisites, you must meet them to learn it. You can learn the Soul aspect at the same time that you meet its prerequisites.\nNo Level RequirementAgonizing Blast\nPact of the Bond ability\nYou can communicate telepathically with your familiar and perceive through your familiar's senses as long as you are within the same Realm. Additionally, while perceiving through your familiar's senses, you can also speak through your familiar in your own voice, even if your familiar is normally incapable of speech.\nAggravating Jinx"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Absorb Soul Aspect (Prerequisite)"
desc = "Your connection to your patron allows you to glimpse aspects of power from your patron’s Soul, and then, with time, embody them yourself. When you gain a level in [Pact], you can choose one of the Soul aspects you know and replace it with another Soul aspect that you could learn at that level. If an aspect has prerequisites, you must meet them to learn it. You can learn the Soul aspect at the same time that you meet its prerequisites.\nNo Level RequirementAgonizing Blast\n5 level picks in [Pact], Hex spell or, any spell or ability that curses\nYou can deal psychic damage with a bonus action against a creature you have cursed by a spell or ability you possess. The damage also afflicts all creatures within 1 m of it and equals your Cunning or Manipulation modifier of your choice (choose once, minimum 1).\nCoffin of Khei"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Prerequisite: 5 level picks in"
desc = "Once per short or long rest, when you suffer damage in combat you may entomb yourself in an icy coffin. Whilst in this icy coffin you gain a number of effects:\nYou gain 10 temporary hit points per total level you possess. These temporary hit points soak up as much as possible of the damage you took before triggering this ability.\nYour speed is reduced to 0.\nYou are incapacitated.\nYou suffer vulnerability to fire damage.\nThis icy coffin melts at the end of your next turn and all effects, including the temporary hit points, ends.\nFavor of the Waves"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Prerequisite: 5 level picks in"
desc = "Once per long rest, you can cast Water Breathing as Soul Mastery. In addition, you gain a swimming speed equal to your walking speed and you can breathe underwater.\nMenacing Aura"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Prerequisite: 5 level picks in"
desc = "Once per short or long rest, you may spend a bonus action and gain a menacing and poisonous aura. The form your aura takes is up to you (buzzing flies, sickly green water, black tendrils of shadows, etc). The radius of your aura is 1-m radius but it cannot go through total cover. Your aura gives you two benefits:\nCreatures who start their turn in your aura suffer poison damage equal to Cunning or Manipulation (minimum of 1) your choice (choose once).\nYou gain advantage on any intimidation attempts you make with Persuasion or Deception skill checks. All other social checks you make have disadvantage.\nMire the Mind"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Prerequisite: 5 level picks in"
desc = "Once per long rest, you can cast Slow as Soul Mastery.\nOne with Shadows"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Prerequisite: 5 level picks in"
desc = "When you are in an area of dim light or darkness, you can use your action to become invisible until you move, take an action, or a reaction.\nSign of Ill Omen"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Prerequisite: 5th level picks in (Prerequisite)"
desc = "Once per long rest, you can cast Bestow Curse as Soul Mastery.\nThirsting Blade\n5 level picks in [Pact], Pact of the Blade ability\nYou can attack with your [Pact] weapon twice, instead of once, whenever you take the attack action on your turn.\nBewitching Whispers"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Prerequisite: 7 level picks in (Prerequisite)"
desc = "Once per long rest, you can cast Compulsion as Soul Mastery.\nDreadful Word\n7th [Pact] level\nOnce per long rest, you can cast Confusion as Soul Mastery.\nInexorable Jinx"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Prerequisite: 7 level picks in (Prerequisite)"
desc = "Once per long rest, you can cast Compulsion as Soul Mastery.\nDreadful Word\n7 level picks in [Pact], Hex spell or, any spell or ability that curses\nAgainst a target you have cursed through a spell or an ability you possess, you can teleport within 1 m of them as a bonus action. You can only teleport this way as long as you can see them and they are within 6 m of you.\nPhantom Vision"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Prerequisite: 7 level picks in"
desc = "Once per short or long rest, for 10 rounds you gain the ability to see through objects. This vision has a range of 6 m and within that range, you also gain darkvision.\nSculptor of Flesh"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Prerequisite: 7 level picks in"
desc = "Once per long rest, you can cast Polymorph as Soul Mastery.\nTactical Retreat"

[[abilities]]

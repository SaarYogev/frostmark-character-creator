[[abilities]]
origin = "Soul Oath"
level = 1
selection = "Primary"
name = "Threaten"
desc = "Choose a Soul Oath from below. Once per long rest as a bonus action, you can Threaten a creature that you can see. Threaten lasts you are incapacitated, until the target is incapacitated, or 10 rounds have passed.\nAgainst a Threatened creature, you deal extra damage on weapon attacks equal to 1 + your [Soul Oath] level divided by 5 (rounded up and minimum 2). Threaten also includes an Oath effect that can be found below. You can Threaten one more time per long rest at every five-level picks of [Soul Oath] (including this level) to a maximum of four Threaten uses per long rest."

[[abilities]]
origin = "Soul Oath"
level = 1
selection = "Secondary"
name = "Born to Ride"
desc = "Riding has become as easy as eating and breathing for you. You gain a number of benefits:\nYou gain advantage on saving throws made to avoid falling off your mount.\nIf you fall off and descend no more than 2 m, you land on your feet and you do not lose any movement as long as you are not incapacitated.\nMounting or dismounting only costs 1 m of movement instead of half your speed."

[[abilities]]
origin = "Soul Oath"
level = 2
selection = "Primary"
name = "Vow (Aegis)"
desc = "Steadfast: If you are wearing heavy armor, you can spend your reaction to gain resistance against bludgeoning, piercing, slashing until the start of your next turn. You can use this ability once per short rest. After 6 level picks of [Soul Oath], you can perform Steadfast twice per short rest, and after 14 level picks of [Soul Oath] thrice."

[[abilities]]
origin = "Soul Oath"
level = 2
selection = "Primary"
name = "Vow (Aspiration)"
desc = "Braggadocio: Once per short rest, as an action you may demoralize an opponent. Choose one creature within 6 m of you and make a Persuasion check with one ability score of your choice (once you have chosen it will remain that ability score for the rest of the game) against that creature's Empathy (Com). If your roll is higher than the creature’s, they become demoralized for 1d4 turns. A demoralized target suffers -2 to its attack rolls, saving throws, and skill checks for the duration. In addition, against demoralized targets, you gain a +2 bonus to your attack rolls."

[[abilities]]
origin = "Soul Oath"
level = 2
selection = "Primary"
name = "Vow (Chivalry)"
desc = "Pristine Honor: You gain proficiency with a saving throw of your choice. In addition, once per short rest, you may reroll one failed saving throw but you must keep the new result."

[[abilities]]
origin = "Soul Oath"
level = 2
selection = "Primary"
name = "Vow (Loyalty)"
desc = "Got Your Back: Whenever you use the help action to aid an ally they also receive advantage on any saving throw or skill check they make until the start of your next turn."

[[abilities]]
origin = "Soul Oath"
level = 2
selection = "Primary"
name = "Vow (Templar)"
desc = "Uplifting Prayer: As an action, you can mutter a prayer to yourself and receive a bonus equal to your Resolve modifier to one skill check, attack roll, or a saving throw of your choice at any point within 10 rounds. You must declare that you are using this ability before the roll is made. You can use this ability up to four times per long rest."

[[abilities]]
origin = "Soul Oath"
level = 2
selection = "Primary"
name = "Vow (Vassalage)"
desc = "Call of the Monarch: Once per short rest, all allies that can hear you and are within 12 m of you, receive advantage on saving throws against charm and fear effects for a number of rounds equal to the number of levels picks you to possess in [Soul Oath]. They also receive advantage to one attack roll of their choice that they can use at any point during the same duration. In addition, if a creature that can hear you and is within range has the charm or frightened condition when you activate this ability, they can immediately make another saving throw to resist the effect if that is allowed."


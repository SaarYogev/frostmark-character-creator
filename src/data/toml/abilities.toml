name = "Ability Score improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Unique Ancestry"
level = 13
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\nTwo points to use in the Accomplishment section or to store for later purchase in the same section\n20 Potential"

[[abilities]]
origin = "Unique Ancestry"
level = 14
selection = "Primary"
name = "Origins (Celestial)"
desc = "Take Flight: Your back sprouts a pair of spectral wings, in a style of your choosing, as a bonus action. Whilst you possess your wings you gain a flying speed of 6 m. The wings persist until you dismiss them as a bonus action, you become incapacitated or die."

[[abilities]]
origin = "Unique Ancestry"
level = 14
selection = "Primary"
name = "Origins (Draconic)"
desc = "Dominate the Skies: Your back sprouts a pair of draconic wings as a bonus action. Whilst you possess your wings you gain a flying speed equal to your current walking speed. The wings persist until you dismiss them as a bonus action, you become incapacitated or die.  You can't manifest your wings while wearing armor unless the armor is made to accommodate them, and clothing not made to accommodate your wings might be destroyed when you manifest them."

[[abilities]]
origin = "Unique Ancestry"
level = 14
selection = "Primary"
name = "Origins (Flames)"
desc = "Heated Ire: You gain resistance to fire damage. In addition, you can use your reaction to deal fire damage equal to your total level to a creature who hit you by a melee attack."

[[abilities]]
origin = "Unique Ancestry"
level = 14
selection = "Primary"
name = "Origins (Penumbra)"
desc = "Slippery Darkness: As a bonus action, you can teleport up to a spot you can see within 24 m of you. To teleport, you must be in darkness or dim light, and the spot you teleport to must also be in darkness or dim light. You can teleport a number of times per long rest equal to your proficiency bonus."

[[abilities]]
origin = "Unique Ancestry"
level = 14
selection = "Primary"
name = "Origins (Tempest)"
desc = "Retributional Discharge: You can use your reaction to deal lightning damage equal to your total level to a creature who hit you by a melee attack. The creature must also succeed in a Brawn saving throw against your spell save DC or be pushed 4 m away from you in a straight line."

[[abilities]]
origin = "Unique Ancestry"
level = 14
selection = "Primary"
name = "Origins (Titan)"
desc = "Soul of Ouskira: For 10 rounds or until you are incapacitated, when you expend a spell slot and start casting a spell, you gain all of the following benefits:\nYour size and your equipment’s size increases by one category.\nYour reach increases by 1 m.\nYour hit points total gains a number of hit points equal to your total level.\nYour walking speed increases with 1 m.\nYou gain advantage on any Brawn checks and saving throws.\nYour melee weapon attacks deal more damage equal to your Vitality modifier (minimum 1).\nYou can use this ability again after you complete a short or long rest."

[[abilities]]
origin = "Unique Ancestry"
level = 15
selection = "Primary"
name = "Improved Magical Upgrade"
desc = "Gain one of your choices:\nTwo points to use in the Accomplishment section or to store for later purchase in the same section\n30 Potential\nThree skill points to assign in any skill or skills of your choice, or to store\n+1 to an ability score of your choice\nPick a feat from the feat list"

[[abilities]]
origin = "Unique Ancestry"
level = 16
selection = "Primary"
name = "Ability Score improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Unique Ancestry"
level = 17
selection = "Primary"
name = "Metamagic"
desc = "Gain another Metamagic option."

[[abilities]]
origin = "Unique Ancestry"
level = 18
selection = "Primary"
name = "Origin (Celestial)"
desc = "Ethereal Resurgence: You can regain a number of hit points equal to half your hit point maximum as a bonus action, if you have been brought down to less than half of your hit point maximum. After you use this ability, you must complete a long rest before you can use it again."

[[abilities]]
origin = "Unique Ancestry"
level = 18
selection = "Primary"
name = "Origin (Draconic)"
desc = "Draconic Presence: If you spend 5 sorcery points, you may ooze an aura of awe or fear with a range of 12 m as an action. For 10 rounds or until you lose your concentration (as if you were concentrating on a spell), each hostile creature that starts its turn in this aura must succeed on a Composure saving throw (if you chose awe) or a Resolve saving throw (if you chose fear) or be charmed by you or frightened of you until the aura ends. A creature that succeeds on this saving throw is immune to your aura for 24 hours."

[[abilities]]
origin = "Unique Ancestry"
level = 18
selection = "Primary"
name = "Origin (Flames)"
desc = "Flaming Spirit: Any spell or effect you create treats immunity to fire damage as resistance, and ignores resistance to fire damage. Additionally, you gain immunity to fire damage."

[[abilities]]
origin = "Unique Ancestry"
level = 18
selection = "Primary"
name = "Origin (Penumbra)"
desc = "Form of Shadows: As a bonus action you can transform yourself into a form of shadows that lasts for 10 rounds or until you are incapacitated. You can end this effect early if you spend a bonus action. By spending 6 sorcery points you gain resistance to all damage, excluding radiant and force damage. You can move through creatures and objects as if they were only difficult terrain but if you end your turn within an object or creature you suffer 5 force damage."

[[abilities]]
origin = "Unique Ancestry"
level = 18
selection = "Primary"
name = "Origin (Tempest)"
desc = "Spirit of Storms: The wind allows you to always soar. You gain a flying speed of 12 m. You can command the air to lift up a number of creatures of your choice equal to 3+ your Cunning modifier (minimum 1) as an action. They can fly with you for up to an hour but your flying speed, and their flying speed, equals 6 m for the duration. You must complete a short or long rest to use this ability again on other creatures than you. Additionally, you are immune to lightning and thunder damage."

[[abilities]]
origin = "Unique Ancestry"
level = 18
selection = "Primary"
name = "Origin (Titan)"
desc = "Titanic Favor: You can use your Soul of Ouskira ability two times more in between rests, but not whilst a use of Soul of Ouskira is in effect. Additionally, your Vitality score increases with +2, to a maximum of 22."

[[abilities]]
origin = "Unique Ancestry"
level = 19
selection = "Primary"
name = "Ability Score improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Unique Ancestry"
level = 20
selection = "Primary"
name = "Unsealed Ancestral Power"
desc = "Regain four sorcery points when you finish a short rest and you may apply two Metamagic effects on one spell."

[[abilities]]
origin = "World Magic"
level = 1
selection = "Primary"
name = "Wild Shape"
desc = "As an action, you can transform into an animal or beast that you have seen before. Your level picks in [World Magic] determines the beasts and animals you can transform into.\n\nLevel | Max CR | Limitations | Example\n--- | --- | --- | ---\n1st | 1 | No swimming or flying speed | Wolf\n4th | 2 | No flying speed | Crocodile\n8th | 3 |  | Giant Eagle\n\n\nYou can remain transformed with Wild Shape for a number of hours equal to half your [World Magic] level picks (rounded down). You then revert to your normal form unless you use this ability again. You can revert to your normal form earlier by using a bonus action on your turn. You automatically revert if you fall unconscious, drop to 0 hit points, or die.\nIf you would use this ability twice per short or long rest, the second transformation is less potent than the first. Subtract one Health Dice from the total Hit Dice pool of the animal or beast every time you use this ability except for the first transformation, and use the new hit point total. This penalty resets when you finish a long rest. However, this penalty can not reduce a transformation to lower than 1 Hit Dice.\nYou can use this ability once per short or long rest. After 2 level picks of [World Magic] you can use this ability twice per short or long rest.\nWhile you are transformed, the following rules apply:\nYour game statistics are replaced by the statistics of the beast or animal, but you keep your mental and social ability scores, as well as your personality. You also keep all of your skill points and saving throw proficiencies, in addition to gaining those of the creature. If the creature has the same proficiency as you and the bonus in its stat block is higher than yours, use the creature’s bonus instead of yours. If the creature has any legendary or lair actions, you can’t use them.\nWhen you transform, you assume the animals or beast’s hit points and Hit Dice. When you revert to your normal form, you return to the number of hit points you had before you transformed. However, if you revert as a result of dropping to 0 hit points, any excess damage carries over to your normal form. For example, if you take 10 damage in a Wild Shape form and have only 1 hit point left, you revert and take 9 damage. As long as the excess damage doesn’t reduce your normal form to 0 hit points, you aren’t knocked unconscious.\nYou can’t cast spells, and your ability to speak or take any action that requires hands is limited to the capabilities of your Wild Shape form. Transforming doesn’t break your concentration on a spell you’ve already cast, however, or prevent you from taking actions that are part of a spell, such as Call Lightning, that you’ve already cast.\nYou keep the benefit of any ability from your AOs, race, or other source and can use them if the new form is physically capable of doing so. However, you can’t use any of your special senses, such as darkvision, unless your new form also has that sense.\nYou choose whether your equipment falls to the ground in your space, merges into your new form, or is worn by it. Worn equipment functions as normal, but the GM decides whether it is practical for the new form to wear a piece of equipment, based on the creature’s shape and size. Your equipment doesn’t change size or shape to match the new form, and any equipment that the new form can’t wear must either fall to the ground or merge with it. Equipment that merges with the form does not affect you until you leave the form."

[[abilities]]
origin = "World Magic"
level = 1
selection = "Secondary"
name = "Cantrips"
desc = "Gain two cantrips of your choice."

[[abilities]]
origin = "World Magic"
level = 2
selection = "Primary"
name = "Circle (Athronna)"
desc = "Mythical Resilience: As an action, you can recover one spell slot of the 2nd level or two spell slots of 1st level. After 10 level picks of [World Magic] you can recover a 3rd level spell slot or two 2nd level. You can't use this ability again until you finish a long rest."

[[abilities]]
origin = "World Magic"
level = 2
selection = "Primary"
name = "Circle (Pateph)"
desc = "Toxic Response: As a reaction, you can fire toxic matter at other creatures on your turn. (You choose how your Toxic Response ability looks, examples include spikes, spores, fumes, grenades, etc.) This ability deals 3 poison damage to one creature within 2 m of you that you can see. This damage increases to 6 poison damage after 6 level picks of [World Magic], 9 poison damage after 9 level picks of [World Magic], and 12 poison damage after 14 level picks of [World Magic]."

[[abilities]]
origin = "World Magic"
level = 2
selection = "Primary"
name = "Circle (Verhet)"
desc = "Spirit Companion: You delve into the mysteries of the dead Enneade of spring and learn how to summon incorporeal spirits. Once per short or long rest, you can summon a spirit on an unoccupied space you can see within 12 m of you as a bonus action. On subsequent turns, you can move it up to 12 m to another point you can see by spending a bonus action. Even if the spirit takes the form of a creature, it does not count as a creature, nor an object. The spirit remains for 10 rounds or until you are incapacitated. The spirit possesses an aura of 6 m radius that grants effects depending on its type.\nChoose the spirit’s form and aura from below when you summon it:"

[[abilities]]
origin = "World Magic"
level = 2
selection = "Primary"
name = "Circle (Mother Ursa)"
desc = "All creatures of your choice within the range of the aura gain temporary hit points equal to your total level + 5 when this spirit appears. All creatures of your choice within the aura also receive advantage on Brawn checks and Brawn saves as long as they remain within the aura."

[[abilities]]
origin = "World Magic"
level = 2
selection = "Primary"
name = "Circle (The Vigilant Eagle)"
desc = "All creatures of your choice within the range of the aura have advantage on all Perception checks when this spirit appears. if an ally would make an attack roll against a target within the aura, you can spend your reaction to give your ally advantage on the attack roll."

[[abilities]]
origin = "World Magic"
level = 2
selection = "Primary"
name = "Circle (Python of Binding)"
desc = "All creatures of your choice within the range of the aura have advantage on ability checks made to detect other creatures within the aura when this spirit appears. Whenever you cast a spell that heals hit points of allies both within and outside of the aura, all creatures of your choice within the aura also gain a number of hit points equal to your total level."

[[abilities]]
origin = "World Magic"
level = 2
selection = "Primary"
name = "Circle (Vettias)"
desc = "Circle Transformations: You focus your connection to the World to understand the nature of Souls and how to transform your Soul’s physical expression. You must still abide by all limitations of Wild Shape, but you can now use your Wild Shape to become an animal or a beast of challenge rating 1 or less. Your bonuses increase as you pick levels in [World Magic]. After 6 level picks of [World Magic] you can transform into an animal or a beast of a challenge rating equal to your level in [World Magic] divided by 3 (rounded down). Any transformation into a beast or animal of challenge rating higher than 1 receives a harsher penalty to its Hit Dice. For every transformation after the first, lower the Hit Dice by two instead of one."

[[abilities]]
origin = "World Magic"
level = 2
selection = "Primary"
name = "Circle (Zestos)"
desc = "Agent of Preservation: Your connection with the World has allowed you to tap into the powers of preservation. You have a healing pool of d6s equal to your level picks of [World Magic]. As a bonus action, you can heal a creature of your choice within 24 m. You roll the dice, add the results together and your target regains hit points equal to the result. Your target also receives a number of temporary hit points equal to the number of dice you roll from your healing pool. You can’t spend more than half your healing pool on one turn and you regain your spent healing dice after a long rest."

[[abilities]]
origin = "World Magic"
level = 2
selection = "Secondary"
name = "Circle (Pateph)"
desc = "Toxic Awakening: Whenever you use your Wild Shape ability you can choose to transform as per normal or honor Pateph, the dead Enneade of disease and pestilence, by awakening your toxicity instead. If you do, you gain a number of benefits that last for 10 minutes or until you activate your Wild Shape ability again.\nIf you possess the Toxic Response ability its damage doubles.\nYou gain temporary hit points equal to 3 times your level picks in [World Magic].\nAny successful melee weapon attack deals an extra 1d6 poison damage."

[[abilities]]
origin = "World Magic"
level = 2
selection = "Secondary"
name = "Circle (Vettias)"
desc = "Improved Wild Shape: Your connection to the dead Enneade of wisdom and skill broadens. You can now transform with Wild Shape as a bonus action. In addition, whilst using Wild Shape you can spend a bonus action to regain hit points by expending one spell slot. The hit points gained equals an 1d8 per level of the spell slot expended."

[[abilities]]

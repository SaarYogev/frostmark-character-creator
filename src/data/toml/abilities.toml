level = 20
selection = "Primary"
name = "Prerequisite: 15 level picks in"
desc = "You can see the true form of any shapechanger or creature concealed by illusion or transmutation magic while the creature is within 6 m of you and within line of sight."

[[abilities]]
origin = "Power"
level = 1
selection = "Primary"
name = "Rage"
desc = "On your turn, you can enter a Rage as a bonus action. While raging, you gain the following benefits if you aren't wearing heavy armor:\nYou have advantage on all Brawn checks and Brawn saving throws.\nWhen you make a melee weapon attack using Brawn, you gain a bonus to the damage roll that increases as you pick levels in [Power], which starts at +2, increases to +3 at 9th and +4 at 16th.\nYou have resistance to bludgeoning, piercing, and slashing damage.\nIf you can cast spells, you can't cast them or concentrate on them while raging.\nYour Rage lasts for a whole combat if the combat does not have any distinct pauses in the violence, this is up to the GM to decide. You can also end your Rage early by spending a bonus action. You can rage twice per long rest when you pick this ability, and the number of times you can Rage increases as you gain total levels. At 3rd total level, you can Rage thrice, four times at 6th, five times at 12th, six times at 17th, and unlimited at 20th."

[[abilities]]
origin = "Power"
level = 1
selection = "Secondary"
name = "Unarmored Defense"
desc = "While you are not wearing any armor or wielding a shield, your armor class equals 10 + your Vitality modifier + your Resolve modifier. The Vitality and the Resolve modifier cannot exceed your proficiency bonus individually."

[[abilities]]
origin = "Power"
level = 1
selection = "Secondary"
name = "Second Wind"
desc = "Once per short or long rest, you may regain hit points equal to 1d10 + your level in [Power] as a bonus action."

[[abilities]]
origin = "Power"
level = 2
selection = "Primary"
name = "Reckless Attack"
desc = "When you make your first attack on your turn, you can decide to attack recklessly. Doing so gives you advantage on all melee weapon attack rolls using Brawn during that turn, but attack rolls against you are rolled with advantage until the beginning of your next turn."

[[abilities]]
origin = "Power"
level = 2
selection = "Secondary"
name = "Danger Sense"
desc = "You have advantage on Dexterity saving throws against effects that you can see. You do not gain this benefit if you are blinded, deafened, or incapacitated."

[[abilities]]
origin = "Power"
level = 2
selection = "Secondary"
name = "Survival Instincts"
desc = "Choose two Skills between Animal Handling, Athletics, Medicine, Perception, or Survival, you gain 2 skill points in both of them and you may gain rank 5 with both of those skills."

[[abilities]]
origin = "Power"
level = 3
selection = "Primary"
name = "Primal Path (Beast Channeller)"
desc = "Bestial Nature: You study an animal or beast of your choice to channel their ferocity in battle and gain their ancient wisdom. The animal or beast of your choice must fit one of the categories below and be native to your home region. On subsequent levels, if you pick up more Beast Channeller abilities you may choose the same animal or a different one. But you still must abide by the guidelines above when you do so. In addition, you learn Beast Sense and Speak as Animals but you can only cast them as rituals."

[[abilities]]
origin = "Power"
level = 3
selection = "Primary"
name = "Primal Path (Lumbering)"
desc = "As long as you have activated your Rage ability, you have resistance to all damage except psychic damage."

[[abilities]]

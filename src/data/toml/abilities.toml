selection = "Primary"
name = "Aura of Courage"
desc = "You and friendly creatures within 2 m of you can't be frightened or charmed while you are conscious. At 18th total level, the range of this aura increases to 6 m."

[[abilities]]
origin = "Divine Oath"
level = 11
selection = "Primary"
name = "Improved Divine Smite"
desc = "Whenever you hit a creature with a melee weapon, the creature takes an extra 5 damage of one of your Enneade’s favorite damage types (choose once). If you also use your Divine Smite with an attack, you add this damage to the extra damage of your Divine Smite. If you’ve not already taken Divine Smite, you gain Divine Smite instead."

[[abilities]]

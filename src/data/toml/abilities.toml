name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 10 Potential"

[[abilities]]
origin = "Unique Ancestry"
level = 10
selection = "Primary"
name = "Metamagic"
desc = "Gain another Metamagic option."

[[abilities]]
origin = "Unique Ancestry"
level = 11
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- Two points to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 20 Potential"

[[abilities]]
origin = "Unique Ancestry"
level = 12
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Unique Ancestry"
level = 13
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- Two points to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 20 Potential"

[[abilities]]
origin = "Unique Ancestry"
level = 14
selection = "Primary"
name = "Origins (Celestial)"
desc = "**Take Flight**\n\nYour back sprouts a pair of spectral wings, in a style of\n\nyour choosing, as a bonus action. Whilst you possess your wings you gain a flying\n\nspeed of 6 m. The wings persist until you dismiss them as a bonus action, you\n\nbecome incapacitated or die."

[[abilities]]
origin = "Unique Ancestry"
level = 14
selection = "Primary"
name = "Origins (Draconic)"
desc = "**Dominate the Skies**\n\nYour back sprouts a pair of draconic wings as a\n\nbonus action. Whilst you possess your wings you gain a flying speed equal to your\n\ncurrent walking speed. The wings persist until you dismiss them as a bonus\n\naction, you become incapacitated or die.  You can't manifest your wings while\n\nwearing armor unless the armor is made to accommodate them, and clothing not\n\nmade to accommodate your wings might be destroyed when you manifest them."

[[abilities]]
origin = "Unique Ancestry"
level = 14
selection = "Primary"
name = "Origins (Flames)"
desc = "**Heated Ire**\n\nYou gain resistance to fire damage. In addition, you can use\n\nyour reaction to deal fire damage equal to your total level to a creature who hit\n\nyou by a melee attack."

[[abilities]]
origin = "Unique Ancestry"
level = 14
selection = "Primary"
name = "Origins (Penumbra)"
desc = "**Slippery Darkness**\n\nAs a bonus action, you can teleport up to a spot\n\nyou can see within 24 m of you. To teleport, you must be in darkness or dim light,\n\nand the spot you teleport to must also be in darkness or dim light. You can\n\nteleport a number of times per long rest equal to your proficiency bonus."

[[abilities]]
origin = "Unique Ancestry"
level = 14
selection = "Primary"
name = "Origins (Tempest)"
desc = "**Retributional Discharge**\n\nYou can use your reaction to deal lightning\n\ndamage equal to your total level to a creature who hit you by a melee attack. The\n\ncreature must also succeed in a Brawn saving throw against your spell save DV or\n\nbe pushed 4 m away from you in a straight line."

[[abilities]]
origin = "Unique Ancestry"
level = 14
selection = "Primary"
name = "Origins (Titan)"
desc = "**Soul of Ouskira**\n\nFor 10 rounds or until you are incapacitated, when you\n\nexpend a spell slot and start casting a spell, you gain all of the following benefits:\n\n  * Your size and your equipment\u2019s size increases by one category.\n\n  * Your reach increases by 1 m.\n\n  * Your health points total gains a number of health points equal to your\n\ntotal level.\n\n  * Your walking speed increases with 1 m.\n\n  * You gain advantage on any Brawn checks and saving throws.\n\n  * Your melee weapon attacks deal more damage equal to your Vitality\n\nmodifier (minimum 1).\n\nYou can use this ability again after you complete a short or long rest."

[[abilities]]
origin = "Unique Ancestry"
level = 15
selection = "Primary"
name = "Improved Magical Upgrade"
desc = "Gain one of your choices:\n\n- Two points to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 30 Potential\n\n- Three skill points to assign in any skill or skills of your choice, or to store\n\n- +1 to an ability score of your choice\n\n- Pick a feat from the feat list"

[[abilities]]
origin = "Unique Ancestry"
level = 16
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Unique Ancestry"
level = 17
selection = "Primary"
name = "Metamagic"
desc = "Gain another Metamagic option."

[[abilities]]
origin = "Unique Ancestry"
level = 18
selection = "Primary"
name = "Origin (Celestial)"
desc = "**Ethereal Resurgence**\n\nYou can regain a number of health points equal\n\nto half your health point maximum as a bonus action, if you have been brought\n\ndown to less than half of your health point maximum. After you use this ability,\n\nyou must complete a long rest before you can use it again."

[[abilities]]
origin = "Unique Ancestry"
level = 18
selection = "Primary"
name = "Origin (Draconic)"
desc = "**Draconic Presence**\n\nIf you spend 5 sorcery points, you may ooze an\n\naura of awe or fear with a range of 12 m as an action. For 10 rounds or until you\n\nlose your concentration (as if you were concentrating on a spell), each hostile\n\ncreature that starts its turn in this aura must succeed on a Composure saving\n\nthrow (if you chose awe) or a Resolve saving throw (if you chose fear) or be\n\ncharmed by you or frightened of you until the aura ends. A creature that\n\nsucceeds on this saving throw is immune to your aura for 24 hours."

[[abilities]]
origin = "Unique Ancestry"
level = 18
selection = "Primary"
name = "Origin (Flames)"
desc = "**Flaming Spirit**\n\nAny spell or effect you create treats immunity to fire\n\ndamage as resistance, and ignores resistance to fire damage. Additionally, you\n\ngain immunity to fire damage."

[[abilities]]
origin = "Unique Ancestry"
level = 18
selection = "Primary"
name = "Origin (Penumbra)"
desc = "**Form of Shadows**\n\nAs a bonus action you can transform yourself into\n\na form of shadows that lasts for 10 rounds or until you are incapacitated. You can\n\nend this effect early if you spend a bonus action. By spending 6 sorcery points\n\nyou gain resistance to all damage, excluding radiant and force damage. You can\n\nmove through creatures and objects as if they were only difficult terrain but if\n\nyou end your turn within an object or creature you suffer 5 force damage."

[[abilities]]
origin = "Unique Ancestry"
level = 18
selection = "Primary"
name = "Origin (Tempest)"
desc = "**Spirit of Storms**\n\nThe wind allows you to always soar. You gain a flying\n\nspeed of 12 m. You can command the air to lift up a number of creatures of your\n\nchoice equal to 3+ your Cunning modifier (minimum 1) as an action. They can fly\n\nwith you for up to an hour but your flying speed, and their flying speed, equals 6\n\nm for the duration. You must complete a short or long rest to use this ability\n\nagain on other creatures than you. Additionally, you are immune to lightning and\n\nthunder damage."

[[abilities]]
origin = "Unique Ancestry"
level = 18
selection = "Primary"
name = "Origin (Titan)"
desc = "**Titanic Favor**\n\nYou can use your Soul of Ouskira ability two times more in\n\nbetween rests, but not whilst a use of Soul of Ouskira is in effect. Additionally,\n\nyour Vitality score increases with +2, to a maximum of 22."

[[abilities]]
origin = "Unique Ancestry"
level = 19
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Unique Ancestry"
level = 20
selection = "Primary"
name = "Unsealed Ancestral Power"
desc = "Regain four sorcery points when you finish a short rest and you may apply two\n\nMetamagic effects on one spell."

[[abilities]]
origin = "World Magic"
level = 1
selection = "Primary"
name = "Wild Shape"
desc = "As an action, you can transform into an animal or beast that you have seen before. Your\n\nlevel picks in [World Magic] determines the beasts and animals you can transform into.\n\nLevel Max\n\nCR\n\nLimitations Example\n\n1st 1 No swim or\n\nfly speed\n\nWolf\n\n4th 2  Crocodile\n\n8th 3  Giant\n\nEagle\n\nYou can remain transformed with Wild Shape for a number of hours equal to half your\n\n[World Magic] level picks (rounded down). You then revert to your normal form unless\n\nyou use this ability again. You can revert to your normal form earlier by using a bonus\n\naction on your turn. You automatically revert if you fall unconscious, drop to 0 health\n\npoints, or die.\n\nIf you would use this ability twice per short or long rest, the second transformation is\n\nless potent than the first. Subtract one health dice from the total health dice pool of the\n\nanimal or beast every time you use this ability except for the first transformation, and\n\nuse the new health point total. This penalty resets when you finish a long rest. However,\n\nthis penalty can not reduce a transformation to lower than 1 health dice.\n\nYou can use this ability once per short or long rest. After 2 level picks of [World Magic]\n\nyou can use this ability twice per short or long rest.\n\nWhile you are transformed, the following rules apply:\n\n- Your game statistics are replaced by the statistics of the beast or animal, but you\n\nkeep your mental and social ability scores, as well as your personality. You also\n\nkeep all of your skill points and saving throw proficiencies, in addition to gaining\n\nthose of the creature. If the creature has the same proficiency as you and the\n\nbonus in its stat block is higher than yours, use the creature\u2019s bonus instead of\n\nyours. If the creature has any legendary or lair actions, you can\u2019t use them.\n\n- When you transform, you assume the animals or beast\u2019s health points and health\n\ndice. When you revert to your normal form, you return to the number of health\n\npoints you had before you transformed. However, if you revert as a result of\n\ndropping to 0 health points, any excess damage carries over to your normal form.\n\nFor example, if you take 10 damage in a Wild Shape form and have only 1 health\n\npoint left, you revert and take 9 damage. As long as the excess damage doesn\u2019t\n\nreduce your normal form to 0 health points, you aren\u2019t knocked unconscious.\n\n- You can\u2019t cast spells, and your ability to speak or take any action that requires\n\nhands is limited to the capabilities of your Wild Shape form. Transforming doesn\u2019t\n\nbreak your concentration on a spell you\u2019ve already cast, however, or prevent you\n\nfrom taking actions that are part of a spell, such as Call Lightning, that you\u2019ve\n\nalready cast.\n\n- You keep the benefit of any ability from your AOs, race, or other source and can\n\nuse them if the new form is physically capable of doing so. However, you can\u2019t\n\nuse any of your special senses, such as darkvision, unless your new form also has\n\nthat sense.\n\n- You choose whether your equipment falls to the ground in your space, merges\n\ninto your new form, or is worn by it. Worn equipment functions as normal, but\n\nthe GM decides whether it is practical for the new form to wear a piece of\n\nequipment, based on the creature\u2019s shape and size. Your equipment doesn\u2019t\n\nchange size or shape to match the new form, and any equipment that the new\n\nform can\u2019t wear must either fall to the ground or merge with it. Equipment that\n\nmerges with the form does not affect you until you leave the form."

[[abilities]]
origin = "World Magic"
level = 1
selection = "Secondary"
name = "Cantrips"
desc = "Gain two cantrips of your choice."

[[abilities]]
origin = "World Magic"
level = 2
selection = "Primary"
name = "Circle (Athronna)"
desc = "**Mythical Resilience**\n\nAs an action, you can recover one spell slot of\n\nthe 2nd level or two spell slots of 1st level. After 10 level picks of [World Magic]\n\nyou can recover a 3rd level spell slot or two 2nd level. You can't use this ability\n\nagain until you finish a long rest."

[[abilities]]
origin = "World Magic"
level = 2
selection = "Primary"
name = "Circle (Pateph)"
desc = "**Toxic Response**\n\nAs a reaction, you can fire toxic matter at other\n\ncreatures on your turn. (You choose how your Toxic Response ability looks,\n\nexamples include spikes, spores, fumes, grenades, etc.) This ability deals 3 poison\n\ndamage to one creature within 2 m of you that you can see. This damage\n\nincreases to 6 poison damage after 6 level picks of [World Magic], 9 poison\n\ndamage after 9 level picks of [World Magic], and 12 poison damage after 14 level\n\npicks of [World Magic]."

[[abilities]]
origin = "World Magic"
level = 2
selection = "Primary"
name = "Circle (Verhet)"
desc = "**Spirit Companion**\n\nYou delve into the mysteries of the dead Enneade of\n\nspring and learn how to summon incorporeal spirits. Once per short or long rest,\n\nyou can summon a spirit on an unoccupied space you can see within 12 m of you\n\nas a bonus action. On subsequent turns, you can move it up to 12 m to another\n\npoint you can see by spending a bonus action. Even if the spirit takes the form of\n\na creature, it does not count as a creature, nor an object. The spirit remains for\n\n10 rounds or until you are incapacitated. The spirit possesses an aura of 6 m\n\nradius that grants effects depending on its type.\n\nChoose the spirit\u2019s form and aura from below when you summon it:\n\n  * Mother Ursa: All creatures of your choice within the range of the aura\n\ngain temporary health points equal to your total level + 5 when this spirit\n\nappears. All creatures of your choice within the aura also receive\n\nadvantage on Brawn checks and Brawn saves as long as they remain\n\nwithin the aura.\n\n  * The Vigilant Eagle: All creatures of your choice within the range of the\n\naura have advantage on all Perception checks when this spirit appears. if\n\nan ally would make an attack roll against a target within the aura, you can\n\nspend your reaction to give your ally advantage on the attack roll.\n\n  * Python of Binding: All creatures of your choice within the range of the\n\naura have advantage on ability checks made to detect other creatures\n\nwithin the aura when this spirit appears. Whenever you cast a spell that\n\nheals health points of allies both within and outside of the aura, all\n\ncreatures of your choice within the aura also gain a number of health\n\npoints equal to your total level."

[[abilities]]
origin = "World Magic"
level = 2
selection = "Primary"
name = "Circle (Vettias)"
desc = "**Circle Transformations**\n\nYou focus your connection to the World to\n\nunderstand the nature of Souls and how to transform your Soul\u2019s physical\n\nexpression. You must still abide by all limitations of Wild Shape, but you can now\n\nuse your Wild Shape to become an animal or a beast of challenge rating 1 or less.\n\nYour bonuses increase as you pick levels in [World Magic]. After 6 level picks of\n\n[World Magic] you can transform into an animal or a beast of a challenge rating\n\nequal to your level in [World Magic] divided by 3 (rounded down). Any\n\ntransformation into a beast or animal of challenge rating higher than 1 receives a\n\nharsher penalty to its health dice. For every transformation after the first, lower\n\nthe health dice by two instead of one."

[[abilities]]
origin = "World Magic"
level = 2
selection = "Primary"
name = "Circle (Zestos)"
desc = "**Agent of Preservation**\n\nYour connection with the World has allowed you\n\nto tap into the powers of preservation. You have a healing pool of d6s equal to\n\nyour level picks of [World Magic]. As a bonus action, you can heal a creature of\n\nyour choice within 24 m. You roll the dice, add the results together and your\n\ntarget regains health points equal to the result. Your target also receives a\n\nnumber of temporary health points equal to the number of dice you roll from\n\nyour healing pool. You can\u2019t spend more than half your healing pool on one turn\n\nand you regain your spent healing dice after a long rest."

[[abilities]]
origin = "World Magic"
level = 2
selection = "Secondary"
name = "Circle (Pateph)"
desc = "**Toxic Awakening**\n\nWhenever you use your Wild Shape ability you can\n\nchoose to transform as per normal or honor Pateph, the dead Enneade of disease\n\nand pestilence, by awakening your toxicity instead. If you do, you gain a number\n\nof benefits that last for 10 minutes or until you activate your Wild Shape ability\n\nagain.\n\n  * If you possess the Toxic Response ability its damage doubles.\n\n  * You gain temporary health points equal to 3 times your level picks in\n\n[World Magic].\n\n  * Any successful melee weapon attack deals an extra 1d6 poison damage."

[[abilities]]
origin = "World Magic"
level = 2
selection = "Secondary"
name = "Circle (Vettias)"
desc = "**Improved Wild Shape**\n\nYour connection to the dead Enneade of wisdom\n\nand skill broadens. You can now transform with Wild Shape as a bonus action. In\n\naddition, whilst using Wild Shape you can spend a bonus action to regain health\n\npoints by expending one spell slot. The health points gained equals an 1d8 per\n\nlevel of the spell slot expended."

[[abilities]]
origin = "World Magic"
level = 3
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 10 Potential"

[[abilities]]
origin = "World Magic"
level = 3
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 10 Potential"

[[abilities]]
origin = "World Magic"
level = 4
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "World Magic"
level = 5
selection = "Primary"
name = "Improved Magical Upgrade"
desc = "Gain one of your choices:\n\n- Two points to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 20 Potential\n\n- +1 to an ability score of your choice\n\n- Pick an additional feat from the feat list"

[[abilities]]
origin = "World Magic"
level = 6
selection = "Primary"
name = "Circle (Athronna)"
desc = "**Summer's Stride\u2019s**\n\nMoving through nonmagical difficult terrain costs\n\nyou no extra movement. You can also pass through nonmagical or magical plants\n\nwithout being slowed by them and without taking damage from them if they have\n\nthorns, spines, or a similar hazard.\n\nIn addition, you have advantage on saving throws against plants that are\n\nmagically created or manipulated to impede movement, such as those created by\n\nthe Entangle spell."

[[abilities]]
origin = "World Magic"
level = 6
selection = "Primary"
name = "Circle (Pateph)"
desc = "**Spread the Disease**\n\nIf your Toxic Response ability would kill a humanoid\n\nit is transformed into a zombie. The zombie animates at the end of your turn and\n\nits turn in the initiative order is immediately after yours. You can command the\n\nzombie telepathically but the only action the zombie can take is one melee attack\n\naction per turn. The zombie collapses when it is either defeated in combat or\n\nafter an hour."

[[abilities]]
origin = "World Magic"
level = 6
selection = "Primary"
name = "Circle (Verhet)"
desc = "**Potent Conjurer**\n\nBeasts, animals, and fey conjured by you are more\n\npotent. Creatures conjured by you gain a bonus to their health points equal to +2\n\nfor each health dice they possess. In addition, their natural weapon attacks are\n\nnow considered magical for the purpose of overcoming immunities and\n\nresistance to nonmagical attacks and damage."

[[abilities]]
origin = "World Magic"
level = 6
selection = "Primary"
name = "Circle (Vettias)"
desc = "**Magical Excellence**\n\nWhen you use your Wild Shape ability, your natural\n\nweapon attacks are considered magical for the purpose of overcoming\n\nresistances and immunities to nonmagical attacks and damage."

[[abilities]]
origin = "World Magic"
level = 6
selection = "Primary"
name = "Circle (Zestos)"
desc = "**Dome of Recuperation**\n\nWhenever you start a rest, you may touch a\n\nlocation and a 6 m radius sphere of obscuring magic appears on that point. The\n\nsphere is invisible and is blocked by total cover. Sources of light from within the\n\nsphere are not visible outside of it. In addition, any number of creatures of your\n\nchoice inside the sphere gain a +5 bonus to Perception and Stealth checks. This\n\neffect disappears whenever you leave the sphere or your rest is over."

[[abilities]]
origin = "World Magic"
level = 7
selection = "Primary"
name = "Greater Wild Shape"
desc = "You gain another use of Wild Shape per short rest."

[[abilities]]
origin = "World Magic"
level = 8
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "World Magic"
level = 9
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 10 Potential"

[[abilities]]
origin = "World Magic"
level = 10
selection = "Primary"
name = "Circle (Athronna)"
desc = "**Summer\u2019s Ward**\n\nYou can't be charmed or frightened by elementals\n\nor fey, and you are immune to poison and disease."

[[abilities]]
origin = "World Magic"
level = 10
selection = "Primary"
name = "Circle (Pateph)"
desc = "**Infest**\n\nInstead of using your Toxic Response ability you can hurl all your\n\nprojectiles into a 2m cube to a point you can see up to 6 m away as a reaction.\n\nThe cube persists for 10 rounds or until you use this ability again, and whilst it is\n\nactive you cannot use your Toxic Response ability. Any creature that starts its\n\nturn inside of the cube takes damage from your Toxic Response."

[[abilities]]
origin = "World Magic"
level = 10
selection = "Primary"
name = "Circle (Verhet)"
desc = "**Spring's Embrace**\n\nIf a fey, animal, or beast that you have conjured ends\n\ntheir turn inside of your Spirit Companion\u2019s aura, that summoned creature may\n\nrecover a number of health points equal to half your total level."

[[abilities]]
origin = "World Magic"
level = 10
selection = "Primary"
name = "Circle (Vettias)"
desc = "**Primordial Kinship**\n\nYou gain the ability to transform into an air, earth,\n\nfire, and water elemental, by expending two uses of your Wild Shape ability at\n\nonce."

[[abilities]]
origin = "World Magic"
level = 10
selection = "Primary"
name = "Circle (Zestos)"
desc = "**Moment of Salvation**\n\nYou can teleport up to 12 m to an unoccupied\n\nspace you can see as a bonus action. You may bring a willing creature with you as\n\nyou teleport but then you must spend an action instead of a bonus action. You\n\ncan use this ability a number of times equal to your Cunning modifier (minimum\n\n1), and you recover all your expended uses of it when you finish a long rest."

[[abilities]]
origin = "World Magic"
level = 11
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- Two points to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 20 Potential"

[[abilities]]
origin = "World Magic"
level = 12
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "World Magic"
level = 13
selection = "Primary"
name = "Greater Wild Shape"
desc = "You gain another use of Wild Shape per short rest."

[[abilities]]
origin = "World Magic"
level = 14
selection = "Primary"
name = "Circle (Athronna)"
desc = "**Summer\u2019s Sanctuary**\n\nWhen a beast, animal, or plant creature attacks\n\nyou, that creature must make a Composure saving throw against your spell save\n\nDV. On a failed save, the creature must choose a different target, or the attack\n\nautomatically misses. On a successful save, the creature is immune to this effect\n\nfor 24 hours. The creature is aware of this effect before it makes its attack against\n\nyou."

[[abilities]]
origin = "World Magic"
level = 14
selection = "Primary"
name = "Circle (Pateph)"
desc = "**Master of Disease**\n\nIf you are dealt damage from a critical hit you do not\n\nsuffer the extra damage of the critical hit. In addition, you are immune to the\n\nconditions of blinded, deafened, frightened, and poisoned."

[[abilities]]
origin = "World Magic"
level = 14
selection = "Primary"
name = "Circle (Verhet)"
desc = "**Loyal Companions**\n\nOnce per long rest, whenever you are incapacitated\n\nagainst your will you may cast conjure animals as a 9th level spell for free. In this\n\ncase, the spell requires no concentration or components. The spell conjures four\n\nbeasts or animals of challenge rating 2 or lower. They protect you and attack any\n\nenemies until they can receive other orders from you. This ability lasts until you\n\ndismiss it, no action required, or for an hour."

[[abilities]]
origin = "World Magic"
level = 14
selection = "Primary"
name = "Circle (Vettias)"
desc = "**Endless Expression**\n\nYou can cast the spell Alter Self as Soul Mastery\n\nand at will."

[[abilities]]
origin = "World Magic"
level = 14
selection = "Primary"
name = "Circle (Zestos)"
desc = "**Path to Salvation**\n\nOnce per long rest, you can cast either Scrying or\n\nTeleportation Circle as Soul Mastery when you have finished a short rest. The\n\ncast of Teleportation Circle is different. Instead of teleporting to another\n\nTeleportation Circle, it opens a gateway to the last location where you completed\n\na long rest if you remain within the same Realm. If you have not finished a long\n\nrest in the Realm, the cast of the spell fails but this ability is not wasted."

[[abilities]]
origin = "World Magic"
level = 15
selection = "Primary"
name = "Improved Magical Upgrade"
desc = "Gain one of your choices:\n\n- Two points to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 30 Potential\n\n- Three skill points to assign in any skill or skills of your choice or to store\n\n- +1 to an ability score of your choice\n\n- Pick a feat from the feat list"

[[abilities]]
origin = "World Magic"
level = 16
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "World Magic"
level = 17
selection = "Primary"
name = "Nurture of Nature"
desc = "For every 10 years that pass, your body ages only 1 year."

[[abilities]]
origin = "World Magic"
level = 18
selection = "Primary"
name = "Bestial Magic"
desc = "You can cast any spell, regardless of somatic or verbal components, as long as it does\n\nnot require Soul consumption whilst you are transformed with your Wild Shape ability."

[[abilities]]
origin = "World Magic"
level = 19
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "World Magic"
level = 20
selection = "Primary"
name = "The World\u2019s Herald"
desc = "You can use your Wild Shape an unlimited number of times (except for elementals\n\nwhere you still need to spend Wild Shape uses like normal) but you still suffer the health\n\ndice penalty as normal. Additionally, when you are transformed with your Wild Shape\n\nability you ignore the verbal and somatic components of spells."


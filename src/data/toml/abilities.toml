selection = "Primary"
name = "Sacred Oath (Test their Mettle)"
desc = "Your oath allows you to channel divine energy to fuel magical effects. Each Channel Divinity option provided by your oath explains how to use it.\nWhen you use your Channel Divinity, you choose which option to use. You must then finish a short or long rest to use your Channel Divinity again. After 6 level picks of [Divine Oath] you can use it twice per day, and after 18 level picks of [Divine Oath] thrice.\nSome Channel Divinity effects require saving throws. When you use such an effect from this class, the DC equals your spell save DC.\nIn addition, you may expend a use of Channel Divinity as a bonus action to regain one expended spell slot of the first level.\n- Riahn: You gain the following two Channel Divinity options.\nAs an action, you can taunt an enemy. A creature of your choice within 6 m of you must make a Composure saving throw. On a failed save, it can't willingly move more than 6 m away from you. This effect ends if you are incapacitated, dead or if the creature was unwillingly moved more than 6 m away from you."


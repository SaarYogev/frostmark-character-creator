name = "Favored Enemy"
desc = "Choose one creature type between, animal, beast, celestial, construct, dragon, elemental, fey, fiend, giant, human, humanoid, monstrosity, ooze, plant, or undead. Against the creature type of choice you receive a number of benefits:\nWhen you do a weapon attack against your creature type you receive a +2 bonus to both attack rolls and damage rolls.\nAdvantage to any Survival checks you perform to track the creature type of your choice.\nAdvantage to any Intelligence checks to recall information about the creature type of choice."

[[abilities]]

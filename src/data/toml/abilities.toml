[[abilities]]
origin = "Tactics"
level = 18
selection = "Primary"
name = "Martial Archetype (Bruiser)"
desc = "**Last One Standing**\n\nUnless you have more than half your health points\n\nleft or you are incapacitated, you regain health points equal to 5 + your Vitality\n\nmodifier (minimum of +1) at the start of each of your turns. You do not gain this\n\nbenefit if you have 0 health points. In addition, upgrade your Savage Aggression\u2019s\n\nbonus damage one step. If you have taken all Savage Aggression abilities before\n\nthis one you gain a 1d10 instead of a 1d8."

[[abilities]]
origin = "Tactics"

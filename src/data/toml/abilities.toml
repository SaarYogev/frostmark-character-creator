[[abilities]]
origin = "Soul Oath"
level = 20
selection = "Primary"
name = "Peerless Charge"
desc = "Whenever you use the Charger feat you gain advantage on the attack and an improved critical range of 18-20. In addition, if you roll a critical hit on a charge attack while mounted, the target is stunned for 1d4 rounds."

[[abilities]]
origin = "Soul Oath"
level = 20
selection = "Primary"
name = "Oaths (Threat)"
desc = "When you pick the Threaten ability or a Vow ability, you must choose an Oath and follow its decrees. If your GM considers you have broken your Oath, you lose the ability to Threaten. You can reclaim the ability to do so if you repent in a way your GM finds acceptable.\nAegis\nYou devote yourself to protect those who cannot protect themselves. Defending the common folk from danger and exploitation. You must offer your help when the meek calls for you, and give alms when needed. You cannot endanger or hurt the defenseless.\nWhen you Threaten a creature you receive a +2 bonus to attack rolls against the creature you have Threatened. The bonus to attack rolls increases with +1 for every 6 level picks of [Soul Oath].\nAspiration\nYou swear an oath to yourself only and you care foremost about your own needs and goals. If the opportunity presents itself, you cannot refuse the chance to elevate yourself, be it wealth, status, or power. You cannot decline a reward or sacrifice your objectives for another cause."

[[abilities]]
origin = "Soul Oath"
level = 20
selection = "Primary"
name = "Oaths (Threat)"
desc = "When you pick the Threaten ability or a Vow ability, you must choose an Oath and follow its decrees. If your GM considers you have broken your Oath, you lose the ability to Threaten. You can reclaim the ability to do so if you repent in a way your GM finds acceptable.\nAegis\nYou devote yourself to protect those who cannot protect themselves. Defending the common folk from danger and exploitation. You must offer your help when the meek calls for you, and give alms when needed. You cannot endanger or hurt the defenseless.\nIf an ally would successfully hit the creature you have Threatened with a weapon attack, you may immediately spend a reaction and make a weapon attack of your own against that Threatened creature. You do not add your ability score modifier to the damage roll for the purposes of this weapon attack.\nChivalry\nYou devote your life to the Sacred Code, upholding its tenets to the best of your abilities.\n\"I will keep faith in the face of hopelessness\nBe honest against my own benefit\nValorous despite my fear\nRemain loyal to my oaths\nBe honorable until my soul leaves me\nAnswer any challenge that stands before me\nAnd protect the weak and the deserving\""

[[abilities]]
origin = "Soul Oath"
level = 20
selection = "Primary"
name = "Oaths (Threat)"
desc = "When you pick the Threaten ability or a Vow ability, you must choose an Oath and follow its decrees. If your GM considers you have broken your Oath, you lose the ability to Threaten. You can reclaim the ability to do so if you repent in a way your GM finds acceptable.\nAegis\nYou devote yourself to protect those who cannot protect themselves. Defending the common folk from danger and exploitation. You must offer your help when the meek calls for you, and give alms when needed. You cannot endanger or hurt the defenseless.\nAgainst creatures that have a higher CR rating than you do or are one size larger than you, you receive +2 to your attack rolls and +2 bonus to your weapon attack damage against the creature if you have Threatened it. Every 6 level picks of [Soul Oath] both bonuses increase with +1.\nLoyalty\nYou devote yourself to the virtue of loyalty, you commit yourself to a cause or a small number of allies, always having their back. All for one, and one for all. You must always offer aid to those you are loyal to, in or out of combat, even sacrificing yourself if necessary."

[[abilities]]
origin = "Soul Oath"
level = 20
selection = "Primary"
name = "Oaths (Threat)"
desc = "When you pick the Threaten ability or a Vow ability, you must choose an Oath and follow its decrees. If your GM considers you have broken your Oath, you lose the ability to Threaten. You can reclaim the ability to do so if you repent in a way your GM finds acceptable.\nAegis\nYou devote yourself to protect those who cannot protect themselves. Defending the common folk from danger and exploitation. You must offer your help when the meek calls for you, and give alms when needed. You cannot endanger or hurt the defenseless.\nYour allies receive a +1 to their weapon attack rolls to hit the creature you have Threatened. Once per short rest, you can use the help action as a free action. You receive an additional free usage of the help action after 11 level picks of [Soul Oath] and the bonus your allies receive to hit increases to +2.\nTemplar\nYou devote yourself to an Enneade, its church, and its members. You must uphold the tenets of your Enneade, aid your church, and protect its members."


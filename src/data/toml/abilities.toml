name = "Channel Divinity"
desc = "For a short moment, you can channel the divine essence of your God through yourself. Channel Divinity abilities, shortened as “CD”, share these rules;\nYou must then finish a short or long rest to use your Channel Divinity again. After 7 level picks of [Devotion] you can use it twice per day, and after 14 level picks of [Devotion] thrice."

[[abilities]]
origin = "Devotion"
level = 3
selection = "Primary"
name = "Channel Divinity"
desc = "For a short moment, you can channel the divine essence of your God through yourself. Channel Divinity abilities, shortened as “CD”, share these rules;\nSome Channel Divinity effects require saving throws. When you use such an effect from this Origin, the DV equals your spell save DV."

[[abilities]]
origin = "Devotion"
level = 3
selection = "Primary"
name = "Channel Divinity"
desc = "For a short moment, you can channel the divine essence of your God through yourself. Channel Divinity abilities, shortened as “CD”, share these rules;\nYou may expend a use of Channel Divinity as a bonus action to regain one expended spell slot of first level.Pick according to your chosen Enneade’s Domains."

[[abilities]]
origin = "Devotion"
level = 3
selection = "Primary"
name = "Channel Divinity (Animation)"
desc = "For a short moment, you can channel the divine essence of your God through yourself. Channel Divinity abilities, shortened as “CD”, share these rules;\nCD Hope for the Hopeless: As an action, you can restore health points equal to five times your [Devotion] level. Choose any number of creatures within 6m of you, and divide those health points among them in a manner of your choice. You cannot use this ability on a construct or an undead."

[[abilities]]
origin = "Devotion"
level = 3
selection = "Primary"
name = "Channel Divinity (Athanasia)"
desc = "For a short moment, you can channel the divine essence of your God through yourself. Channel Divinity abilities, shortened as “CD”, share these rules;\nCD Hasten Demise: As an action, you choose one creature you can see within 1m of you, cursing it until the end of your next turn. The next time you or an ally of yours hits the cursed creature with an attack, the creature has vulnerability to all of that attack's damage, and then the curse ends."

[[abilities]]
origin = "Devotion"
level = 3
selection = "Primary"
name = "Channel Divinity (Battle)"
desc = "For a short moment, you can channel the divine essence of your God through yourself. Channel Divinity abilities, shortened as “CD”, share these rules;\nCD Moment of Destiny: You can use your Channel Divinity to grant yourself a +10 bonus to a failed attack roll, ability check, or saving throw of your choice."

[[abilities]]
origin = "Devotion"
level = 3
selection = "Primary"
name = "Channel Divinity (Chaos)"
desc = "For a short moment, you can channel the divine essence of your God through yourself. Channel Divinity abilities, shortened as “CD”, share these rules;\nCD Control the Chaos: After you finish a long rest, roll a 1d20 and record it. After a creature within 12m of you makes an attack roll, ability check or saving throw, you can use your reaction to replace the result of one 1d20 roll with your recorded number. The creature still adds their modifiers to the result."

[[abilities]]
origin = "Devotion"
level = 3
selection = "Primary"
name = "Channel Divinity (Community)"
desc = "For a short moment, you can channel the divine essence of your God through yourself. Channel Divinity abilities, shortened as “CD”, share these rules;\nCD Not So Fast: As an action, you can force each hostile creature within 6m of you to make a Dexterity saving throw. On a failed save, the creature is knocked prone or restrained (your choice) by animated objects in your vicinity, such as tangling plants, stonework falling over, or splashing water from wells or ponds. A restrained creature can escape by making a successful Athletics (Br/Dex) check (their choice) against your spell save DV."

[[abilities]]
origin = "Devotion"
level = 3
selection = "Primary"
name = "Channel Divinity (Creation)"
desc = "For a short moment, you can channel the divine essence of your God through yourself. Channel Divinity abilities, shortened as “CD”, share these rules;\nCD Metal Transmutation: You conduct a 1 minute ritual that crafts a nonmagical item that must include some metal: a weapon, a suit of armor, ten pieces of ammunition, a set of tools, or another metal object. The creation is completed at the end of the minute, coalescing in an unoccupied space of your choice on a surface within 1m of you.The thing you create can be something that is worth no more than 100 gp. As part of this ritual, you must lay out metal, which can include coins, with a value equal to the creation. The metal irretrievably coalesces and transforms into the creation at the ritual's end, magically forming even nonmetal parts of the creation. The ritual can create a duplicate of a nonmagical item that contains metal, such as a key, if you possess the original during the ritual."

[[abilities]]
origin = "Devotion"
level = 3
selection = "Primary"
name = "Channel Divinity (Curiosity)"
desc = "For a short moment, you can channel the divine essence of your God through yourself. Channel Divinity abilities, shortened as “CD”, share these rules;\nCD Avoid Failure: When you, or a creature of your choice within 6m of you that you can see, fail an attack roll, saving throw, or ability check, you may spend one Channel Divinity and a reaction to roll again. You, or the creature, must use the new result."

[[abilities]]

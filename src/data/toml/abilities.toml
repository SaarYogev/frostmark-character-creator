level = 3
selection = "Primary"
name = "Channel Divinity (Ruin)"
desc = "For a short moment, you can channel the divine essence of your God through yourself. Channel Divinity abilities, shortened as “CD”, share these rules;\nCD Ravage: When you hit a creature with a melee attack or a spell attack, you may deal extra damage to the creature equal to 5+ twice your level of [Devotion]."

[[abilities]]
origin = "Devotion"
level = 3
selection = "Primary"
name = "Channel Divinity (Sanguine)"
desc = "For a short moment, you can channel the divine essence of your God through yourself. Channel Divinity abilities, shortened as “CD”, share these rules;\nCD Let the Blood Speak: You can use your Channel Divinity to form a bond with a creature you can see, or with a creature for which you possess a blood sample. This bond lasts for 1 hour or until your concentration is broken (as if concentrating on a spell).While the bond is in effect, you can use an action to learn the target's approximate distance and direction from you, as well as the percentage of its remaining health points and any conditions affecting it, as long as the target is within 20km of you.Additionally, while the bond is in effect, as an action, you can surge the bond in two ways;You force the creature to spend their reaction to move up to their base movement speed to a location of your choice, and then the creature makes a weapon attack against a creature of your choice within range. Afterwards the bond ends and the creature is immune to this ability for 24 hours.Alternatively, you can use your action to attempt to connect with the target's senses. The target makes a Vitality saving throw against your spell save DV. Creatures who you don’t have a blood sample of, roll their saving throw with advantage. On a successful save, the bond ends. On a failure, you can choose to either see or hear through the target's senses for a number of minutes equal to your proficiency bonus. During this time, you are blinded or deafened (respectively) with regard to your own senses. Regardless of the outcome, the target feels a wave of unease pass over it when it makes this save. When the connection ends, the bond is lost and the creature is immune to this ability for 24 hours."

[[abilities]]

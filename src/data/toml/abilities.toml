desc = "Choose another creature type for a second Favored Enemy. If you have two Favored Enemy creature types, damage you deal with your Favored Enemies increases to +4 and you gain advantage on all saving throws you make against abilities, traits, and spells your Favored Enemy uses."

[[abilities]]
origin = "Predator"
level = 7
selection = "Primary"
name = "Conclave (Butcher of Behemoths)"
desc = "Marked Foe: Mark one creature within 12 m that you can see and spend a bonus action. Once on each of your turns, the first successful weapon attack you make against your marked creature gains more damage. The damage increases with a 1d8 and after eleven level picks of [Predator] it increases to 2d8. This bonus lasts until you are incapacitated or your marked creature is. You can also dismiss this effect with a bonus action. You can mark one creature with this ability once per long rest."


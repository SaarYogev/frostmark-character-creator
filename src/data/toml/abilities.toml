name = "General Upgrade"
desc = "20 Potential"

[[abilities]]
origin = "Devotion"
level = 19
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Devotion"
level = 20
selection = "Primary"
name = "Greater Aid of the Gods"
desc = "Your Aid of the Gods ability succeeds automatically, no roll required."

[[abilities]]
origin = "Discipline"
level = 1
selection = "Primary"
name = "Martial Arts"
desc = "You gain the following benefits while you are unarmed or wielding a quarterstaff, and you aren't wearing armor or wielding a shield:\nWhen you make a melee weapon attack or an unarmed attack, you may use your Dexterity modifier instead of your Brawn modifier to hit and deal damage.\nYou may change the damage die of your unarmed strike or quarterstaff weapon to a 1d4. This die increases as you pick levels in [Discipline], to a 1d6 after 5 level picks, 1d8 after 11 level picks, and a 1d10 after 17 level picks.\nWhen you attack unarmed or with a quarterstaff, you can make one unarmed strike as a bonus action."

[[abilities]]
origin = "Discipline"
level = 1
selection = "Secondary"
name = "Unarmored defense"
desc = "While you are not wearing any armor or wielding a shield, your armor class equals 10 + your Dexterity modifier + your Composure modifier. The Dexterity and the Composure modifier cannot exceed your proficiency bonus individually."

[[abilities]]
origin = "Discipline"
level = 2
selection = "Primary"
name = "Mastery (Abilities)"
desc = "You have gained a singularly pure connection to your Soul which allows you to draw upon Soul power within to strengthen and empower your body. You gain a number of Mastery points. Your [Discipline] level determines the number of points you have. When you pick this ability you gain 2 Mastery points and for every level pick of [Discipline] after this one, this increases by 1. Mastery points possess these features:\nYou can spend Mastery point to fuel certain abilities. When you take this ability you gain five such abilities. You can learn more Mastery abilities as you pick levels in [Discipline]."

[[abilities]]
origin = "Discipline"
level = 2
selection = "Primary"
name = "Mastery (Recover)"
desc = "You have gained a singularly pure connection to your Soul which allows you to draw upon Soul power within to strengthen and empower your body. You gain a number of Mastery points. Your [Discipline] level determines the number of points you have. When you pick this ability you gain 2 Mastery points and for every level pick of [Discipline] after this one, this increases by 1. Mastery points possess these features:\nYou regain all expended Mastery points when you finish a short or long rest. During these rests, you must spend at least 30 minutes meditating to allow your Soul to recover, and in extension regenerate your Mastery points."

[[abilities]]
origin = "Discipline"
level = 2
selection = "Primary"
name = "Mastery (Saving Throws)"
desc = "You have gained a singularly pure connection to your Soul which allows you to draw upon Soul power within to strengthen and empower your body. You gain a number of Mastery points. Your [Discipline] level determines the number of points you have. When you pick this ability you gain 2 Mastery points and for every level pick of [Discipline] after this one, this increases by 1. Mastery points possess these features:\nSome of your Mastery abilities requires your target to make a saving throw to resist the ability's effects. Your Mastery DC equals 8 + your proficiency modifier + your Composure modifier.\nYou gain these Mastery abilities:"

[[abilities]]
origin = "Discipline"
level = 2
selection = "Primary"
name = "Mastery (Farseeing)"
desc = "You have gained a singularly pure connection to your Soul which allows you to draw upon Soul power within to strengthen and empower your body. You gain a number of Mastery points. Your [Discipline] level determines the number of points you have. When you pick this ability you gain 2 Mastery points and for every level pick of [Discipline] after this one, this increases by 1. Mastery points possess these features:\nUntil the end of your next turn, by spending 1 Mastery point you may ignore disadvantage imposed when attacking with a ranged weapon at long range."

[[abilities]]
origin = "Discipline"
level = 2
selection = "Primary"
name = "Mastery (Greater Aggression)"
desc = "You have gained a singularly pure connection to your Soul which allows you to draw upon Soul power within to strengthen and empower your body. You gain a number of Mastery points. Your [Discipline] level determines the number of points you have. When you pick this ability you gain 2 Mastery points and for every level pick of [Discipline] after this one, this increases by 1. Mastery points possess these features:\nImmediately after you take the attack action on your turn, you can spend 1 Mastery point to make two unarmed strikes as a bonus action."

[[abilities]]
origin = "Discipline"
level = 2
selection = "Primary"
name = "Mastery (Greater Agility)"
desc = "You have gained a singularly pure connection to your Soul which allows you to draw upon Soul power within to strengthen and empower your body. You gain a number of Mastery points. Your [Discipline] level determines the number of points you have. When you pick this ability you gain 2 Mastery points and for every level pick of [Discipline] after this one, this increases by 1. Mastery points possess these features:\nIf you spend 1 Mastery point, your jump distance is doubled for the turn and as a bonus action you can take the disengage or dash action as a bonus action on your turn."

[[abilities]]
origin = "Discipline"
level = 2
selection = "Primary"
name = "Mastery (Greater Reflexes)"
desc = "You have gained a singularly pure connection to your Soul which allows you to draw upon Soul power within to strengthen and empower your body. You gain a number of Mastery points. Your [Discipline] level determines the number of points you have. When you pick this ability you gain 2 Mastery points and for every level pick of [Discipline] after this one, this increases by 1. Mastery points possess these features:\nYou can use the dodge action as a bonus action on your turn if you spend 1 Mastery point."

[[abilities]]
origin = "Discipline"
level = 2
selection = "Primary"
name = "Mastery (Self)"
desc = "You have gained a singularly pure connection to your Soul which allows you to draw upon Soul power within to strengthen and empower your body. You gain a number of Mastery points. Your [Discipline] level determines the number of points you have. When you pick this ability you gain 2 Mastery points and for every level pick of [Discipline] after this one, this increases by 1. Mastery points possess these features:\nHealing: As a bonus action, you may spend 2 Mastery points to regain hit points equal to 1d6 + your proficiency modifier."

[[abilities]]
origin = "Discipline"
level = 2
selection = "Secondary"
name = "Unburdened Celerity"
desc = "Your walking speed increases by 2 m if you are not wearing armor or wielding a shield. This bonus increases after a certain amount of [Discipline] level picks, to 3 m after 6 level picks, 4 m after 10 level picks, 5 m after 14 level picks, and 6 m after 18 levels.\nAfter 9 level picks of [Discipline], you gain the ability to move along vertical surfaces and across liquids on your turn without falling during the move."

[[abilities]]
origin = "Discipline"
level = 3
selection = "Primary"
name = "Mold Soul (Embodiment of Enlightenment)"
desc = "Radiant Bolt: As a ranged spell attack, you can hurl a ball of Soul energy at an enemy. The spell attack has a range of 6 m, you are proficient with it, and you add your Dexterity modifier to its attack and damage rolls. Radiant Bolt deals 1d4 radiant damage (plus your Dexterity modifier). The damage of Radiant Bolt increases as you pick levels in [Discipline] equal to how your unarmed strikes and quarterstaff gains damage from the Martial Arts ability.\nIn addition, when you take the attack action on your turn and use this ranged spell attack as part of it, you can spend 1 Mastery point to make the spell attack twice as a bonus action. If you pick the Extra Attack ability, this spell attack can be used for any of the attacks you make as part of the attack action."

[[abilities]]
origin = "Discipline"
level = 3
selection = "Primary"
name = "Mold Soul (Embodiment of Inevitability)"
desc = "Silver Lining: When you reduce a creature within 1 m of you to 0 hit points, you gain temporary hit points equal to your Composure modifier + your [Discipline] level (minimum 1)."

[[abilities]]
origin = "Discipline"
level = 3
selection = "Primary"
name = "Mold Soul (Embodiment of Serenity)"
desc = "Channel Soul: Whenever you hit a creature with one of the attacks granted by your Greater Aggression, you can impose one of the following effects on that target:\nIt must succeed on a Dexterity saving throw or be knocked prone.\nIt must make a Brawn saving throw or be pushed 3 m away from you.\nIt cannot take reactions until the end of your next turn."

[[abilities]]
origin = "Discipline"
level = 3
selection = "Primary"
name = "Mold Soul (Embodiment of Solemnity)"
desc = "Spell Mastery: You can cast Minor Illusion as Soul Mastery. In addition, you can cast Darkness, Darkvision, Pass Without Trace, and Silence as Soul Mastery by spending 2 Mastery points."

[[abilities]]
origin = "Discipline"
level = 3
selection = "Primary"
name = "Mold Soul (Embodiment of Triumph)"
desc = "Extension of the Soul: On the path of finding complete harmony with your Soul, you practice your discipline in the heat of battle. You gain the following benefits:"

[[abilities]]
origin = "Discipline"
level = 3
selection = "Primary"
name = "Mold Soul (Mastery Weapons)"
desc = "Choose one ranged weapon and one melee weapon to be your Mastery Weapons. Your Mastery Weapons can be any weapon that lacks the heavy and special properties (the longbow is an exception to this rule). You gain proficiency with these weapons if you do not already possess them. Many abilities in the Embodiment of Triumph requires the use of your Mastery Weapons. After you have picked 6 levels, 11 levels, and 17 levels of [Discipline], you can choose another ranged or melee weapon to be counted as a Mastery Weapon for you, following the limitations above."

[[abilities]]
origin = "Discipline"
level = 3
selection = "Primary"
name = "Mold Soul (Defensive Arms)"
desc = "If you make an unarmed strike as part of the attack action on your turn and you are wielding a melee Mastery Weapon, you gain a +2 bonus to your AC until the start of your next turn. During this time the weapon must be in your hand and you cannot be incapacitated."

[[abilities]]
origin = "Discipline"
level = 3
selection = "Primary"
name = "Mold Soul (Deadly Shot)"
desc = "As a bonus action, you may increase the damage of your ranged weapon attacks with an extra 1d4 of the weapon’s damage type. You keep this benefit until the end of your current turn."

[[abilities]]
origin = "Discipline"
level = 3
selection = "Secondary"
name = "Deflect Missiles"
desc = "As a reaction, you can reduce the damage of a ranged weapon attack targeting you by 1d10 + Dexterity modifier + your [Discipline] level. If you reduce the damage to 0, you can catch the missile if it is small enough for you to hold in one hand and you have at least one hand free.\nIf you reduce the damage to 0, you can catch the missile if it is small enough for you to hold in one hand and you have at least one hand free. If you catch a missile in this way, you can spend 1 Mastery point to make a ranged attack (4/6 m) with the weapon or piece of ammunition you just caught, as part of the same reaction. You make this attack with proficiency, and the missile counts as unarmed for the attack."

[[abilities]]
origin = "Discipline"
level = 4
selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Discipline"
level = 5
selection = "Primary"
name = "Extra Attack"
desc = "As part of your attack action, you can make two attacks instead of one. You must possess at least 1 level of [Discipline] to be eligible for this ability (excluding this level)."

[[abilities]]
origin = "Discipline"
level = 5
selection = "Primary"
name = "Stunning Strike"
desc = "When you hit another creature with a melee weapon attack, you can spend 1 Mastery point to attempt a Stunning Strike. The target must succeed on a Vitality saving throw or be stunned until the end of your next turn."

[[abilities]]
origin = "Discipline"
level = 6
selection = "Primary"
name = "Soul-Infused Strikes"
desc = "Your unarmed strikes count as magical for the purpose of overcoming resistance and immunity to non-magical attacks and damage."

[[abilities]]
origin = "Discipline"
level = 6
selection = "Primary"
name = "Mold Soul (Embodiment of Enlightenment)"
desc = "Fiery Outburst: Immediately after you take the attack action on your turn, you can spend 2 Mastery points to cast the Burning Hands spell as a bonus action and Soul Mastery.\nYou can spend additional Mastery points to cast Burning Hands as a higher-level spell. Each additional Mastery point you spend increases the spell's level by 1. The maximum number of Mastery points (2 plus any additional points) that you can spend on the spell equals half your [Discipline] level."

[[abilities]]
origin = "Discipline"
level = 6
selection = "Primary"
name = "Mold Soul (Embodiment of Inevitability)"
desc = "Face Fate: As an action, each creature within 6 m of you that can see you must succeed on a Resolve saving throw or be frightened of you until the end of your next turn."

[[abilities]]
origin = "Discipline"
level = 6
selection = "Primary"
name = "Mold Soul (Embodiment of Serenity)"
desc = "Wholeness of Body: As an action, you can regain hit points equal to three times your [Discipline] level. You must finish a long rest before you can use this ability again."

[[abilities]]
origin = "Discipline"
level = 6
selection = "Primary"
name = "Mold Soul (Embodiment of Solemnity)"
desc = "Shadow Step: You gain the ability to step from one shadow into another. When you are in dim light or darkness, as a bonus action you can teleport up to 12 m to an unoccupied space you can see that is also in dim light or darkness. You then have advantage on the first melee attack you make before the end of the turn. You can use this ability a number of times equal to your Composure saving throw (minimum 1) per long rest."

[[abilities]]
origin = "Discipline"
level = 6
selection = "Primary"
name = "Mold Soul (Embodiment of Triumph)"
desc = "Master of Arms: Your mastery of your Soul and arms deepens, granting you the following benefits."

[[abilities]]
origin = "Discipline"
level = 6
selection = "Primary"
name = "Mold Soul (Magic Mastery Weapons)"
desc = "Your attacks with your Mastery Weapons count as magical for the purpose of overcoming resistance and immunity to nonmagical attacks and damage."

[[abilities]]
origin = "Discipline"
level = 6
selection = "Primary"
name = "Mold Soul (Soul Enchanted)"
desc = "When you hit a target with a Mastery Weapon, you can spend 1 Mastery point to cause the weapon to deal extra damage to the target equal to the damage die of unarmed strikes and the quarterstaff of your Martial Arts ability. You can use this ability only once on each of your turns."

[[abilities]]
origin = "Discipline"
level = 7
selection = "Primary"
name = "Evasion"
desc = "When you are subjected to an effect that allows you to make a Dexterity saving throw to take only half damage, you instead take no damage if you succeed on the saving throw, and only half damage if you fail."

[[abilities]]
origin = "Discipline"
level = 7
selection = "Primary"
name = "Stillness of Mind"
desc = "As an action, you can end one effect on yourself that causes you to be charmed or frightened."

[[abilities]]

selection = "Primary"
name = "Divine Domain (Curiosity)"
desc = "Pick according to your chosen Enneade’s Domains.\nThe Right Tools: As a bonus action, you may temporarily exchange one skill, saving throw or spell for the day. All exchanges revert back to normal when you finish a long rest. You cannot exchange a saving throw, skill or spell to the same saving throw, skill, or spell between two consecutive long rests."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Saving Throw)"
desc = "Pick according to your chosen Enneade’s Domains.\nChoose one saving throw you possess, you temporarily lose proficiency with it. Choose one saving throw you don’t possess, you temporarily gain proficiency with it."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Skill)"
desc = "Pick according to your chosen Enneade’s Domains.\nChoose one skill you possess at Rank 2 or lower. You may move the ranks associated with that skill to a Skill you have lower to no ranks in. After 7 [Devotion] levels you may exchange a skill of Rank 3 or lower. After 14 [Devotion] levels you may exchange a skill of Rank 4 or lower."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Spell)"
desc = "Pick according to your chosen Enneade’s Domains.\nChoose one spell you possess of level 3 or below. You may lose it as a spell known and gain a new spell known of the same level you gave up. After 7 [Devotion] levels you may exchange a spell of 4th level or below. After 14 [Devotion] levels you may exchange a spell of 5th level or below."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Deceit)"
desc = "Pick according to your chosen Enneade’s Domains.\nGrace of Agility: You can touch one willing creature to give them advantage with one skill that uses Dexterity for an hour. Whenever that creature rolls the skill with Dexterity, they have advantage on the roll. You can touch them again to reset the period, or change which skill it affects."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Destiny)"
desc = "Pick according to your chosen Enneade’s Domains.\nGuide the Path: You gain the Augury and Guidance spells as Soul Mastery, and you can cast Augury once per long rest. When you cast the spells with Soul Mastery, they gain these benefits;"

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain"
desc = "Pick according to your chosen Enneade’s Domains.\nYou can cast Guidance in touch range as the spell describes, or cast it with a range of 6m. If you cast the spell at a distance the creature must be able to hear you."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain"
desc = "Pick according to your chosen Enneade’s Domains.\nAugury’s casting time changes to instantaneous.In addition, when you cast a divination spell that includes a chance the spell gives you no answer or a random reading, such as Augury, Commune, or Divination, reduce that chance by 25 percent."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Dusk)"
desc = "Pick according to your chosen Enneade’s Domains.\nPierce the Gloom: You gain darkvision with a range of 24m. In that radius, you can see in dim light as if it were bright light and in darkness as if it were dim light.When you reach total level 5, you can share your improved darkvision with other creatures: Once per long rest, as an action, you can designate a number of willing creatures up to your Intelligence or Resolve modifier (minimum 1) to gain your darkvision. When you designate the creatures they must be within 6m of you and you must be able to see them. As long as those creatures remain within 6m of you, they gain your darkvision for 10 minutes. If they temporarily leave this range and return, they regain the darkvision once they are within range again."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Law)"
desc = "Pick according to your chosen Enneade’s Domains.\nCall for Order: If you cast a spell of 1st level or higher and target an ally with that spell, that ally can use their reaction immediately after the casting to make one weapon attack against a viable creature of your choice that you can see. If the spell targets more than one ally, you choose the ally who can make the attack."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Lore)"
desc = "Pick according to your chosen Enneade’s Domains.\nSophisticated Mind: You learn two languages of your choice at Academics skill rank 2. You can also assign two skill points into two Academic and/or Art/Craft skills of your choice. You may gain rank 5 with those Academics or Art/Craft skills."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Might)"
desc = "Pick according to your chosen Enneade’s Domains.\nCheck Out These Guns: After you successfully hit a creature that is Large or smaller within 1m of you with an attack, you may use your bonus action to attempt to shove or grapple it. You can use this ability a number of times per long rest equal to your proficiency modifier.In addition, you count as one size larger when determining your carrying capacity and the weight you can push, drag, or lift."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Moon)"
desc = "Pick according to your chosen Enneade’s Domains.\nMoonlit Lucidity: When a creature within 6m of you that you can see makes a saving throw, you can use your reaction to grant that creature advantage on the save. You can use this ability a number of times equal to your proficiency bonus, regaining all expended uses when you finish a long rest."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Nature)"
desc = "Pick according to your chosen Enneade’s Domains.\nIn Tandem with Nature: You gain 10 Potency. You also gain four skill points to assign to Animal Handling, Academics: Nature, or Survival in a manner of your choice. You may gain rank 5 with the skills you spend skill points in through this ability."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Ocean)"
desc = "Pick according to your chosen Enneade’s Domains.\nThe Coming Tide: You can use your bonus action to magically push and pull other creatures. Choose another creature you can see within 6m. You may pull it 1m closer to you, or push it 1m away from you. This movement does not provoke attacks of opportunity. An unwilling creature can attempt to resist this effect by rolling a Brawn saving throw against your spell save DV.You can use this ability a number of times equal to your spellcasting modifier (minimum of 1). You regain all expended uses when you finish a long rest."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Passion)"
desc = "Pick according to your chosen Enneade’s Domains.\nShared Passion: You can use a bonus action on your turn to choose a creature other than yourself within 6m of you that can hear you. The creature possesses a “Passion” which it can use within the next 10 minutes to add your Resolve or Manipulation modifier to an attack roll or ability check of their choice. The creature can wait to use its Passion after it has rolled but must decide before the GM determines success or failure. You can use this ability a number of times per long rest equal to your proficiency bonus."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Preservation)"
desc = "Pick according to your chosen Enneade’s Domains.\nStalwart Defender: When a creature within melee range of you attacks a target other than you (and that target doesn't have this ability or the Sentinel feat), you can use your reaction to impose disadvantage to the target’s attack roll."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Radiance)"
desc = "Pick according to your chosen Enneade’s Domains.\nFlash!: As a reaction, you may impose disadvantage on a successful attack targeting you by a creature within 10m of you. You can use this ability a number of times equal to your Resolve or Presence modifier (minimum 1). You regain all expended uses when you finish a long rest."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Ruin)"
desc = "Pick according to your chosen Enneade’s Domains.\nScales of Life and Death: You learn one cantrip from the school of vismancy of your choice. When you cast a vismancy cantrip that normally targets only one creature, the spell can instead target two creatures within the range of the spell as long as the two creatures are within 2m of each other."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Sanguine)"
desc = "Pick according to your chosen Enneade’s Domains.\nLet the Blood Flow: When you cast a damage-dealing spell of 1st level or higher whose duration is instantaneous, any creature with blood that takes damage from the spell takes extra necrotic damage equal to 2+ the spell's level."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Storm)"
desc = "Pick according to your chosen Enneade’s Domains.\nTempestuous Retribution: When you are successfully attacked by a creature that you can see and is within 6m of you, you can spend your reaction to hurt them with a shock of lightning or blast of thunder. The creature must roll a Dexterity saving throw against your spell save DV. On a failed save, the creature takes your proficiency modifier times three of lightning or thunder damage (your choice), and half as much damage on a successful one. You can use this ability a number of times equal to your proficiency modifier. You regain all expended uses when you finish a long rest."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Thaumaturgy)"
desc = "Pick according to your chosen Enneade’s Domains.\nMagical Instruction: You gain two skill points in the Occult skill, and you may gain rank 5 in this skill. Choose one level 1 spell, you may cast it as Soul Mastery once per day (you can not upcast it past level 1). In addition, you gain 20 Potential."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Unity)"
desc = "Pick according to your chosen Enneade’s Domains.\nStronger Together: After you cast a spell of 1st level or higher that targets an ally, that ally gains resistance to the first damage it takes until the beginning of your next turn. A targeted ally must be within 2m of you when the damage is dealt to gain the resistance."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Secondary"
name = "Divine Domain (Animation, Law, or Unity)"
desc = "Bonus Proficiency Armor: You gain proficiency with heavy armor."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Secondary"
name = "Divine Domain (Athanasia)"
desc = "Vision of Souls: As Soul Mastery, you may cast Detect Soul Aspects once per long rest."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Secondary"
name = "Divine Domain (Battle)"
desc = "Bonus Proficiency Armor or Weapon: You gain proficiency with heavy armor or one group of weapons worth 3 Accomplishment points."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Secondary"
name = "Divine Domain (Chaos, Passion, Ruin, or Sanguine)"
desc = "Bonus Proficiency Weapon: You gain proficiency with one group of weapons worth 3 Accomplishment points."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Secondary"
name = "Divine Domain (Community)"
desc = "Bonus Proficiency Social Skills: You gain 3 skill points that you can assign to the Deception, Empathy, Leadership and/or Persuasion skills in a manner of your choice. You may gain rank 5 in the skills you assign skill points to through this ability."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Secondary"
name = "Divine Domain (Creation)"
desc = "Bonus Proficiency Armor or Utility Skill: You gain proficiency with heavy armor or four skill points in an Art or Craft skill of your choice that you may gain rank 5 in."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Secondary"
name = "Divine Domain (Curiosity)"
desc = "Bonus Skill Points: You gain three skill points."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Secondary"
name = "Divine Domain"
desc = "Deceit, Lore, Moon, Radiance, Storm, or Thaumaturgy - Bonus Accomplishment: You gain 3 Accomplishment points."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Secondary"
name = "Divine Domain (Destiny)"
desc = "Saw it Coming: Your initiative modifier gains a bonus equal to your spellcasting modifier."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Secondary"
name = "Divine Domain (Dusk)"
desc = "Prepared for Anything: As an action, you give one creature you touch advantage on the next initiative roll the creature makes. This benefit ends immediately after the roll or if you use this ability again."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Secondary"
name = "Divine Domain (Might)"
desc = "Unarmored Defense: As long as you are not wearing armor or wielding a shield, your armor class equals 10 + your Vitality modifier + your Presence/Resolve modifier. The Vitality and the Presence/Resolve modifier cannot exceed your proficiency bonus individually."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Secondary"
name = "Divine Domain (Nature)"
desc = "Beast Speech: You gain the ability to understand the speech of animals, beasts and plants, and they understand you. The animals, beasts and plants are limited in their ability to communicate and understand in accordance with their intelligence and physical ability."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Secondary"
name = "Divine Domain (Ocean)"
desc = "Come Swim With Me: You gain a swimming speed of 6m. When you reach total level 5, you can share your swimming speed with other creatures: Once per short rest, you can magically extend this benefit to any number of creatures you can see within 6m of you. The shared benefit lasts one hour."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Secondary"
name = "Divine Domain (Preservation)"
desc = "Bonus Cantrip: You can cast Resistance as Soul Mastery and it has a range of 6m. Once per short rest you can cast it as a bonus action."

[[abilities]]
origin = "Devotion"
level = 2
selection = "Primary"
name = "General Upgrade"
desc = "One point to use in the Accomplishment section or to store for later purchase in the same section"

[[abilities]]

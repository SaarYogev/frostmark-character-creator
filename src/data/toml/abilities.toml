level = 1
selection = "Secondary"
name = "Natural Explorer"
desc = "Your soul vibrates at the same frequency as the natural world. When you take this ability you gain advantage on attack rolls against creatures who have not yet acted on your first turn in combat. You gain advantage to initiative rolls and you ignore difficult terrain. When you travel for an hour or more you and your group receive the following benefits:\nDifficult Terrain doesn't slow your group's travel.\nYour group can't become lost except by magical means.\nEven when you are engaged in another activity while traveling, you remain alert to danger.\nIf you are traveling alone, you can move stealthily at a normal pace.\nWhen you forage, you find twice as much food as you normally would.\nWhile tracking other creatures, you also learn their exact number, their sizes, and how long ago they passed through the area."


[[abilities]]
origin = "Devotion"
level = 10
selection = "Primary"
name = "Aid of the Gods"
desc = "You can call out to your Enneade to ask for aid. Describe the assistance you seek, and\n\nroll percentile dice. If you roll a number equal to or lower than your level in [Devotion],\n\nyour Enneade offers aid. The GM chooses the nature of the aid. If your deity offers aid,\n\nyou can't use this ability again for 7 days. Otherwise, you can use it again after you finish\n\na long rest."

[[abilities]]

[[abilities]]
origin = "Divine Oath"
level = 3
selection = "Primary"
name = "Sacred Oath"
desc = "Your oath allows you to channel divine energy to fuel magical effects. Each\n\nChannel Divinity option provided by your oath explains how to use it.\n\nWhen you use your Channel Divinity, you choose which option to use. You must\n\nthen finish a short or long rest to use your Channel Divinity again. After 6 level\n\npicks of [Divine Oath] you can use it twice per day, and after 18 level picks of\n\n[Divine Oath] thrice.\n\nSome Channel Divinity effects require saving throws. When you use such an\n\neffect from this class, the DV equals your spell save DV.\n\nIn addition, you may expend a use of Channel Divinity as a bonus action to regain\n\none expended spell slot of the first level.\n\n- Riahn: You gain the following two Channel Divinity options.\n\n  * Sacred Weapon: As an action, for 10 rounds you add your Resolve\n\nmodifier to attack rolls made with a weapon of your choice (with a\n\nminimum bonus of +1). The weapon also emits bright light in a 4 m\n\nradius and dim light 4 m beyond that. If the weapon is not already\n\nmagical, it becomes magical for the duration. You can end this\n\neffect on your turn as a bonus action. If you are no longer holding or\n\ncarrying this weapon, or if you fall unconscious, this effect ends.\n\n  * Turn the Unholy: You can force any undead or fiends within 6 m of\n\nyou to make a Resolve saving throw or become turned as an action.\n\nOn a failed save, the creature is turned for 10 rounds or until it takes\n\ndamage. A turned creature suffer a number of penalties:\n\n\u25aa It cannot take reactions.\n\n\u25aa Every turn the creature is turned it must move as far as\n\npossible away from you.\n\n\u25aa It cannot willingly move within 6 m of you.\n\n\u25aa Any actions it takes must be dash actions to try and escape\n\nfrom you and the effect\n\n\u25aa If it cannot move further away from you, it can only use the\n\ndodge action.\n\n\u25aa If the creature is using an illusion or a shapeshifting effect to\n\nconceal its true form, its true form is revealed as long as it is\n\nturned.\n\n- Gera: You gain the following two Channel Divinity options.\n\n  * Burgeoning Tangle: You can attempt to restrain a creature within 2\n\nm of you by causing magical vines to spring forth as an action. The\n\ntarget breaks free from the vines, which vanishes) if it succeeds on a\n\nBrawn or Dexterity saving throw (it\u2019s choice). While restrained by\n\nthe vines, the creature repeats the saving throw at the end of each\n\nof its turns.\n\n  * Alpha\u2019s Dominance: You can force any undead or constructs within\n\n6 m of you to make a Resolve saving throw or become turned as an\n\naction. On a failed save, the creature is turned for 10 rounds or until\n\nit takes damage. A turned creature suffer a number of penalties:\n\n\u25aa It cannot take reactions.\n\n\u25aa Every turn the creature is turned it must move as far as\n\npossible away from you.\n\n\u25aa It cannot willingly move within 6 m of you.\n\n\u25aa Any actions it takes must be dash actions to try and escape\n\nfrom you and the effect.\n\n\u25aa If it cannot move further away from you, it can only use the\n\ndodge action.\n\n\u25aa If the creature is using an illusion or a shapeshifting effect to\n\nconceal its true form, its true form is revealed as long as it is\n\nturned.\n\n- Teranis: You gain the following two Channel Divinity options.\n\n  * Calculated Strike: After you make an attack roll, but before the GM\n\ndeclares it to be a hit or a miss, you may add +10 to the result of\n\nyour roll.\n\n  * Mantle of Anguish: As an action, you can force one creature of your\n\nchoice within 6 m of you to make a Resolve saving throw or become\n\nfrightened of you. This condition lasts for 10 rounds or until the\n\ncreature succeeds on another Resolve saving throw they can make\n\nif they are more than 6 m away from you at the end of their turn. If\n\nthe creature cannot move more than 6 m away from you, it can still\n\nroll the saving throw if it has moved as far away as possible away\n\nfrom you.\n\n- Lapuana: You gain the following two Channel Divinity options.\n\n  * Test their Mettle: As an action, you can taunt an enemy. A creature\n\nof your choice within 6 m of you must make a Composure saving\n\nthrow. On a failed save, it can't willingly move more than 6 m away\n\nfrom you. This effect ends if you are incapacitated, dead or if the\n\ncreature was unwillingly moved more than 6 m away from you.\n\n  * A New Beginning: You can restore a number of health points equal\n\nto 1d6 + your Presence modifier to each creature of your choice\n\nwithin 6 m of you as a bonus action. You can only restore health\n\npoints of creatures who currently have no more than half of its\n\nhealth points this way.\n\n- Borias: You gain the following two Channel Divinity options.\n\n  * Subdue the Unliving: As an action, you can force one undead\n\ncreature of your choice within 6 m of you to make a Resolve saving\n\nthrow or be forced to follow your commands. This effect lasts for 24\n\nhours or until you use this Channel Divinity option again. You\n\ncannot target an undead creature with a challenge rating that is\n\nequal to, or greater than your [Divine Oath] level with this ability.\n\n  * Mantle of Power: As an action, you can force one creature of your\n\nchoice within 6 m of you to make a Resolve saving throw or become\n\nfrightened of you. This condition lasts for 10 rounds or until the\n\ncreature succeeds on another Resolve saving throw they can make\n\nif they are more than 6 m away from you at the end of their turn. If\n\nthe creature cannot move more than 6 m away from you, it can still\n\nroll the saving throw if it has moved as far away as possible away\n\nfrom you.\n\n- Suhlmis: You gain the following two Channel Divinity options.\n\n  * Disarming Smile: As an action, you can force one creature of your\n\nchoice within 12 m of you to make a Composure saving throw or\n\nbecome charmed by you for 10 rounds. Humans worshipping\n\nTeranis and Enna of Teranis suffer disadvantage on this saving\n\nthrow. While charmed, the creature's speed is 0, and It can't benefit\n\nfrom any bonus to its speed. At the end of each of the creature\u2019s\n\nturns, it can repeat the saving throw to end this effect on itself.\n\n  * Act of Aggression: You can target one creature of your choice\n\nwithin 2 m of you with your Aggression as a bonus action. You gain\n\nadvantage on attack rolls for 10 rounds against a creature targeted\n\nthis way, or until the creature is defeated.\n\n- Vegomo: You gain the following two Channel Divinity options.\n\n  * Peaceful Solution: You can grant yourself a +5 bonus to Persuasion\n\n(Pre) checks for 10 minutes as a bonus action.\n\n  * Pacify: Immediately after another creature within 6 m of you is\n\ndealt damage from an attack that did not originate from you, you\n\ncan spend your reaction to force the attacker to make a Resolve\n\nsaving throw. On a failed save, the attacker takes psychic damage\n\nequal to the damage it just dealt. On a successful save, it takes half\n\nas much damage."

[[abilities]]
origin = "Divine Oath"
level = 3
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later\n\npurchase in the same section\n\n- 10 Potential"

[[abilities]]
origin = "Divine Oath"
level = 4
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a\n\nfeat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Divine Oath"
level = 5
selection = "Primary"
name = "Extra Attack"
desc = "As part of your attack action, you can make two attacks instead of one. You must\n\npossess at least 1 level of [Divine Oath] to be eligible for this ability (excluding\n\nthis level)."

[[abilities]]
origin = "Divine Oath"
level = 6
selection = "Primary"
name = "Aura of Protection"
desc = "Whenever you or a friendly creature within 2 m of you must make a saving\n\nthrow, the creature gains a bonus to the saving throw equal to your Presence\n\nmodifier (minimum 1 but maximum +3). You must be conscious to grant this\n\nbonus. At 18th total level, the range of this aura increases to 6 m."

[[abilities]]
origin = "Divine Oath"
level = 7
selection = "Primary"
name = "Sacred Oath (Riahn)"
desc = "**Aura of Radiant Awe**\n\nYou and friendly creatures within 2 m of you\n\nhave advantage on mental and social saving throws while you are\n\nconscious. At 18th total level, the range of this aura increases to 6 m."

[[abilities]]
origin = "Divine Oath"
level = 7
selection = "Primary"
name = "Sacred Oath (Gera)"
desc = "**Defender of the Pack**\n\nWhen a creature within 2 m of you takes\n\ndamage, you can use your Reaction to magically take that damage, instead\n\nof that creature taking it. This ability doesn't transfer any other effects\n\nthat might accompany the damage, and this damage can't be reduced in\n\nany way. At 18th total level, the range of this aura increases to 6 m."

[[abilities]]
origin = "Divine Oath"
level = 7
selection = "Primary"
name = "Sacred Oath (Teranis)"
desc = "**Scheming Generosity**\n\nYou, your allies, any celestial and fiends\n\nwithin 2 m of you, gain a bonus to their weapon damage rolls equal to your\n\nCunning modifier (minimum 1). A creature can benefit from this ability\n\nfrom only one source at a time. At 18th total level, the range of this aura\n\nincreases to 6 m."

[[abilities]]
origin = "Divine Oath"
level = 7
selection = "Primary"
name = "Sacred Oath (Lapuana)"
desc = "**Harmony**\n\nWhen a creature within 2 m of you takes damage,\n\nyou can use your Reaction to magically take that damage, instead of that\n\ncreature taking it. This ability doesn't transfer any other effects that might\n\naccompany the damage, and this damage can't be reduced in any way. At\n\n18th total level, the range of this aura increases to 6 m."

[[abilities]]
origin = "Divine Oath"
level = 7
selection = "Primary"
name = "Sacred Oath (Borias)"
desc = "**Harbinger of Ruin**\n\nAs long as you are not incapacitated,\n\ncreatures who are frightened and are within 2 m of you that you can see\n\nand hear, suffer a number of penalties:\n\n  * Their speed becomes 0.\n\n  * If the creature starts its turn within your range, it takes cold\n\ndamage equal to half your [Divine Oath].\n\nAt 18th total level, the range of this ability increases to 6 m."

[[abilities]]
origin = "Divine Oath"
level = 7
selection = "Primary"
name = "Sacred Oath (Suhlmis)"
desc = "**Fervent Persecution**\n\nWhenever you successfully hit an\n\nopportunity attack, you can immediately move up to half your speed as\n\npart of the same reaction. This movement doesn't provoke opportunity\n\nattacks."

[[abilities]]
origin = "Divine Oath"
level = 7
selection = "Primary"
name = "Sacred Oath (Vegomo)"
desc = "**Queller of Violence**\n\nYou and friendly creatures within 2 m of\n\nyou have resistance to damage from spells. At 18th total level, the range of\n\nthis aura increases to 6 m."

[[abilities]]
origin = "Divine Oath"
level = 8
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a\n\nfeat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Divine Oath"
level = 9
selection = "Primary"
name = "Divine Health"
desc = "You become immune to disease and gain resistance against poison damage."

[[abilities]]
origin = "Divine Oath"
level = 10
selection = "Primary"
name = "Aura of Courage"
desc = "You and friendly creatures within 2 m of you can't be frightened or charmed\n\nwhile you are conscious. At 18th total level, the range of this aura increases to 6\n\nm."

[[abilities]]
origin = "Divine Oath"
level = 11
selection = "Primary"
name = "Improved Divine Smite"
desc = "Whenever you hit a creature with a melee weapon, the creature takes an extra 5\n\ndamage of one of your Enneade\u2019s favorite damage types (choose once). If you\n\nalso use your Divine Smite with an attack, you add this damage to the extra\n\ndamage of your Divine Smite. If you\u2019ve not already taken Divine Smite, you gain\n\nDivine Smite instead."

[[abilities]]
origin = "Divine Oath"
level = 12
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a\n\nfeat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Divine Oath"
level = 13
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choice:\n\n- Two points to use in the Accomplishment section or to store for later\n\npurchase in the same section\n\n- 20 Potential"

[[abilities]]
origin = "Divine Oath"
level = 14
selection = "Primary"
name = "Cleansing Touch"
desc = "You can use your action to end one spell on yourself or on one willing creature\n\nthat you touch. You can use this ability a number of times equal to your Cunning\n\nmodifier (a minimum of once). You regain expended uses when you finish a long\n\nrest."

[[abilities]]
origin = "Divine Oath"
level = 15
selection = "Primary"
name = "Sacred Oath (Riahn)"
desc = "**Purity of Spirit**\n\nYou gain resistance against necrotic and radiant\n\ndamage."

[[abilities]]
origin = "Divine Oath"
level = 15
selection = "Primary"
name = "Sacred Oath (Gera)"
desc = "**Survival of the Fittest**\n\nIf you end your turn in combat with fewer\n\nthan half of your health points and you are not incapacitated, you regain a\n\nnumber of health points equal to 1d6 + half your [Divine Oath]."

[[abilities]]
origin = "Divine Oath"
level = 15
selection = "Primary"
name = "Sacred Oath (Teranis)"
desc = "**Resilient Duality**\n\nYou gain resistance to bludgeoning, piercing,\n\nand slashing damage from nonmagical weapons."

[[abilities]]
origin = "Divine Oath"
level = 15
selection = "Primary"
name = "Sacred Oath (Lapuana)"
desc = "**Unperturbed Wanderer**\n\nYou have advantage on saving throws\n\nto avoid becoming paralyzed or stunned."

[[abilities]]
origin = "Divine Oath"
level = 15
selection = "Primary"
name = "Sacred Oath (Borias)"
desc = "**Immortal Will**\n\nOnce per long rest, when you drop to 0 health\n\npoints but not killed outright you can choose to drop to 1 health point\n\ninstead. Additionally, you suffer none of the drawbacks of old age, and you\n\ncan't be aged magically."

[[abilities]]
origin = "Divine Oath"
level = 15
selection = "Primary"
name = "Sacred Oath (Suhlmis)"
desc = "**Nemesis**\n\nWhen a creature under the effect of your Act of\n\nAggression makes an attack, you can use your reaction to make a melee\n\nweapon attack against that creature if it is within range."

[[abilities]]
origin = "Divine Oath"
level = 15
selection = "Primary"
name = "Sacred Oath (Vegomo)"
desc = "**Guilty Conscience**\n\nAs long as you are not incapacitated,\n\nwhenever a creature hits you with an attack, that creature takes psychic\n\ndamage equal to your Presence modifier (minimum of 1)."

[[abilities]]
origin = "Divine Oath"
level = 16
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a\n\nfeat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Divine Oath"
level = 17
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- Two points to use in the Accomplishment section or to store for later\n\npurchase in the same section\n\n- 20 Potential"

[[abilities]]
origin = "Divine Oath"
level = 18
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- Two points to use in the Accomplishment section or to store for later\n\npurchase in the same section\n\n- 20 Potential"

[[abilities]]
origin = "Divine Oath"
level = 19
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a\n\nfeat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Divine Oath"
level = 20
selection = "Primary"
name = "Sacred Oath (Riahn)"
desc = "**Holy Nimbus**\n\nAs an action, you can emanate light. For 10 rounds,\n\na bright light shines from you in a 6 m aura radius, and dim light shines 6\n\nm beyond that. Whenever an enemy creature starts its turn in your 6 m\n\nbright light aura, the creature takes 10 radiant damage. In addition, for the\n\nduration, you have advantage on saving throws against spells with cold\n\ndamage. Once you use this ability, you can't use it again until you finish a\n\nlong rest."

[[abilities]]
origin = "Divine Oath"
level = 20
selection = "Primary"
name = "Sacred Oath (Gera)"
desc = "**Verdant Warden**\n\nOnce per long rest, as an action, you can\n\ntransform into a powerful champion of the wilds. For 10 rounds you gain\n\nthe following benefits:\n\n  * At the start of each of your turns, you regain 10 health points.\n\n  * Whenever you cast a spell that has a casting time of 1 action, you\n\ncan cast it using a bonus action instead.\n\n  * Enemy creatures within 2 m of you have disadvantage on saving\n\nthrows against your spells and Channel Divinity options."

[[abilities]]
origin = "Divine Oath"
level = 20
selection = "Primary"
name = "Sacred Oath (Teranis)"
desc = "**Beacon of Death**\n\nOnce per long rest, you can cloak yourself in\n\nmighty shadows as an action. For 10 rounds you gain a number of benefits:\n\n  * You reduce bright light in a 6 m radius around you to dim light.\n\n  * Whenever an enemy that is frightened by you starts its turn within\n\n6 m of you, it takes 4d10 necrotic damage.\n\n  * Creatures other than you, that rely on sight have disadvantage on\n\nattack rolls against creatures within 6 m of you.\n\n  * You can use a bonus action on your turn to cause your shadows to\n\nattack one creature within 6 m of you. Make a melee spell attack\n\nagainst the target. If the attack hits, the target takes necrotic\n\ndamage equal to 3d10 + your Cunning modifier (minimum 1)."

[[abilities]]
origin = "Divine Oath"
level = 20
selection = "Primary"
name = "Sacred Oath (Lapuana)"
desc = "**Lunar Paragon**\n\nOnce per long rest, you can give yourself a\n\nnumber of benefits that last for an hour by spending an action.\n\n  * You have Resistance to bludgeoning, piercing, and slashing damage\n\nfrom nonmagical weapons.\n\n  * Your allies have advantage on death saving throws while within 6 m\n\nof you.\n\n  * You have advantage on Resolve saving throws, as do your allies\n\nwithin 6 m of you. This effect ends early if you are incapacitated or\n\ndie."

[[abilities]]
origin = "Divine Oath"
level = 20
selection = "Primary"
name = "Sacred Oath (Borias)"
desc = "**Embodiment of Winter\u2019s Cruelty**\n\nOnce per long rest, you\n\nbecome the embodiment of winter as an action. For 10 rounds you gain a\n\nnumber of benefits:\n\n  * You have resistance to all damage.\n\n  * When you take the attack action on your turn, you can make one\n\nadditional attack as part of that action.\n\n  * Your melee weapon attacks gain an increased critical hit range of 19\n\nto 20."

[[abilities]]
origin = "Divine Oath"
level = 20
selection = "Primary"
name = "Sacred Oath (Suhlmis)"
desc = "**Merciless Avenger**\n\nOnce per long rest, as an action, you can\n\ntransform into an avatar of vengeance. For 10 rounds you gain the\n\nfollowing benefits:\n\n  * You gain a flying speed of 12 m as wings of fire appears on your\n\nback.\n\n  * The first time any enemy creature moves within 6 m of you or starts\n\nits turn within 6 m, the creature must succeed on a Resolve saving\n\nthrow or become frightened of you for 10 rounds or until it takes\n\nany damage. Attack rolls against the frightened creature have\n\nadvantage."

[[abilities]]
origin = "Divine Oath"
level = 20
selection = "Primary"
name = "Sacred Oath (Vegomo)"
desc = "**Arbiter of Peace**\n\nAs an action, you can awaken your mind\u2019s eye.\n\nFor 10 rounds you gain a number of benefits:\n\n  * You have resistance to all damage dealt by other creatures (their\n\nattacks, spells, and other effects).\n\n  * Whenever a creature hits you with an attack, it takes psychic\n\ndamage equal to half the damage you take from the attack.\n\n  * If you attack a creature, cast a spell on it, or deal damage to it by\n\nany means but this ability or Guilty Conscience ability, neither\n\nbenefit works against that creature until you finish a long rest."

[[abilities]]
origin = "Finesse"
level = 1
selection = "Primary"
name = "Sneak Attack"
desc = "When you attack a creature with a weapon attack you can deal an extra 1d6 damage to it\n\nif you attack with a finesse or ranged weapon and if you had advantage on the attack.\n\nYou don't need advantage on the attack roll if another enemy of the target is within 1 m\n\nof it, that enemy isn't incapacitated, and you don't have disadvantage on the attack roll.\n\nThe amount of the extra damage increases with 1d6 as you pick levels in [Finesse], at\n\nevery uneven level pick of [Finesse] (counting only [Finesse] levels). You can only Sneak\n\nAttack once per turn."

[[abilities]]
origin = "Finesse"
level = 1
selection = "Secondary"
name = "Unarmored Defense"
desc = "While you are not wearing any armor or wielding a shield, your armor class equals 10 +\n\nyour Dexterity modifier + your Cunning modifier. The Dexterity and the Cunning\n\nmodifier cannot exceed your proficiency bonus individually."

[[abilities]]
origin = "Finesse"
level = 1
selection = "Secondary"
name = "Expertise"
desc = "You gain two skill points in two skills of your choice, and you may gain rank 5 for both of\n\nthe chosen skills."

[[abilities]]
origin = "Finesse"
level = 2
selection = "Primary"
name = "Cunning Action"
desc = "You can use your bonus action to take the dash, disengage, or hide action."

[[abilities]]
origin = "Finesse"
level = 2
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 10 Potential"

[[abilities]]
origin = "Finesse"
level = 3
selection = "Primary"
name = "Roguish Archetype (Cutthroat)"
desc = "**Slay**\n\nYou gain two skill points with Academics: Poison and two skill\n\npoints with Subterfuge. Any successful attack you make against a surprised\n\ncreature is an automatic critical hit. In addition, you have advantage on attack\n\nrolls against creatures who have not taken a turn in combat yet."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Primary"
name = "Roguish Archetype (Divining Rogue)"
desc = "**Wise Engagement**\n\nYou may gain Sneak Attack against a target\n\neven if you don\u2019t have advantage on the attack roll, as long as you do not have\n\ndisadvantage. Spend a bonus action and target a creature that is not\n\nincapacitated. You gain this benefit for 10 rounds if the target fails a Persuasion\n\n(Man) versus your Empathy (Int) check. You can only target one creature with\n\nthis ability at the same time. If a creature succeeds on the check they are\n\nimmune until you finish a long rest."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Primary"
name = "Roguish Archetype (Fencer)"
desc = "**Slippery Maneuvers**\n\nAn opponent cannot make opportunity attacks\n\nagainst you for the rest of your turn if you make a successful attack against that\n\nopponent during your turn."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Primary"
name = "Roguish Archetype (Occult Prowler)"
desc = "**Spectral Sleight of Hand**\n\nYou learn to cast Mage Hand as Soul\n\nMastery. When you cast Mage Hand this way it earns a number of additional\n\nbenefits. Your Mage Hand is invisible and it can perform tasks unnoticed if you\n\nsucceed on a Subterfuge (Dex/Cun) versus your target\u2019s Perception (Com). In\n\naddition, you can use the bonus action granted by Cunning Action to control the\n\nhand.\n\nYou can perform the following additional tasks with it:\n\n  * You can stow one object the hand is holding in a container worn or\n\ncarried by another creature.\n\n  * You can retrieve an object in a container worn or carried by another\n\ncreature.\n\n  * You can use Thieves' Tools to pick locks and disarm traps at range."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Primary"
name = "Roguish Archetype (Operator)"
desc = "**Master of Strategy**\n\nYou can use the help action as a bonus action and\n\nwith a 6 m range as long as your target can see or hear you."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Primary"
name = "Roguish Archetype (Spy)"
desc = "**Agile Mobility**\n\nAs a reaction, you can move up to half your speed whenever\n\nan enemy ends their turn within 1 m of you. This movement doesn't provoke\n\nopportunity attacks."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Primary"
name = "Roguish Archetype (Thief)"
desc = "**Fast Hands**\n\nYou can use the bonus action given by your Cunning Action\n\nability to make a Subterfuge (Dex/Cun) check, use your Thieves' Tools, or take\n\nthe use an object action."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Secondary"
name = "Roguish Archetype (Divining Rogue)"
desc = "**Discerning Eye**\n\nYou can use a bonus action to make a\n\nPerception (Int) check to spot a hidden creature or object or to make an\n\nInvestigation (Cun) check to uncover or decipher clues. In addition, whenever\n\nyou make an Empathy (Com) check to determine whether a creature is lying,\n\ntreat a roll of 7 or lower on the d20 as an 8."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Secondary"
name = "Roguish Archetype (Fencer)"
desc = "**Dashing Courage**\n\nYou learn another way to perform sneak attack. As\n\nlong as you do not have disadvantage on the attack, you are within 1 m of the\n\nopponent and no other creature is within 1 m of you. All the other rules for Sneak\n\nAttack still apply to you. In addition, you gain a bonus to your initiative rolls equal\n\nto your Manipulation modifier."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Secondary"
name = "Roguish Archetype (Occult Prowler)"
desc = "**Cantrips**\n\nYou learn two cantrips of your choice as Soul\n\nMastery. After ten level picks of [Finesse] you learn a level 1 spell of your choice\n\nas Soul Mastery."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Secondary"
name = "Roguish Archetype (Operator)"
desc = "**Web Spinner**\n\nAs long as you know the language, you can pass\n\nyourself off as a native speaker of a culture if you hear it spoken for at least 10\n\nrounds. In addition, you gain two skill points in Subterfuge and one skill point in\n\nAcademics (strategy)."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Secondary"
name = "Roguish Archetype (Spy)"
desc = "**Crafty**\n\nYou gain two skill points in the Academics (nature) and Survival\n\nskills. You may reach rank 5 in these skills."

[[abilities]]
origin = "Finesse"
level = 3
selection = "Secondary"
name = "Roguish Archetype (Thief)"
desc = "**Second-Story Work**\n\nYou are immune to the first 2d6 damage you take by\n\nfalling. Climbing no longer costs you extra movement. In addition, when you\n\nmake a running jump, the distance you cover increases by a number of meters\n\nequal to half your Dexterity modifier (rounded up and minimum 1 m)."

[[abilities]]
origin = "Finesse"
level = 4
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Finesse"
level = 5
selection = "Primary"
name = "Expertise"
desc = "You gain two skill points in two skills of your choice, and you may gain rank 5 for both of\n\nthe chosen skills."

[[abilities]]
origin = "Finesse"
level = 6
selection = "Primary"
name = "Uncanny Dodge"
desc = "When an attacker that you can see hits you with an attack, you can use your reaction to\n\nhalve the attack's damage against you."

[[abilities]]
origin = "Finesse"
level = 7
selection = "Primary"
name = "Evasion"
desc = "When you are subjected to an effect that allows you to make a Dexterity saving throw to\n\ntake only half damage, you instead take no damage if you succeed on the saving throw,\n\nand only half damage if you fail."

[[abilities]]
origin = "Finesse"
level = 8
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Finesse"
level = 9
selection = "Primary"
name = "Archetype (Cutthroat)"
desc = "**Blend In**\n\nBy spending seven days and 25 gp you can give yourself a\n\nnew identity by establishing history, profession, and affiliations. You can't\n\nestablish an identity that belongs to someone else. Other creatures believe you to\n\nbe this identity until they are given an obvious reason not to."

[[abilities]]
origin = "Finesse"
level = 9
selection = "Primary"
name = "Archetype (Divining Rogue)"
desc = "**Accurate Perception**\n\nAs long as you do not move no more than\n\nhalf your speed on your turn, you gain advantage on any perception or\n\ninvestigation check you make."

[[abilities]]
origin = "Finesse"
level = 9
selection = "Primary"
name = "Archetype (Fencer)"
desc = "**Swagger**\n\nAgainst a creature that can hear you and shares a language\n\nwith you, you can spend an action to make a Persuasion (Man) contested by your\n\ntarget\u2019s Empathy (Com). The effect of this ability lasts for 10 rounds if your check\n\nis successful and depends upon if the creature you targeted is hostile or not. s\n\nAgainst a hostile target, this ability causes that creature to have disadvantage on\n\nattack rolls against targets other than you and can't make opportunity attacks\n\nagainst targets other than you. This effect ends immediately if you or your\n\ncompanions attack the target or affects it with a spell, or until you and the target\n\nare more than 12 m apart.\n\nAgainst a target that is not hostile to you, the creature becomes charmed by you.\n\nWhile charmed, it regards you as a friendly acquaintance. This effect ends\n\nimmediately if you or your companions do anything harmful to it."

[[abilities]]
origin = "Finesse"
level = 9
selection = "Primary"
name = "Archetype (Occult Prowler)"
desc = "**Arcane Conniving**\n\nUntil the end of your turn, creatures gain\n\ndisadvantage against any saving throws from spells you cast if you are hidden\n\nfrom the creature."

[[abilities]]
origin = "Finesse"
level = 9
selection = "Primary"
name = "Archetype (Operator)"
desc = "**Informed Schemer**\n\nIf you interact or observe another creature\n\noutside of combat for at least a minute, you learn some of their capabilities.\n\nChoose two characteristics from below, your GM tells you if they are superior,\n\ninferior, or equal compared to you:\n\n  * Intelligence score\n\n  * Composure score\n\n  * Presence score\n\n  * AO levels (if any)\n\n  * At the GM's option, you might also realize you know a piece of the\n\ncreature's history or one of its personality traits, if it has any."

[[abilities]]
origin = "Finesse"
level = 9
selection = "Primary"
name = "Archetype (Spy)"
desc = "**Greater Maneuverability**\n\nYour walking speed increases by 2 m. If you have\n\na climbing or swimming speed, this increase applies to those speeds as well."

[[abilities]]
origin = "Finesse"
level = 9
selection = "Primary"
name = "Archetype (Thief)"
desc = "**Supreme Sneak**\n\nYou gain advantage on Stealth (Dex/Cun) checks if you\n\nmove no more than half your speed on the same turn."

[[abilities]]
origin = "Finesse"
level = 10
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Finesse"
level = 11
selection = "Primary"
name = "Reliable Talent"
desc = "Whenever you make an ability check that lets you add your proficiency bonus, you can\n\ntreat a d20 roll of 9 or lower as a 10."

[[abilities]]
origin = "Finesse"
level = 12
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Finesse"
level = 13
selection = "Primary"
name = "Roguish Archetype (Cutthroat)"
desc = "**Changeling**\n\nIf you spend three hours studying another creature's\n\nspeech, writing, and behavior you can mimic these traits with impeccable\n\naccuracy. If a creature would become suspicious of you, you gain advantage on\n\nDeception (Man) checks you roll to avoid detection."

[[abilities]]
origin = "Finesse"
level = 13
selection = "Primary"
name = "Roguish Archetype (Divining Rogue)"
desc = "**Faultless Attention**\n\nAs long as you are not deafened or\n\nblinded, you know when an illusion effect is trying to deceive you. Within 6 m of\n\nyou, spend an action and you can sense the presence of illusions, shapechangers\n\nnot in their original form, or magical effects designed to fool the senses. You do\n\nnot learn who, where or what is the cause of the effect, but you learn that\n\nsomething is amiss in your radius of awareness. You can use this ability a number\n\nof times equal to your Cunning modifier (minimum of 1), and you regain all\n\nexpended uses of it when you finish a long rest."

[[abilities]]
origin = "Finesse"
level = 13
selection = "Primary"
name = "Roguish Archetype (Fencer)"
desc = "**Fancy Stunt**\n\nAs a bonus action, you grant yourself advantage on the\n\nnext Athletics check you make this turn. Alternatively, you can grant yourself\n\nadvantage on the first dexterity saving throw you make until the start of your\n\nnext turn."

[[abilities]]
origin = "Finesse"
level = 13
selection = "Primary"
name = "Roguish Archetype (Occult Prowler)"
desc = "**Gifted Prowler**\n\nYou can choose one creature within 1 m of\n\nyour Mage Hand cantrip as a bonus action. Against the chosen creature you gain\n\nadvantage on attack rolls until the end of your turn."

[[abilities]]
origin = "Finesse"
level = 13
selection = "Primary"
name = "Roguish Archetype (Operator)"
desc = "**Feint**\n\nIf another creature is within 1 m of you and provides cover for\n\nyou against an attack targeting you, you can use your reaction to have that attack\n\ntarget the creature covering you instead of hitting you."

[[abilities]]
origin = "Finesse"
level = 13
selection = "Primary"
name = "Roguish Archetype (Spy)"
desc = "**Waylay Virtuoso**\n\nYou gain advantage on initiative rolls. Until the end of\n\nyour next turn, your allies receive advantage on their attack rolls against the first\n\ncreature you hit on the first round of combat."

[[abilities]]
origin = "Finesse"
level = 13
selection = "Primary"
name = "Roguish Archetype (Thief)"
desc = "**Use Magic Device**\n\nYou ignore all ability origin, race, and level\n\nrequirements on the use of magic items. In addition, you can cast Identify as Soul\n\nMastery."

[[abilities]]
origin = "Finesse"
level = 14
selection = "Primary"
name = "Blindsense"
desc = "If you can hear, you are aware of the location of any hidden or invisible creatures within\n\n2 m of you."

[[abilities]]
origin = "Finesse"
level = 15
selection = "Primary"
name = "Slippery Mind"
desc = "You gain proficiency in one mental or social saving throw of your choice."

[[abilities]]
origin = "Finesse"
level = 16
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Finesse"
level = 17
selection = "Primary"
name = "Roguish Archetype (Cutthroat)"
desc = "**Murderous Intent**\n\nWhenever you deal damage against a creature\n\nthat is surprised, that creature must make a Vitality saving throw against 8+ your\n\ndexterity modifier + your proficiency bonus, or take double the damage from\n\nyour attack."

[[abilities]]
origin = "Finesse"
level = 17
selection = "Primary"
name = "Roguish Archetype (Divining Rogue)"
desc = "**Discover Flaw**\n\nYour Sneak Attack damage increases by 3d6\n\nagainst a creature you have targeted with your Wise Engagement ability."

[[abilities]]
origin = "Finesse"
level = 17
selection = "Primary"
name = "Roguish Archetype (Fencer)"
desc = "**Charming Mercenary**\n\nOnce per short or long rest, you can reroll a\n\nmissed attack with advantage."

[[abilities]]
origin = "Finesse"
level = 17
selection = "Primary"
name = "Roguish Archetype (Operator)"
desc = "**Spirit of Manipulation**\n\nYour mind becomes as slippery as your soul.\n\nYou gain a number of benefits:\n\n  * Whenever your mind is being read, you can present false thoughts if you\n\nsucceed on a Deception (Man) contested by the mind readers Empathy\n\n(Com).\n\n  * You can not be compelled to tell the truth by magic.\n\n  * You become immune to charm effects."

[[abilities]]
origin = "Finesse"
level = 17
selection = "Primary"
name = "Roguish Archetype (Occult Prowler)"
desc = "**Spell Thief**\n\nOnce per long rest, you attempt to steal a spell.\n\nWhen a creature casts a spell that targets you or includes you in its area of effect\n\nyou can spend your reaction and force that creature to make a saving throw\n\nusing its spellcasting ability modifier against your spell save DV. On a failed save,\n\nyou negate the spell\u2019s effect against you. In addition, if the spell is of a level you\n\ncan cast and is at least 1st level, you can cast that spell using your spell slots for\n\nthe next 8 hours. During this duration, the creature you stole the spell from\n\ncannot cast it. You can use this ability once per long rest."

[[abilities]]
origin = "Finesse"
level = 17
selection = "Primary"
name = "Roguish Archetype (Spy)"
desc = "**Out of Nowhere**\n\nIf you take the attack action on your turn, you can make\n\none additional attack as a bonus action. This attack can benefit from your Sneak\n\nAttack even if you have already used it this turn, but you can't use Sneak Attack\n\nagainst the same target more than once in a turn."

[[abilities]]
origin = "Finesse"
level = 17
selection = "Primary"
name = "Roguish Archetype (Thief)"
desc = "**Thief's Reflexes**\n\nYou can take two turns during the first round of any\n\ncombat. You take your first turn at your normal initiative and your second turn at\n\nyour initiative minus 10. You can't use this ability when you are surprised."

[[abilities]]
origin = "Finesse"
level = 18
selection = "Primary"
name = "Elusive"
desc = "No attack roll has advantage against you while you aren't incapacitated."

[[abilities]]
origin = "Finesse"
level = 19
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Finesse"
level = 20
selection = "Primary"
name = "Stroke of Luck"
desc = "If your attack misses a target within range, you can turn the miss into a hit.\n\nAlternatively, if you fail an ability check, you can treat the d20 roll as a 20. Once you use\n\nthis ability, you can't use it again until you finish a short or long rest."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Primary"
name = "Arcane Tradition (Abjuration)"
desc = "**Protective Ward**\n\nOnce per long rest, you can tease out more power\n\nfrom the Souls you use when you cast abjuration spells. Whenever you cast an\n\nabjuration spell of 1st or higher you also create a protective Ward that soaks up\n\ndamage for you. The Ward functions like this:\n\n  * It has health points equal to twice your Intelligence modifier plus the\n\nnumber of level picks you to possess in [Occult Student].\n\n  * Whenever you take damage, your Ward takes the damage instead.\n\n  * If the damage you take succeeds the health points your Ward possesses,\n\nyou take the remaining damage.\n\n  * When your Ward is reduced to 0 health points it persists until you finish a\n\nlong rest.\n\n  * The ward regains health points whenever you cast an abjuration spell of\n\n1st level or higher equal to twice the level of the spell."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Primary"
name = "Arcane Tradition (Conjuration)"
desc = "**Conjure Minor Item**\n\nAs an action, you can conjure an inanimate\n\nobject into your hand or unto the ground in an unoccupied space that you can\n\nsee within 2 m of you. The object cannot be larger than 0.5 m or weigh more than\n\n5 kg. You must have seen the object before to be able to conjure a copy. It is\n\nvisibly magical and sheds dim light in a 1 m radius. The object immediately\n\ndisappears if you attempt to deal damage with it, or it takes damage. The object\n\npersists for an hour or until you use this ability again."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Primary"
name = "Arcane Tradition (Divination)"
desc = "**Premonition**\n\nWhenever you finish a long rest, you roll two d20 and\n\nsave the numbers you rolled. At any point, until you finish a long rest, you can\n\nswap one of the numbers you rolled with any attack roll, saving throw, or ability\n\ncheck you make. You must swap out a number this way before the GM declares\n\nthe check to be a success or a fail. You can only swap out a result this way once\n\nper turn and a saved number can only be used once."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Primary"
name = "Arcane Tradition (Enchantment)"
desc = "**Mesmerize**\n\nYou can hypnotize a creature within 1 m of you that\n\nyou can see by spending an action. If the target can see you too, they must\n\nsucceed on a Composure saving throw against your spell save DV or becomes\n\nincapacitated and have their speed be reduced to 0 until the end of your next\n\nturn. You can choose to maintain this effect by spending another action on your\n\nsubsequent turn and continue hypnotizing your target until the end of your next\n\nturn. The target can make another saving throw every time you choose to\n\nmaintain this effect. The hypnotized condition ends if you move more than 1 m\n\naway from the target, the target is forced to make another saving throw or it is\n\ndealt damage. The target becomes immune to this ability until you finish a long\n\nrest if they succeed on their saving throw against this effect."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Primary"
name = "Arcane Tradition (Evocation)"
desc = "**Sculpt Spells**\n\nWhen you cast an evocation spell that affects other\n\ncreatures that you can see, you can choose a number of them equal to 1 + the\n\nspell's level. The chosen creatures automatically succeed on their saving throws\n\nagainst the spell, and they take no damage if they would normally take half\n\ndamage on a successful save."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Primary"
name = "Arcane Tradition (Illusion)"
desc = "**Illusionist\u2019s Stratagem**\n\nYou learn the Minor Illusion cantrip as Soul\n\nMastery. In addition, whenever you cast Minor Illusion you can both create a\n\nsound and an image with a single cast of the cantrip."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Primary"
name = "Arcane Tradition (Necromancy)"
desc = "**Siphon Vitality**\n\nOnce per turn, when you kill one or more\n\ncreatures with a spell of 1st level or higher, you regain health points equal to\n\ntwice the spell's level, or three times its level if the spell belongs to the school of\n\nviscmancy. You don't gain this benefit when killing constructs or undead."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Primary"
name = "Arcane Tradition (Transmutation)"
desc = "**Alchemical Secrets**\n\nYou can cast a version of Fabricate once\n\nper short rest as Soul Mastery. This version of Fabricate can only create an object\n\nthat is no larger than 0.5 m or weigh more than 5 kg. This use of Fabricate only\n\nlasts for 1 hour before it reverts to its original form."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Primary"
name = "Arcane Tradition (War Magic)"
desc = "**Minor Shield**\n\nYou can use your reaction to gain a +2 bonus to your\n\nAV against an attack that hits you, or alternatively gain a +4 bonus to a failed\n\nsaving throw. If you decide to use either benefit from this ability, you cannot cast\n\nany spells other than cantrips until the end of your next turn."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Secondary"
name = "Arcane Tradition (War Magic)"
desc = "**Quick Mind**\n\nYou can give yourself a bonus to your initiative rolls\n\nequal to your Intelligence modifier."

[[abilities]]
origin = "Occult Student"
level = 1
selection = "Secondary"
name = "Spellbook"
desc = "You gain a Spellbook where you can copy down spells into and gain them as spells\n\nknown. When you find a spell of first level or higher in a Spellbook or any other source\n\nyou can copy from, you can add it to your Spellbook, and your spells known if the spell\u2019s\n\nlevel is lower than your current level.\n\nThe process takes 2 hours per level of the spell and consumes Soul points equal to the\n\nlevel of the spell to copy it down."

[[abilities]]
origin = "Occult Student"
level = 2
selection = "Primary"
name = "Arcane Recovery"
desc = "Once per long rest, as an action, you can recover one spell slot. The spell must have a\n\nlevel that is equal to or less than half your [Occult Student] level (rounded up), the slot\n\ncan\u2019t be 8th level or higher."

[[abilities]]
origin = "Occult Student"
level = 2
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 10 Potential"

[[abilities]]
origin = "Occult Student"
level = 3
selection = "Primary"
name = "General Upgrades"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 10 Potential"

[[abilities]]
origin = "Occult Student"
level = 3
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 10 Potential"

[[abilities]]
origin = "Occult Student"
level = 4
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Occult Student"
level = 5
selection = "Primary"
name = "Improved Magical Upgrade"
desc = "Gain one of your choices:\n\n- Two points to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 20 Potential\n\n- +1 to an ability score of your choice\n\n- Pick an additional feat from the feat list"

[[abilities]]
origin = "Occult Student"
level = 6
selection = "Primary"
name = "Arcane Tradition (Abjuration)"
desc = "**Generous Ward**\n\nWhenever a creature within 6 m of you that you\n\ncan see takes damage, you can use your reaction to cause your Protective Ward\n\nto absorb the damage dealt with that creature. If your Ward would be reduced to\n\n0 health point this way, the creature you warded takes any remaining damage."

[[abilities]]
origin = "Occult Student"
level = 6
selection = "Primary"
name = "Arcane Tradition (Conjuration)"
desc = "**Juxtapose**\n\nAs an action, you can teleport up to 6 m to an\n\nunoccupied space that you can see. Alternatively, you can choose a space within\n\nrange that is occupied by a Small or Medium creature that is willing. You both\n\nteleport by swapping places with each other. You can use this ability once per\n\nlong rest, but if you cast a conjuration spell of 1st level or higher you regain one\n\nusage of it."

[[abilities]]
origin = "Occult Student"
level = 6
selection = "Primary"
name = "Arcane Tradition (Divination)"
desc = "**Effortless Visions**\n\nWhen you cast a divination spell of 2nd level or\n\nhigher using a spell slot, you regain one expended spell slot. The slot you regain\n\nmust be of a level lower than the spell you cast and can't be higher than 5th level."

[[abilities]]
origin = "Occult Student"
level = 6
selection = "Primary"
name = "Arcane Tradition (Enchantment)"
desc = "**Reverence**\n\nIf you spend a reaction you can cause an attack that\n\nwas targeting you to target another creature instead. The attacker must succeed\n\non a Composure saving throw against your spell save DV, or it must attack\n\nanother viable target. The attacker targets a creature that is closest to it but\n\ncannot attack itself or you. If several creatures are closest to the attacker, the\n\nattacker chooses which one to target. If there are no viable targets for the attack,\n\nthe attack is wasted. You must choose to use this ability before knowing whether\n\nthe attack hits or misses. On a successful save, the attacker becomes immune\n\nagainst this ability until you finish a long rest. Creatures that are immune to the\n\ncharmed condition can not be affected but this ability."

[[abilities]]
origin = "Occult Student"
level = 6
selection = "Primary"
name = "Arcane Tradition (Evocation)"
desc = "**Potent Cantrips**\n\nWhen a creature succeeds on saving throws against\n\na cantrip you cast, the creature takes half the cantrip's damage (if any) but suffers\n\nno additional effect from the cantrip. In addition, damage you deal with cantrips\n\nwith a spell attack gains a bonus equal to your proficiency bonus."

[[abilities]]
origin = "Occult Student"
level = 6
selection = "Primary"
name = "Arcane Tradition (Illusion)"
desc = "**Dreamscape**\n\nWhen you cast an illusion spell that has a duration of 10\n\nrounds or longer, you can use your action to change the nature of the form of\n\nthat illusion (using the spell's normal parameters for the illusion), provided that\n\nyou can see the illusion."

[[abilities]]
origin = "Occult Student"
level = 6
selection = "Primary"
name = "Arcane Tradition (Necromancy)"
desc = "**Infuse Vessel**\n\nYou learn to cast Animate Dead. In addition, you\n\ncan cast Animate Dead once per short rest as Soul Mastery but you must still pay\n\nthe Soul consumption. When you cast Animate Dead, you can target one\n\nadditional corpse or a pile of bones, creating another zombie or skeleton, as\n\nappropriate. Whenever you create an undead using a necromancy spell, it has\n\nadditional benefits:\n\n  * The undead's health point maximum is increased by an amount equal to\n\nyour total level.\n\n  * The undead adds your proficiency bonus to its weapon damage rolls."

[[abilities]]
origin = "Occult Student"
level = 6
selection = "Primary"
name = "Arcane Tradition (Transmutation)"
desc = "**Alchemist\u2019s Stone**\n\nYou gain two skill points in Academics\n\n(alchemy). If you spend 8 hours practicing alchemy you can create an Alchemist's\n\nStone. When you create the Stone, choose the benefit from the following options:\n\n  * Darkvision out to a range of 12 m.\n\n  * As long as the creature is not over-encumbered, their speed increases by\n\n2 m.\n\n  * Advantage with Vitality saving throws.\n\n  * Resistance to acid, cold, fire, lightning, or thunder damage (your choice\n\nwhenever you choose this benefit).\n\nYou can benefit from the Stone yourself or give it to another creature. Each time\n\nyou cast a transmutation spell of 1st level or higher, you can change the effect of\n\nyour Stone if the Stone is on your person. If you create a new Alchemist's Stone,\n\nthe previous one ceases to function."

[[abilities]]
origin = "Occult Student"
level = 6
selection = "Primary"
name = "Arcane Tradition (War Magic)"
desc = "**Overcharge**\n\nWhenever you successfully end a magical effect by\n\ncasting Dispel Magic or prevent a spell from being cast with Counterspell, you\n\nabsorb some fleeting Soul energy from the magical effects you terminate by\n\ngaining one use of Overcharge. In addition, whenever you complete a short rest,\n\nyou gain one use of Overcharge. Once per turn, whenever you deal damage with\n\na spell you cast you may spend one use of Overcharge to deal more damage. The\n\nbonus damage equals half your total level and is of one of the damage types the\n\nspell you cast deals (your choice). You can store a number of Overcharge uses\n\nequal to your Intelligence modifier (minimum of 1). When you complete a long\n\nrest, you lose all uses of Overcharge you have stored except for one."

[[abilities]]
origin = "Occult Student"
level = 7
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 10 Potential"

[[abilities]]
origin = "Occult Student"
level = 8
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Occult Student"
level = 9
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 10 Potential"

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (Abjuration)"
desc = "**Potent Denial**\n\nWhenever you cast an abjuration spell that requires\n\nyou to make an ability check as part of the spell\u2019s description, you receive a\n\nbonus to the ability check equal to your proficiency bonus."

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (Conjuration)"
desc = "**Unrivaled Focus**\n\nYou cannot lose your concentration by taking\n\ndamage when you are concentrating on a conjuration spell."

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (Divination)"
desc = "**Mind\u2019s Eye**\n\nOnce per short or long rest, you may gain a benefit to\n\nyour perceptive ability that lasts until you start a short or long rest, or until you\n\nare incapacitated. Spend an action and choose one benefit below:\n\n  * Darkvision: You gain darkvision out to a range of 12 m.\n\n  * Ethereal Sight: You can see into the Ethereal Plane out to a range of 12 m.\n\n  * Greater Comprehension: You can read any language.\n\n  * See Invisibility: You can see invisible creatures and objects within 6 m of\n\nyou that are within line of sight."

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (Enchantment)"
desc = "**Twice the Charm**\n\nYou can target an additional creature\n\nwhenever you cast an enchantment spell of 1st level or higher that targets only\n\none creature."

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (Evocation)"
desc = "**Empowered Evocation**\n\nOnce per turn, you can add your Intelligence\n\nmodifier to one damage roll of any evocation spell you cast."

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (Illusion)"
desc = "**Duplicate**\n\nOnce per short or long rest, you may interpose an illusory\n\nduplicate of yourself in front of an attack that would hit you. As a reaction, the\n\nillusion takes the hit, the attack misses you, after which the illusion dissipates."

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (Necromancy)"
desc = "**Un-lifeforce**\n\nYour health point maximum can\u2019t be reduced, and\n\nyou receive resistance to necrotic damage."

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (Transmutation)"
desc = "**Biomancy**\n\nOnce per long rest, you can cast Polymorph as Soul\n\nMastery. This casting of Polymorph allows you to target an additional creature."

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (War Magic)"
desc = "**Defensive Chant**\n\nWhile you maintain concentration on a spell, you\n\ngain a +2 bonus to AV and all saving throws."

[[abilities]]
origin = "Occult Student"
level = 11
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- Two points to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 20 Potential"

[[abilities]]
origin = "Occult Student"
level = 12
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Occult Student"
level = 13
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- Two points to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 20 Potential"

[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (Abjuration)"
desc = "**Prismatic Ward**\n\nYou gain advantage on saving throws against\n\nspells, and you gain resistance against damage dealt by spells."

[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (Conjuration)"
desc = "**Bolster**\n\nAny creature that you summon or create via a conjuration\n\nspell receive 30 temporary health points."

[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (Divination)"
desc = "**Epiphany**\n\nYou roll three d20 for your Premonition ability, rather\n\nthan two."

[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (Enchantment)"
desc = "**Memnomancy**\n\nWhen you cast an enchantment spell that causes\n\none or more creatures to be charmed by you, you can prevent one charmed\n\ncreature from realizing that it is charmed. In addition, once before the spell\n\nexpires, you can attempt to erase memories of one charmed creature. Spend an\n\naction and target one creature currently being charmed by you. The creature\n\nmust succeed on Int/Cun saving throw against your spell save DV. On a fail, the\n\ncreature forgets a number of hours equal to 1 + your Manipulation modifier\n\n(minimum 1). You decide which hours the creature forgets of its time being\n\ncharmed and you can decide to make the creature forget less time. The amount\n\nof time can't exceed the duration of your enchantment spell."

[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (Evocation)"
desc = "**Overchannel**\n\nWhen you cast a spell of 5th level or lower (excluding\n\ncantrips) that deals damage, you can deal maximum damage with that spell. The\n\nfirst time you do so, you suffer no adverse effect. If you use this ability again\n\nbefore you finish a long rest, you take 2d12 necrotic damage for each level of the\n\nspell, immediately after you cast it. Each time you use this ability again before\n\nfinishing a long rest, the necrotic damage per spell level increases by 1d12. This\n\ndamage ignores resistance and immunity."

[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (Illusion)"
desc = "**Delusions of Grandeur**\n\nAs a bonus action, you may make one\n\ninanimate, nonmagical object that is a part of an illusion real when you cast an\n\nillusion spell of 1st level or higher. The object becomes tangible for 10 rounds. The\n\nobject can't deal damage or otherwise directly harm anyone."

[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (Necromancy)"
desc = "**Necromantic Mastery**\n\nTarget an undead that you can see within\n\n12 m of you and spend an action. That undead must succeed on an Int/Cun\n\nsaving throw or become friendly to you. If the undead succeeds this saving throw\n\nit cannot be targeted again by this ability. How effective this ability depends upon\n\nthe undead\u2019s intelligence ability score.\n\n  * If the undead you target possesses an Intelligence score of 8 or higher, the\n\nundead receives advantage on the saving throw.\n\n  * If the undead you target possesses an Intelligence score of 12 or higher\n\nand fails its initial saving throw, it can repeat the saving throw at the end\n\nof every hour until it breaks free from this ability."

[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (Transmutation)"
desc = "**Mystic Release**\n\nAs an action, you can release the power within\n\nyour Alchemist's Stone to create one powerful effect of your choice:\n\n  * Flexible Transmutation: You can transmute one nonmagical object\u2014no\n\nlarger than a 1 m cube into another nonmagical object of similar size and\n\nmass and of equal or lesser value. You must spend 10 minutes handling the\n\nobject to transform it.\n\n  * Elixir: You remove all curses, diseases, and poisons affecting a creature\n\nthat you touch with the Alchemist's Stone. The creature also regains all its\n\nhealth points.\n\n  * Regeneration: You cast the Raise Dead spell on a creature you touch with\n\nthe Alchemist's Stone as Soul Mastery.\n\n  * Restore Youth: You touch the Alchemist's Stone to a willing creature, and\n\nthat creature's apparent age is reduced by 3d10 years, to a minimum of 13\n\nyears. This effect doesn't extend the creature's lifespan.\n\nWhen you use this ability, your Alchemist's Stone is destroyed and can't be\n\nremade until you finish a long rest."

[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (War Magic)"
desc = "**Arcane Veil**\n\nWhenever you use your Minor Shield ability, up to\n\nthree creatures of your choice that you can see within 12 m of you each take\n\nforce damage equal to half your total level."

[[abilities]]
origin = "Occult Student"
level = 15
selection = "Primary"
name = "Improved Magical Upgrade"
desc = "Gain one of your choices:\n\n- Two points to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 30 Potential\n\n- Three skill points to assign in any skill or skills of your choice, or to store\n\n- +1 to an ability score of your choice\n\n- Pick a feat from the feat list"

[[abilities]]
origin = "Occult Student"
level = 16
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Occult Student"
level = 17
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- Two points to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 20 Potential"

[[abilities]]
origin = "Occult Student"
level = 18
selection = "Primary"
name = "Spell mastery"
desc = "Choose a 1st-level spell and a 2nd-level spell. You can cast those spells at their lowest\n\nlevel as Soul Mastery."

[[abilities]]
origin = "Occult Student"
level = 19
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Occult Student"
level = 20
selection = "Primary"
name = "Superior Spell Mastery"
desc = "You gain mastery over two powerful spells and can cast them with little effort. Choose\n\ntwo 3rd-level spells that you know. Once per short or long rest, you can cast them as\n\nSoul Mastery."

[[abilities]]
origin = "Pact"
level = 1
selection = "Primary"
name = "Patron (Angelic)"
desc = "**Mending Warmth**\n\nYour Soul oozes a warmth that reinvigorates your\n\nallies. You gain a number of d6s equal to 1 + your level picks of [Pact]. You can\n\nheal other creatures by spending a bonus action and dice from your pool. You roll\n\nthe dice, add it together, and restore that many health points. You can only\n\nspend a number of dice equal to your Presence modifier (minimum of 1) on your\n\nturn. You regain all your spent dice when you complete a long rest."

[[abilities]]
origin = "Pact"
level = 1
selection = "Primary"
name = "Patron (Explorer)"
desc = "**Energy Field**\n\nOnce per short or long rest, a swirling field of energy\n\nsurrounds you. As a bonus action, you gain resistance against all damage and you\n\ndeal radiant damage equal to your [Pact] + your Intelligence modifier to all hostile\n\ncreatures who end their turn within 2 m of you until the end of your next turn."

[[abilities]]
origin = "Pact"
level = 1
selection = "Primary"
name = "Patron (Fey)"
desc = "**Beguiling Aura**\n\nOnce per short or long rest you may frighten or charm\n\n(your choice) all creatures in a 2 m cube originating from you as an action. The\n\ncreatures in the area make an Int/Cun saving throw against your spell save DV.\n\nOn a failed save, the creature suffers the condition until the end of your next\n\nturn."

[[abilities]]
origin = "Pact"
level = 1
selection = "Primary"
name = "Patron (Fiend)"
desc = "**Violent Nourishment**\n\nWhen you reduce a hostile creature to 0 health\n\npoints, you gain temporary health points equal to your Presence modifier + your\n\nlevel picks in [Pact] (minimum of 1)."

[[abilities]]
origin = "Pact"
level = 1
selection = "Primary"
name = "Patron (Lurker)"
desc = "**Jinx**\n\nOnce per short or long rest, you can curse one creature that you\n\ncan see within 6 m of you as a bonus action. The curse lasts for 10 rounds or until\n\nyou or the creature becomes incapacitated. As long as the curse is in effect you\n\ngain these benefits:\n\n  * A bonus to your damage from both spell attacks and weapon attacks equal\n\nto your proficiency bonus.\n\n  * Your critical range increases to 19 against the cursed target.\n\n  * If the target dies whilst it is cursed, you recover health points equal to\n\nyour level picks in [Pact] plus your Manipulation modifier."

[[abilities]]
origin = "Pact"
level = 1
selection = "Primary"
name = "Patron (Psychic)"
desc = "**Ascension**\n\nAs long as a creature knows one language and is within 6 m\n\nof you, you can telepathically communicate with it and the creature will\n\nunderstand you. The creature cannot reply."

[[abilities]]
origin = "Pact"
level = 1
selection = "Primary"
name = "Patron (Undead)"
desc = "**Deceased Familiarity**\n\nAny undead must first succeed a resolve saving\n\nthrow against your spell DV before targeting you directly with an attack or spell\n\nthat deals damage, or be forced to target somebody else, potentially forfeiting\n\nthe attack or spell. The undead creature becomes immune to this ability for 24\n\nhours if it succeeds the saving throw and if you target the undead with an attack\n\nor a spell that deals damage. In addition, you learn the Spare the Dying cantrip as\n\nSoul Mastery and you receive advantage to all saving throws against disease."

[[abilities]]
origin = "Pact"
level = 1
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 10 Potential"

[[abilities]]
origin = "Pact"
level = 2
selection = "Primary"
name = "Absorbed Soul Aspect"
desc = "When you pick this ability you gain two Absorbed Soul Aspects. For every third level of\n\n[Pact] you possess you may learn another Absorbed Soul Aspect. If you picked this\n\nability at level 2 you receive another Absorbed Soul Aspect at 4th, 7th, 10th, 13th, 16th,\n\nand 19th pick of [Pact] to a maximum of 8 Aspects. Additionally, when you pick a level of\n\n[Pact], you can choose one of the Aspects you know and replace it with another Aspect\n\nthat you could learn at that level."

[[abilities]]
origin = "Pact"
level = 2
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 10 Potential"

[[abilities]]
origin = "Pact"
level = 3
selection = "Primary"
name = "Pact Boon (Blade)"
desc = "As an action, you can create a melee [Pact] weapon of your choice in your\n\nhand. These rules apply to your [Pact] weapon:\n\n  * Proficient: You are proficient with it while you wield it.\n\n  * Magical: This weapon counts as magical for the purpose of overcoming\n\nresistance and immunity to nonmagical attacks and damage.\n\n  * Duration: Your [Pact] weapon disappears if it is more than 1 m away from\n\nyou for 10 rounds or more. It also disappears if you use this ability again, if\n\nyou dismiss the weapon (no action required), or if you die. You can dismiss\n\nthe weapon, shunting it into an extradimensional space, and it appears\n\nwhenever you create your [Pact] weapon thereafter.\n\n  * Transform: You can transform one magic weapon into your [Pact] weapon\n\nby performing a special ritual while you hold the weapon. You perform the\n\nritual for over 1 hour, which can be done during a short rest. You can't\n\naffect an artifact or a sentient weapon in this way. The weapon ceases\n\nbeing your [Pact] weapon if you die, if you perform the 1-hour ritual on a\n\ndifferent weapon, or if you use a 1-hour ritual to break your bond to it.\n\nThe weapon appears at your feet if it is in the extradimensional space\n\nwhen the bond breaks."

[[abilities]]
origin = "Pact"
level = 3
selection = "Primary"
name = "Pact Boon (Bond)"
desc = "You learn the Find Familiar spell and can cast it as a ritual and Soul\n\nMastery.\n\n  * When you cast the spell, you can choose one of the normal forms for your\n\nfamiliar or one of the following special forms: Imp, Pseudodragon, Quasit,\n\nor Sprite.\n\n  * Additionally, when you take the attack action, you can forgo one of your\n\nown attacks to allow your familiar to use its reaction to make one attack of\n\nits own."

[[abilities]]
origin = "Pact"
level = 3
selection = "Primary"
name = "Pact Boon (Tome)"
desc = "Your patron gives you a spellbook. When you gain this ability, choose\n\nthree cantrips from the spell list. While the book is on your person, you can cast\n\nthose cantrips at will. They don't count against your number of cantrips known.\n\nIf you lose your spellbook, you can perform a 1-hour ceremony to receive a\n\nreplacement from your patron. This ceremony can be performed during a short\n\nor long rest, and it destroys the previous book. The book turns to ash when you\n\ndie."

[[abilities]]
origin = "Pact"
level = 3
selection = "Primary"
name = "Pact Boon (Stellar Bond)"
desc = "If you have chosen Explorer as your patron you can select this Pact\n\nBoon. This Pact Boon grants your character a chain forged in starlight and whilst\n\nthis chain is on your person you gain two benefits:\n\n  * Once per short or long rest, you gain advantage to one Intelligence check\n\nor a skill check including Intelligence.\n\n  * You can cast the Augury spell as Soul Mastery but only as a ritual. The\n\nchain disappears if you would die. Once per short or long rest, you can\n\nperform a 1-hour ritual to replace your star chain if it is lost."

[[abilities]]
origin = "Pact"
level = 3
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 10 Potential"

[[abilities]]
origin = "Pact"
level = 4
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Pact"
level = 5
selection = "Primary"
name = "Improved Magical Upgrade"
desc = "Gain one of your choices:\n\n- Two points to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 20 Potential\n\n- +1 to an ability score of your choice\n\n- Pick an additional feat from the feat list"

[[abilities]]
origin = "Pact"
level = 6
selection = "Primary"
name = "Patron (Angelic)"
desc = "**Heart of Gold**\n\nWhenever you cast a spell that deals fire or radiant\n\ndamage to one target, you add your Presence modifier to the damage. In\n\naddition, you gain resistance to radiant damage."

[[abilities]]
origin = "Pact"
level = 6
selection = "Primary"
name = "Patron (Explorer)"
desc = "**Star Step**\n\nOnce per long rest, you can temporarily teleport into the\n\nStellar Expanse as an action. You return at the end of your turn and then your\n\nturn ends, but before then you can cast two spells that target yourself. This\n\nmovement does not trigger an attack of opportunity."

[[abilities]]
origin = "Pact"
level = 6
selection = "Primary"
name = "Patron (Fey)"
desc = "**Fade Out**\n\nOnce per short or long rest, you become invisible and teleport up\n\nto 12 m to an unoccupied space you can see if you take combat damage. You\n\nremain invisible until the end of your next turn or until you take a hostile action."

[[abilities]]
origin = "Pact"
level = 6
selection = "Primary"
name = "Patron (Fiend)"
desc = "**Fiendish Luck**\n\nWhen you make an ability check or a saving throw, you\n\ncan use this ability to add 1d10 to your roll. You can do so after seeing the initial\n\nroll but before any of the roll's effects occur. Once you use this ability, you can't\n\nuse it again until you finish a short or long rest."

[[abilities]]
origin = "Pact"
level = 6
selection = "Primary"
name = "Patron (Lurker)"
desc = "**Ghost Caller**\n\nOnce per long rest, you can cause a Soul to rise as a ghost\n\nfrom a humanoid creature you killed this turn. The Soul that rises has the\n\nstatistics of a specter but with a few differences:\n\n  * It gains a bonus to its attack roll equal to your Manipulation modifier.\n\n  * It gains temporary health points equal to half your total level.\n\n  * The specter obeys your commands and rolls its own initiative. The Soul\n\nreturns to the world after you finish a long rest."

[[abilities]]
origin = "Pact"
level = 6
selection = "Primary"
name = "Patron (Psychic)"
desc = "**Mind Over Matter**\n\nOnce per short or long rest, you can spend a\n\nreaction to give an enemy attacking you disadvantage to the attack roll. Before\n\nthe end of your next turn, you may make your next attack roll with advantage if\n\nyou caused the attack to miss this way."

[[abilities]]
origin = "Pact"
level = 6
selection = "Primary"
name = "Patron (Undead)"
desc = "**Escape Fate**\n\nOnce per long rest, when you stabilize a creature with the\n\nSpare the Dying cantrip, you can heal them for 1d8 + your Vitality modifier.\n\nAlternatively, when you succeed on a death saving throw, you can heal yourself\n\nfor 1d8+ your Vitality modifier (minimum 1)."

[[abilities]]
origin = "Pact"
level = 7
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 10 Potential"

[[abilities]]
origin = "Pact"
level = 8
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Pact"
level = 9
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 10 Potential"

[[abilities]]
origin = "Pact"
level = 10
selection = "Primary"
name = "Patron (Angelic)"
desc = "**Radiant Fortitude**\n\nWhen you finish a short or long rest, you and up to\n\nten allies are filled with celestial fortitude. You gain temporary health points\n\nequal to your total level plus your Presence modifier. Your allies receive\n\ntemporary health points equal to half your level picks in [Pact] plus your\n\nPresence modifier."

[[abilities]]
origin = "Pact"
level = 10
selection = "Primary"
name = "Patron (Explorer)"
desc = "**Resilient Voyager**\n\nYou gain resistance to both fire and cold damage,\n\nand you no longer need to breathe."

[[abilities]]
origin = "Pact"
level = 10
selection = "Primary"
name = "Patron (Fey)"
desc = "**Iron Will**\n\nWhen another creature attempts to charm you they must\n\nsucceed a Composure saving throw against your spell save DV or be charmed by\n\nyou instead of for 10 rounds or until the creature takes damage from an hostile\n\naction. In addition, you are immune to the charm condition."

[[abilities]]
origin = "Pact"
level = 10
selection = "Primary"
name = "Patron (Fiend)"
desc = "**Fiendish Resilience**\n\nYou can choose one damage type when you finish a\n\nshort or long rest. You gain resistance to that damage type until you choose a\n\ndifferent one with this ability. Damage from magical weapons or silver weapons\n\nignores this resistance."

[[abilities]]
origin = "Pact"
level = 10
selection = "Primary"
name = "Patron (Lurker)"
desc = "**Jinx Aegis**\n\nYou can roll a d6 as a reaction. If the result is 4 or higher the\n\ncreature afflicted by your Jinx ability that hits you with a successful attack roll\n\nmisses their attack instead."

[[abilities]]
origin = "Pact"
level = 10
selection = "Primary"
name = "Patron (Psychic)"
desc = "**Telepathic Wall**\n\nWhenever you are dealt psychic damage from another\n\ncreature, that creature suffers as much psychic damage you do. Your thoughts\n\ncannot be read unless you allow it. In addition, you gain resistance against\n\npsychic damage."

[[abilities]]
origin = "Pact"
level = 10
selection = "Primary"
name = "Patron (Undead)"
desc = "**Eternal Existence**\n\nEvery ten years your body only ages 1 year and you\n\nare immune against magical age effects. You do not require food, water, or\n\nbreathing. You still receive the benefits of a short or a long rest and you must\n\nrest to remove the exhaustion condition."

[[abilities]]
origin = "Pact"
level = 11
selection = "Primary"
name = "Absorb Innate Spellcasting"
desc = "Choose one 6th-level spell that is not Soul Consumption. You can cast this spell as Soul\n\nMastery once per long rest."

[[abilities]]
origin = "Pact"
level = 12
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Pact"
level = 13
selection = "Primary"
name = "Absorb Innate Spellcasting"
desc = "Choose one 7th-level spell that is not Soul Consumption. You can cast this spell as Soul\n\nMastery once per long rest."

[[abilities]]
origin = "Pact"
level = 14
selection = "Primary"
name = "Patron (Angelic)"
desc = "**Blazing Dedication**\n\nOnce per long rest, when you make a death saving\n\nthrow you may instantly stabilize, gain health points equal to your half your\n\nhealth point maximum and stand up. All creatures of your choice within 6 m of\n\nyou take radiant damage equal to your Presence damage plus 2d8 and are blinded\n\nuntil the end of your next turn."

[[abilities]]
origin = "Pact"
level = 14
selection = "Primary"
name = "Patron (Explorer)"
desc = "**Isolated in the Expanse**\n\nOnce per long rest, you may transport\n\nyourself and up to ten willing creatures into the Stellar Expanse by performing a\n\n5-minute ritual. You can stay in the Stellar Expanse for the duration of a short\n\nrest. If a creature uses this time to take the rest action, they regain the full value\n\nof any spent health dice and they gain advantage on one skill check, saving throw,\n\nor attack roll of their choosing. The advantage must be used within 4 hours after\n\nthe rest is complete. You can apply the advantage after you have rolled the check\n\nbut before the GM declares a success or a fail. When the duration is over, all\n\ncreatures are returned to their original location."

[[abilities]]
origin = "Pact"
level = 14
selection = "Primary"
name = "Patron (Fey)"
desc = "**Sinister Hallucinations**\n\nOnce per short or long rest, you can target one\n\ncreature within 12 m of you and cause them to hallucinate. The target\n\nhallucinates that they are in an empty, misty realm where they can only hear\n\nthemselves and you, but not see anything else. The target suffers these effects for\n\n10 rounds or until your concentration is broken (as if you were concentrating on\n\na spell) if they fail a Resolve saving throw or a Composure saving throw (your\n\nchoice) against your spell save DV."

[[abilities]]
origin = "Pact"
level = 14
selection = "Primary"
name = "Patron (Fiend)"
desc = "**Hurl Through Hell**\n\nOnce per short rest, when you hit a creature with an\n\nattack, you can use this ability to instantly make the target hallucinate about long\n\ngone realms once home to fiends. The creature disappears to the Stellar Expanse\n\nand in their mind falls through a nightmare landscape. At the end of your next\n\nturn, the target returns to the space it previously occupied or the nearest\n\nunoccupied space. If the target is not a fiend, it takes 10d10 psychic damage as it\n\nreels from its horrific experience."

[[abilities]]
origin = "Pact"
level = 14
selection = "Primary"
name = "Patron (Lurker)"
desc = "**Jinx Savant**\n\nAs long as you are not incapacitated, you can transfer your\n\nJinx to another target within 6 m of you after your currently Jinxed target dies as\n\na bonus action. You can transfer your Jinx like this three times per short rest."

[[abilities]]
origin = "Pact"
level = 14
selection = "Primary"
name = "Patron (Psychic)"
desc = "**Instant Slave**\n\nYou can charm an incapacitated humanoid by simply\n\ntouching them and spending an action. You can communicate telepathically with\n\nthe charmed creatures as long as the both of you are within the same Realm. The\n\ncharm condition persists until you use this ability again or by a Remove Curse\n\nspell."

[[abilities]]
origin = "Pact"
level = 14
selection = "Primary"
name = "Patron (Undead)"
desc = "**Everlasting Soul**\n\nIf you regain health points from any source you can\n\nreattach body parts. Once per short or long rest, you may spend a bonus action\n\nand regain health points equal to 1d8 + your total level."

[[abilities]]
origin = "Pact"
level = 15
selection = "Primary"
name = "Absorb Innate Spellcasting"
desc = "Choose one 8th-level spell that is not Soul Consumption. You can cast this spell as Soul\n\nMastery once per long rest."

[[abilities]]
origin = "Pact"
level = 16
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Pact"
level = 17
selection = "Primary"
name = "Absorb Innate Spellcasting"
desc = "Choose one 9th-level spell that is not Soul Consumption. You can cast this spell as Soul\n\nMastery once per long rest."

[[abilities]]
origin = "Pact"
level = 18
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- Two points to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 20 Potential"

[[abilities]]
origin = "Pact"
level = 19
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Sibling Soul"
desc = "You can spend 10 rounds entreating your patron for aid to regain either all your spell\n\nslots that recover after a long rest, or all your spell slots that recover after a short rest.\n\nOnce you regain spell slots with this ability, you must finish a long rest before you can\n\ndo so again.\n\nExtra ability origin content"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Absorb Soul Aspect"
desc = "Your connection to your patron allows you to glimpse aspects of power from your\n\npatron\u2019s Soul, and then, with time, embody them yourself. When you gain a level in\n\n[Pact], you can choose one of the Soul aspects you know and replace it with another\n\nSoul aspect that you could learn at that level. If an aspect has prerequisites, you must\n\nmeet them to learn it. You can learn the Soul aspect at the same time that you meet its\n\nprerequisites.\n\nAgonizing Blast\n\nPrerequisite: Ranged spell attack cantrip\n\nWhen you cast a ranged spell attack cantrip of your choice, add your Cunning or\n\nManipulation modifier of your choice (choose once) to the damage it deals on a hit.\n\nArcane Sight\n\nYou can cast Detect Magic as Soul Mastery.\n\nArmor of Shadows\n\nYou can cast Mage Armor as Soul Mastery.\n\nBeast Speech\n\nYou can cast Speak With Animals as Soul Mastery.\n\nBeguiling Influence\n\nYou gain 2 skill points in the Deception and Persuasion skills and you may gain rank 5\n\nwith those skills.\n\nBook of Ancient Rituals\n\nPrerequisite: Pact of the Tome ability\n\nYou can now inscribe magical rituals in your spellbook. Choose two 1st-level spells that\n\nhave the ritual tag. The spells appear in the book and don't count against the number of\n\nspells you know. With your spellbook in hand, you can cast the chosen spells as rituals.\n\nYou can't cast the spells except as rituals unless you've learned them by some other\n\nmeans. You can also cast your normal spells you know as a ritual if it has the ritual tag.\n\nOn your adventures, you can add other ritual spells to your spellbook. When you find\n\nsuch a spell, you can add it to the book if the spell's level is equal to or less than half your\n\n[Pact] level (rounded up) and if you can spare the time to transcribe the spell. For each\n\nlevel of the spell, the transcription process takes 2 hours and costs Soul points equal to\n\nthe level of the spell inscribed, those Soul points are consumed.\n\nBountiful Recovery\n\nPrerequisite: Pact of the Bond ability\n\nWhilst your familiar is within 30 m of you, whenever you are targeted with a spell or\n\nability that rolls dice to regain health points, you regain health points equal to the\n\nmaximum value of those dice instead of rolling.\n\nEmbrace of Dithore\n\nPrerequisite: Ranged spell attack cantrip\n\nYou can move one target you have hit with your a ranged spell attack cantrip of your\n\nchoice 2 m towards you in a straight line. You can only use this Soul Aspect once per\n\nturn.\n\nEnhanced Pact Weapon\n\nPrerequisite: Pact of the Blade ability\n\nAs long as your [Pact] weapon does not have a +1 bonus to attack rolls and damage rolls\n\nalready, it receives a +1 bonus to attack and damage rolls. Additionally, the [Pact] weapon\n\nyou conjure can be a short bow, longbow, light crossbow, or heavy crossbow.\n\nEyes of An\u2019her\n\nYou can see normally in darkness, both magical and nonmagical, up to a distance of 24\n\nm.\n\nEyes of Sokari\n\nYou can read all written text.\n\nForce Spear\n\nPrerequisite: Ranged spell attack cantrip\n\nIf you cast a ranged spell attack cantrip of your choice, its range is 60 m.\n\nGaze of Two Minds\n\nYou can use your action to touch a willing humanoid and perceive through its senses\n\nuntil the end of your next turn. As long as the creature is within the same Realm as you,\n\nyou can use your action on subsequent turns to maintain this connection, extending the\n\nduration until the end of your next turn. While perceiving through the other creature's\n\nsenses, you benefit from any special senses possessed by that creature, and you are\n\nblinded and deafened to your own surroundings.\n\nJinx of Imenta\n\nOnce per long rest, you can cast Bane as Soul Mastery.\n\nLunar Trance\n\nPrerequisite: Pact of the Tome\n\nYou cannot fall asleep anymore, not even by magical means. You can still gain the\n\nbenefits of a long rest but you must spend it only doing light activity.\n\nMask of Many Faces\n\nYou can cast Disguise Self as Soul Mastery.\n\nMisty Visions\n\nYou can cast Silent Image as Soul Mastery.\n\nRepelling Blast\n\nPrerequisite: Ranged spell attack cantrip\n\nWhen you hit a creature with a ranged spell attack cantrip of your choice, you can push\n\nthe creature up to 2 m away from you in a straight line.\n\nSpear of Torpor\n\nPrerequisite: Ranged spell attack cantrip\n\nYou can reduce the speed of one target you have hit with a ranged spell attack cantrip of\n\nyour choice by 2 m until the end of your next turn. You can only use this Soul Aspect\n\nonce per turn.\n\nVigor of Labda\n\nYou can cast Armor of Life as 1st level spell on yourself as Soul Mastery.\n\nVoice of the Master\n\nPrerequisite: Pact of the Bond ability\n\nYou can communicate telepathically with your familiar and perceive through your\n\nfamiliar's senses as long as you are within the same Realm. Additionally, while perceiving\n\nthrough your familiar's senses, you can also speak through your familiar in your own\n\nvoice, even if your familiar is normally incapable of speech.\n\nAggravating Jinx\n\nPrerequisite: 5 level picks in [Pact], Hex spell or, any spell or ability that curses\n\nYou can deal psychic damage with a bonus action against a creature you have cursed by\n\na spell or ability you possess. The damage also afflicts all creatures within 1 m of it and\n\nequals your Cunning or Manipulation modifier of your choice (choose once, minimum\n\n1).\n\nCoffin of Khei\n\nPrerequisite: 5 level picks in [Pact]\n\nOnce per short or long rest, when you suffer damage in combat you may entomb\n\nyourself in an icy coffin. Whilst in this icy coffin you gain a number of effects:\n\n- You gain 10 temporary health points per total level you possess. These temporary\n\nhealth points soak up as much as possible of the damage you took before\n\ntriggering this ability.\n\n- Your speed is reduced to 0.\n\n- You are incapacitated.\n\n- You suffer vulnerability to fire damage.\n\nThis icy coffin melts at the end of your next turn and all effects, including the temporary\n\nhealth points, ends.\n\nFavor of the Waves\n\nPrerequisite: 5 level picks in [Pact]\n\nOnce per long rest, you can cast Water Breathing as Soul Mastery. In addition, you gain\n\na swimming speed equal to your walking speed and you can breathe underwater.\n\nMenacing Aura\n\nPrerequisite: 5 level picks in [Pact]\n\nOnce per short or long rest, you may spend a bonus action and gain a menacing and\n\npoisonous aura. The form your aura takes is up to you (buzzing flies, sickly green water,\n\nblack tendrils of shadows, etc). The radius of your aura is 1-m radius but it cannot go\n\nthrough total cover. Your aura gives you two benefits:\n\n- Creatures who start their turn in your aura suffer poison damage equal to\n\nCunning or Manipulation (minimum of 1) your choice (choose once).\n\n- You gain advantage on any intimidation attempts you make with Persuasion or\n\nDeception skill checks. All other social checks you make have disadvantage.\n\nMire the Mind\n\nPrerequisite: 5 level picks in [Pact]\n\nOnce per long rest, you can cast Slow as Soul Mastery.\n\nOne with Shadows\n\nPrerequisite: 5 level picks in [Pact]\n\nWhen you are in an area of dim light or darkness, you can use your action to become\n\ninvisible until you move, take an action, or a reaction.\n\nSign of Ill Omen\n\nPrerequisite: 5th level picks in [Pact]\n\nOnce per long rest, you can cast Bestow Curse as Soul Mastery.\n\nThirsting Blade\n\nPrerequisite: 5 level picks in [Pact], Pact of the Blade ability\n\nYou can attack with your [Pact] weapon twice, instead of once, whenever you take the\n\nattack action on your turn.\n\nBewitching Whispers\n\nPrerequisite: 7 level picks in [Pact]\n\nOnce per long rest, you can cast Compulsion as Soul Mastery.\n\nDreadful Word\n\nPrerequisite: 7th [Pact] level\n\nOnce per long rest, you can cast Confusion as Soul Mastery.\n\nInexorable Jinx\n\nPrerequisite: 7 level picks in [Pact], Hex spell or, any spell or ability that curses\n\nAgainst a target you have cursed through a spell or an ability you possess, you can\n\nteleport within 1 m of them as a bonus action. You can only teleport this way as long as\n\nyou can see them and they are within 6 m of you.\n\nPhantom Vision\n\nPrerequisite: 7 level picks in [Pact]\n\nOnce per short or long rest, for 10 rounds you gain the ability to see through objects.\n\nThis vision has a range of 6 m and within that range, you also gain darkvision.\n\nSculptor of Flesh\n\nPrerequisite: 7 level picks in [Pact]\n\nOnce per long rest, you can cast Polymorph as Soul Mastery.\n\nTactical Retreat\n\nPrerequisite: 7 level picks in [Pact]\n\nOnce per long rest, you can cast Freedom of Movement as Soul Mastery.\n\nAscendant Step\n\nPrerequisite: 9 level picks in [Pact]\n\nYou can cast Levitate on yourself as Soul Mastery.\n\nExceptional Pact Weapon\n\nPrerequisite: 9 level picks in [Pact], Pact of the Blade ability\n\nAs long as your [Pact] weapon does not have a +2 bonus to attack rolls and damage rolls\n\nalready, it receives a +2 bonus to attack and damage rolls. Additionally, the [Pact]\n\nweapon you conjure can be a short bow, longbow, light crossbow, or heavy crossbow.\n\nMinions of the Primordials\n\nPrerequisite: 9 level picks in [Pact]\n\nOnce per long rest, you can cast Conjure Elemental as Soul Mastery.\n\nOtherworldly Leap\n\nPrerequisite: 9 level picks in [Pact]\n\nYou can cast Jump as Soul Mastery.\n\nWhispers of the Grave\n\nPrerequisite: 9 level picks in [Pact]\n\nYou can cast Speak With Dead as Soul Mastery.\n\nWrath of the Taskmaster\n\nPrerequisite: 9 level picks in [Pact], Pact of the Bond ability\n\nSpend your bonus action and you can command your familiar to make an attack.\n\nAffliction of Galene\n\nPrerequisite: 12 level picks in [Pact], Pact of the Blade ability\n\nWhen you hit a creature with your [Pact] weapon, the creature takes extra lightning\n\ndamage equal to your Cunning or Manipulation modifier (your choice, choose once,\n\nminimum 1).\n\nChains of Amaknuphis\n\nPrerequisite: 15th [Pact] level, Pact of the Bond ability\n\nYou can cast Hold Monster as Soul Mastery but you can only target a celestial, fiend, or\n\nelemental. You must finish a long rest before you can cast Hold Monster like this against\n\nthe same creature again.\n\nCloak of Darkness\n\nPrerequisite: 15 level picks in [Pact]\n\nOnce per long rest, you can cast Invisibility as Soul Mastery.\n\nMaster of Myriad Forms\n\nPrerequisite: 15 level picks in [Pact]\n\nYou can cast Alter Self as Soul Mastery.\n\nTranscendent Pact Weapon\n\nPrerequisite: 15 level picks in [Pact], Pact of the Blade ability\n\nAs long as your [Pact] weapon does not have a +3 bonus to attack rolls and damage rolls\n\nalready, it receives a +3 bonus to attack and damage rolls. Additionally, the [Pact]\n\nweapon you conjure can be a short bow, longbow, light crossbow, or heavy crossbow.\n\nVisions of Distant Realms\n\nPrerequisite: 15 level picks in [Pact]\n\nYou can cast Arcane Eye as Soul Mastery.\n\nWitch Sight\n\nPrerequisite: 15 level picks in [Pact]\n\nYou can see the true form of any shapechanger or creature concealed by illusion or\n\ntransmutation magic while the creature is within 6 m of you and within line of sight."

[[abilities]]
origin = "Power"
level = 1
selection = "Primary"
name = "Rage"
desc = "On your turn, you can enter a Rage as a bonus action. While raging, you gain the\n\nfollowing benefits if you aren't wearing heavy armor:\n\n- You have advantage on all Brawn checks and Brawn saving throws.\n\n- When you make a melee weapon attack using Brawn, you gain a bonus to the\n\ndamage roll that increases as you pick levels in [Power], which starts at +2,\n\nincreases to +3 at 9th and +4 at 16th.\n\n- You have resistance to bludgeoning, piercing, and slashing damage.\n\n- If you can cast spells, you can't cast them or concentrate on them while raging.\n\nYour Rage lasts for a whole combat if the combat does not have any distinct pauses in\n\nthe violence, this is up to the GM to decide. You can also end your Rage early by\n\nspending a bonus action. You can rage twice per long rest when you pick this ability, and\n\nthe number of times you can Rage increases as you gain total levels. At 3rd total level,\n\nyou can Rage thrice, four times at 6th, five times at 12th, six times at 17th, and unlimited\n\nat 20th."

[[abilities]]
origin = "Power"
level = 1
selection = "Secondary"
name = "Unarmored Defense"
desc = "While you are not wearing any armor or wielding a shield, your armor class equals 10 +\n\nyour Vitality modifier + your Resolve modifier. The Vitality and the Resolve modifier\n\ncannot exceed your proficiency bonus individually."

[[abilities]]
origin = "Power"
level = 1
selection = "Secondary"
name = "Second Wind"
desc = "Once per short or long rest, you may regain health points equal to 1d10 + your level in\n\n[Power] as a bonus action."

[[abilities]]
origin = "Power"
level = 2
selection = "Primary"
name = "Reckless Attack"
desc = "When you make your first attack on your turn, you can decide to attack recklessly.\n\nDoing so gives you advantage on all melee weapon attack rolls using Brawn during that\n\nturn, but attack rolls against you are rolled with advantage until the beginning of your\n\nnext turn."

[[abilities]]
origin = "Power"
level = 2
selection = "Secondary"
name = "Danger Sense"
desc = "You have advantage on Dexterity saving throws against effects that you can see. You do\n\nnot gain this benefit if you are blinded, deafened, or incapacitated."

[[abilities]]
origin = "Power"
level = 2
selection = "Secondary"
name = "Survival Instincts"
desc = "Choose two Skills between Animal Handling, Athletics, Medicine, Perception, or Survival,\n\nyou gain 2 skill points in both of them and you may gain rank 5 with both of those skills."

[[abilities]]
origin = "Power"
level = 3
selection = "Primary"
name = "Primal Path (Beast Channeller)"
desc = "**Bestial Nature**\n\nYou study an animal or beast of your choice\n\nto channel their ferocity in battle and gain their ancient wisdom. The animal or\n\nbeast of your choice must fit one of the categories below and be native to your\n\nhome region. On subsequent levels, if you pick up more Beast Channeller abilities\n\nyou may choose the same animal or a different one. But you still must abide by\n\nthe guidelines above when you do so. In addition, you learn Beast Sense and\n\nSpeak as Animals but you can only cast them as rituals.\n\n  * Lumbering: As long as you have activated your Rage ability, you have\n\nresistance to all damage except psychic damage.\n\n  * Flying: As long as you are not wearing heavy armor you can use the dash\n\naction as a bonus action. Additionally, other creatures have disadvantage\n\nwhen targeting you with opportunity attacks.\n\n  * Pack: As long as you are using your Rage ability, all your companions\n\nreceive advantage when they target a creature within 1 m of you with a\n\nmelee attack."

[[abilities]]
origin = "Power"
level = 3
selection = "Primary"
name = "Primal Path (Berserker)"
desc = "**Frenzy**\n\nYou can go into a Frenzy when you Rage. If you do so, for the\n\nduration of your Rage you can make a single melee weapon attack as a bonus\n\naction on each of your turns after this one. When the Rage ends you gain one\n\nlevel of exhaustion."

[[abilities]]
origin = "Power"
level = 3
selection = "Primary"
name = "Primal Path (Fanatic)"
desc = "**Blessed**\n\nAs long as you are using your Rage ability, your first successful\n\nweapon attack on each of your turns receives a bonus to its damage. The damage\n\nequals 1d6 plus half your [Power] level, rounded up. You choose the damage type\n\nand it will remain that damage type for the rest of your campaign."

[[abilities]]
origin = "Power"
level = 3
selection = "Primary"
name = "Primal Path (Natural Harbinger)"
desc = "**Child of the Natural World**\n\nWhilst raging, you can activate\n\nan aura with a 2 m radius. On subsequent turns whilst you are raging, as long as\n\nyou spend a bonus action, the aura is activated until the start of your next turn.\n\nThis aura cannot pierce through total cover. If any effects within Natural\n\nHarbinger would require a saving throw, your DV would equal your Vitality\n\nmodifier plus your proficiency modifier. Choose one:\n\n  * Arid: All creatures but you take 2 fire damage when you activate your aura\n\nwith a bonus action. The damage increases with +1 at every 5 level picks of\n\n[Power].\n\n  * Ocean: When you spend a bonus action to reactivate your aura, choose a\n\ncreature within your aura\u2019s range. That creature makes a dexterity saving\n\nthrow. On a fail, the creature suffers 1d6 lightning damage and on a\n\nsuccess, they suffer half that damage. The damage increases with +1d6 at\n\nevery 5 level picks of [Power].\n\n  * Arctic: All allies within range become strengthened by your icy aura and\n\ngain 5 temporary health points. The temporary health points increase with\n\n+5 at every 5 level picks of [Power]."

[[abilities]]
origin = "Power"
level = 3
selection = "Primary"
name = "Primal Path (Shaman)"
desc = "**Defenders**\n\nOn your turn, the first creature you hit with a weapon\n\nattack whilst you are raging becomes distracted by spirits. That creature has\n\ndisadvantage to any attack it makes when targeting one of your allies instead of\n\nyou. If it would successfully hit one of your allies anyway, your ally receives\n\nresistance to the damage it receives. This effect lasts until the start of your next\n\nturn or until you stop raging."

[[abilities]]
origin = "Power"
level = 3
selection = "Secondary"
name = "Fast Movement"
desc = "Your speed increases by 2 m while you aren't wearing heavy armor."

[[abilities]]
origin = "Power"
level = 4
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Power"
level = 5
selection = "Primary"
name = "Extra Attack"
desc = "As part of your attack action, you can make two attacks instead of one. You must\n\npossess at least 1 level of [Power] to be eligible for this ability (excluding this level)."

[[abilities]]
origin = "Power"
level = 6
selection = "Primary"
name = "Primal Path (Beast Channeller)"
desc = "**Animalistic Virtue**\n\nYour Soul swells with the virtues of an\n\nanimal or beast of your choice. Choose one:\n\n  * Lumbering: All knockback effects increase with 1 m for you and all\n\nattempts to knock you prone or knock you back suffer disadvantage. In\n\naddition, you double your carrying capacity.\n\n  * Flying: Dim light does not impose disadvantage on your perception\n\nchecks. Without obstacles, you can see up to 2 km away from you and you\n\ncan discern fine details up to 30 m away from you.\n\n  * Running: If you are traveling at a normal pace you can still move stealthily\n\nand if you are traveling at a fast pace you can still track other creatures."

[[abilities]]
origin = "Power"
level = 6
selection = "Primary"
name = "Primal Path (Berserker)"
desc = "**Mindless Rage**\n\nYou can't be charmed or frightened while raging. If\n\nyou are charmed or frightened when you enter your Rage, the effect is\n\nsuspended for the duration of the Rage."

[[abilities]]
origin = "Power"
level = 6
selection = "Primary"
name = "Primal Path (Fanatic)"
desc = "**Zealous Perseverance**\n\nOnce per Rage, you can reroll a failed saving\n\nthrow but you must use the new result."

[[abilities]]
origin = "Power"
level = 6
selection = "Primary"
name = "Primal Path (Natural Harbinger)"
desc = "**Soul of the Wild**\n\nYou gain benefits even if your aura is not\n\nactive. Choose one:\n\n  * Arid: You can light on fire flammable objects with a mere touch of your\n\nhand. If you want to light on fire an object that is being worn or carried\n\nyou must first perform a successful grapple on the target and then a\n\nbonus action to ignite the spark. If the creature does not remove the item\n\nor douse the fire with action before the end of their next turn, they suffer\n\n1d10 fire damage. In addition, you gain resistance to fire damage.\n\n  * Ocean: You can breathe underwater and you gain a swimming speed of 6\n\nm. In addition, you gain resistance to lightning damage.\n\n  * Arctic: You do not suffer any adverse effects in extreme cold, you do not\n\nleave any footprints in snow and you gain advantage on Survival checks\n\nmade to track creatures in the snow. In addition you gain resistance\n\nagainst cold damage."

[[abilities]]
origin = "Power"
level = 6
selection = "Primary"
name = "Primal Path (Shaman)"
desc = "**Phantom Armor**\n\nWhen you are raging and you see an ally take damage\n\nwithin 6 m of you, you may spend your reaction and lower that damage by 2d6.\n\nThis reduction in damage increases twice with 1d6. Once after 10 level picks of\n\n[Power] (to 3d6), and once again after 14 levels picks of [Power] (to 4d6)."

[[abilities]]
origin = "Power"
level = 7
selection = "Primary"
name = "Feral Instinct"
desc = "You have advantage on initiative rolls. Additionally, if you are surprised at the beginning\n\nof combat and aren't incapacitated, you can act normally on your first turn, but only if\n\nyou enter your Rage before doing anything else on that turn."

[[abilities]]
origin = "Power"
level = 8
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Power"
level = 9
selection = "Primary"
name = "Brutal Critical"
desc = "You can roll one additional weapon damage die when determining the extra damage for\n\na critical hit with a melee attack."

[[abilities]]
origin = "Power"
level = 10
selection = "Primary"
name = "Primal Path (Beast Channeller)"
desc = "**Listen to the Wild**\n\nYou gain the ability to cast Commune\n\nWith Nature as a ritual."

[[abilities]]
origin = "Power"
level = 10
selection = "Primary"
name = "Primal Path (Berserker)"
desc = "**Intimidating Presence**\n\nAs an action, you may attempt to frighten a\n\ncreature that you can see or hear you within 6 m of you. The creature must\n\nsucceed on a Resolve saving throw (DV equal to 8 + your proficiency bonus + your\n\nPresence modifier) or be frightened of you until the end of your next turn. On\n\nsubsequent turns, you can use your action to extend the duration of this effect\n\non the frightened creature until the end of your next turn. This effect ends if the\n\ncreature ends its turn out of line of sight or more than 12 m away from you. If the\n\ncreature succeeds on its saving throw, you can't use this ability on that creature\n\nagain for 24 hours."

[[abilities]]
origin = "Power"
level = 10
selection = "Primary"
name = "Primal Path (Fanatic)"
desc = "**Kindle the Spark**\n\nOnce per long rest, you can unleash a holy\n\nemboldening shout that gives up to ten allies within 12 m of advantage to all\n\nattack rolls and saving throws they make until the start of your next turn."

[[abilities]]
origin = "Power"
level = 10
selection = "Primary"
name = "Primal Path (Natural Harbinger)"
desc = "**Shelter**\n\nAll creatures of your choice within your aura also\n\ngain your resistance that you received from the Soul of the Wild ability."

[[abilities]]
origin = "Power"
level = 10
selection = "Primary"
name = "Primal Path (Shaman)"
desc = "**Commune with the Forebearers**\n\nOnce per short or long rest, you can\n\ncast Augury or Clairvoyance as Soul Mastery. For the purposes of Clairvoyance,\n\nrather than creating a sensor, you send one of your spirits to the location\n\ninstead."

[[abilities]]
origin = "Power"
level = 11
selection = "Primary"
name = "Relentless Rage"
desc = "If you drop to 0 health points while you're raging and don't die outright, you can make a\n\nDV 10 Vitality saving throw. If you succeed, you drop to 1 health point instead. Each time\n\nyou use this ability after the first, the DV increases by 5. When you finish a short or long\n\nrest, the DV resets to 10."

[[abilities]]
origin = "Power"
level = 12
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Power"
level = 13
selection = "Primary"
name = "Brutal Critical"
desc = "You can roll one additional weapon damage die when determining the extra damage for\n\na critical hit with a melee attack. If this is not the first time you have picked this ability,\n\nyou gain another die."

[[abilities]]
origin = "Power"
level = 14
selection = "Primary"
name = "Primal Path (Beast Channeller)"
desc = "**Beast Bond**\n\nChoose one:\n\n  * Lumbering: Any creature within 1 m of you and is hostile to you suffers\n\ndisadvantage on all attack rolls when they target other creatures other\n\nthan you. This ability is in effect as long as you are raging, the affected\n\ncreature can see or hear you, and the creature isn\u2019t immune to being\n\nfrightened.\n\n  * Flying: As long as you are raging, you gain the ability to fly in short bursts.\n\nYour flying speed equals your walking speed. If you would end your turn\n\nup in the air you would immediately fall.\n\n  * Running: If you spend your bonus action when you hit a creature with a\n\nmelee weapon attack you may knock the creature prone. You can only\n\nknock a creature prone this way if you are raging and the target is Large\n\nor smaller."

[[abilities]]
origin = "Power"
level = 14
selection = "Primary"
name = "Primal Path (Berserker)"
desc = "**Retaliation**\n\nAs a reaction, you may make one melee weapon against\n\na creature that is within 1 of you and damages you."

[[abilities]]
origin = "Power"
level = 14
selection = "Primary"
name = "Primal Path (Fanatic)"
desc = "**Endless Anger**\n\nIf you are brought down to 0 health points or less but\n\nnot killed outright when you are raging, you do not fall unconscious. You still\n\nsuffer damage as normal and make death saving throws as normal. If you die from\n\nyour death saving throws you can still keep on fighting until your rage ends or 10\n\nrounds has passed, whichever is faster."

[[abilities]]
origin = "Power"
level = 14
selection = "Primary"
name = "Primal Path (Natural Harbinger)"
desc = "**Force of Nature**\n\nChoose one:\n\n  * Arid: As a reaction, you can force one creature to make a Dexterity saving\n\nthrow after it hits you with an attack. If the creature fails this saving throw\n\nit takes fire damage equal to half your total level.\n\n  * Ocean: As a reaction, you can knock a creature prone if you successfully\n\nhit them with an attack within your aura. A successful Brawn saving throw\n\nprevents the creature from being knocked prone by the rolling wave of\n\nforce you unleash.\n\n  * Arctic: Whenever you spend a bonus action to reactivate your aura, you\n\ncan choose one creature to make a Brawn saving throw. On a failed save,\n\nthe creature\u2019s speed is reduced to 0 until the start of your next turn as\n\nthey become afflicted by frostbite. The creature must be within your aura\n\nand you must be able to see it."

[[abilities]]
origin = "Power"
level = 14
selection = "Primary"
name = "Primal Path (Shaman)"
desc = "**Ruthless**\n\nWhenever you use your Phantom Armor ability to reduce\n\ndamage against an ally of yours, the attacker suffers force damage equal to the\n\ndamage your Phantom Armor ability averted."

[[abilities]]
origin = "Power"
level = 15
selection = "Primary"
name = "Innate Aggression"
desc = "As a reaction, you may move up to half your total movement towards a creature that\n\nended their turn within 3 m of you. This movement does not trigger attacks of\n\nopportunity."

[[abilities]]
origin = "Power"
level = 16
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Power"
level = 17
selection = "Primary"
name = "Brutal Critical"
desc = "You can roll one additional weapon damage die when determining the extra damage for\n\na critical hit with a melee attack. If this is not the first time you have picked this ability,\n\nyou gain another die."

[[abilities]]
origin = "Power"
level = 18
selection = "Primary"
name = "Indomitable Might"
desc = "If your total for a Brawn check is less than your Brawn score, you can use that score in\n\nplace of the total."

[[abilities]]
origin = "Power"
level = 19
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Power"
level = 20
selection = "Primary"
name = "Primal Champion"
desc = "Your Brawn and Vitality scores increase by 4. Your maximum for those scores is now 24."

[[abilities]]
origin = "Predator"
level = 1
selection = "Primary"
name = "Favored Enemy"
desc = "Choose one creature type between, animal, beast, celestial, construct, dragon,\n\nelemental, fey, fiend, giant, human, humanoid, monstrosity, ooze, plant, or undead.\n\nAgainst the creature type of choice you receive a number of benefits:\n\n- When you do a weapon attack against your creature type you receive a +2 bonus\n\nto both attack rolls and damage rolls.\n\n- Advantage to any Survival checks you perform to track the creature type of your\n\nchoice.\n\n- Advantage to any Intelligence checks to recall information about the creature\n\ntype of choice."

[[abilities]]
origin = "Predator"
level = 1
selection = "Secondary"
name = "Natural Explorer"
desc = "Your soul vibrates at the same frequency as the natural world. When you take this ability\n\nyou gain advantage on attack rolls against creatures who have not yet acted on your first\n\nturn in combat. You gain advantage to initiative rolls and you ignore difficult terrain.\n\nWhen you travel for an hour or more you and your group receive the following benefits:\n\n- Difficult Terrain doesn't slow your group's travel.\n\n- Your group can't become lost except by magical means.\n\n- Even when you are engaged in another activity while traveling, you remain alert\n\nto danger.\n\n- If you are traveling alone, you can move stealthily at a normal pace.\n\n- When you forage, you find twice as much food as you normally would.\n\n- While tracking other creatures, you also learn their exact number, their sizes,\n\nand how long ago they passed through the area."

[[abilities]]
origin = "Predator"
level = 2
selection = "Primary"
name = "Fighting Style (Archery)"
desc = "+2 attack rolls made with ranged weapons."

[[abilities]]
origin = "Predator"
level = 2
selection = "Primary"
name = "Fighting Style (Defense)"
desc = "While you\u2019re wearing armor, you gain a +1 bonus to AC."

[[abilities]]
origin = "Predator"
level = 2
selection = "Primary"
name = "Fighting Style (Dueling)"
desc = "When you\u2019re wielding a melee weapon in one hand and no other\n\nweapon, you gain a +2 bonus to damage rolls with that weapon."

[[abilities]]
origin = "Predator"
level = 2
selection = "Primary"
name = "Fighting Style (Great Weapon Fighting)"
desc = "When you roll a 1 or 2 on a damage die for an attack you\n\nmake with a melee weapon that you\u2019re wielding with two hands, you can reroll\n\nthe dice and must use the new results."

[[abilities]]
origin = "Predator"
level = 2
selection = "Primary"
name = "Fighting Style (Protection)"
desc = "When a creature you can see attacks a target other than you that is\n\nwithin 1 m of you, you can use your reaction to impose disadvantage on the\n\nattack roll. You must be wielding a shield."

[[abilities]]
origin = "Predator"
level = 2
selection = "Primary"
name = "Fighting Style (Two)"
desc = "**Weapon Fighting**\n\nWhen you engage in two-weapon fighting, you can add\n\nyour ability modifier to the damage of the second attack."

[[abilities]]
origin = "Predator"
level = 2
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 10 Potential"

[[abilities]]
origin = "Predator"
level = 3
selection = "Primary"
name = "Conclave (Butcher of Behemoths)"
desc = "**Butcher\u2019s Intuition**\n\nChoose one creature that you can\n\nsee within 12 m of you and spend an action. As long as the creature is not\n\nprotected from Divination magic you learn the creature\u2019s vulnerabilities,\n\nresistances, and immunities. If it is protected, you sense the creature has no\n\nvulnerabilities, resistances, and immunities. You may perform this ability a\n\nnumber of times equal to your Cunning modifier (minimum of 1) before you\n\ncomplete a long rest."

[[abilities]]
origin = "Predator"
level = 3
selection = "Primary"
name = "Conclave (Exterminator of Woe)"
desc = "**Ghastly Executioner**\n\nOn your first turn each combat you\n\ngain a number of benefits.\n\n  * As part of your attack action that turns you can make an additional attack.\n\n  * You can dash as a bonus action."

[[abilities]]
origin = "Predator"
level = 3
selection = "Primary"
name = "Conclave (Hunter)"
desc = "**Hunter\u2019s Prey**\n\nyou gain one of the following benefits of your choice.\n\n  * Colossus Slayer: When you hit a creature with a weapon attack, the\n\ncreature takes an extra 1d8 damage if it's below its health point maximum.\n\nYou can deal this extra damage only once per turn.\n\n  * Giant Killer: When a Large or larger creature within 1 m of you hits or\n\nmisses you with an attack, you can use your reaction to attack that\n\ncreature immediately after its attack, provided that you can see the\n\ncreature.\n\n  * Horde Breaker: Once on each of your turns when you make a weapon\n\nattack, you can make another attack with the same weapon against a\n\ndifferent creature that is within 1 m of the original target and within range\n\nof your weapon."

[[abilities]]
origin = "Predator"
level = 3
selection = "Primary"
name = "Conclave (Ranger)"
desc = "**Partner of the Wild**\n\nYou gain a bonus to your initiative equal to your\n\nCunning modifier. In addition, you learn how to bond an animal\u2019s or beast\u2019s Soul\n\nto yours, and through your bond strengthen their Soul. To bond with the partner\n\nyou must perform an 8-hour Soul Consumption ritual with at least one Soul\n\npotency. This ritual is Soul Mastery but Soul potency must still be consumed. If\n\nyou do not have a Soul Mark, the Soul can be consumed from a Soul Gem or\n\ndirectly from a recently dead corpse within 6 m of you during the full length of\n\nthe ritual. At the end of the ritual, the partner you chose appears and befriends\n\nyou. You can bond with any animal or beast that possesses a CR rating of \u00bd or\n\nbelow and is native to the area that you perform the ritual in.\n\nWhen a Partner of the Wild is bound to your Soul it obeys certain rules:\n\n  * Your partner obeys your commands to the best of its ability and shares\n\nyour goals.\n\n  * You determine your partner\u2019s actions, personality, and behavior.\n\n  * If you would be incapacitated or away from your partner, it acts on its\n\nown per the personality and behavior you gave it.\n\n  * You roll initiative separately for your animal partner.\n\n  * The benefits you receive from your Natural Explorer ability also applies to\n\nyour partner.\n\nWhen you have bonded with a partner, its character sheet changes:\n\n  * If your animal partner possesses multiattack actions, it loses it.\n\n  * It uses your proficiency bonus rather than its own.\n\n  * It adds your proficiency bonus to its AV, to its attack rolls, and the damage\n\nit deals from natural weapon attacks.\n\n  * It gains two skill points in two skills of your choice.\n\n  * It gains proficiency with all saving throws.\n\n  * You calculate your partner\u2019s new HP by rolling health dice equal to your\n\ntotal level. The size of its health dice is equal to the health dice size it\n\nalready possesses. Whilst rolling for the new HP as you pick this ability up\n\nor for a level up, you abide by the same rules as when you roll your health\n\ndice.\n\n  * Whenever you pick an \u201cAbility Score Improvement or Feat\u201d ability, your\n\npartner may increase one of its ability scores with +2, or two ability scores\n\ncan receive +1. Your partner cannot increase an ability score above 20\n\nunless its description allows it to do so. In addition, it gains one skill point\n\nin a skill of your choice.\n\nDue to the nature of your bound Souls, your partner cannot die as long as you are\n\nalive. As long as you are not incapacitated you can call back your partner\u2019s Soul\n\nfrom their Enneade, even if you possess no parts of their body. Through redoing\n\nthe ritual and consuming a Soul of at least 1 Soul potency, your partner\u2019s Soul\n\ngains a body and revives. This way, you can also change which animal or beast\n\nbody your partner inhabits by abiding by the character sheet rules above."

[[abilities]]
origin = "Predator"
level = 3
selection = "Primary"
name = "Conclave (Realm Marshal)"
desc = "**Champion of the Realm**\n\nChoose a creature within your\n\nweapon\u2019s range or reach and spend a bonus action. The next time you\n\nsuccessfully hit that creature with a weapon attack action on this turn, you deal\n\nmore damage. The damage you make with your weapon attack becomes force\n\ndamage and you deal an extra 1d8 force damage. When you have picked 11 levels\n\nof [Predator] the extra damage increases to 2d8 force damage."

[[abilities]]
origin = "Predator"
level = 3
selection = "Secondary"
name = "Primeval Awareness"
desc = "You gain the ability to sense your Favored Enemy through Soul Mastery. If you spend an\n\nuninterrupted minute as if you were concentrating on a spell, you can sense your\n\nFavored Enemy within a 10 km radius. You sense how many of your Favored Enemy is\n\nwithin the range, their general direction as well as distance (in km) from you. If you have\n\nseveral Favored Enemies your senses can differentiate between them and you learn\n\nabout them separately with one use of Primeval Awareness.\n\nIn addition, you gain a form of primitive communication with animals and beasts. As an\n\naction, you may understand, or you may convey to an animal or beast:\n\n- A simple request.\n\n- Emotional state.\n\n- Current intent.\n\n- Desires (such as shelter, safety, or food).\n\n- Physical state (such as being hurt, or affected by magic).\n\nConversing with an animal or beast you attacked recently may not be receptive to you."

[[abilities]]
origin = "Predator"
level = 4
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Predator"
level = 5
selection = "Primary"
name = "Extra Attack"
desc = "You can take an attack action an extra time during your turn. You must possess at least 1\n\nlevel of [Predator] to be eligible for this ability (excluding this level)."

[[abilities]]
origin = "Predator"
level = 5
selection = "Primary"
name = "Conclave (Ranger)"
desc = "**Synchronized Strike**\n\nAs long as your partner can see you, it can use its\n\nreaction to make a natural weapon attack against any creature within its range\n\nwhen you use an attack action on your turn. If you decide to spend your partner\u2019s\n\nreaction this way, they receive a bonus to hit equal to your Cunning modifier."

[[abilities]]
origin = "Predator"
level = 6
selection = "Primary"
name = "Greater Favored Enemy"
desc = "Choose another creature type for a second Favored Enemy. If you have two Favored\n\nEnemy creature types, damage you deal with your Favored Enemies increases to +4 and\n\nyou gain advantage on all saving throws you make against abilities, traits, and spells your\n\nFavored Enemy uses."

[[abilities]]
origin = "Predator"
level = 7
selection = "Primary"
name = "Conclave (Butcher of Behemoths)"
desc = "**Marked Foe**\n\nMark one creature within 12 m that you\n\ncan see and spend a bonus action. Once on each of your turns, the first\n\nsuccessful weapon attack you make against your marked creature gains more\n\ndamage. The damage increases with a 1d8 and after eleven level picks of\n\n[Predator] it increases to 2d8. This bonus lasts until you are incapacitated or your\n\nmarked creature is. You can also dismiss this effect with a bonus action. You can\n\nmark one creature with this ability once per long rest."

[[abilities]]
origin = "Predator"
level = 7
selection = "Primary"
name = "Conclave (Exterminator of Woe)"
desc = "**Steel Will**\n\nYou gain proficiency in a mental or social\n\nsaving throw of your choice.\n\n  * Hunter - Elusive Stalker: You gain one of the following abilities of your\n\nchoice:\n\n  * Escape the Horde: Opportunity attacks against you are made with\n\ndisadvantage.\n\n  * Multi-attack Defense: When a creature hits you with an attack, you gain a\n\n+4 bonus to AV against all subsequent attacks made by that creature for\n\nthe rest of the turn."

[[abilities]]
origin = "Predator"
level = 7
selection = "Primary"
name = "Conclave"
desc = "Steel Will: You gain proficiency in a mental or social saving throw of your\nchoice."

[[abilities]]
origin = "Predator"
level = 7
selection = "Primary"
name = "Conclave (Ranger)"
desc = "**Feral Fury**\n\nAs long as your partner can see you it gains another attack\n\naction and receives advantage to all saving throws."

[[abilities]]
origin = "Predator"
level = 7
selection = "Primary"
name = "Conclave (Realm Marshal)"
desc = "**Extra-Planar Glide**\n\nAs a bonus action, you can cast\n\nEtherealness as Soul Mastery but with a duration of one minute. You regain the\n\nability to cast Etherealness when you complete a long rest."

[[abilities]]
origin = "Predator"
level = 8
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Predator"
level = 9
selection = "Primary"
name = "Excellent Footwork"
desc = "As a bonus action on your turn, you can take the dash action."

[[abilities]]
origin = "Predator"
level = 10
selection = "Primary"
name = "Natural Stealth"
desc = "As a bonus action, you may cast Invisibility as Soul Mastery once per short or long rest."

[[abilities]]
origin = "Predator"
level = 10
selection = "Primary"
name = "Camouflage"
desc = "Whenever you make a Stealth (Cun) check you do so with advantage. In addition, if you\n\nhaven\u2019t moved this turn and take the hide action, creatures attempting to spot you do so\n\nwith disadvantage. You lose this effect as soon as you take another action or you move."

[[abilities]]
origin = "Predator"
level = 11
selection = "Primary"
name = "Conclave (Butcher of Behemoths)"
desc = "**Sorcerer\u2019s Bane**\n\nWhen a creature teleports or casts a\n\nspell within 12 m of you, you can spend your reaction and try to counter it. The\n\ncreature must roll a Resolve saving throw against your spell save DV. If the\n\ncreature fails, their teleportation attempt or their spell fails. You can perform this\n\nability again after you complete a short or a long rest."

[[abilities]]
origin = "Predator"
level = 11
selection = "Primary"
name = "Conclave (Exterminator of Woe)"
desc = "**Exterminator\u2019s Promise**\n\nOnce per turn you may reroll a\n\nmissed weapon attack as part of the same attack action. You may perform this\n\nability a number of times per long rest equal to your proficiency modifier.\n\n  * Hunter - Relentless Chaser: You gain one of the following abilities of your\n\nchoice.\n\n  * Volley: You can use your action to make a ranged attack against any\n\nnumber of creatures within 2 m of a point you can see within your\n\nweapon's range. You must have ammunition for each target, as normal,\n\nand you make a separate attack roll for each target.\n\n  * Whirlwind Strike: You can use your action to make melee attacks against\n\nany number of creatures within 1 m of you, with a separate attack roll for\n\neach target."

[[abilities]]
origin = "Predator"
level = 11
selection = "Primary"
name = "Conclave (Ranger)"
desc = "**Whirlwind Strike**\n\nAs one natural weapon attack action, your partner\n\nmay make an attack roll against all enemies within its range and deal damage as\n\nnormal to all creatures that were hit successfully."

[[abilities]]
origin = "Predator"
level = 11
selection = "Primary"
name = "Conclave (Realm Marshal)"
desc = "**Flicker Attack**\n\nOnce per turn you may teleport 3 m to an\n\nunoccupied space you can see by temporarily displacing yourself in the Ethereal\n\nPlane. This movement does provoke an attack of opportunity if you teleport out\n\nof threat range."

[[abilities]]
origin = "Predator"
level = 12
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Predator"
level = 13
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- Two points to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 20 Potential"

[[abilities]]
origin = "Predator"
level = 14
selection = "Primary"
name = "Vanish"
desc = "You can use the hide action as a bonus action on your turn. Also, you can't be tracked by\n\nnonmagical means, unless you choose to leave a trail."

[[abilities]]
origin = "Predator"
level = 15
selection = "Primary"
name = "Conclave (Butcher of Behemoths)"
desc = "**Butcher\u2019s Riposte**\n\nIf a marked creature by your Marked\n\nFoe ability forces you to roll a saving throw you may immediately make an attack\n\nroll against the marked creature if the creature is within your range or reach. If\n\nyour attack successfully hits the marked creature, you deal damage as normal\n\nand you automatically succeed the saving throw."

[[abilities]]
origin = "Predator"
level = 15
selection = "Primary"
name = "Conclave (Exterminator of Woe)"
desc = "**Eluding Shade**\n\nIf you spend a reaction you may impose\n\ndisadvantage on an attack roll targeting you as long as the attack wasn\u2019t made\n\nwith advantage. You may perform this ability a number of times per long rest\n\nequal to your proficiency modifier."

[[abilities]]
origin = "Predator"
level = 15
selection = "Primary"
name = "Conclave (Hunter)"
desc = "**Superior Elusive Stalker**\n\nYou gain one of the following Abilities of\n\nyour choice.\n\n  * Evasion: When you are subjected to an effect that allows you to make a\n\nDexterity saving throw to take only half damage, you instead take no\n\ndamage if you succeed on the saving throw, and only half damage if you\n\nfail.\n\n  * Stand Against the Tide: When a hostile creature misses you with a melee\n\nattack, you can use your reaction to force that creature to repeat the\n\nsame attack against another creature (other than itself) of your choice.\n\n  * Uncanny Dodge: When an attacker that you can see hits you with an\n\nattack, you can use your reaction to halve the attack's damage against you."

[[abilities]]
origin = "Predator"
level = 15
selection = "Primary"
name = "Conclave (Ranger)"
desc = "**Superior Feral Fury**\n\nYour partner may spend a reaction to halve the\n\ndamage from an attack it can see. In addition, all-natural weapon attacks your\n\npartner makes receives a bonus to hit equal to your Cunning modifier."

[[abilities]]
origin = "Predator"
level = 15
selection = "Primary"
name = "Conclave (Realm Marshal)"
desc = "**Ethereal Armor**\n\nIf you spend a reaction you may gain\n\nresistance against the damage type of an attack targeting you. You may perform\n\nthis ability a number of times per long rest equal to your proficiency modifier."

[[abilities]]
origin = "Predator"
level = 16
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Predator"
level = 17
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- Two points to use in the Accomplishment section or to store for later purchase in\n\nthe same section\n\n- 20 Potential"

[[abilities]]
origin = "Predator"
level = 18
selection = "Primary"
name = "Feral Senses"
desc = "When you attack a creature you can't see, your inability to see it doesn't impose\n\ndisadvantage on your attack rolls against it. You are also aware of the location of any\n\ninvisible creature within 6 m of you, provided that the creature isn't hidden from you\n\nand you aren't blinded or deafened. In addition, your Primeval Awareness\u2019 range\n\nincreases to 20 km."

[[abilities]]
origin = "Predator"
level = 19
selection = "Primary"
name = "ASI or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of\n\nyour choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Predator"
level = 20
selection = "Primary"
name = "Foe Slayer"
desc = "Each of your weapon and spell attacks receives a bonus to hit and damage equal to\n\nCunning modifier."

[[abilities]]
origin = "Soul Oath"
level = 1
selection = "Primary"
name = "Threaten"
desc = "Choose a Soul Oath from below. Once per long rest as a bonus action, you can Threaten\n\na creature that you can see. Threaten lasts you are incapacitated, until the target is\n\nincapacitated, or 10 rounds have passed.\n\nAgainst a Threatened creature, you deal extra damage on weapon attacks equal to 1 +\n\nyour [Soul Oath] level divided by 5 (rounded up and minimum 2). Threaten also includes\n\nan Oath effect that can be found below. You can Threaten one more time per long rest\n\nat every five-level picks of [Soul Oath] (including this level) to a maximum of four\n\nThreaten uses per long rest."

[[abilities]]
origin = "Soul Oath"
level = 1
selection = "Secondary"
name = "Born to Ride"
desc = "Riding has become as easy as eating and breathing for you. You gain a number of\n\nbenefits:\n\n- You gain advantage on saving throws made to avoid falling off your mount.\n\n- If you fall off and descend no more than 2 m, you land on your feet and you do\n\nnot lose any movement as long as you are not incapacitated.\n\n- Mounting or dismounting only costs 1 m of movement instead of half your speed."

[[abilities]]
origin = "Soul Oath"
level = 2
selection = "Primary"
name = "Vow (Aegis)"
desc = "**Steadfast**\n\nIf you are wearing heavy armor, you can spend your reaction\n\nto gain resistance against bludgeoning, piercing, slashing until the start of your\n\nnext turn. You can use this ability once per short rest. After 6 level picks of [Soul\n\nOath], you can perform Steadfast twice per short rest, and after 14 level picks of\n\n[Soul Oath] thrice."

[[abilities]]
origin = "Soul Oath"
level = 2
selection = "Primary"
name = "Vow (Aspiration)"
desc = "**Braggadocio**\n\nOnce per short rest, as an action you may demoralize\n\nan opponent. Choose one creature within 6 m of you and make a Persuasion\n\ncheck with one ability score of your choice (once you have chosen it will remain\n\nthat ability score for the rest of the game) against that creature's Empathy (Com).\n\nIf your roll is higher than the creature\u2019s, they become demoralized for 1d4 turns.\n\nA demoralized target suffers -2 to its attack rolls, saving throws, and skill checks\n\nfor the duration. In addition, against demoralized targets, you gain a +2 bonus to\n\nyour attack rolls."

[[abilities]]
origin = "Soul Oath"
level = 2
selection = "Primary"
name = "Vow (Chivalry)"
desc = "**Pristine Honor**\n\nYou gain proficiency with a saving throw of your\n\nchoice. In addition, once per short rest, you may reroll one failed saving throw\n\nbut you must keep the new result."

[[abilities]]
origin = "Soul Oath"
level = 2
selection = "Primary"
name = "Vow (Loyalty)"
desc = "**Got Your Back**\n\nWhenever you use the help action to aid an ally they\n\nalso receive advantage on any saving throw or skill check they make until the\n\nstart of your next turn."

[[abilities]]
origin = "Soul Oath"
level = 2
selection = "Primary"
name = "Vow (Templar)"
desc = "**Uplifting Prayer**\n\nAs an action, you can mutter a prayer to yourself and\n\nreceive a bonus equal to your Resolve modifier to one skill check, attack roll, or a\n\nsaving throw of your choice at any point within 10 rounds. You must declare that\n\nyou are using this ability before the roll is made. You can use this ability up to\n\nfour times per long rest."

[[abilities]]
origin = "Soul Oath"
level = 2
selection = "Primary"
name = "Vow (Vassalage)"
desc = "**Call of the Monarch**\n\nOnce per short rest, all allies that can hear you\n\nand are within 12 m of you, receive advantage on saving throws against charm\n\nand fear effects for a number of rounds equal to the number of levels picks you to\n\npossess in [Soul Oath]. They also receive advantage to one attack roll of their\n\nchoice that they can use at any point during the same duration. In addition, if a\n\ncreature that can hear you and is within range has the charm or frightened\n\ncondition when you activate this ability, they can immediately make another\n\nsaving throw to resist the effect if that is allowed."

[[abilities]]
origin = "Soul Oath"
level = 2
selection = "Secondary"
name = "Fighting Style (Archery)"
desc = "+2 attack rolls made with ranged weapons."

[[abilities]]
origin = "Soul Oath"

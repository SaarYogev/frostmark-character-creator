[[abilities]]
origin = "Soul Oath"
level = 7
selection = "Primary"
name = "Vow (Loyalty)"
desc = "Together: Once per short rest, As an action you can give all allies within 6 m (including yourself) who can see and hear you a benefit for one round that you choose. Choose one benefit which ally receives (and choose one for yourself):\n+2 to AC.\n+2 to all attack rolls.\nMove up to their speed without spending a movement action."

[[abilities]]

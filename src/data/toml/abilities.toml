[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (Abjuration)"
desc = "Prismatic Ward: You gain advantage on saving throws against spells, and you gain resistance against damage dealt by spells."

[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (Conjuration)"
desc = "Bolster: Any creature that you summon or create via a conjuration spell receive 30 temporary hit points."

[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (Divination)"
desc = "Epiphany: You roll three d20 for your Premonition ability, rather than two."

[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (Enchantment)"
desc = "Memnomancy: When you cast an enchantment spell that causes one or more creatures to be charmed by you, you can prevent one charmed creature from realizing that it is charmed. In addition, once before the spell expires, you can attempt to erase memories of one charmed creature. Spend an action and target one creature currently being charmed by you. The creature must succeed on Int/Cun saving throw against your spell save DC. On a fail, the creature forgets a number of hours equal to 1 + your Manipulation modifier (minimum 1). You decide which hours the creature forgets of its time being charmed and you can decide to make the creature forget less time. The amount of time can't exceed the duration of your enchantment spell."

[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (Evocation)"
desc = "Overchannel: When you cast a spell of 5th level or lower (excluding cantrips) that deals damage, you can deal maximum damage with that spell. The first time you do so, you suffer no adverse effect. If you use this ability again before you finish a long rest, you take 2d12 necrotic damage for each level of the spell, immediately after you cast it. Each time you use this ability again before finishing a long rest, the necrotic damage per spell level increases by 1d12. This damage ignores resistance and immunity."

[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (Illusion)"
desc = "Delusions of Grandeur: As a bonus action, you may make one inanimate, nonmagical object that is a part of an illusion real when you cast an illusion spell of 1st level or higher. The object becomes tangible for 10 rounds. The object can't deal damage or otherwise directly harm anyone."

[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (Necromancy)"
desc = "Necromantic Mastery: Target an undead that you can see within 12 m of you and spend an action. That undead must succeed on an Int/Cun saving throw or become friendly to you. If the undead succeeds this saving throw it cannot be targeted again by this ability. How effective this ability depends upon the undead’s intelligence ability score.\nIf the undead you target possesses an Intelligence score of 8 or higher, the undead receives advantage on the saving throw.\nIf the undead you target possesses an Intelligence score of 12 or higher and fails its initial saving throw, it can repeat the saving throw at the end of every hour until it breaks free from this ability."

[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (Transmutation)"
desc = "Mystic Release: As an action, you can release the power within your Alchemist's Stone to create one powerful effect of your choice:"

[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (Flexible Transmutation)"
desc = "You can transmute one nonmagical object—no larger than a 1 m cube into another nonmagical object of similar size and mass and of equal or lesser value. You must spend 10 minutes handling the object to transform it."

[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (Elixir)"
desc = "You remove all curses, diseases, and poisons affecting a creature that you touch with the Alchemist's Stone. The creature also regains all its hit points."

[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (Regeneration)"
desc = "You cast the Raise Dead spell on a creature you touch with the Alchemist's Stone as Soul Mastery."

[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (Restore Youth)"
desc = "You touch the Alchemist's Stone to a willing creature, and that creature's apparent age is reduced by 3d10 years, to a minimum of 13 years. This effect doesn't extend the creature's lifespan.\nWhen you use this ability, your Alchemist's Stone is destroyed and can't be remade until you finish a long rest."

[[abilities]]
origin = "Occult Student"
level = 14
selection = "Primary"
name = "Arcane Tradition (War Magic)"
desc = "Arcane Veil: Whenever you use your Minor Shield ability, up to three creatures of your choice that you can see within 12 m of you each take force damage equal to half your total level."

[[abilities]]
origin = "Occult Student"
level = 15
selection = "Primary"
name = "Improved Magical Upgrade"
desc = "Gain one of your choices:\nTwo points to use in the Accomplishment section or to store for later purchase in the same section\n30 Potential\nThree skill points to assign in any skill or skills of your choice, or to store\n+1 to an ability score of your choice\nPick a feat from the feat list"


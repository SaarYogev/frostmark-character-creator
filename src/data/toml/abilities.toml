level = 6
selection = "Primary"
name = "Divine Domain (Curiosity)"
desc = "No Consequences: Once per short rest, when you take damage you may spend a reaction to immediately move up to half your speed (rounded up) and not provoke attacks of opportunity. In addition, you gain temporary health points equal to your total level."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Deceit)"
desc = "Cloak of Shadows: As a bonus action, you may become invisible for two rounds. The effect ends at the end of your second turn (or ten seconds), or until you attack or cast a spell. You can use this ability a number of times per day equal to 1+ your levels in [Devotion] divided by 5 (rounded down, minimum 1)."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Destiny)"
desc = "Correction: Twice per long rest, when you use your action to cast a spell of 1st level or higher that targets one or more hostile creatures but fail to affect and/or damage any of the targets, you can use your bonus action to cast a cantrip that normally has a casting time of an action. After 12 levels of [Devotion], you can use this ability three times per long rest, and after 18 levels of [Devotion] you can use this ability four times per long rest."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Dusk)"
desc = "Wings of Twilight: Once per long rest, as a bonus action, when you are in dim light or darkness, you can magically give yourself a flying speed equal to your walking speed for 1 minute. After 12 levels of [Devotion], you can use this ability as once per short rest instead."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Law)"
desc = "Epitome of Order: Twice per long rest you can change the casting time of one enchantment spell of at least 1st level or higher from an action to a bonus action. After 12 levels of [Devotion] you can use this ability three times per long rest, and after 18 levels of [Devotion] you can use this ability four times per long rest."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Lore)"
desc = "CD Pervade Mind: As an action, you can attempt to read the surface thoughts of a creature within 12m of you that you can see. The creature must roll a Composure saving throw and on a failed save you can read thoughts that are foremost in its mind for 10 rounds as long as the creature is within 12m of you. As long as you are reading its mind and within 12m of the creature, you can spend an action to cast Suggestion on the creature once as Soul Mastery. The target automatically fails its saving throw against the spell. If the creature succeeds on the initial Composure saving throw, you cannot use this ability on the creature again until you finish a long rest."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Might)"
desc = "Extra Attack: As part of your attack action, you can make two attacks instead of one. You must possess at least 1 level of [Devotion] to be eligible for this ability (excluding this level)."

[[abilities]]
origin = "Devotion"
level = 6
selection = "Primary"
name = "Divine Domain (Moon)"
desc = "Lunar Duality: You can cast a second concentration spell while already concentrating on another spell. If you need to make a Resolve saving throw to maintain your concentration on both spells, you make the save with disadvantage. On a failure, you lose concentration on both spells. You can use this ability a number of times per short rest equal to your proficiency bonus divided by two (rounded down, minimum 1)."

[[abilities]]
origin = "Devotion"

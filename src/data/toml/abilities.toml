name = "Inspiration"
desc = "You can use a bonus action on your turn to choose one creature other than yourself within 12m of you who can hear you. That creature gains one Inspiration die, a d6.Once within the next 10 minutes, the creature can roll the die and add the number rolled to one ability check, attack roll, or saving throw it makes. In addition, the Inspiration die can be added to a damage or a healing roll from casting a spell. The creature can wait until after it rolls the d20 before deciding to use the Inspiration die but must decide before the GM says whether the roll succeeds or fails. Once the Inspiration die is rolled, it is lost. A creature can have only one Inspiration die at a time.You can use this ability a number of times equal to your 1 + Presence modifier or Manipulation modifier (a minimum of once). You regain any expended uses when you finish a long rest. Your Inspiration die changes when you reach certain levels in [Artistry]. The die becomes a d8 after 5 level picks, a d10 after 10 level picks, and a d12 after 15 level picks."


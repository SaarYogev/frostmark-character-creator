selection = "Primary"
name = "Divine Domain (Ardor)"
desc = "Pick according to your chosen Enneade\u2019s Domains.\n\n**Distracting Flash**\n\nA brilliant flash of light erupts from your hand,\n\ndistracting your attacker. As a reaction, you may impose disadvantage on an\n\nattack roll targeting you by a creature within 6 m of you. An attacker who cannot\n\nbe blinded is immune to this ability. You can use this ability a number of times\n\nequal to your Resolve modifier (a minimum of once). You regain all expended\n\nuses when you finish a long rest."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Athanasia)"
desc = "Pick according to your chosen Enneade\u2019s Domains.\n\n**Deny Death**\n\nWhen you restore health points to a creature at 0\n\nhealth points with a spell, the dice you would normally roll now heal for the\n\nhighest number possible for each die. In addition, you learn Spare the Dying\n\ncantrip as Soul Mastery. If you cast it this way, it has a range of 6 m, and you can\n\ncast it as a bonus action."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Battle)"
desc = "Pick according to your chosen Enneade\u2019s Domains.\n\n**Initiate of War**\n\nWhen you take the attack action, you can make one\n\nweapon attack as a bonus action. You can use this ability a number of times equal\n\nto your Resolve modifier (minimum 1). You regain all expended uses when you\n\nfinish a long rest."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Community)"
desc = "Pick according to your chosen Enneade\u2019s Domains.\n\n**Urban Soul**\n\nYou may gain advantage to Persuasion (Man) checks\n\nwhilst you are within an urban environment a number of times equal to your\n\nManipulation modifier (minimum 1). You regain any expended uses when you\n\nfinish a long rest."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Craft)"
desc = "Pick according to your chosen Enneade\u2019s Domains.\n\n**Blessed Armory**\n\nAt the end of a long rest, you may bless a nonmagical\n\nsuit of armor or a nonmagical weapon. Until the end of your next long rest, the\n\narmor becomes magical and receives a +1 to its AV. If you bless a weapon, it\n\nbecomes magical and receives a +1 to hit and damage until the end of your next\n\nlong rest. Once you use this ability, you can't use it again until you finish a long\n\nrest. In addition, you gain two skill points with Arts & Craft (smithing). You may\n\ngain skill rank 5 with that skill."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Deceit)"
desc = "Pick according to your chosen Enneade\u2019s Domains.\n\n**Grace of Covertness**\n\nYou can give one willing creature advantage on\n\nStealth checks (Dex/Cun) for an hour (or until you use this ability again) by a\n\nmere touch."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Harmony)"
desc = "Pick according to your chosen Enneade\u2019s Domains.\n\n**Act as One**\n\nWhen you take the Help Action and choose to give\n\nadvantage to an ally\u2019s attack roll, you can make one weapon attack as a bonus\n\naction. You can use this ability a number of times equal to your Composure\n\nmodifier (minimum 1). You regain expended uses when you finish a long rest."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Law)"
desc = "Pick according to your chosen Enneade\u2019s Domains.\n\n**Call for Order**\n\nIf you cast a spell of 1st level or higher and target an ally\n\nwith that spell, that ally can use their reaction immediately after the spell to\n\nmake one weapon attack against a creature of your choice that you can see. If the\n\nspell targets more than one ally, you choose the ally who can make the attack.\n\nYou also gain two skill points in the Persuasion skill and you may gain rank 5 in\n\nthat skill."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Lore)"
desc = "Pick according to your chosen Enneade\u2019s Domains.\n\n**Sophisticated Mind**\n\nYou learn two languages of your choice at Academics\n\nskill rank 2. You also gain three skill points in two Academic skills of your choice.\n\nYou may gain rank 5 in those Academics skills."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Might)"
desc = "Pick according to your chosen Enneade\u2019s Domains.\n\n**Worshiper of Strength**\n\nWhen you take the attack action, you can make\n\none weapon attack as a bonus action. You can use this ability a number of times\n\nequal to your Resolve modifier (minimum 1). You regain all expended uses when\n\nyou finish a long rest."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Nature)"
desc = "Pick according to your chosen Enneade\u2019s Domains.\n\n**In Tandem with Nature**\n\nYou learn one nature-themed cantrip of your\n\nchoice. You also gain four skill points in one of the following skills of your choice:\n\nAnimal Handling, Academics: Nature, or Survival. You may gain rank 5 in this\n\nskill."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Passion)"
desc = "Pick according to your chosen Enneade\u2019s Domains.\n\n**Fervor**\n\nWhen you take the attack action, you can make one weapon\n\nattack as a bonus action. You can use this ability a number of times equal to your\n\nPresence modifier (minimum 1). You regain all expended uses when you finish a\n\nlong rest."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Preservation)"
desc = "Pick according to your chosen Enneade\u2019s Domains.\n\n**Stalwart Defender**\n\nWhen a creature within 1 m of you is attacked,\n\nyou can spend your reaction to impose disadvantage on the attack roll. For the\n\npurposes of this ability, you must be able to see both the attacker and the target."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Radiance)"
desc = "Pick according to your chosen Enneade\u2019s Domains.\n\n**Distracting Flash**\n\nA brilliant flash of light erupts from your hand,\n\ndistracting your attacker. As a reaction, you may impose disadvantage on an\n\nattack roll targeting you by a creature within 6 m of you. An attacker who cannot\n\nbe blinded is immune to this ability. You can use this ability a number of times\n\nequal to your Presence modifier (minimum 1). You regain all expended uses when\n\nyou finish a long rest."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Ruin)"
desc = "Pick according to your chosen Enneade\u2019s Domains.\n\n**Bringer of Death**\n\nYou learn one cantrip from the school of vismancy of\n\nyour choice. When you cast a vismancy cantrip that normally targets only one\n\ncreature, the spell can instead target two creatures within the range of the spell\n\nas long as the two creatures are within 1 m of each other."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Storm)"
desc = "Pick according to your chosen Enneade\u2019s Domains.\n\n**Tempestuous Retribution**\n\nWhen you are successfully attacked by a\n\ncreature that you can see and is within 1 m of you, you can spend your reaction\n\nto hurt them with a shock of lightning or blast of thunder. The creature must roll\n\na Dexterity saving throw against your spell save DV. On a failed save, the creature\n\ntakes 2d8 lightning or thunder damage (your choice but you can only choose\n\nonce), and half as much damage on a successful one. You can use this ability a\n\nnumber of times equal to your Presence modifier (minimum 1). You regain all\n\nexpended uses when you finish a long rest. In addition, you gain proficiency with\n\ntwo weapons of your choice."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Primary"
name = "Divine Domain (Thaumaturgy)"
desc = "Pick according to your chosen Enneade\u2019s Domains.\n\n**Magical Instruction**\n\nYou gain two skill points in Occult, and you\n\nmay gain rank 5 in this skill. In addition, you gain two cantrips and one first level\n\nspell from the spell list of your choice."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Secondary"
name = "Divine Domain (Athanasia)"
desc = "**Vision of Death**\n\nAs an action, you can give yourself a Vision of Death\n\nuntil the end of your next turn. Whilst you have Vision of Death activated, you\n\nknow the location of any undead within 12 m of you that isn\u2019t behind total cover\n\nand isn\u2019t protected from Divination magic. You do not learn what kind of undead\n\nit is nor any of its capabilities. You can use this ability a number of times equal to\n\nyour Resolve modifier (minimum 1). You regain all expended uses when you finish\n\na long rest."

[[abilities]]
origin = "Devotion"
level = 1
selection = "Secondary"
name = "Bonus Proficiency"
desc = "You gain proficiency with heavy armor."

[[abilities]]
origin = "Devotion"
level = 2
selection = "Primary"
name = "Channel Divinity"
desc = "For a short moment, you can channel the divine essence of your God through yourself.\n\nChannel Divinity is not an ability you can pick normally. Instead, options in the Divine\n\nDomain may include Channel Divinity options. Any ability in the Divine Domain list that\n\nincludes \u201cCD\u201d in its name is a Channel Divinity ability. Divine Domain abilities that are\n\nalso Channel Divinity possess these rules:\n\n- Each Channel Divinity option provided by your [Devotion] explains how to use it.\n\n- When you use your Channel Divinity ability, you choose which option to use.\n\n- You must then finish a short or long rest to use your Channel Divinity again. After\n\n6 level picks of [Devotion] you can use it twice per day, and after 18 level picks of\n\n[Devotion] thrice.\n\n- Some Channel Divinity effects require Saving Throws. When you use such an\n\neffect from this Origin, the DV equals your spell save DV.\n\n- You may expend a use of Channel Divinity as a bonus action to regain one\n\nexpended spell slot of first level."

[[abilities]]
origin = "Devotion"
level = 2
selection = "Primary"
name = "Divine Domain (Animation)"
desc = "**CD Hope for the Hopeless**\n\nAs an action, you can restore health\n\npoints equal to five times your [Devotion] level. Choose any number of creatures\n\nwithin 6 m of you, and divide those health points among them in a manner of\n\nyour choice. This ability can restore a creature to no more than half of its health\n\npoint maximum, and you cannot use this ability on a construct."

[[abilities]]
origin = "Devotion"
level = 2
selection = "Primary"
name = "Divine Domain (Ardor)"
desc = "**CD Sever Shadow**\n\nAs an action, you may confuse your enemies by\n\ncreating an illusion of yourself which grants you a number of benefits:\n\n  * The ability lasts for 10 rounds or until you lose your concentration as if\n\nyou were concentrating on a spell (if you cast a spell that requires\n\nconcentration, this ability immediately ends).\n\n  * You may summon the illusion within 6 m of yourself in an unoccupied\n\nspace you can see.\n\n  * As a bonus action, you may move the illusion up to 6 m, but it cannot be\n\nfurther away from you than 24 m.\n\n  * For the duration, you can cast spells through your illusion, as if you were\n\nin the illusion\u2019s space, but you must still abide by your own senses.\n\n  * Considering how confusing it is to see both you and your illusion, you gain\n\nadvantage on attack rolls against any creature that you and the illusion are\n\nwithin 1 m of."

[[abilities]]
origin = "Devotion"
level = 2
selection = "Primary"
name = "Divine Domain (Athanasia)"
desc = "**CD Curse the Hopeless**\n\nAs an action, you choose one creature you\n\ncan see within 1 m of you, cursing it until the end of your next turn. The next time\n\nyou or an ally of yours hits the cursed creature with an attack, the creature has\n\nvulnerability to all of that attack's damage, and then the curse ends."

[[abilities]]
origin = "Devotion"
level = 2
selection = "Primary"
name = "Divine Domain (Battle)"
desc = "**CD Moment of Destiny**\n\nYou can use your Channel Divinity to grant\n\nyourself a +10 bonus to an attack roll, ability check, or saving throw of your\n\nchoice. You may add this bonus to a roll after you see it, but before the GM says\n\nwhether the roll succeeds or fails."

[[abilities]]
origin = "Devotion"
level = 2
selection = "Primary"
name = "Divine Domain (Community)"
desc = "**CD Towncrier**\n\nAs an Action, each hostile creature within 6 m of\n\nyou must make a Composure saving throw as you cry out to the city to defend\n\nyou. On a failed save, the creature is knocked prone or restrained (your choice)\n\nby urban animated utilities and objects, such as tangling plants, stonework falling\n\nover, or splashing water from buckets and wells. A restrained creature can\n\nescape by making a successful Athletics (Br/Dex) check (their choice) against\n\nyour spell save DV. What objects or utilities aid you in this way and how is up to\n\nthe GM."

[[abilities]]
origin = "Devotion"
level = 2
selection = "Primary"
name = "Divine Domain (Craft)"
desc = "**CD Metal Transmutation**\n\nYou can transmute a nonmagical object that at\n\nleast has some metal in its construction and is worth no more than 100 gp. By\n\nconducting a 1-hour ritual and supplying any kind of metal equal to the worth of\n\nthe creation, you can magically transmute the metal to other materials and form.\n\nOnce the ritual is over, the object is transmuted irrevocably. The ritual can\n\nduplicate an item if you have access to the original during the ritual."

[[abilities]]
origin = "Devotion"
level = 2
selection = "Primary"
name = "Divine Domain (Harmony)"
desc = "**CD Hope for the Hopeless**\n\nAs an action, you can restore health\n\npoints equal to five times your [Devotion] level. Choose any number of creatures\n\nwithin 6 m of you, and divide those health points among them in a manner of\n\nyour choice. This ability can restore a creature to no more than half of its health\n\npoint maximum, and you cannot use this ability on a construct."

[[abilities]]
origin = "Devotion"
level = 2
selection = "Primary"
name = "Divine Domain (Law)"
desc = "**CD Authoritative Demand**\n\nAs an action, you can attempt to charm each\n\ncreature within 6 m of you that can see or hear you. A creature in range must\n\nmake a Composure saving throw, and on a failed save is charmed by you until the\n\nend of your next turn or until the charmed creature takes any damage. When a\n\ncreature fails this saving throw, you can also command it to drop whatever it is\n\nholding."

[[abilities]]
origin = "Devotion"
level = 2
selection = "Primary"
name = "Divine Domain (Lore)"
desc = "**CD Divine Epiphany**\n\nAs an action, choose one skill and you gain three skill\n\npoints with it for 10 minutes."

[[abilities]]
origin = "Devotion"
level = 2
selection = "Primary"
name = "Divine Domain (Might)"
desc = "**CD Herculean Task**\n\nYou can use your Channel Divinity to grant yourself\n\na +10 bonus to an attack roll, ability check, or saving throw using brawn of your\n\nchoice. You may add this bonus to a roll after you see it, but before the GM says\n\nwhether the roll succeeds or fails."

[[abilities]]
origin = "Devotion"
level = 2
selection = "Primary"
name = "Divine Domain (Nature)"
desc = "**CD Invoke the Mother**\n\nAs an action, you may attempt to charm each\n\nanimal, beast, or plant creature within 6 m of you that you can see. The creature\n\nmust roll a Composure saving throw. On a failed save, the creature is charmed by\n\nyou for 10 rounds or until it takes damage. While it is charmed by you, you may\n\ndesignate other creatures the animal or plant must be friendly towards."

[[abilities]]
origin = "Devotion"
level = 2
selection = "Primary"
name = "Divine Domain (Passion)"
desc = "**CD Burst of Violence**\n\nInstead of rolling damage dice, you may use your\n\nChannel Divinity to deal maximum damage with a spell or ability that deals fire or\n\nlightning damage."

[[abilities]]
origin = "Devotion"
level = 2
selection = "Primary"
name = "Divine Domain (Preservation)"
desc = "**CD Lustrous Retaliation**\n\nAs an action, you may punish a creature\n\nwho attacks one of your allies. Choose one ally within 6 m of you, the next time\n\nthat ally is hit by an attack within the next 10 rounds, the attacker takes radiant\n\ndamage equal to  2d10 + your level of [Devotion]."

[[abilities]]
origin = "Devotion"
level = 2
selection = "Primary"
name = "Divine Domain (Radiance)"
desc = "**CD Dawn of Illumination**\n\nAs an action, you may dispel any magical\n\ndarkness within 6 m of you. Additionally, each hostile creature within 6 m of you\n\nmust make a Vitality saving throw. On a failed save, the creature suffers Radiant\n\ndamage equal to 2d10 + your level of [Devotion]. A creature that has total cover\n\nfrom you is immune to this effect."

[[abilities]]
origin = "Devotion"
level = 2
selection = "Primary"
name = "Divine Domain (Ruin)"
desc = "**CD Ravage**\n\nUsing your Channel Divinity, you can deal extra necrotic\n\ndamage to the target equal to 5 + twice your level of [Devotion] when you hit a\n\ncreature with a melee attack."

[[abilities]]
origin = "Devotion"
level = 2
selection = "Primary"
name = "Divine Domain (Storm)"
desc = "**CD High Voltage**\n\nInstead of rolling damage dice, you may use your\n\nChannel Divinity to deal maximum damage with a spell or ability that deals\n\nthunder or lightning damage."

[[abilities]]
origin = "Devotion"
level = 2
selection = "Primary"
name = "Divine Domain (Thaumaturgy)"
desc = "**CD Reject the Impure**\n\nYou may turn one celestial, elemental,\n\nfey, or fiend of your choice within 6 m of you as an action. The creature must be\n\nable to hear and see you. The creature must make a Resolve saving throw and on\n\na failed save, it is turned for 10 rounds or until it takes any damage. Turn\n\ncreatures suffer these effects:\n\n  * It must spend its turns trying to move as far away from you as it can, and\n\nit can't willingly end its move in a space within 6 m of you.\n\n  * It can't perform any reactions.\n\n  * As an action, it can only take the dash action.\n\n  * If it cannot move further away from you, it may use the dodge action\n\ninstead.\n\nAfter 5 level picks of [Devotion], this ability banishes instead of turns (as in the\n\nBanishment spell but no concentration required) if it is not within its home\n\nRealm. You cannot banish a creature this way if its challenge rating is at or below\n\ncertain thresholds, as shown below:\n\nLevel picks in [Devotion] Banishes creatures of CR\n\n5    1/2 or lower\n\n8    1 or lower\n\n11    2 or lower\n\n14    3 or lower\n\n17    4 or lower"

[[abilities]]
origin = "Devotion"
level = 2
selection = "Secondary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase\n\nin the same section\n\n- 10 Potential"

[[abilities]]
origin = "Devotion"
level = 3
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\n\n- One point to use in the Accomplishment section or to store for later purchase\n\nin the same section\n\n- 10 Potential"

[[abilities]]

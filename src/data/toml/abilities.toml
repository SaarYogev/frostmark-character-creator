name = "Absorb Soul Aspect (Prerequisite)"
desc = "Your connection to your patron allows you to glimpse aspects of power from your patron’s Soul, and then, with time, embody them yourself. When you gain a level in [Pact], you can choose one of the Soul aspects you know and replace it with another Soul aspect that you could learn at that level. If an aspect has prerequisites, you must meet them to learn it. You can learn the Soul aspect at the same time that you meet its prerequisites.\nNo Level RequirementAgonizing Blast\nA ranged spell attack cantrip\nYou can move one target you have hit with a ranged spell attack cantrip of your choice 2 m towards you in a straight line. You can only use this Soul Aspect once per turn.\nEnhanced Pact Weapon"

[[abilities]]
origin = "Pact"

level = 3
selection = "Primary"
name = "Primal Path (Flying)"
desc = "As long as you are not wearing heavy armor you gain two benefits:\nYou can use the dash action as a bonus action.\nOther creatures have disadvantage when targeting you with opportunity attacks."

[[abilities]]

name = "Absorb Soul Aspect (Prerequisite)"
desc = "Your connection to your patron allows you to glimpse aspects of power from your patron’s Soul, and then, with time, embody them yourself. When you gain a level in [Pact], you can choose one of the Soul aspects you know and replace it with another Soul aspect that you could learn at that level. If an aspect has prerequisites, you must meet them to learn it. You can learn the Soul aspect at the same time that you meet its prerequisites.\nNo Level RequirementAgonizing Blast\nPact of the Blade ability\nAs long as your [Pact] weapon does not have a +1 bonus to attack rolls and damage rolls already, it receives a +1 bonus to attack and damage rolls. Additionally, the [Pact] weapon you conjure can be a short bow, longbow, light crossbow, or heavy crossbow.\nEyes of An’herYou can see normally in darkness, both magical and nonmagical, up to a distance of 24 m.\nEyes of SokariYou can read all written text.\nForce Spear"

[[abilities]]
origin = "Pact"
level = 20
selection = "Primary"
name = "Absorb Soul Aspect (Prerequisite)"
desc = "Your connection to your patron allows you to glimpse aspects of power from your patron’s Soul, and then, with time, embody them yourself. When you gain a level in [Pact], you can choose one of the Soul aspects you know and replace it with another Soul aspect that you could learn at that level. If an aspect has prerequisites, you must meet them to learn it. You can learn the Soul aspect at the same time that you meet its prerequisites.\nNo Level RequirementAgonizing Blast\nRanged spell attack cantrip\nIf you cast a ranged spell attack cantrip of your choice, its range is 60 m.\nGaze of Two MindsYou can use your action to touch a willing humanoid and perceive through its senses until the end of your next turn. As long as the creature is within the same Realm as you, you can use your action on subsequent turns to maintain this connection, extending the duration until the end of your next turn. While perceiving through the other creature's senses, you benefit from any special senses possessed by that creature, and you are blinded and deafened to your own surroundings.\nJinx of ImentaOnce per long rest, you can cast Bane as Soul Mastery.\nLunar Trance"

[[abilities]]

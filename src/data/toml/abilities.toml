desc = "Intimidating Presence: As an action, you may attempt to frighten a creature that you can see or hear you within 6 m of you. The creature must succeed on a Resolve saving throw (DC equal to 8 + your proficiency bonus + your Presence modifier) or be frightened of you until the end of your next turn. On subsequent turns, you can use your action to extend the duration of this effect on the frightened creature until the end of your next turn. This effect ends if the creature ends its turn out of line of sight or more than 12 m away from you. If the creature succeeds on its saving throw, you can't use this ability on that creature again for 24 hours."

[[abilities]]

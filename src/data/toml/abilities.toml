[[abilities]]
origin = "Soul Weapon"
level = 20
selection = "Primary"
name = "Prerequisite: 9 level picks in"
desc = "When you score a critical hit on your turn and haven’t spent your bonus action, you may spend it and immediately cast a special melee spell attack as a bonus action if the critical hit was performed with a melee weapon, or a special ranged spell if the critical hit was performed with a ranged weapon, as long as the spell delivered has a casting time of an action or less. Special spell in this context means that it automatically hits and your Soul Check is an automatic success."


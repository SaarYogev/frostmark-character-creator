selection = "Primary"
name = "Ability Score Improvement or Feat"
desc = "You can increase one ability score of your choice by 2, or two by one. Or gain a feat of your choice, you must meet the prerequisites of it."

[[abilities]]
origin = "Occult Student"
level = 9
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\nOne point to use in the Accomplishment section or to store for later purchase in the same section\n10 Potential"

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (Abjuration)"
desc = "Potent Denial: Whenever you cast an abjuration spell that requires you to make an ability check as part of the spell’s description, you receive a bonus to the ability check equal to your proficiency bonus."

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (Conjuration)"
desc = "Unrivaled Focus: You cannot lose your concentration by taking damage when you are concentrating on a conjuration spell."

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (Divination)"
desc = "Mind’s Eye: Once per short or long rest, you may gain a benefit to your perceptive ability that lasts until you start a short or long rest, or until you are incapacitated. Spend an action and choose one benefit below:"

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (Darkvision)"
desc = "You gain darkvision out to a range of 12 m."

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (Ethereal Sight)"
desc = "You can see into the Ethereal Plane out to a range of 12 m."

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (Greater Comprehension)"
desc = "You can read any language."

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (See Invisibility)"
desc = "You can see invisible creatures and objects within 6 m of you that are within line of sight."

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (Enchantment)"
desc = "Twice the Charm: You can target an additional creature whenever you cast an enchantment spell of 1st level or higher that targets only one creature."

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (Evocation)"
desc = "Empowered Evocation: Once per turn, you can add your Intelligence modifier to one damage roll of any evocation spell you cast."

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (Illusion)"
desc = "Duplicate: Once per short or long rest, you may interpose an illusory duplicate of yourself in front of an attack that would hit you. As a reaction, the illusion takes the hit, the attack misses you, after which the illusion dissipates."

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (Necromancy)"
desc = "Un-lifeforce: Your hit point maximum can’t be reduced, and you receive resistance to necrotic damage."

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (Transmutation)"
desc = "Biomancy: Once per long rest, you can cast Polymorph as Soul Mastery. This casting of Polymorph allows you to target an additional creature."

[[abilities]]
origin = "Occult Student"
level = 10
selection = "Primary"
name = "Arcane Tradition (War Magic)"
desc = "Defensive Chant: While you maintain concentration on a spell, you gain a +2 bonus to AC and all saving throws."

[[abilities]]
origin = "Occult Student"
level = 11
selection = "Primary"
name = "General Upgrade"
desc = "Gain one of your choices:\nTwo points to use in the Accomplishment section or to store for later purchase in the same section\n20 Potential"

[[abilities]]

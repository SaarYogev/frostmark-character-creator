selection = "Primary"
name = "Arcane and Martial Mastery"
desc = "Your martial and arcane powers swell. You gain one more use of Action Surge. In\n\naddition, whenever you cast a spell whilst you are engaged in melee or ranged combat,\n\nyou gain a benefit to that spell casting of your choice:\n\n- Increase your spell save DV with +2.\n\n- Ignore one damage resistance.\n\n- Your spell attack gains a +2 to hit.\n\nExtra Ability Origin Content"

[[abilities]]
origin = "Tactics"
level = 1
selection = "Primary"
name = "Action Surge"
desc = "Once per short or long rest, you gain one more action in addition to your regular action\n\non your turn."

[[abilities]]

selection = "Primary"
name = "Fighting style (Great Weapon Fighting)"
desc = "When you roll a 1 or 2 on a damage die for an attack you\n\nmake with a melee weapon that you\u2019re wielding with two hands, you can reroll\n\nthe dice and must use the new results."

[[abilities]]
origin = "Tactics"
level = 2
selection = "Primary"
name = "Fighting style (Protection)"
desc = "When a creature you can see attacks a target other than you that is\n\nwithin 1 m of you, you can use your reaction to impose disadvantage on the\n\nattack roll. You must be wielding a shield."

[[abilities]]
origin = "Tactics"
level = 2
selection = "Primary"
name = "Fighting style (Two)"
desc = "**Weapon Fighting**\n\nWhen you engage in two-weapon fighting, you can add\n\nyour ability score modifier to the damage of the second attack."

[[abilities]]
origin = "Tactics"
level = 2
selection = "Secondary"
name = "Indomitable"
desc = "Once per long rest, you may reroll a saving throw if you fail it. If you do so you must use\n\nthe new roll."

[[abilities]]
origin = "Tactics"
level = 3
selection = "Primary"
name = "Martial Archetype (Beast Slayer)"
desc = "**Slayer Technique**\n\nYou gain four Slayer Technique dice that are\n\nd8s. You regain all expended dice after you complete a short or long rest. You\n\ncan spend one Slayer Technique dice after you make the check but before the\n\nGM declares if its a success or a fail:\n\n  * An attack roll\n\n  * A damage roll\n\nYou can spend Slayer Technique dice before or after you make:\n\n  * A saving throw you are proficient in\n\n  * A Perception check\n\n  * An Empathy check"

[[abilities]]
origin = "Tactics"
level = 3
selection = "Primary"
name = "Martial Archetype (Bruiser)"
desc = "**Savage Aggression**\n\nIf you deal damage through a weapon attack you\n\ndeal an extra 1d4 damage."

[[abilities]]
origin = "Tactics"
level = 3
selection = "Primary"
name = "Martial Archetype (Champion)"
desc = "**Improved Critical**\n\nIncrease your critical range to 19. Whenever you\n\nscore a critical health you gain a number of temporary health points equal to 1d6\n\n+ your proficiency bonus."

[[abilities]]
origin = "Tactics"
level = 3
selection = "Primary"
name = "Martial Archetype (Grandmaster)"
desc = "**Weapon Techniques**\n\nYou learn three Weapon Techniques of\n\nyour choice from below. You can apply one of your Weapon Techniques to an\n\nattack action you make. For your Weapon Techniques, you also gain a 4d8\n\nTechnique Die that you spend when you use a Weapon Technique. You acquire\n\nan additional 1d8 Technique Die after 7 level picks of [Tactics] and an extra 1d8\n\nTechnique Die after 15 level picks of [Tactics]. After you complete a long rest you\n\nregain all your spent Technique Dice. When you pick another level of [Tactics]\n\nyou may exchange one Weapon Technique for another."

[[abilities]]
origin = "Tactics"
level = 3
selection = "Primary"
name = "Martial Archetype (Spellblade)"
desc = "**Soul Link**\n\nYou can perform a 1-hour ritual that allows you to link\n\nyour soul to one weapon of your choice that you are holding. The ritual can be\n\nperformed during a short rest and you can link with up to two weapons. A\n\nweapon that is linked to your Soul can be magically teleported to your hand as a\n\nbonus action as long as you are not incapacitated and the weapon resides in the\n\nsame Realm as you. You can only teleport one weapon at a time. If you wish to\n\nlink with another weapon, you can exchange one weapon for another by\n\nperforming another ritual."

[[abilities]]
origin = "Tactics"
level = 3
selection = "Primary"
name = "Martial Archetype (Spellbow)"
desc = "**Arcane Projectile**\n\nYou learn two Arcane Projectile options. Once per\n\nturn, whenever you make a ranged weapon attack, as part of that attack action,\n\nyou may apply an Arcane Projectile option to that projectile. Some Arcane\n\nProjectile options must be declared before the attack roll is made, others can be\n\nused after the ranged weapon attack is declared a hit. You may use this ability\n\ntwice per short or long rest. See below."

[[abilities]]
origin = "Tactics"
level = 3
selection = "Primary"
name = "Martial Archetype (Standard Bearer)"
desc = "**United We Stand!**\n\nYou know how to rally your allies to inspire\n\nthem to fight past their limits. Choose up to 3 allied creatures that are within 12\n\nm of you and that can hear you. When you use your Second Wind ability each\n\ncreature you chose gains health points equal to your [Tactics] level."

[[abilities]]
origin = "Tactics"
level = 3
selection = "Secondary"
name = "Martial Archetype (Beast Slayer)"
desc = "**A Slayer\u2019s Secrets**\n\nOnce per long rest you can cast Protection\n\nfrom Radiant and Necrotic as Soul Mastery. In addition, you learn to cast Detect\n\nMagic as a ritual with Soul Mastery."

[[abilities]]
origin = "Tactics"
level = 3
selection = "Secondary"
name = "Martial Archetype (Spellblade)"
desc = "**Arcane Talent**\n\nYou learn two cantrips."

[[abilities]]
origin = "Tactics"
level = 3
selection = "Secondary"
name = "Martial Archetype (Spellbow)"
desc = "**Crucial Knowledge**\n\nYou gain two skill points in either Occult or\n\nSurvival, your choice, and you may gain rank 5 with that skill. You learn either\n\nPrestidigitation or Druidcraft as Soul Mastery. Alternatively, you may take both\n\nskills (2 skill points in two skills, and can gain rank 5 with both) or learn both\n\ncantrips."


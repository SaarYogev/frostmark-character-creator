[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Animation)"
desc = "Supreme Healing: When you restore health points with a spell, you heal the maximum value of the dice instead of rolling them. In addition, when you cast a spell of level 6 or above that restores health points without rolling dice, you may choose to immediately end one magical effect or condition affecting one creature the healing spell targets."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Athanasia)"
desc = "Reaper’s Reward: When an enemy you can see dies within 12m of you, as a bonus action on your turn or otherwise as a reaction, you or one creature of your choice that is within 12m of you and you can hear or see regains health points equal to twice the enemy's number of health dice. You can use this ability only if you aren't incapacitated. Once you use it, you can't do so again until the start of your next turn."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Battle)"
desc = "Hardened by Conflict: You gain resistance to bludgeoning, piercing, and slashing damage from nonmagical attacks."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Chaos)"
desc = "Absolute Bedlam: As a reaction, whenever a creature within 12m of you that you can see makes an attack that targets a single creature or casts an AoE spell, you can force that creature to make a saving throw against your spell save DV. On a success, the creature follows through with their attack or casting of the AoE Spell as normal. On a failure, you affect the attack or the AoE spell."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Single Target Attack)"
desc = "Determine the amount of eligible targets for the attack (e.g within range of the attack) and assign them a number. Roll a dice equal to the amount determined, and the result causes the attack to target the creature with that given number. If there are no other eligible targets than a single creature, the attack has a 50% chance of not hitting instead (roll a 1d2)."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (AoE Spell)"
desc = "The placement of the AoE spell is randomly determined. Roll a 1d12 for the direction (as in a clock). Roll a die equal to the maximum distance of the spell to determine how far away from the creature it lands, if applicable.You can use this ability a number of times per long rest equal to your cunning or manipulation modifier (minimum 1)."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Community)"
desc = "Public Transport: Once per long rest, you can cast Teleport as Soul Mastery. You can only teleport to an urban environment or within an urban environment when casting the spell this way."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Creation)"
desc = "Soul of the Forge: While you're wearing heavy armor, you have resistance to bludgeoning, piercing, and slashing damage from nonmagical attacks. In addition, you gain immunity to fire damage."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Curiosity)"
desc = "Satisfaction Brought You Back: Once per long rest, when you drop down to 0 health points, you may immediately heal a number of health points equal to your total level, you don’t roll an injury check if applicable and you aren’t knocked prone. In addition, if you can spend your reaction, you may immediately use the No Consequences ability. If you have already used it this short rest, you gain one more use of it for the purposes of this ability."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Deceit)"
desc = "Improved Severance: You can create up to four illusions of yourself, instead of one, when you use your Sever Shadow ability. On your turn, you may move any number of them up to 6m as a bonus action, to a maximum range of 24m."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Destiny)"
desc = "Fortune Favors You: You gain the Foresight spell as Soul Mastery and you may cast it once per every seven days. When you cast the spell in this way, the spell’s duration is 5 rounds or 25 seconds for that casting."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Dusk)"
desc = "Stellar Shield: You and your allies have half cover while in the sphere created by your Embrace of Dusk."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Law)"
desc = "Judge and Jury: When you deal damage to a creature with your Deistic Punishment ability, or cast a spell of 1st level or higher from the enchantment school, you can additionally curse that creature. Until the start of your next turn, the first attack roll, saving throw or ability check (whichever is first) the creature rolls whilst cursed will be rolled with disadvantage."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Lore)"
desc = "The Knowledge of Stars: Once per seven days, you may cast Legend Lore as Soul Mastery. In addition, the thing you name doesn’t have to be of legendary importance to gain information about it."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Might)"
desc = "Chiseled Perfection: After you successfully hit a creature with Godly Punishment, the target, and all enemy creatures within 3m of the target, must make a Brawn saving throw against your spell save DV. On a failure, you may choose to either knock them prone or push them 2m away from you."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Moon)"
desc = "Stage of Moonlight: Once per long rest, as a bonus action, you can manifest an aura that is filled with dim light in a 12m radius centered on you. Creatures of your choice within the aura suffer disadvantage to their saving throws."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Nature)"
desc = "Sacred Grove: Your Mother’s Embrace ability grows even stronger, gaining these additional benefits;"

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain"
desc = "Once during its duration you may cast Death Ward or Greater Restoration as Soul Mastery."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain"
desc = "All Soul Checks made within its border are rolled with advantage."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain"
desc = "Eating a fruit now grants temporary health points equal to your proficiency bonus times two."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Ocean)"
desc = "Ocean’s Bounty: You gain resistance against cold damage.If you have The Coming Tide ability, the distance you can push and pull becomes 2m instead and a creature falls prone if it fails the saving throw to resist it.In addition, if you have the Swim with Me ability, you can breathe underwater and the swimming speed increases to 10m. You can also share your new benefits with others as described in the ability."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Passion)"
desc = "Ablazed with Glory: Once per long rest, when you are reduced to 0 health points (even if you would die) by an attacker you can see, you can use your reaction to move up to your speed toward the attacker and make one attack against it, as long as the movement brings it within your reach. You make this attack with advantage. If the attack hits, the creature takes an extra 8d10 fire or thunder damage (your choice). If the creature is immune to fire or thunder damage it becomes resistant against the damage instead for the purposes of this ability. Then you fall unconscious and begin making death saving throws as normal (or die if the damage was sufficient)."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Preservation)"
desc = "Indomitable Defense: You gain resistance to two damage types of your choice, choosing from bludgeoning, necrotic, piercing, radiant, and slashing. Whenever you finish a short or long rest, you can change the damage types you chose. Additionally, you can transfer one resistance to an ally you touch as an action. The creature keeps the resistance until the end of your next long rest or until you transfer it back to yourself as a bonus action.In addition, your Be Your Shield ability can now target two allies with Heroism as if you cast it with a level 2 spell slot."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Radiance)"
desc = "Aura of Resplendence: As an action, you can shine like a small sun for 10 rounds or until you dismiss it as an action. Your aura emits bright light in a 12m radius and dim light 6m beyond that. Enemies inside of the bright light aura suffer disadvantage on saving throws against any spell that deals fire or radiant damage."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Ruin)"
desc = "Improved Scales of Life and Death: Whenever you cast a spell of the vismancy school of at least 1st level but not higher than 5th level, the spell can instead target two creatures within range and within 4m of each other. If the spell consumes Souls, you only need to provide it for one target."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Sanguine)"
desc = "Let the Blood Betray You: Once per long rest, as a bonus action, you may activate an aura that agitates blood in your vicinity. For 1 minute, any hostile creature with blood that moves within 6m of you for the first time on a turn or starts its turn there takes necrotic damage equal to the total amount of health dice it has. If a hostile creature with blood regains health points while in the aura, it regains only half as many health points as expected."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Storm)"
desc = "Stormborn: As long as you are not underground or indoors, you gain a flying speed equal to your walking speed. As long as you are underground or indoors, your base walking speed increases by 2m."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Thaumaturgy)"
desc = "Arcane Mastery: You choose four spells, one from each of the following levels: 5th, 6th, 7th, and 8th. You learn them as spells known."

[[abilities]]
origin = "Devotion"
level = 17
selection = "Primary"
name = "Divine Domain (Unity)"
desc = "Arm in Arm: As long as you are not incapacitated, whenever an ally within 2m of you takes the attack action, they can make one additional attack as part of that action."

[[abilities]]
origin = "Devotion"
level = 18
selection = "Primary"
name = "General Upgrade"
desc = "Two points to use in the Accomplishment section or to store for later purchase in the same section"

[[abilities]]
origin = "Devotion"

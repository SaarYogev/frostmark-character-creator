[[abilities]]
origin = "Soul Weapon"
level = 20
selection = "Primary"
name = "Prerequisite: 5 level picks in"
desc = "Once per long rest, when you make a melee or ranged attack with a weapon that has been enchanted by this Soul Gift, you may infuse your weapon attack with the Dispel Magic spell as Soul Mastery, delivering the spell through the weapon attack you make. If your attack misses, the spell is wasted.\nDivinatory Aptitude"

[[abilities]]

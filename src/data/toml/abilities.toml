name = "Channel Divinity"
desc = "For a short moment, you can channel the divine essence of your God through yourself. Channel Divinity abilities, shortened as “CD”, share these rules;\nConsidering how confusing it is to see both you and your illusion, you gain advantage on attack rolls against any creature that you and the illusion are within 1m of."

[[abilities]]
origin = "Devotion"
level = 3
selection = "Primary"
name = "Channel Divinity (Destiny)"
desc = "For a short moment, you can channel the divine essence of your God through yourself. Channel Divinity abilities, shortened as “CD”, share these rules;\nCD Sway Destiny: As a bonus action, you can direct fate three rounds or 15 seconds. For the duration, whenever another creature you can see makes an attack roll or an ability check within 6m of you, you can spend your reaction to give the roll advantage or disadvantage (your choice) before or after the GM has determined the outcome of the roll."


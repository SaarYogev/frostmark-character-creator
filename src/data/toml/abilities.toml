name = "Channel Divinity"
desc = "For a short moment, you can channel the divine essence of your God through yourself. Channel Divinity abilities, shortened as “CD”, share these rules;\nEach hostile creature within 6m of you must make a Vitality saving throw. On a failed save, the creature suffers Radiant damage equal to 2d10+ your level of [Devotion]. A creature that has total cover from you is immune to this effect."

[[abilities]]

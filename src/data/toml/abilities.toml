desc = "Your martial and arcane powers swell. You gain one more use of Action Surge. In addition, whenever you cast a spell whilst you are engaged in melee or ranged combat, you gain a benefit to that spell casting of your choice:\nIncrease your spell save DC with +2.\nIgnore one damage resistance.\nYour spell attack gains a +2 to hit.\nYou unlock minor magical advantages by the power of your own Soul. When you gain a level in [Soul Weapon], you can choose one of the Soul Gifts you know and replace it with another Soul Gift that you could learn at that level.\nSome Soul Gifts include “Enchant” in their title. You can enchant weapons with these Soul Gifts through a 10 minute uninterrupted ritual where you infuse fragments of your Soul into your weapons. Across all your weapons, you can only have two Soul Gifts Enchants activated at one time if you have less than 10 level picks of [Soul Weapon], three Soul Gift Enchants if you have more than 10 level picks in [Soul Weapon]. You can’t apply the same\nYou can exchange Soul Gift Enchants or apply them to a new weapon, by doing a new uninterrupted 10 minute ritual with the weapon, adding those Enchants you want, and removing those you want. If you change your Soul Gift on a level up between one Enchant that is active on a weapon, for another Soul Gift, the weapon is automatically not Enchanted with that Soul Gift.\nAgile ForesightYou add double your Dexterity modifier to your Dexterity saving throws.\nAquatic AlterationYou can breathe underwater for a number of minutes equal to 10 * your Intelligence modifier (minimum 1).\nEnduring Soul InfusementYour Infuse Soul ability now lasts for 10 rounds plus twice your Intelligence modifier (minimum 2).\nOld FriendOnce per short rest, when you are wielding a weapon enchanted by this Soul Gift, you automatically succeed on a Resolve saving throw against being frightened.\nSchemes of TeranisYou gain two skill points in Deception and Stealth. You may gain rank 5 with both of these skills.\nArcane Martial Adept"


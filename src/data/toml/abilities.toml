level = 7
selection = "Primary"
name = "Martial Archetype Abilities (Spellbow)"
desc = "**Enchanted Projectiles**\n\nProjectiles from your ranged weapon attacks\n\nare considered magical for the purposes of overcoming resistance and immunity\n\nor nonmagical attacks and damage. After the projectile misses or hits, it\n\nimmediately ceases to be magical. In addition, when you make a ranged weapon\n\nattack and do not hit, you may spend a bonus action to reroll the attack check\n\nagainst another target within 6 m of the original target."

